<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE VIRUS — 사랑의 오류</title>
<style>
:root{--sage:#B6C99C;--red:#C64B37;--ivory:#FFF8EA;--olive:#82965C;--pink:#EAB5B5;--cream:#F4E8D2;--ink:#584D43;--line:#c5c9a9}
*{box-sizing:border-box}body{margin:0;background:#e5e9d9;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:13px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;transition:background .12s,border-color .12s}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.top{min-height:71px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;background:var(--ivory);border-bottom:1px solid #d3d8bc}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand-mark{width:34px;height:38px;display:grid;place-items:center}
h1{font-family:Georgia,serif;font-size:24px;letter-spacing:.045em;margin:0;font-weight:600;color:#6b7651}.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{background:#fffdf6;border:1px solid #cbd2b9;padding:8px 11px;border-radius:8px;min-height:35px;font-weight:600}.btn:hover{background:#f5f0df}.btn.primary{background:#8a9f68;color:white;border-color:#83985c}.btn.red{background:var(--red);color:white;border-color:#ad3f30}.btn.small{min-height:29px;padding:5px 8px;font-size:12px}.btn.active{border-color:#a95043;background:#f5dddd}
.workspace{display:grid;grid-template-columns:minmax(320px,365px) minmax(0,1fr);gap:20px;max-width:1550px;margin:0 auto;padding:20px}.sidebar{background:#fffaf0;border:1px solid #d8d8bd;border-radius:14px;max-height:calc(100vh - 114px);overflow:auto;box-shadow:0 3px 12px #5968490d}.sidebar::-webkit-scrollbar{width:8px}.sidebar::-webkit-scrollbar-thumb{background:#cdd4b7;border-radius:10px}
.group{border-bottom:1px solid #e3e3d2}.group>summary{list-style:none;padding:15px 18px;cursor:pointer;font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:space-between}.group>summary::-webkit-details-marker{display:none}.group>summary:after{content:"⌄";color:#9aa77f;font-size:20px;line-height:12px;transform:rotate(-90deg)}.group[open]>summary:after{transform:rotate(0)}
.group-body{padding:0 18px 18px}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label,.field .flabel{font-size:12px;font-weight:650;color:#716d60}.field input[type=text],.field input[type=number],.field select,.field textarea{background:#fffef9;width:100%;border:1px solid #d5d8c6;border-radius:7px;padding:8px;min-height:34px}
.field textarea{resize:vertical;min-height:62px}.field input[type=range]{width:100%;accent-color:#8b9e68;margin:3px 0}.field input[type=color]{height:33px;width:100%;padding:2px;background:white;border:1px solid #d5d8c6;border-radius:6px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tight{margin:6px 0}.row-buttons{display:flex;gap:6px;flex-wrap:wrap}.switchline{display:flex;align-items:center;justify-content:space-between;min-height:31px;gap:10px}.switchline label{font-weight:600;font-size:12px}.switchline input{accent-color:#8b9e68}.muted{font-size:11px;color:#938e7e;line-height:1.5}.file-row{display:flex;align-items:center;gap:7px;margin:8px 0}.file-row .btn{flex:1;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-row button:last-child{flex:none}.file-input{display:none}
.popup-list{display:flex;flex-direction:column;gap:5px;margin:10px 0}.popup-item{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid #e1e4d4;border-radius:7px;background:#fffefb}.popup-item.selected{border-color:#bd7867;background:#f9eeea}.popup-item .pick{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:transparent;border:0;padding:6px}.popup-item .tag{color:#8b9377;font-size:10px}.popup-item .mini{padding:3px 5px;min-width:24px;min-height:24px;background:#fff;border:1px solid #e0e1d2;border-radius:5px}.popup-item .mini:disabled{opacity:.25}
.preview-col{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:12px}.preview-sticky{position:sticky;top:16px;display:flex;flex-direction:column;gap:11px}.preview-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:1px 3px}.preview-head span{font-weight:700;color:#697a52}.preview-head .hint{font-size:12px;font-weight:400;color:#8a907e}.canvas-shell{background:#d2dbbc;padding:14px;border:1px solid #c6d0b4;border-radius:14px;box-shadow:0 6px 20px #4e69400e}.canvas-frame{position:relative;width:100%;aspect-ratio:3/2;background:#B6C99C;overflow:hidden;border-radius:7px;touch-action:none;cursor:grab}.canvas-frame:active{cursor:grabbing}canvas{display:block;width:100%;height:100%;touch-action:none}
.playback{display:flex;align-items:center;gap:10px;background:#fffaf0;padding:12px 14px;border-radius:12px;border:1px solid #d8d8bd}.playback .btn{min-width:60px}.timeline{flex:1;accent-color:#8a9f68;min-width:0}.timecode{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;color:#827966}
.export-msg{min-height:26px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#7e705e;font-size:12px}.progress{flex:1;max-width:300px;height:7px;border-radius:99px;overflow:hidden;background:#e3e6d9;display:none}.progress i{display:block;width:0;height:100%;background:#8d9f6a;transition:width .08s}
hr{border:0;border-top:1px solid #e4e5d7;margin:12px 0}.unavail{opacity:.55;pointer-events:none}.hidden{display:none!important}
@media(max-width:1050px){.top{padding:12px 15px}.workspace{grid-template-columns:minmax(290px,330px) minmax(0,1fr);padding:13px;gap:12px}.canvas-shell{padding:9px}.top-actions{justify-content:end}.brand h1{font-size:21px}}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.workspace{display:flex;flex-direction:column;gap:14px}.preview-col{order:0}.sidebar{order:1;max-height:none;overflow:visible}.preview-sticky{position:static}.preview-head .hint{display:none}.canvas-shell{padding:7px}.playback{padding:9px;gap:6px}.btn{padding:7px 8px}.brand h1{font-size:22px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="brand-mark"><svg width="32" height="36" viewBox="0 0 32 36" aria-hidden="true"><path fill="#82965C" d="M16 9C10 2 4 3 3 6c5-1 7 3 9 6-1-6 3-10 8-11-1 5 0 7-1 10 3-5 7-6 11-5-2 6-8 7-14 8Z"/><path fill="#C64B37" d="M16 11C6 8 1 15 5 25c3 7 8 10 11 11 3-1 10-7 12-14 3-9-3-13-12-11Z"/><g fill="#FFF8EA"><ellipse cx="10" cy="19" rx="1.1" ry="1.7" transform="rotate(-24 10 19)"/><ellipse cx="18" cy="18" rx="1.1" ry="1.7"/><ellipse cx="23" cy="22" rx="1.1" ry="1.7"/><ellipse cx="13" cy="27" rx="1.1" ry="1.7"/><ellipse cx="20" cy="29" rx="1.1" ry="1.7"/></g></svg></div><h1>LOVE VIRUS</h1></div>
  <div class="top-actions">
    <button class="btn" id="resetBtn">초기화</button><button class="btn" id="randomBtn">랜덤 배치</button>
    <button class="btn primary" id="playBtn">▶ 재생</button><button class="btn" id="pauseBtn">일시정지</button>
    <button class="btn" id="pngBtn">PNG 저장</button><button class="btn red" id="gifBtn">GIF 저장</button>
  </div>
</header>
<main class="workspace">
  <aside class="sidebar" id="sidebar">
    <details class="group" open><summary>01 · 캐릭터 이미지</summary><div class="group-body">
      <div class="field"><label for="mode">인원</label><select id="mode"><option value="2">2인 페어</option><option value="1">1인</option></select></div>
      <div id="imageUploads"></div>
      <hr><div class="field"><label for="imageTarget">이미지 조절 대상</label><select id="imageTarget"></select></div>
      <div class="field"><label for="imageScale">크기 <output id="imageScaleOut"></output></label><input id="imageScale" type="range" min=".25" max="3" step=".01"></div>
      <div class="two"><div class="field"><label for="imageX">가로 위치</label><input id="imageX" type="range" min="-250" max="250" step="1"></div><div class="field"><label for="imageY">세로 위치</label><input id="imageY" type="range" min="-250" max="250" step="1"></div></div>
      <div class="switchline"><label for="imageFlip">좌우 반전</label><input type="checkbox" id="imageFlip"></div>
      <div class="row-buttons"><button class="btn small" id="resetImage">이미지 위치 초기화</button><button class="btn small" id="removeImage">이미지 삭제</button></div>
      <div class="field"><label for="dragMode">미리보기 드래그</label><select id="dragMode"><option value="window">팝업 이동</option><option value="image">사진 안 이미지 이동</option></select></div>
    </div></details>
    <details class="group"><summary>02 · 배경</summary><div class="group-body">
      <div class="field"><label for="backgroundType">종류</label><select id="backgroundType"><option value="strawberry">딸기 원단</option><option value="daisy">데이지 원단</option><option value="check">체크 원단</option><option value="heart">작은 하트</option><option value="paper">종이 콜라주</option><option value="solid">단색</option><option value="image">사용자 이미지</option></select></div>
      <div class="field"><label for="backgroundColor">배경색</label><input id="backgroundColor" type="color"></div>
      <div class="two"><div class="field"><label for="patternScale">패턴 크기</label><input id="patternScale" type="range" min=".45" max="2.2" step=".05"></div><div class="field"><label for="patternDensity">밀도</label><input id="patternDensity" type="range" min=".45" max="2.2" step=".05"></div></div>
      <div class="switchline"><label for="patternOn">패턴 표시</label><input type="checkbox" id="patternOn"></div>
      <div class="file-row"><button class="btn" id="backgroundUploadBtn">배경 이미지 선택</button><button class="btn small" id="backgroundRemoveBtn">삭제</button><input class="file-input" type="file" id="backgroundUpload" accept="image/png,image/jpeg,image/webp"></div>
      <div class="two"><div class="field"><label for="backgroundScale">이미지 크기</label><input type="range" id="backgroundScale" min=".5" max="3" step=".05"></div><div class="field"><label for="backgroundX">가로 위치</label><input type="range" id="backgroundX" min="-300" max="300"></div></div>
      <div class="field"><label for="backgroundY">세로 위치</label><input type="range" id="backgroundY" min="-300" max="300"></div>
    </div></details>
    <details class="group" open><summary>03 · 팝업 구성</summary><div class="group-body">
      <div class="field"><label for="layout">배치 프리셋</label><select id="layout"><option value="default">STRAWBERRY ERROR</option><option value="single">SINGLE ALERT</option><option value="chain">CHAIN ERROR</option><option value="pair">PAIR INFECTION</option><option value="flood">SCREEN FLOOD</option><option value="heart">HEART CORE</option><option value="chaos">DESKTOP CHAOS</option></select></div>
      <div class="two"><div class="field"><label for="newPopupType">추가할 창</label><select id="newPopupType"><option value="alert">알림창</option><option value="photo">사진창</option><option value="profile">소개창</option><option value="loading">하트 모으기</option><option value="confirm">선택창</option><option value="result">편지창</option></select></div><div class="field"><label>&nbsp;</label><button class="btn primary" id="addPopup">+ 팝업 추가</button></div></div>
      <div class="row-buttons"><button class="btn small" id="tidyBtn">전체 정리</button><button class="btn small" id="clearExtrasBtn">추가 팝업 삭제</button></div>
      <div class="popup-list" id="popupList"></div>
      <div class="row-buttons"><button class="btn small" id="duplicatePopup">복제</button><button class="btn small" id="deletePopup">선택 삭제</button><button class="btn small" id="frontPopup">맨 앞으로</button><button class="btn small" id="backPopup">맨 뒤로</button></div>
    </div></details>
    <details class="group" open><summary>04 · 팝업 편집</summary><div class="group-body">
      <div id="popupEditor">
        <div class="field"><label for="popupType">종류</label><select id="popupType"><option value="alert">알림창</option><option value="photo">사진창</option><option value="profile">소개창</option><option value="loading">하트 모으기</option><option value="confirm">선택창</option><option value="result">편지창</option></select></div>
        <div class="field"><label for="popupTitle">제목</label><input id="popupTitle" type="text" maxlength="80"></div>
        <div class="field"><label for="popupMessage">메시지</label><textarea id="popupMessage" rows="2" maxlength="300"></textarea></div>
        <div class="two"><div class="field"><label for="popupButton1">버튼 1</label><input type="text" id="popupButton1"></div><div class="field"><label for="popupButton2">버튼 2</label><input type="text" id="popupButton2"></div></div>
        <div class="field"><label for="popupSource">사진</label><select id="popupSource"></select></div>
        <div class="two"><div class="field"><label for="popupX">가로 위치</label><input type="number" id="popupX" min="0" max="900"></div><div class="field"><label for="popupY">세로 위치</label><input type="number" id="popupY" min="0" max="600"></div></div>
        <div class="two"><div class="field"><label for="popupW">너비</label><input type="number" id="popupW" min="100" max="880"></div><div class="field"><label for="popupH">높이</label><input type="number" id="popupH" min="85" max="580"></div></div>
        <div class="two"><div class="field"><label for="popupHeader">제목줄 색상</label><input type="color" id="popupHeader"></div><div class="field"><label for="popupBorder">테두리 색상</label><input type="color" id="popupBorder"></div></div>
        <div class="two"><div class="field"><label for="popupPhotoBg">사진 바탕색</label><input type="color" id="popupPhotoBg"></div><div class="field"><label for="popupProgressColor">로딩바 색상</label><input type="color" id="popupProgressColor"></div></div>
        <div class="two"><div class="field"><label for="popupImageScale">사진 크기</label><input type="range" id="popupImageScale" min=".5" max="2.5" step=".05"></div><div class="field"><label for="popupOrder">등장 순서</label><input type="number" id="popupOrder" min="1" max="50"></div></div>
        <div class="two"><div class="field"><label for="popupImageX">사진 가로</label><input type="range" id="popupImageX" min="-140" max="140"></div><div class="field"><label for="popupImageY">사진 세로</label><input type="range" id="popupImageY" min="-140" max="140"></div></div>
        <div class="switchline"><label for="popupVisible">창 표시</label><input id="popupVisible" type="checkbox"></div><div class="switchline"><label for="popupLocked">위치 잠금</label><input id="popupLocked" type="checkbox"></div>
      </div>
    </div></details>
    <details class="group"><summary>05 · 텍스트</summary><div class="group-body">
      <div id="textFields"></div>
      <div class="two"><div class="field"><label for="fontFamily">글씨체</label><select id="fontFamily"><option value="sans">기본 고딕</option><option value="serif">명조</option><option value="round">둥근 고딕</option></select></div><div class="field"><label for="fontAlign">정렬</label><select id="fontAlign"><option value="center">가운데</option><option value="left">왼쪽</option><option value="right">오른쪽</option></select></div></div>
      <div class="two"><div class="field"><label for="fontSize">글씨 크기</label><input type="range" id="fontSize" min=".7" max="1.5" step=".05"></div><div class="field"><label for="fontColor">글씨 색상</label><input type="color" id="fontColor"></div></div>
      <div class="switchline"><label for="fontBold">굵게</label><input id="fontBold" type="checkbox"></div><div class="switchline"><label for="textVisible">글씨 표시</label><input id="textVisible" type="checkbox"></div>
    </div></details>
    <details class="group"><summary>06 · 장식과 창 모양</summary><div class="group-body">
      <div class="two"><div class="field"><label for="windowShape">창 모양</label><select id="windowShape"><option value="round">기본 둥근 창</option><option value="square">직각 레트로</option><option value="wave">물결 종이창</option><option value="sticker">손오림 스티커</option></select></div><div class="field"><label for="buttonShape">버튼 모양</label><select id="buttonShape"><option value="round">둥근 버튼</option><option value="square">직각 버튼</option><option value="pill">캡슐 버튼</option></select></div></div>
      <div class="two"><div class="field"><label for="borderWidth">테두리 두께</label><input type="range" id="borderWidth" min="0" max="5" step=".5"></div><div class="field"><label for="borderRadius">모서리</label><input type="range" id="borderRadius" min="0" max="24"></div></div>
      <div class="two"><div class="field"><label for="innerPadding">내부 여백</label><input type="range" id="innerPadding" min="5" max="24"></div><div class="switchline"><label for="windowShadow">그림자</label><input type="checkbox" id="windowShadow"></div></div>
      <hr>
      <div class="field"><label for="decorType">장식 종류</label><select id="decorType"><option value="strawberry">딸기</option><option value="flower">흰 꽃</option><option value="leaf">잎사귀</option><option value="heart">하트</option><option value="ribbon">리본</option><option value="star">별</option><option value="dot">작은 점</option><option value="sparkle">반짝이</option><option value="tape">종이 테이프</option></select></div>
      <div class="two"><div class="field"><label for="decorCount">개수</label><input id="decorCount" type="range" min="0" max="35" step="1"></div><div class="field"><label for="decorSize">크기</label><input id="decorSize" type="range" min=".5" max="2.5" step=".1"></div></div>
      <div class="two"><div class="field"><label for="decorColor">장식 색상</label><input type="color" id="decorColor"></div><div class="field"><label for="decorRotation">회전</label><input type="range" id="decorRotation" min="-180" max="180"></div></div>
      <div class="field"><label for="decorPlace">배치</label><select id="decorPlace"><option value="edge">가장자리</option><option value="around">팝업 주변</option><option value="scatter">화면 전체</option><option value="none">장식 없음</option></select></div>
      <div class="switchline"><label for="decorVisible">장식 표시</label><input id="decorVisible" type="checkbox"></div><button id="decorClear" class="btn small">장식 전체 삭제</button>
    </div></details>
    <details class="group" open><summary>07 · 애니메이션</summary><div class="group-body">
      <div class="field"><label for="animationType">모션</label><select id="animationType"><option value="chain">연쇄 오류</option><option value="close">닫을수록 증가</option><option value="loading">감정 설치 중</option><option value="pair">페어 감염</option><option value="flood">화면 범람</option><option value="static">정적 포인트 모션</option></select></div>
      <div class="two"><div class="field"><label for="duration">재생 시간</label><select id="duration"><option value="2">2초</option><option value="3">3초</option><option value="4">4초</option></select></div><div class="field"><label for="speed">속도</label><input id="speed" type="range" min=".5" max="2" step=".1"></div></div>
      <div class="two"><div class="field"><label for="gap">등장 간격</label><input type="range" id="gap" min=".4" max="1.7" step=".1"></div><div class="field"><label for="bounce">튕김 강도</label><input type="range" id="bounce" min="0" max="1.8" step=".1"></div></div>
      <div class="switchline"><label for="animationOn">애니메이션</label><input id="animationOn" type="checkbox"></div><div class="switchline"><label for="showCursor">커서 표시</label><input id="showCursor" type="checkbox"></div><div class="switchline"><label for="moveDecor">장식 움직임</label><input id="moveDecor" type="checkbox"></div><div class="switchline"><label for="loop">반복 재생</label><input id="loop" type="checkbox"></div>
      <button id="restartBtn" class="btn small">처음부터 재생</button>
    </div></details>
    <details class="group"><summary>08 · 저장 설정</summary><div class="group-body">
      <div class="field"><label for="pngKind">PNG 배경</label><select id="pngKind"><option value="normal">배경 포함</option><option value="transparent">투명 배경</option></select></div>
      <div class="two"><div class="field"><label for="gifWidth">GIF 너비</label><select id="gifWidth"><option value="480">480px</option><option value="640" selected>640px</option><option value="800">800px</option></select></div><div class="field"><label for="gifFps">GIF 프레임</label><select id="gifFps"><option value="10">10fps</option><option value="12">12fps</option></select></div></div>
      <div class="row-buttons"><button id="pngBtn2" class="btn">PNG 저장</button><button id="gifBtn2" class="btn red">GIF 저장</button></div>
    </div></details>
  </aside>
  <section class="preview-col">
    <div class="preview-sticky">
      <div class="preview-head"><span>미리보기 <small class="hint"> · 창을 드래그하거나 오른쪽 아래 모서리로 크기 변경</small></span><span id="previewInfo">960 × 640</span></div>
      <div class="canvas-shell"><div class="canvas-frame" id="canvasFrame"><canvas id="scene" width="960" height="640" aria-label="팝업 디자인 미리보기"></canvas></div></div>

function downloadBlob(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000)}

// GIF89a writer: each rendered frame receives its own palette fitted to its pixel distribution.
// No fixed "web-safe" palette, no lossy DOM screenshots, no randomized/noisy quantization.
class ByteWriter{
 constructor(){this.bytes=[]}
 b(n){this.bytes.push(n&255)}
 u16(n){this.b(n);this.b(n>>8)}
 str(s){for(let i=0;i<s.length;i++)this.b(s.charCodeAt(i))}
 many(arr){for(let i=0;i<arr.length;i++)this.b(arr[i])}
 blob(){return new Blob([new Uint8Array(this.bytes)],{type:'image/gif'})}
}
// Preserve large flat regions and the fabric colors exactly. Frame-local palettes
// still adapt to photographs, but key fabric tones never wander between frames.
function paletteFromFrame(rgba){
 const hits=new Map(), exact=new Map();
 const step=Math.max(1,Math.floor(rgba.length/4/75000));
 for(let px=0;px<rgba.length/4;px+=step){
  const j=px*4,r=rgba[j],g=rgba[j+1],b=rgba[j+2];
  const rgb=(r<<16)|(g<<8)|b;
  exact.set(rgb,(exact.get(rgb)||0)+1);
  const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
  let v=hits.get(key);if(!v){v={r:0,g:0,b:0,n:0,key};hits.set(key,v)}
  v.r+=r;v.g+=g;v.b+=b;v.n++;
 }
 const reserved=[];
 const reserve=rgb=>{if(!reserved.includes(rgb)&&reserved.length<24)reserved.push(rgb)};
 // Exact palette entries for user-selectable background and brand fabric hues.
 const bg=hex(state.backgroundColor);
 reserve(parseInt(bg.slice(1),16));
 for(const color of ['#B6C99C','#C64B37','#82965C','#FFF8EA','#E6C779','#F4E8D2','#EAB5B5','#584D43'])reserve(parseInt(color.slice(1),16));
 for(const [rgb,count] of [...exact].sort((a,b)=>b[1]-a[1]).slice(0,22)){
  if(count>=Math.max(12,rgba.length/4/step*.0005))reserve(rgb);
 }
 const bins=Array.from(hits.values());for(const v of bins){v.r/=v.n;v.g/=v.n;v.b/=v.n}
 const stats=arr=>{const min=[255,255,255],max=[0,0,0];let sum=0;for(const v of arr){sum+=v.n;min[0]=Math.min(min[0],v.r);min[1]=Math.min(min[1],v.g);min[2]=Math.min(min[2],v.b);max[0]=Math.max(max[0],v.r);max[1]=Math.max(max[1],v.g);max[2]=Math.max(max[2],v.b)}const ranges=[max[0]-min[0],max[1]-min[1],max[2]-min[2]],axis=ranges.indexOf(Math.max(...ranges));return{arr,sum,axis,score:ranges[axis]*Math.sqrt(sum)}};
 let boxes=bins.length?[stats(bins)]:[];
 while(boxes.length<256-reserved.length){
  let index=-1,best=-1;for(let i=0;i<boxes.length;i++){if(boxes[i].arr.length>1&&boxes[i].score>best){index=i;best=boxes[i].score}}
  if(index<0)break;
  const box=boxes[index],axis=['r','g','b'][box.axis];box.arr.sort((a,b)=>a[axis]-b[axis]);
  let count=0,split=0;for(let j=0;j<box.arr.length-1;j++){count+=box.arr[j].n;if(count>=box.sum/2){split=j+1;break}}
  if(!split)split=Math.floor(box.arr.length/2);
  boxes[index]=stats(box.arr.slice(0,split));boxes.push(stats(box.arr.slice(split)));
 }
 const palette=new Uint8Array(256*3);
 reserved.forEach((rgb,i)=>{palette[i*3]=(rgb>>16)&255;palette[i*3+1]=(rgb>>8)&255;palette[i*3+2]=rgb&255});
 boxes.forEach((box,i)=>{let r=0,g=0,b=0,sum=0;for(const v of box.arr){r+=v.r*v.n;g+=v.g*v.n;b+=v.b*v.n;sum+=v.n}const k=(i+reserved.length)*3;palette[k]=Math.round(r/sum);palette[k+1]=Math.round(g/sum);palette[k+2]=Math.round(b/sum)});
 return{palette,used:reserved.length+boxes.length};
}
function quantizeFrame(rgba,palette,used){
 // Match each distinct RGB color independently: old 5-bit bin memoization
 // assigned visibly different pixels the same color and caused gray blotches.
 const cache=new Map(), output=new Uint8Array(rgba.length/4);
 for(let i=0;i<output.length;i++){
  const j=i*4,r=rgba[j],g=rgba[j+1],b=rgba[j+2],rgb=(r<<16)|(g<<8)|b;
  let idx=cache.get(rgb);
  if(idx===undefined){let dist=Infinity,best=0;
   for(let n=0;n<used;n++){const k=n*3,dr=r-palette[k],dg=g-palette[k+1],db=b-palette[k+2],d=dr*dr*.30+dg*dg*.59+db*db*.11;
    if(d<dist){dist=d;best=n;if(d===0)break}}
   idx=best;cache.set(rgb,idx);
  }

}
function writeLZW(writer,indices){
 const codeMin=8,clear=256,end=257;let codeSize=9,next=258,dictionary=new Map();
 const chunks=[];let cur=0,bits=0,block=[];
 function put(code){
  cur|=(code<<bits);bits+=codeSize;
  while(bits>=8){block.push(cur&255);cur>>>=8;bits-=8;if(block.length===255){chunks.push(Uint8Array.from(block));block=[]}}
 }
 function flush(){if(bits){block.push(cur&255);bits=0;cur=0}if(block.length)chunks.push(Uint8Array.from(block));}
 put(clear);let prefix=indices[0]||0;
 for(let i=1;i<indices.length;i++){
  const k=indices[i],key=(prefix<<8)|k,code=dictionary.get(key);
  if(code!==undefined){prefix=code;continue}
  put(prefix);
  if(next<4096){
   dictionary.set(key,next++);
   // The decoder adds its dictionary entry one emitted code later.
   if(next>(1<<codeSize)&&codeSize<12)codeSize++;
  }else{
   put(clear);dictionary.clear();codeSize=9;next=258;
  }
  prefix=k;
 }
 put(prefix);put(end);flush();

}
function addGifFrame(writer,indices,palette,w,h,delayCs){
 writer.b(0x21);writer.b(0xF9);writer.b(4);writer.b(0x08);writer.u16(delayCs);writer.b(0);writer.b(0);
 writer.b(0x2C);writer.u16(0);writer.u16(0);writer.u16(w);writer.u16(h);
 writer.b(0x87);writer.many(palette);
 writeLZW(writer,indices);
}
function beginGif(w,h){
 const writer=new ByteWriter();writer.str('GIF89a');writer.u16(w);writer.u16(h);writer.b(0x70);writer.b(0);writer.b(0);
 writer.b(0x21);writer.b(0xFF);writer.b(11);writer.str('NETSCAPE2.0');writer.b(3);writer.b(1);writer.u16(0);writer.b(0);

}
const breathe=()=>new Promise(resolve=>setTimeout(resolve,0));
async function saveGIF(){
 if(exporting)return;
 exporting=true;pause();$('gifBtn').disabled=$('gifBtn2').disabled=true;
 $('progress').style.display='block';$('progressBar').style.width='0%';$('status').textContent='GIF 생성 중 · 0%';
 try{
  const w=state.gifWidth,h=Math.round(w*H/W),fps=state.gifFps,frames=Math.round(state.duration*fps);
  const off=document.createElement('canvas');off.width=w;off.height=h;const c=off.getContext('2d',{alpha:false,willReadFrequently:true});c.scale(w/W,h/H);
  const writer=beginGif(w,h);
  for(let f=0;f<frames;f++){
   if(!state.animationOn)c.fillStyle='white';
   renderScene(c,state.animationOn?(frames===1?1:f/(frames-1)):1,false,false);
   const rgba=c.getImageData(0,0,w,h).data;
   const result=paletteFromFrame(rgba);
   const indexed=quantizeFrame(rgba,result.palette,result.used);
   addGifFrame(writer,indexed,result.palette,w,h,fps===12?(f%3===2?9:8):10);
   const pct=Math.round((f+1)/frames*100);$('progressBar').style.width=pct+'%';$('status').textContent='GIF 생성 중 · '+pct+'%';
   await breathe();
  }
  writer.b(0x3B);const blob=writer.blob();downloadBlob(blob,'LOVE_VIRUS.gif');setStatus('GIF 저장 완료 · '+(blob.size/1024/1024).toFixed(1)+' MB');
 }catch(e){console.error(e);setStatus('GIF 오류: '+(e?.message||e),true)}
 finally{exporting=false;$('gifBtn').disabled=$('gifBtn2').disabled=false;$('progress').style.display='none';draw();}
}
setupInputs();
})();
