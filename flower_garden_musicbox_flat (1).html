function lzwEncode(pixels){let out=[],bits=0,acc=0,size=9,next=258,dict=new Map();function emit(c){acc|=c<<bits;bits+=size;while(bits>=8){out.push(acc&255);acc>>>=8;bits-=8}}emit(256);let prefix=pixels[0];for(let i=1;i<pixels.length;i++){let k=pixels[i],key=prefix*256+k,v=dict.get(key);if(v!==undefined)prefix=v;else{emit(prefix);if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++}else{emit(256);dict.clear();size=9;next=258}prefix=k}}emit(prefix);if(next===(1<<size)&&size<12)size++;emit(257);if(bits)out.push(acc&255);return new Uint8Array(out)}
function lzwDecode(bytes,length){let table,size,next,prev=null,bit=0,out=new Uint8Array(length),pos=0;function reset(){table=Array.from({length:256},(_,i)=>[i]);size=9;next=258;prev=null}reset();function read(){let c=0;for(let i=0;i<size;i++,bit++)c|=((bytes[bit>>3]>>(bit&7))&1)<<i;return c}while(bit+size<=bytes.length*8){let code=read();if(code===256){reset();continue}if(code===257)break;let entry=table[code]||(code===next&&prev?prev.concat(prev[0]):null);if(!entry||pos+entry.length>length)throw Error('GIF LZW 검증 오류');out.set(entry,pos);pos+=entry.length;if(prev&&next<4096){table[next++]=prev.concat(entry[0]);if(next===(1<<size)&&size<12)size++}prev=entry}if(pos!==length)throw Error('GIF 프레임 길이 오류');return out}
class GIF{constructor(w,h){this.w=w;this.h=h;this.parts=[];this.push([...new TextEncoder().encode('GIF89a'),w&255,w>>8,h&255,h>>8,0x70,0,0,0x21,0xff,11,...new TextEncoder().encode('NETSCAPE2.0'),3,1,0,0,0]);this.frames=0}push(a){this.parts.push(new Uint8Array(a))}add(data,delay){let pal=palette(data),px=indexPixels(data,pal),compressed=lzwEncode(px),decoded=lzwDecode(compressed,px.length);for(let i=0;i<px.length;i++)if(px[i]!==decoded[i])throw Error('GIF 프레임 검증 실패');this.push([0x21,0xf9,4,9,delay&255,delay>>8,0,0,0x2c,0,0,0,0,this.w&255,this.w>>8,this.h&255,this.h>>8,0x87]);this.push(pal.flat());this.push([8]);for(let i=0;i<compressed.length;i+=255){let b=compressed.subarray(i,i+255);this.push([b.length]);this.parts.push(b)}this.push([0]);this.frames++}blob(){if(this.frames!==36)throw Error('GIF 프레임 수 오류');return new Blob([...this.parts,new Uint8Array([0x3b])],{type:'image/gif'})}}
