<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마음 설치 중</title><style>
*{box-sizing:border-box}body{margin:0;color:#433750;background:#f5f1f9;font:14px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}header{padding:24px 32px;border-bottom:1px solid #dcd3e6;background:#fffafc;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;letter-spacing:-1px;margin:0}header span{font-size:12px;color:#897594}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:26px;max-width:1480px;margin:auto;padding:26px}aside{display:flex;flex-direction:column;gap:12px}section{background:#fff;border:1px solid #e1d7e9;border-radius:13px;padding:17px}h2{font-size:13px;margin:0 0 14px;color:#8d64a1}label{display:block;font-size:12px;margin:11px 0 5px}input,select,textarea{font:inherit;color:inherit;width:100%;background:#faf8fc;border:1px solid #ded4e7;border-radius:6px;padding:9px}input[type=checkbox]{width:auto;accent-color:#9c6db2}input[type=color]{padding:3px;height:36px}input[type=range]{padding:0}textarea{resize:vertical;min-height:66px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.checks{display:grid;grid-template-columns:1fr 1fr}.checks label{display:flex;gap:5px;align-items:center;font-size:11px}button{font:inherit;cursor:pointer;background:#fff;border:1px solid #cbb8d8;border-radius:6px;color:#674779;padding:10px 13px}button:hover{background:#f0e5f8}button:disabled{opacity:.4;cursor:wait}.primary{background:#9462ae;color:white;border-color:#9462ae}.primary:hover{background:#81529a}.viewer{position:sticky;top:20px;align-self:start;min-width:0}.screen{padding:15px;background:#e6dceF;border:1px solid #c8b6d8;border-radius:17px;box-shadow:0 9px 0 #d7c9e3}canvas{display:block;width:100%;height:auto;border:1px solid #7f678f;border-radius:7px;touch-action:none}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 12px}.tools button{flex:1;white-space:nowrap}.timeline{display:flex;align-items:center;gap:12px;background:white;border-radius:10px;padding:12px}.timeline input{flex:1}.timeline output{min-width:44px;text-align:right;font-size:12px}#status{font-size:12px;min-height:25px;padding-top:10px;color:#876499}details summary{cursor:pointer;font-size:12px}small{font-size:11px;color:#9b8aa5}.upload{font-size:11px;padding:7px}.export{margin-top:16px}.export .row{margin-top:10px}@media(max-width:850px){main{display:flex;flex-direction:column;padding:14px;gap:20px}.viewer{order:-1;position:static}header{padding:18px}header span{display:none}aside{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:520px){aside{display:flex}.screen{padding:7px;border-radius:10px}.tools button{font-size:11px;padding:9px}main{padding:10px}h1{font-size:19px}}
</style><header><h1>마음 설치 중 <span style="font-size:16px">↳</span></h1><span>캐릭터 · 설치 마법사 · 바탕화면</span></header><main><aside>
<section><h2>01 / 캐릭터</h2><div class="row"><div><label>A 이름</label><input id="nameA" value="캐릭터 A" maxlength="16"><label>A 이미지</label><input class="upload" type="file" id="imgA" accept="image/*"></div><div><label>B 이름</label><input id="nameB" value="캐릭터 B" maxlength="16"><label>B 이미지</label><input class="upload" type="file" id="imgB" accept="image/*"></div></div><label>설치 방향</label><select id="direction"><option value="AB">A의 컴퓨터에 B 설치</option><option value="BA">B의 컴퓨터에 A 설치</option><option value="both">서로에게 동시에 설치</option><option value="solo">1인 셀프 설치 (A)</option></select><label>관계 프리셋</label><select id="relation"><option>친구</option><option>연인</option><option>라이벌</option><option>앙숙</option><option>동료</option></select></section>
<section><h2>02 / 설치 프로그램</h2><label>설치 대상</label><select id="target"><option value="theme">바탕화면 테마</option><option value="photo">사진 묶음</option><option value="chat">메시지 프로그램</option><option value="pet">바탕화면 친구</option><option value="player">추억 재생기</option><option value="secret">비밀 프로그램</option></select><label>프로그램 이름</label><input id="program" value="공간" maxlength="24"><label>메시지 / 비밀 메시지</label><textarea id="message" maxlength="160">설치가 끝났어. 열어 볼래?</textarea><label>설치 방식</label><select id="method"><option value="normal">일반 설치</option><option value="fast">빠른 설치</option><option value="custom">사용자 지정</option><option value="fail">설치 실패</option><option value="force">강제 설치</option><option value="update">자동 업데이트</option></select><label>설치 위치</label><select id="location"><option value="left">바탕화면 왼쪽</option><option value="right">바탕화면 오른쪽</option><option value="bottom">바탕화면 아래</option></select><div class="checks" id="components"><label><input type="checkbox" id="shortcut" checked>바로가기</label><label><input type="checkbox" id="photos" checked>사진 폴더</label><label><input type="checkbox" id="widget" checked>프로필 위젯</label><label><input type="checkbox" id="messenger">메신저</label><label><input type="checkbox" id="notice" checked>알림</label><label><input type="checkbox" id="wallpaper" checked>배경화면 변경</label><label><input type="checkbox" id="autorun" checked>자동 실행</label><label><input type="checkbox" id="taskbar" checked>작업 표시줄</label></div></section>
<section><h2>03 / 사건과 결말</h2><label>설치 중 사건</label><select id="event"><option value="none">없음</option><option value="space">용량 부족</option><option value="permission">권한 요청</option><option value="clone">바로가기 복제</option><option value="path">설치 위치 변경</option><option value="conflict">프로그램 충돌</option><option value="reinstall">재설치</option></select><label>권한 반응</label><select id="permission"><option value="allow">허용하기</option><option value="deny">거부하고 중단</option><option value="retry">거부 후 다시 요청</option><option value="force">거부해도 설치</option></select><label>결말</label><select id="ending"><option value="success">설치 완료</option><option value="cancel">설치 취소</option><option value="force">취소 실패 → 완료</option><option value="fail">오류로 중단</option></select><label>바로가기 복제 수</label><input id="clones" type="range" min="2" max="8" value="4"></section>
<section><h2>04 / 화면 디자인</h2><div class="row"><div><label>설치 전 배경</label><input id="before" type="color" value="#c7b8e7"></div><div><label>설치 후 배경</label><input id="after" type="color" value="#f1bcd4"></div><div><label>창 색상</label><input id="accent" type="color" value="#d6b4ed"></div></div><label>배경 패턴</label><select id="pattern"><option value="grid">격자</option><option value="dots">도트</option><option value="plain">단색</option></select><label>프로그램 아이콘</label><select id="icon"><option>♡</option><option>✦</option><option>✿</option><option>◈</option><option>♪</option></select><label>결과창 크기</label><input id="size" type="range" min="70" max="110" value="100"><label>결과창 투명도</label><input id="opacity" type="range" min="50" max="100" value="100"><label>모서리 둥글기</label><input id="radius" type="range" min="0" max="24" value="8"><small>완료된 프로그램 창은 드래그로 옮길 수 있어요.</small></section>
</aside><div class="viewer"><div class="screen"><canvas id="cv" width="1000" height="750" aria-label="설치 미리보기"></canvas></div><div class="tools"><button id="play" class="primary">자동 재생</button><button id="manual">직접 설치</button><button id="beforeBtn">설치 전</button><button id="afterBtn">설치 후</button><button id="run">프로그램 실행</button><button id="reset">처음으로</button></div><div class="timeline"><span>진행</span><input id="seek" type="range" min="0" max="1000" value="0"><output id="percent">0%</output></div><section class="export"><div class="row"><div><label>GIF 연출</label><select id="preset"><option value="normal">기본 설치</option><option value="fast">빠른 설치</option><option value="denied">권한 거부 → 재시도</option><option value="force">취소해도 설치</option><option value="theme">바탕화면 변화</option><option value="double">동시 설치</option></select></div><div><label>길이</label><select id="duration"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div><label>프레임</label><select id="fps"><option>10</option><option selected>12</option></select></div></div><div class="row"><div><label>PNG 화면</label><select id="pngmode"><option value="current">현재 화면</option><option value="complete">설치 완료 바탕화면</option><option value="window">프로그램 결과창</option></select></div><div><label>PNG 해상도</label><select id="scale"><option value="2">2×</option><option value="3">3×</option></select></div><div><label>배경</label><select id="transparent"><option value="no">포함</option><option value="yes">투명 PNG</option></select></div></div><div class="row"><button id="png">PNG 저장</button><button id="gif" class="primary">GIF 저장</button></div><div id="status" role="status" aria-live="polite"></div></section></div></main>
<script>
'use strict';const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),imgs={A:null,B:null};let t=0,playing=false,start=0,manual=false,step=0,progress=0,last=0,pausedEvent=false,resolved=false,opened=false,closed=false,drag=null,pos={x:330,y:190},busy=false,hits=[];
const val=id=>$(id).value,ck=id=>$(id).checked;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function cfg(){let d=val('direction');return {host:d==='BA'?'B':'A',guest:d==='BA'||d==='solo'?'A':'B',double:d==='both'||val('preset')==='double',target:val('target'),method:val('method'),event:val('event'),permission:val('permission'),ending:val('ending'),preset:val('preset')}}
function name(k){return val('name'+k)||k}function rr(c,x,y,w,h,r=8,fill='#fff',stroke='#654f73'){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke()}}
function txt(c,s,x,y,size=16,color='#493750',align='left'){c.fillStyle=color;c.font=`${size>=24?'600 ':''}${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;c.textAlign=align;c.fillText(s,x,y);c.textAlign='left'}
function fit(c,k,x,y,w,h){let im=imgs[k];if(im){let s=Math.min(w/im.width,h/im.height);c.drawImage(im,x+(w-im.width*s)/2,y+(h-im.height*s)/2,im.width*s,im.height*s)}else{c.save();c.translate(x+w/2,y+h/2);c.fillStyle=k==='A'?'#c5b6e8':'#eebbd0';c.beginPath();c.arc(0,-h*.12,Math.min(w,h)*.22,0,7);c.fill();c.beginPath();c.ellipse(0,h*.28,w*.31,h*.23,0,0,7);c.fill();txt(c,k,0,-h*.09,Math.min(w,h)*.16,'#fff','center');c.restore()}}
function photo(c,k,x,y,w,h){rr(c,x,y,w,h,5,'#fff');rr(c,x+7,y+7,w-14,h-32,2,'#f5edf8',null);fit(c,k,x+10,y+10,w-20,h-40);txt(c,name(k),x+w/2,y+h-11,12,'#756381','center')}
function button(c,label,x,y,w,fn,active=true){rr(c,x,y,w,32,4,active?'#fff6fb':'#e7dfe9');txt(c,label,x+w/2,y+21,13,active?'#51405c':'#aa9daf','center');if(fn&&active)hits.push({x,y,w,h:32,fn})}
function win(c,title,x,y,w,h,body){rr(c,x+5,y+6,w,h,+val('radius'),'#69516e',null);rr(c,x,y,w,h,+val('radius'),'#fff8fc');c.save();c.beginPath();c.roundRect(x,y,w,h,+val('radius'));c.clip();c.fillStyle=val('accent');c.fillRect(x,y,w,36);c.restore();txt(c,'◈  '+title.slice(0,26),x+13,y+24,14);txt(c,'−   □   ×',x+w-82,y+24,15);body(x,y+36,w,h-36)}
function icon(c,label,x,y,k,kind='folder',alpha=1){c.save();c.globalAlpha=alpha;if(kind==='photo'){photo(c,k,x+9,y,52,57)}else if(kind==='app'){rr(c,x+9,y,53,53,12,'#fff0f8');txt(c,val('icon'),x+35,y+38,34,'#a171b3','center')}else{rr(c,x+9,y+5,27,13,3,'#e8c6ed');rr(c,x+9,y+15,54,38,4,'#f7d8e5');txt(c,'♡',x+36,y+43,23,'#ad80b5','center')}txt(c,label.slice(0,13),x+36,y+76,12,'#44304e','center');c.restore()}
function wrapped(c,s,x,y,w,size=16){let line='',yy=y;for(let ch of s){if(ch==='\n'||c.measureText(line+ch).width>w){txt(c,line,x,yy,size);yy+=size*1.6;line=ch==='\n'?'':ch}else line+=ch}if(line)txt(c,line,x,yy,size)}
function state(time,forceComplete=false){
 let q=cfg(),event=q.preset==='denied'?'permission':q.event;
 let p=clamp((time-.17)/.60),phase=time<.12?0:time<.17?1:time<.77?2:3;
 if(q.method==='fast'||q.preset==='fast')p=clamp((time-.12)/.32);
 if(event==='reinstall'&&time>.42&&time<.64)p=clamp((time-.50)/.14);
 const forced=q.method==='force'||q.preset==='force';
 if(forced&&time>=.30&&time<.70){p=time<.40?.35*(1-clamp((time-.30)/.10)):time<.48?.12:.12+clamp((time-.48)/.22)*.76;phase=2}
 let rollback=false,interrupted=q.ending==='cancel'||q.ending==='fail';
 // The explicitly selected ending always wins over method, event and preset.
 if(q.ending==='cancel'){
  if(time<.70){if(!forced||time<.30)p=clamp((time-.17)/.50)*.95;phase=time<.12?0:time<.17?1:2}
  else{p=.95*(1-clamp((time-.70)/.23));rollback=time<.93;phase=rollback?2:4}
 }else if(q.ending==='fail'){p=Math.min(p,.62);if(time>=.6)phase=4}
 else if(event==='permission'&&q.permission==='deny'&&q.preset!=='denied'&&q.ending!=='force'){p=time<.55?Math.min(p,.45):0;if(time>=.55)phase=4}
 if(manual){phase=step<3?step===0?0:1:step===3||step===6?2:step===4?3:4;p=progress;rollback=step===6}
 if(forceComplete){p=1;phase=3;rollback=false}
 return {q,p,phase,event,interrupted,rollback};
}
function result(c,q,p,only=false){let s=+val('size')/100,w=560*s,h=360*s,x=pos.x,y=pos.y;if(only){x=(1000-w)/2;y=(750-h)/2}c.save();c.globalAlpha=+val('opacity')/100;win(c,val('program')||name(q.guest),x,y,w,h,(a,b,ww,hh)=>{let k=q.guest,host=q.host,target=q.target; c.save();c.beginPath();c.rect(a,b,ww,hh);c.clip();if(target==='theme'){photo(c,host,a+25,b+23,ww*.40,hh-55);photo(c,k,a+ww*.55,b+23,ww*.40,hh-55);txt(c,val('icon'),a+ww/2,b+hh/2,25,'#bc84ab','center')}if(target==='photo'){[k,host,k].forEach((v,i)=>photo(c,v,a+18+i*(ww-36)/3,b+35,(ww-60)/3,hh-65))}if(target==='chat'){fit(c,k,a+18,b+17,52,52);txt(c,name(k),a+83,b+40,17);rr(c,a+30,b+92,ww*.72,70,14,'#edddf4',null);c.font='16px sans-serif';wrapped(c,val('message'),a+46,b+120,ww*.65);rr(c,a+ww*.42,b+185,ww*.5,45,14,'#f6dce8',null);txt(c,'응, 확인했어!',a+ww*.47,b+214,15);rr(c,a+17,b+hh-43,ww-34,29,6,'#fff',null);txt(c,'메시지',a+28,b+hh-23,12,'#b4a1bf')}if(target==='pet'){fit(c,k,a+ww*.3+Math.sin(t*8)*15,b+20,ww*.4,hh-55);txt(c,name(k),a+ww/2,b+hh-15,15,'#8f6aa0','center')}if(target==='player'){photo(c,(Math.floor(t*6)%2)?host:k,a+24,b+20,hh-50,hh-45);txt(c,name(k),a+hh-6,b+80,23);txt(c,'◀   Ⅱ   ▶',a+hh-6,b+145,24);rr(c,a+hh-6,b+185,ww-hh-16,7,3,'#e5d5ed',null);rr(c,a+hh-6,b+185,(ww-hh-16)*((t*3)%1),7,3,'#b083c4',null);txt(c,'00:12  /  03:24',a+hh-6,b+224,12)}if(target==='secret'){photo(c,k,a+22,b+24,ww*.36,hh-48);txt(c,'잠금 해제  ◇',a+ww*.44,b+60,21);c.font='17px sans-serif';wrapped(c,val('message'),a+ww*.44,b+105,ww*.49,17)}c.restore()});if(!only){hits.push({x:x+w-30,y,w:30,h:36,fn:()=>{closed=true;opened=false}});hits.push({x,y,w:w-90,h:36,fn:null,drag:true})}c.restore()}
function render(c,time,opt={}){let {q,p,phase,event,rollback}=state(time,opt.complete),W=1000,H=750;let forceStage=!manual&&!opt.complete&&!rollback&&(q.method==='force'||q.preset==='force')?(time>=.30&&time<.40?'close':time>=.40&&time<.48?'gone':time>=.48&&time<.70?'return':''):'';hits=[];c.clearRect(0,0,W,H);if(opt.only){result(c,q,p,true);return}let changed=ck('wallpaper')?clamp((p-.25)/.6):0;if(!opt.transparent){c.fillStyle=val('before');c.fillRect(0,0,W,H);c.save();c.globalAlpha=changed;c.fillStyle=val('after');c.fillRect(0,0,W,H);c.restore();if(val('pattern')!=='plain'){c.strokeStyle='#ffffff40';c.fillStyle='#ffffff65';c.lineWidth=1;for(let x=0;x<W;x+=32)for(let y=0;y<H;y+=32){if(val('pattern')==='dots'){c.beginPath();c.arc(x,y,1.5,0,7);c.fill()}else{c.strokeRect(x,y,32,32)}}}}if(q.preset==='theme'&&ck('wallpaper')&&changed>0){c.save();c.globalAlpha=changed*.3;fit(c,q.guest,340,65,400,610);c.restore()}txt(c,name(q.host)+'의 컴퓨터',950,45,17,'#684e7a','right');icon(c,'내 폴더',35,43,q.host);icon(c,'휴지통',35,147,q.host,'app');photo(c,q.host,140,70,155,185);if(p>.25&&ck('photos')){let count=Math.min(3,Math.floor((p-.25)*5)+1);for(let i=0;i<count;i++)icon(c,`사진_${i+1}.png`,45+i*90,560,q.guest,'photo')}
let ix=val('location')==='right'?860:val('location')==='bottom'?450:40,iy=val('location')==='bottom'?565:280;if(event==='path'&&p>.55){ix=850;iy=300}if(p>.48&&ck('shortcut')){let n=event==='clone'?+val('clones'):1;for(let i=0;i<n;i++){let x=ix+(i%3)*82,y=iy+Math.floor(i/3)*92;if(x>920)x-=246;icon(c,(val('program')||name(q.guest))+(q.method==='update'?' v2':''),x,y,q.guest,'app');hits.push({x,y,w:76,h:84,fn:()=>{opened=true;closed=false}})}}if(q.method==='update'&&p<.48)icon(c,name(q.guest)+' v1',ix,iy,q.guest,'app',.55);
