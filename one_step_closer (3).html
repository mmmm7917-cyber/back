<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한 칸 더 가까이</title><style>
:root{--ink:#383c39;--muted:#848981;--line:#e2e6df;--green:#536e5c;--paper:#fbfcf8}*{box-sizing:border-box}body{margin:0;background:#eef1eb;color:var(--ink);font:14px/1.55 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:9px 13px}button:hover{border-color:#829786}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--green);color:white;border-color:var(--green)}header{max-width:1440px;margin:auto;padding:25px 36px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:-1px;margin:0}header p{margin:2px 0;color:var(--muted);font-size:12px}.badge{font-size:11px;border:1px solid #cbd4c8;border-radius:30px;padding:5px 12px;color:#697867}.layout{max-width:1440px;margin:auto;padding:0 36px 30px;display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}.panel,.preview{background:var(--paper);border:1px solid #dce2d7;border-radius:20px}.panel{padding:20px;max-height:calc(100vh - 125px);overflow:auto;scrollbar-width:thin}.section{padding-bottom:21px;margin-bottom:20px;border-bottom:1px solid var(--line)}.section:last-child{border:0;margin:0;padding:0}.section-title{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mini{font-size:11px;color:var(--muted);font-weight:400}.pairtabs{display:flex;gap:6px;margin-bottom:12px}.pairtabs button{flex:1}.pairtabs button.active{background:#e3eadd;border-color:#c2cfbc}.upload{display:block;padding:13px;text-align:center;border:1px dashed #bdcbb5;border-radius:12px;background:#f2f5ed;cursor:pointer}.upload input{display:none}.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row label{font-size:12px;min-width:65px}.row input[type=text],select{width:100%;min-width:0;padding:8px;border:1px solid var(--line);background:white;border-radius:8px;color:var(--ink)}.range{display:grid;grid-template-columns:1fr 38px;gap:8px;align-items:center}input[type=range]{width:100%;accent-color:#6e896a}output{font-size:11px;color:var(--muted);text-align:right}.field{margin:13px 0}.field>label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}.checks{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}.checks label{display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:var(--green)}.smallbtn{font-size:11px;padding:5px 9px}.preview{padding:22px;position:sticky;top:18px}.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12px;color:#808b7b}.statusdot{display:inline-block;width:6px;height:6px;background:#79976f;border-radius:50%;margin-right:6px}.stage{position:relative;overflow:hidden;border-radius:13px;background-image:linear-gradient(45deg,#e6e9e2 25%,transparent 25%),linear-gradient(-45deg,#e6e9e2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e9e2 75%),linear-gradient(-45deg,transparent 75%,#e6e9e2 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;touch-action:none;display:flex;justify-content:center}canvas{display:block;max-width:100%;width: min(100%,660px);height:auto;touch-action:none}.stagehint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);border-radius:20px;background:#ffffffde;padding:5px 12px;font-size:11px;pointer-events:none;white-space:nowrap;color:#87927f}.controlbar{margin:18px 0 0;display:flex;gap:8px;align-items:center}.controlbar input{flex:1}.anglelabels{display:flex;justify-content:space-between;margin:4px 0 16px 88px;color:#93998d;font-size:10px}.actions{border-top:1px solid var(--line);padding-top:17px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions .spacer{flex:1}.note{font-size:11px;color:var(--muted);margin:10px 0 0}.progress{font-size:12px;color:var(--green);min-height:20px;margin-top:8px}.colors{display:flex;gap:7px;margin-top:8px}.swatch{width:24px;height:24px;border-radius:50%;padding:0;border:3px solid white;box-shadow:0 0 0 1px #ddd}.colorinput{width:29px;height:26px;border:0;background:none;padding:0}details summary{font-size:12px;cursor:pointer;color:#6c7b64}details p{font-size:12px;color:#858d7e;margin-bottom:0}@media(max-width:850px){header{padding:20px}h1{font-size:21px}.badge{display:none}.layout{padding:0 14px 24px;display:flex;flex-direction:column;gap:15px}.preview{order:-1;width:100%;position:static;padding:14px}.panel{width:100%;max-height:none;padding:18px}canvas{max-height:57vh;width:auto;max-width:100%}.actions button{flex:1}.actions .spacer{display:none}.anglelabels{margin-left:80px}.section{margin-bottom:17px;padding-bottom:17px}}
</style><header><div><h1>한 칸 더 가까이</h1></div></header><main class="layout"><aside class="panel"><div class="section"><div class="section-title">캐릭터 <span class="mini">PNG · JPG · WebP</span></div><div class="pairtabs"><button id="tab0" class="active">캐릭터 A</button><button id="tab1">캐릭터 B</button></div><label class="upload"><span id="uploadLabel">이미지 불러오기</span><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="row"><label for="charname">이름</label><input id="charname" type="text" maxlength="24" placeholder="이름 (선택)"></div><div id="charfields"></div><div class="checks"><label><input type="checkbox" id="flip">좌우 반전</label><button id="remove" class="smallbtn">이미지 지우기</button><button id="charReset" class="smallbtn">배치 초기화</button></div></div><div class="section"><div class="section-title">다가오는 방식</div><div class="row"><select id="who"><option value="both">서로 다가오기</option><option value="a">A만 다가오기</option><option value="b">B만 다가오기</option></select></div><div class="row"><select id="reaction"><option value="stay">가까이 붙어 있기</option><option value="lean">살짝 기대기</option><option value="shy">놀라서 떨어지기</option></select></div><div id="motionfields"></div><div class="row"><label>앞에 놓기</label><select id="front"><option value="b">캐릭터 B</option><option value="a">캐릭터 A</option></select></div><div class="checks"><label><input type="checkbox" id="hearts" checked>작은 하트</label><label><input type="checkbox" id="shadows" checked>그림자</label><label><input type="checkbox" id="names" checked>이름 표시</label></div></div><div class="section"><div class="section-title">화면과 색</div><div class="row"><label>화면 비율</label><select id="ratio"><option value="1">정사각형 1:1</option><option value="1.333333">가로형 4:3</option><option value="0.75">세로형 3:4</option></select></div><div class="row"><label>배경색</label><input class="colorinput" id="bg" type="color" value="#f0f2e8"><label style="min-width:auto">장식색</label><input class="colorinput" id="accent" type="color" value="#b48888"></div><div class="colors" id="colors"></div><div class="checks" style="margin-top:13px"><label><input id="transparent" type="checkbox">투명 배경</label><label><input id="frame" type="checkbox" checked>얇은 테두리</label></div></div><div class="section"><div class="section-title">저장 설정</div><div class="row"><label>PNG 크기</label><select id="pngScale"><option value="2">2배 · 긴 변 1440px</option><option value="3">3배 · 긴 변 2160px</option></select></div><div class="row"><label>GIF 크기</label><select id="gifSize"><option value="480">480px · 가볍게</option><option value="640" selected>640px · 기본</option><option value="800">800px · 크게</option></select></div><div class="row"><label>반복 길이</label><select id="duration"><option value="3">3초</option><option value="4" selected>4초</option><option value="5">5초</option></select></div><details><summary>간단한 사용법</summary><p>캐릭터 A와 B에 이미지를 넣고 각자 크기를 맞춰 주세요. 미리보기를 좌우로 끌거나 아래 기울기 막대를 움직이면 가까워집니다. ‘캐릭터 배치’를 켜면 그림을 직접 끌어 위치를 바꿀 수 있어요. PNG는 현재 장면, GIF는 가까워졌다 돌아오는 전체 움직임을 저장합니다.</p></details></div></aside><section class="preview"><div class="preview-head"><span><span class="statusdot"></span><span id="sceneStatus">떨어져 있는 순간</span></span><label><input id="edit" type="checkbox"> 캐릭터 배치</label></div><div class="stage" id="stage"><canvas id="view" width="720" height="720" tabindex="0" aria-label="좌우로 끌거나 방향키로 기울여 보세요"></canvas><span class="stagehint" id="hint">좌우로 끌어서 기울여 보세요</span></div><div class="controlbar"><button id="play">자동 재생</button><input id="tilt" type="range" min="-100" max="100" value="0" aria-label="기울기"><button id="center" class="smallbtn">가운데</button></div><div class="anglelabels"><span>가까이 ←</span><span>떨어져 있기</span><span>→ 가까이</span></div><div class="actions"><button id="png" class="primary">PNG 저장</button><button id="gif">GIF 저장</button><span class="spacer"></span></div><div id="progress" class="progress" role="status" aria-live="polite"></div><p class="note">그림이 없는 자리는 예시로 표시됩니다. 업로드한 그림은 비율을 유지합니다.</p></section></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
const chars=[{img:null,name:'',scale:100,x:0,y:0,rot:0,flip:false},{img:null,name:'',scale:100,x:0,y:0,rot:0,flip:false}];
let active=0,playing=false,phase=0,lastTime=0,tilt=0,busy=false,drag=null,uploadTicket=0;const rects=[];
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),ease=n=>{n=clamp(n);return n*n*(3-2*n)},lerp=(a,b,t)=>a+(b-a)*t;
function range(parent,id,label,min,max,val,unit){const d=document.createElement('div');d.className='field';d.innerHTML=`<label for="${id}">${label}</label><div class="range"><input id="${id}" type="range" min="${min}" max="${max}" value="${val}"><output id="${id}Out">${val}${unit}</output></div>`;$(parent).append(d);$(id).addEventListener('input',()=>{$(id+'Out').value=$(id).value+unit; if(['scale','x','y','rot'].includes(id))chars[active][id]=+$(id).value;});}
range('charfields','scale','크기',20,240,100,'%');range('charfields','x','좌우 위치',-220,220,0,'');range('charfields','y','높이',-220,180,0,'');range('charfields','rot','회전',-35,35,0,'°');range('motionfields','gap','처음 거리',0,200,90,'');range('motionfields','overlap','마지막 겹침',0,100,24,'%');range('motionfields','lean','기대는 각도',0,20,8,'°');
function sync(){for(let i=0;i<2;i++)$('tab'+i).classList.toggle('active',active===i);const c=chars[active];for(const id of ['scale','x','y','rot']){$(id).value=c[id];$(id+'Out').value=c[id]+(id==='scale'?'%':id==='rot'?'°':'');}$('charname').value=c.name;$('flip').checked=c.flip;$('uploadLabel').textContent=c.img?'이미지 바꾸기':'이미지 불러오기';}
$('tab0').onclick=()=>{active=0;sync()};$('tab1').onclick=()=>{active=1;sync()};$('charname').oninput=e=>{chars[active].name=e.target.value;if(e.target.value.trim())$('names').checked=true;};$('flip').onchange=e=>chars[active].flip=e.target.checked;
$('charReset').onclick=()=>{Object.assign(chars[active],{scale:100,x:0,y:0,rot:0,flip:false});sync()};$('remove').onclick=()=>{chars[active].img=null;sync()};
$('upload').onchange=async e=>{const file=e.target.files[0],target=active;if(!file)return;const ticket=++uploadTicket;try{const url=URL.createObjectURL(file),img=new Image();try{img.src=url;await img.decode();if(img.naturalWidth*img.naturalHeight>60000000)throw Error('이미지가 너무 큽니다. 긴 변을 6000px 이하로 줄여 주세요.');const source=document.createElement('canvas');source.width=img.naturalWidth;source.height=img.naturalHeight;const s=source.getContext('2d');s.drawImage(img,0,0);let x0=0,y0=0,x1=source.width,y1=source.height;if(file.type==='image/png'||file.type==='image/webp'){const data=s.getImageData(0,0,source.width,source.height).data;let l=source.width,t=source.height,r=-1,b=-1;for(let y=0;y<source.height;y++)for(let x=0;x<source.width;x++){if(data[(y*source.width+x)*4+3]>8){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y)}}if(r<0)throw Error('완전히 투명한 이미지입니다.');x0=l;y0=t;x1=r+1;y1=b+1;}const crop=document.createElement('canvas');crop.width=x1-x0;crop.height=y1-y0;crop.getContext('2d').drawImage(source,x0,y0,crop.width,crop.height,0,0,crop.width,crop.height);chars[target].img=crop;if(active===target)sync();$('progress').textContent='이미지를 불러왔어요.';}finally{URL.revokeObjectURL(url)}}catch(err){$('progress').textContent='이미지를 불러오지 못했어요. '+err.message;}e.target.value='';};
for(const color of ['#f0f2e8','#f7e9e7','#e8eff5','#f6edda','#eae5f3','#ffffff']){const b=document.createElement('button');b.className='swatch';b.style.background=color;b.title=color;b.onclick=()=>$('bg').value=color;$('colors').append(b)}
function settings(){return {who:$('who').value,reaction:$('reaction').value,gap:+$('gap').value,overlap:+$('overlap').value/100,lean:+$('lean').value,front:$('front').value==='a'?0:1,bg:$('bg').value,accent:$('accent').value,transparent:$('transparent').checked,frame:$('frame').checked,hearts:$('hearts').checked,shadows:$('shadows').checked,names:$('names').checked,ratio:+$('ratio').value};}
function dimensions(long,ratio){return ratio>=1?[long,Math.round(long/ratio)]:[Math.round(long*ratio),long]}
function rounded(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function heart(g,x,y,s,color){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();g.moveTo(0,3);g.bezierCurveTo(-13,-5,-7,-14,0,-7);g.bezierCurveTo(7,-14,13,-5,0,3);g.fillStyle=color;g.fill();g.restore()}
function placeholder(g,w,h,i){g.fillStyle=i?'#9aa9b9':'#d5bdb0';rounded(g,-w/2,-h,w,h,Math.min(w*.44,70));g.fill();g.fillStyle=i?'#b8c5d0':'#e8d4c4';g.beginPath();g.ellipse(0,-h*.73,w*.40,w*.40,0,0,Math.PI*2);g.fill();g.fillStyle='#ffffffb8';g.textAlign='center';g.textBaseline='middle';g.font='500 '+w*.24+'px sans-serif';g.fillText(i?'B':'A',0,-h*.4);}
function geometry(s,p,W,H){const u=W/720,base=H*.79, maxH=H*.57,maxW=W*.29;
const sizes=chars.map(c=>{const ratio=c.img?c.img.width/c.img.height:.62;let h=Math.min(maxH,maxW/ratio)*c.scale/100;return {w:h*ratio,h}});let apart=(sizes[0].w+sizes[1].w)/2+s.gap*u,near=(sizes[0].w+sizes[1].w)/2*(1-s.overlap),dist=lerp(apart,near,p),left=W/2-apart/2,right=W/2+apart/2;
if(s.who==='both'){left=W/2-dist/2;right=W/2+dist/2}else if(s.who==='a'){left=right-dist}else{right=left+dist}
return sizes.map((d,i)=>({...d,x:(i?right:left)+chars[i].x*u,y:base+chars[i].y*u,rot:chars[i].rot*Math.PI/180+(s.reaction==='lean'?(i?-1:1)*s.lean*Math.PI/180*ease((p-.62)/.38):0)}));}
function render(g,W,H,value,s,edit=false){g.clearRect(0,0,W,H);const abs=Math.abs(value),close=ease(abs);let p=close;if(s.reaction==='shy'&&close>.77)p=lerp(.77,.23,ease((close-.77)/.23));const u=W/720,geo=geometry(s,p,W,H);if(!s.transparent){g.fillStyle=s.bg;g.fillRect(0,0,W,H);g.fillStyle='#ffffff35';g.beginPath();g.ellipse(W*.5,H*.92,W*.7,H*.3,0,0,Math.PI*2);g.fill();}if(s.frame){g.strokeStyle='#747e5d40';g.lineWidth=1.3*u;rounded(g,22*u,22*u,W-44*u,H-44*u,12*u);g.stroke();}
if(s.shadows){g.fillStyle='#45504416';for(const d of geo){g.beginPath();g.ellipse(d.x,d.y+8*u,d.w*.48,10*u,0,0,Math.PI*2);g.fill()}}
for(const i of [1-s.front,s.front]){const d=geo[i],c=chars[i];g.save();g.translate(d.x,d.y);g.rotate(d.rot);if(c.flip)g.scale(-1,1);if(c.img)g.drawImage(c.img,-d.w/2,-d.h,d.w,d.h);else placeholder(g,d.w,d.h,i);g.restore();if(s.names&&c.name){g.fillStyle='#555e50';g.textAlign='center';g.font=`${12*u}px "Malgun Gothic",sans-serif`;g.fillText(c.name,d.x,d.y+36*u);}if(edit&&i===active){g.save();g.translate(d.x,d.y);g.rotate(d.rot);g.strokeStyle='#78936e';g.lineWidth=1.5*u;g.setLineDash([5*u,4*u]);g.strokeRect(-d.w/2-5*u,-d.h-5*u,d.w+10*u,d.h+10*u);g.restore();}}
if(s.hearts&&p>.47){const t=ease((p-.47)/.53),x=(geo[0].x+geo[1].x)/2,y=Math.min(...geo.map(d=>d.y-d.h))+H*.07;g.globalAlpha=t;heart(g,x,y-14*u*t,.95*u,s.accent);heart(g,x-28*u,y+8*u-10*u*t,.45*u,s.accent);heart(g,x+27*u,y-7*u-18*u*t,.55*u,s.accent);g.globalAlpha=1;}
if(s.reaction==='shy'&&close>.8){g.strokeStyle=s.accent;g.lineWidth=2*u;for(const i of [0,1]){const d=geo[i],dir=i?1:-1;g.beginPath();g.moveTo(d.x+dir*d.w*.55,d.y-d.h*.85);g.lineTo(d.x+dir*(d.w*.55+13*u),d.y-d.h*.85-12*u);g.stroke();}}
if(g===ctx){rects.splice(0,rects.length,...geo);$('sceneStatus').textContent=s.reaction==='shy'&&close>.85?'깜짝, 다시 한 칸':p>.8?'가장 가까운 순간':p>.15?'조금씩 가까워지는 중':'떨어져 있는 순간';}}
function setTilt(v){tilt=clamp(v,-1,1);$('tilt').value=Math.round(tilt*100)}function stop(){playing=false;$('play').textContent='자동 재생'}$('tilt').oninput=e=>{stop();setTilt(+e.target.value/100)};$('center').onclick=()=>{stop();setTilt(0)};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시 정지':'자동 재생';phase=0;lastTime=0;};
// 가운데에서 출발해 양쪽으로 기울고 되돌아오는 동일한 루프.
function loopValue(t){return Math.sin(t*Math.PI*2)}
function animate(time){const s=settings(),[w,h]=dimensions(720,s.ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}if(playing&&!busy){if(lastTime)phase=(phase+(time-lastTime)/(+$('duration').value*1000))%1;setTilt(loopValue(phase));}lastTime=time;render(ctx,w,h,tilt,s,$('edit').checked);requestAnimationFrame(animate)}requestAnimationFrame(animate);
canvas.onpointerdown=e=>{if(busy)return;stop();canvas.setPointerCapture(e.pointerId);const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*canvas.width/b.width,y=(e.clientY-b.top)*canvas.height/b.height;if($('edit').checked){const order=[settings().front,1-settings().front];const found=order.find(i=>{const d=rects[i],dx=x-d.x,dy=y-d.y,a=-d.rot,rx=dx*Math.cos(a)-dy*Math.sin(a),ry=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(rx)<=d.w/2&&ry<=0&&ry>=-d.h});if(found===undefined)return;active=found;sync();drag={mode:'edit',x,y,ox:chars[active].x,oy:chars[active].y};}else drag={mode:'tilt',x:e.clientX,start:tilt};};canvas.onpointermove=e=>{if(!drag)return;const b=canvas.getBoundingClientRect();if(drag.mode==='tilt')setTilt(drag.start+(e.clientX-drag.x)/(b.width*.4));else{chars[active].x=clamp(drag.ox+((e.clientX-b.left)*canvas.width/b.width-drag.x)*720/canvas.width,-220,220);chars[active].y=clamp(drag.oy+((e.clientY-b.top)*canvas.height/b.height-drag.y)*720/canvas.width,-220,180);sync()}};function release(){drag=null}canvas.onpointerup=release;canvas.onpointercancel=release;canvas.onlostpointercapture=release;canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();stop();setTilt(e.key==='Home'?0:tilt+(e.key==='ArrowRight'?.05:-.05))}};$('edit').onchange=()=>{$('hint').textContent=$('edit').checked?'그림을 끌어 위치를 조절하세요':'좌우로 끌어서 기울여 보세요'};
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('png').onclick=()=>{const s=settings(),[w,h]=dimensions(720*+$('pngScale').value,s.ratio),c=document.createElement('canvas');c.width=w;c.height=h;render(c.getContext('2d'),w,h,tilt,s);c.toBlob(b=>{if(b){download(b,'한_칸_더_가까이.png');$('progress').textContent='현재 장면을 PNG로 저장했어요.'}else $('progress').textContent='PNG 저장에 실패했어요.'},'image/png');};
const breathe=()=>new Promise(r=>setTimeout(r,0));
function paletteFrom(samples){let boxes=[samples];while(boxes.length<255){let best=-1,score=-1;for(let i=0;i<boxes.length;i++){const b=boxes[i];if(b.length<2)continue;const range=[0,1,2].map(k=>{let lo=255,hi=0;for(const p of b){lo=Math.min(lo,p[k]);hi=Math.max(hi,p[k])}return hi-lo});const v=Math.max(...range)*Math.sqrt(b.length);if(v>score){score=v;best=i;b.axis=range.indexOf(Math.max(...range));}}if(best<0||score===0)break;const b=boxes[best],k=b.axis;b.sort((a,c)=>a[k]-c[k]);const m=b.length>>1;boxes.splice(best,1,b.slice(0,m),b.slice(m));}const pal=[[0,0,0]];for(const b of boxes){const sum=[0,0,0];for(const p of b)for(let k=0;k<3;k++)sum[k]+=p[k];pal.push(sum.map(v=>Math.round(v/b.length)))}while(pal.length<256)pal.push(pal[pal.length-1]||[255,255,255]);return pal;}
function quantize(rgba,pal,cache){const out=new Uint8Array(rgba.length/4);for(let i=0,j=0;i<rgba.length;i+=4,j++){if(rgba[i+3]<128){out[j]=0;continue}const r=rgba[i],g=rgba[i+1],b=rgba[i+2],key=(r<<16)|(g<<8)|b;let idx=cache.get(key);if(idx===undefined){let best=1,dist=Infinity;for(let k=1;k<256;k++){const p=pal[k],d=(r-p[0])**2*.3+(g-p[1])**2*.59+(b-p[2])**2*.11;if(d<dist){dist=d;best=k;if(!d)break}}idx=best;if(cache.size<250000)cache.set(key,idx)}out[j]=idx;}return out}
// 9비트 사전만 사용하고 510에서 지워 코드 폭 경계 오류를 방지한다.
function lzw(data){let dict=new Map(),next=258,acc=0,bits=0,bytes=[];function emit(code){acc|=code<<bits;bits+=9;while(bits>=8){bytes.push(acc&255);acc>>>=8;bits-=8}}emit(256);let prefix=data[0];for(let i=1;i<data.length;i++){const k=data[i],key=prefix*256+k,found=dict.get(key);if(found!==undefined){prefix=found;continue}emit(prefix);dict.set(key,next++);prefix=k;if(next===510){emit(256);dict.clear();next=258}}emit(prefix);emit(257);if(bits)bytes.push(acc&255);return bytes;}
function gifWriter(w,h,pal){const a=[];const byte=n=>a.push(n&255),word=n=>{byte(n);byte(n>>8)},str=s=>{for(const c of s)byte(c.charCodeAt(0))};str('GIF89a');word(w);word(h);byte(247);byte(0);byte(0);for(const p of pal)for(const v of p)byte(v);str('!');byte(255);byte(11);str('NETSCAPE2.0');byte(3);byte(1);word(0);byte(0);return {frame(data,delay){byte(33);byte(249);byte(4);byte(9);word(delay);byte(0);byte(0);byte(44);word(0);word(0);word(w);word(h);byte(0);byte(8);const z=lzw(data);for(let i=0;i<z.length;i+=255){byte(Math.min(255,z.length-i));for(let j=i;j<Math.min(i+255,z.length);j++)byte(z[j])}byte(0)},finish(){byte(59);return new Blob([new Uint8Array(a)],{type:'image/gif'})}}}
$('gif').onclick=async()=>{if(busy)return;busy=true;stop();for(const b of document.querySelectorAll('button,input,select'))b.disabled=true;const s=settings(),duration=+$('duration').value,n=duration*12,[w,h]=dimensions(+$('gifSize').value,s.ratio),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});try{const samples=[];for(let i=0;i<12;i++){render(g,w,h,loopValue(i/12),s);const d=g.getImageData(0,0,w,h).data;for(let j=(i%4)*4;j<d.length;j+=Math.max(4,Math.floor(w*h/4000))*4)if(d[j+3]>=128)samples.push([d[j],d[j+1],d[j+2]]);$('progress').textContent=`GIF 색상 준비 중 ${Math.round((i+1)/12*100)}%`;await breathe()}if(!samples.length)samples.push([255,255,255]);const pal=paletteFrom(samples),cache=new Map(),writer=gifWriter(w,h,pal);for(let i=0;i<n;i++){render(g,w,h,loopValue(i/n),s);const rgba=g.getImageData(0,0,w,h).data,indices=quantize(rgba,pal,cache),delay=Math.round((i+1)*100/12)-Math.round(i*100/12);writer.frame(indices,delay);$('progress').textContent=`GIF 저장 중 ${Math.round((i+1)/n*100)}%`;await breathe()}const blob=writer.finish();download(blob,'한_칸_더_가까이.gif');$('progress').textContent=`GIF 저장 완료 · ${(blob.size/1048576).toFixed(1)}MB`;}catch(e){console.error(e);$('progress').textContent='GIF 저장에 실패했어요. 크기를 줄여 다시 시도해 주세요.'}finally{busy=false;for(const b of document.querySelectorAll('button,input,select'))b.disabled=false;}};
</script></html>
