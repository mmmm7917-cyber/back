<style>

x}.item .head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px}.item .head strong{color:#ecd0d4;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .head button{padding:3px 7px;font-size:11px}.item .field{margin-bottom:9px}.muted{color:#998b91;font-size:11px;line-height:1.6}.hint{border-left:2px solid #794457;padding:10px;color:#a8949d;background:#1d171e;margin:14px 0;font-size:11px;line-height:1.7}.minor{padding:7px 9px;font-size:11px}.canvas-area{overflow:auto;display:flex;flex-direction:column;align-items:stretch;min-width:0;background:radial-gradient(ellipse at 50% 15%,#27202a 0%,#0f0d12 75%)}.canvas-top{padding:21px 26px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.canvas-top .caption{font-size:10px;color:#b8a5ad;letter-spacing:1.5px}.canvas-top .sub{font-size:11px;color:#9e8991}.preview-container{padding:6px 26px 20px;display:flex;align-items:flex-start;justify-content:center;min-height:0;flex:1}.canvas-frame{width:100%;max-width:1420px;position:relative;align-self:center;box-shadow:0 18px 70px #0008;border:1px solid #71505c;line-height:0;background:#09090b}#scene{width:100%;height:auto;aspect-ratio:16/9;display:block;touch-action:none;cursor:default}.playbar{background:#161218;border-top:1px solid #3d2d36;min-height:69px;display:flex;align-items:center;gap:12px;padding:13px 24px;flex-wrap:wrap}.playbar button{white-space:nowrap}.playbar input[type=range]{flex:1;min-width:100px}.clock{font-variant-numeric:tabular-nums;color:#a999a1;min-width:77px;text-align:right}.toast{position:fixed;right:26px;bottom:22px;z-index:50;padding:12px 16px;background:#3d2230;border:1px solid #b55b71;border-radius:8px;box-shadow:0 12px 32px #0008;max-width:420px;display:none;font-size:12px}.toast.show{display:block}.export-progress{margin-top:9px;color:#dbcbd0;display:none}.export-progress progress{width:100%;accent-color:#b53b50}.stat-edit{display:flex;gap:3px;margin:5px 0 11px}.stat-edit button{flex:1;min-width:0;padding:0;height:20px;border-radius:2px;border-color:#564148;background:#2b252b}.stat-edit button.on{background:#c76838;border-color:#dd9267}.hide{display:none!important}body.viewer header,body.viewer .sidebar,body.viewer .canvas-top,body.viewer .playbar{display:none}body.viewer .app{grid-template-columns:1fr;height:100vh}body.viewer .preview-container{padding:20px}body.viewer .canvas-frame{max-width:min(96vw,calc(96vh * 16 / 9));align-self:center}body.viewer .canvas-area{justify-content:center}body.viewer #scene{cursor:default}@media(max-width:1100px){header{height:auto;min-height:68px;flex-wrap:wrap;padding:11px 13px}.brand{min-width:160px}.app{grid-template-columns:318px minmax(0,1fr);height:calc(100vh - 90px)}.tabs{grid-template-columns:repeat(3,1fr)}.preview-container{padding:4px 12px 20px}.canvas-top{padding:15px 13px}}@media(max-width:720px){header{align-items:flex-start}.brand{min-width:100%}.top-actions{order:2}.top-right{margin-left:auto}.app{height:auto;min-height:0;display:flex;flex-direction:column-reverse}.canvas-area{min-height:0}.preview-container{padding:5px 8px 15px;min-height:225px}.canvas-top{padding:12px}.playbar{padding:9px}.sidebar{max-height:55vh;border-top:1px solid #493640;overflow:hidden}.tabs{grid-template-columns:repeat(6,1fr)}.panel{min-height:0;overflow-y:auto}.side-title{padding:12px}.tabs button{padding:8px 0;font-size:10px}.top-actions select{min-width:110px}}

<header><div class="brand"><strong>PAIR SCENARIO</strong><small>INTERACTIVE SCENARIO STUDIO</small></div><div class="top-actions"><select id="presetTop" title="장르 프리셋"></select><button id="newProject">새 프로젝트</button><button id="undo" title="Ctrl+Z">↶ 실행 취소</button><button id="redo" title="Ctrl+Y">↷ 다시 실행</button><button id="viewerBtn">감상 모드</button></div><div class="top-right"><button class="primary" id="saveTop">저장 · 내보내기</button></div></header>

<script>
(()=>{'use strict';
const W=1600,H=900,canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:true});
const $=s=>document.querySelector(s),uid=()=> 'p'+Math.random().toString(36).slice(2,10),clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),num=(v,d=0)=>Number.isFinite(+v)?+v:d;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const presets={zombie:{name:'ZOMBIE SURVIVAL',primary:'#790D1D',accent:'#B53B50',label:'생존 가능성'},fantasy:{name:'DARK FANTASY',primary:'#75602E',accent:'#BFA06E',label:'임무 성공률'},operation:{name:'MODERN OPERATION',primary:'#344B5E',accent:'#8FA9B9',label:'작전 달성률'},relationship:{name:'RELATIONSHIP DRAMA',primary:'#713448',accent:'#E6B8BA',label:'관계 안정도'},school:{name:'SCHOOL INCIDENT',primary:'#303D63',accent:'#B45D75',label:'사건 해결도'}};
const parts=[['head','머리'],['torso','몸통'],['leftArm','왼팔'],['rightArm','오른팔'],['leftLeg','왼다리'],['rightLeg','오른다리']];
const icons=['sword','dagger','shield','bat','bag','med','food','key','flashlight','book','tool','question','radio','staff'];
const iconName={sword:'검',dagger:'단검',shield:'방패',bat:'배트',bag:'가방',med:'의약품',food:'식품',key:'열쇠',flashlight:'손전등',book:'책',tool:'도구',question:'기타',radio:'무전기',staff:'지팡이'};
function statGroup(name,names){return {id:uid(),name,entries:names.map((n,i)=>({id:uid(),name:n,value:Math.max(2,8-i),max:10}))};}
function mkChar(id){return {id,name:'CHARACTER '+id,affiliation:'UNKNOWN',job:'조사원',role:id==='A'?'선봉':'지원',metadata:[{id:uid(),name:'활동 구역',value:'북부 구역'},{id:uid(),name:'기록 번호',value:id+'-027'},{id:uid(),name:'생존 시간',value:'03:14:26'}],image:null,imageTransform:{zoom:1,x:0,y:0,rotation:0,flipX:false,brightness:100,contrast:100,opacity:100,mode:'cover'},stats:[statGroup('기본 능력',['체력','집중','정신력']),statGroup('생존 능력',['탐색','의지']),statGroup('제작 능력',['기술','응급']),statGroup('전투 능력',['공격','회피'])],inventory:[{id:uid(),name:'손전등',quantity:1,icon:'flashlight',equipped:true},{id:uid(),name:'응급 키트',quantity:2,icon:'med',equipped:false},{id:uid(),name:'무전기',quantity:1,icon:'radio',equipped:true},{id:uid(),name:'열쇠',quantity:3,icon:'key',equipped:false}],injuries:[],hp: id==='A'?84:92,stress:id==='A'?32:18,equipment:{name:id==='A'?'철제 배트':'휴대 무전기',type:'대표 장비',description:'현장에서 사용하는 장비',icon:id==='A'?'bat':'radio',image:null}};}
function defaultProject(){return {version:'1.0.0',title:'PAIR SCENARIO',mode:'pair',theme:{preset:'zombie',primary:'#790D1D',accent:'#B53B50',text:'#F6F1ED',panelOpacity:0.78,fontScale:1},background:{source:null,style:'gradient',zoom:1,x:0,y:0,flipX:false,brightness:100,blur:0,overlay:65,noise:true,lines:true,vignette:true},characters:[mkChar('A'),mkChar('B')],dialogues:[{id:uid(),speaker:0,text:'신호가 끊겼어. 이곳에 우리만 있는 것 같아.',style:'rounded',effect:'typing',start:0.55,size:1,color:'#3b202b',align:'left'},{id:uid(),speaker:1,text:'아직 판단하긴 일러. 조금 더 확인해 보자.',style:'outlined',effect:'fade',start:1.2,size:1,color:'#26333b',align:'left'}],timeline:[{id:uid(),title:'현장 도착',description:'북부 구역 진입',time:'00:00',side:'left',color:'#B53B50',emphasized:false,risk:2},{id:uid(),title:'첫 번째 신호',description:'정체불명의 전파 확인',time:'00:16',side:'right',color:'#B53B50',emphasized:false,risk:4},{id:uid(),title:'단서 발견',description:'기록 장치 수색',time:'00:31',side:'left',color:'#BFA06E',emphasized:false,risk:2},{id:uid(),title:'상황 악화',description:'통로가 차단됨',time:'01:04',side:'right',color:'#D44C61',emphasized:true,risk:7},{id:uid(),title:'재집결',description:'두 인원 합류',time:'02:25',side:'left',color:'#48A17B',emphasized:false,risk:2},{id:uid(),title:'최종 결정',description:'작전 지속 결정',time:'03:14',side:'right',color:'#B53B50',emphasized:false,risk:3}],outcome:{label:'생존 가능성',value:95.87,decimals:2,suffix:'%',mode:'manual',color:'#F4E4DC',risk:'보통',countUp:true},animation:{duration:4,fps:12,loop:true,speed:1,charEffect:'rise'},layout:{charAOffsetX:0,charAOffsetY:0,charBOffsetX:0,charBOffsetY:0,dialogueOffsetX:0,dialogueOffsetY:0,timelineOffsetX:0,timelineOffsetY:0,outcomeOffsetX:0,outcomeOffsetY:0},settings:{invColumns:2,showIcons:true,showQuantity:true,statsPage:[0,0],dialoguePage:0,timelinePage:0,svgDetail:true}};}
let project=defaultProject(),selectedChar=0,selectedPart='torso',tab='character',t=project.animation.duration,playing=false,lastTick=0,exporting=false,history=[],future=[],imageCache=new Map(),renderBusy=false,drag=null,toastTimer=0;
const tabs=[['character','인물'],['inventory','소지품'],['stats','능력치'],['status','상태·장비'],['dialogue','대사'],['timeline','사건'],['outcome','결과'],['background','배경'],['style','스타일'],['motion','모션'],['layout','배치'],['export','저장']];
function notify(m,error=false){const el=$('#toast');el.textContent=m;el.style.borderColor=error?'#e16d69':'#b55b71';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4300)}
function snapshot(){if(exporting)return;history.push(JSON.stringify(project));if(history.length>30)history.shift();future=[];syncHistory()}
function syncHistory(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}
function restore(raw){try{project=normalize(JSON.parse(raw));imageCache.clear();t=project.animation.duration;playing=false;syncUi();preload().catch(()=>{});return true}catch(e){notify('프로젝트 복원 실패: '+e.message,true);return false}}
function undo(){if(!history.length)return;future.push(JSON.stringify(project));const s=history.pop();restore(s);syncHistory()}
function redo(){if(!future.length)return;history.push(JSON.stringify(project));const s=future.pop();restore(s);syncHistory()}
function val(path){return path.split('.').reduce((o,k)=>o?.[k],project)}
function set(path,value){const parts=path.split('.');let o=project;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts.at(-1)]=value}
function makeField(label,path,type='text',opts={}){let v=val(path),id='e'+path.replace(/\W/g,'_');const attr=`data-path="${esc(path)}" data-value-type="${type}" id="${id}"`;
if(type==='checkbox')return `<div class="field"><label><input type="checkbox" ${attr} ${v?'checked':''}> ${esc(label)}</label></div>`;
if(type==='select')return `<div class="field"><label for="${id}">${esc(label)}</label><select ${attr}>${opts.options.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
if(type==='textarea')return `<div class="field"><label for="${id}">${esc(label)}</label><textarea ${attr} rows="${opts.rows||2}">${esc(v)}</textarea></div>`;
if(type==='range')return `<div class="field"><label for="${id}">${esc(label)} <span data-range-label="${esc(path)}">${esc(v)}</span></label><input type="range" ${attr} min="${opts.min??0}" max="${opts.max??100}" step="${opts.step??1}" value="${esc(v)}"></div>`;
return `<div class="field"><label for="${id}">${esc(label)}</label><input ${attr} type="${type==='number'?'number':type==='color'?'color':'text'}" value="${esc(v)}" ${type==='number'?`step="${opts.step||1}" ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''}`:''}></div>`}
function action(name,label,cls='minor',extra=''){return `<button class="${cls}" data-action="${name}" ${extra}>${label}</button>`}
function charSwitch(){return `<div class="pill-select"><button class="${selectedChar===0?'active':''}" data-action="charA">CHARACTER A</button><button class="${selectedChar===1?'active':''}" data-action="charB">CHARACTER B</button></div>`}
function uploadField(label,target,accept='image/png,image/jpeg,image/webp'){return `<div class="field"><label>${esc(label)}</label><input type="file" data-upload="${esc(target)}" accept="${accept}"><div class="inline">${action('clearImage:'+target,'이미지 삭제')}</div></div>`}
function orderBtns(kind,i){return `<div class="inline">${action('up:'+kind+':'+i,'↑')}${action('down:'+kind+':'+i,'↓')}${action('del:'+kind+':'+i,'삭제')}</div>`}
function options(arr){return {options:arr.map(x=>Array.isArray(x)?x:[x,x])}}
function buildPanel(){const c=project.characters[selectedChar],base=`characters.${selectedChar}`;let h='';const fld=(label,key,type='text',o={})=>makeField(label,key,type,o);
switch(tab){
case 'character':h=`<h2>캐릭터 편집</h2>${fld('인원 모드','mode','select',options([['pair','2인 페어'],['solo','1인 단독']]))}${charSwitch()}${uploadField('캐릭터 이미지',base+'.image')}${fld('이름',base+'.name')}${fld('소속',base+'.affiliation')}<div class="fieldrow">${fld('직업',base+'.job')}${fld('역할',base+'.role')}</div><h3>이미지 조정</h3>${fld('표시 모드',base+'.imageTransform.mode','select',options([['cover','프레임 채우기'],['contain','전체 표시'],['manual','수동 (원본 크기 기반)']]))}${fld('확대·축소',base+'.imageTransform.zoom','range',{min:.2,max:4,step:.01})}<div class="fieldrow">${fld('가로 위치',base+'.imageTransform.x','number',{step:5})}${fld('세로 위치',base+'.imageTransform.y','number',{step:5})}</div>${fld('회전',base+'.imageTransform.rotation','range',{min:-180,max:180,step:1})}${fld('좌우 반전',base+'.imageTransform.flipX','checkbox')}${fld('밝기',base+'.imageTransform.brightness','range',{min:0,max:200})}${fld('대비',base+'.imageTransform.contrast','range',{min:0,max:200})}${fld('투명도',base+'.imageTransform.opacity','range',{min:0,max:100})}${action('resetTransform','이미지 위치 초기화')}<h3>추가 정보</h3>`;
for(let i=0;i<c.metadata.length;i++)h+=`<div class="item"><div class="fieldrow">${fld('항목명',base+'.metadata.'+i+'.name')}${fld('값',base+'.metadata.'+i+'.value')}</div>${orderBtns('metadata',i)}</div>`;h+=action('add:metadata','＋ 정보 항목 추가');break;
case 'inventory':h=`<h2>소지품 · 인벤토리</h2>${charSwitch()}<div class="fieldrow">${fld('표시 열','settings.invColumns','select',options([[1,'1열'],[2,'2열']]))}${fld('아이콘 표시','settings.showIcons','checkbox')}</div>${fld('수량 표시','settings.showQuantity','checkbox')}`;
for(let i=0;i<c.inventory.length;i++)h+=`<div class="item"><div class="head"><strong>${i+1}. ${esc(c.inventory[i].name)}</strong></div>${fld('아이템명',base+'.inventory.'+i+'.name')}<div class="fieldrow">${fld('수량',base+'.inventory.'+i+'.quantity','number',{min:0})}${fld('아이콘',base+'.inventory.'+i+'.icon','select',options(icons.map(x=>[x,iconName[x]])))}</div>${fld('장착 중',base+'.inventory.'+i+'.equipped','checkbox')}${orderBtns('inventory',i)}</div>`;

case 'export':h=`<h2>내보내기 · 프로젝트</h2><h3>PNG 이미지</h3>${`<div class="field"><label>출력 영역</label><select id="pngCrop"><option value="full">전체 상황판</option><option value="a">캐릭터 A 카드</option><option value="b">캐릭터 B 카드</option><option value="center">중앙 사건 패널</option></select></div><div class="field"><label>크기</label><select id="pngSize"><option value="1">기본 1600 × 900 기준</option><option value="1.2">고해상도 (120%)</option><option value="2">초고해상도 (200%)</option></select></div><div class="field"><label><input type="checkbox" id="transparent"> 배경 투명</label></div>`}${action('savePNG','PNG 저장','primary')}<h3>GIF 애니메이션</h3><div class="field"><label>GIF 해상도</label><select id="gifSize"><option value="0.6">960 × 540 (권장)</option><option value="0.4">640 × 360 (빠름)</option><option value="0.75">1200 × 675 (고화질)</option></select></div><div class="field"><label><input id="gifDither" type="checkbox"> 디더링 적용 (느림)</label></div>${action('saveGIF','실제 GIF89a 저장','primary')}<div class="export-progress" id="exportProgress"><span id="exportStatus">준비 중</span><progress id="gifProgress" value="0" max="100"></progress></div><div class="hint">GIF는 256색 포맷입니다. 이미지 색상이 다소 줄어들 수 있으며, 큰 이미지는 처리에 시간이 걸릴 수 있습니다.</div><h3>프로젝트 백업</h3><div class="inline">${action('saveJSON','JSON 저장')}${action('loadJSON','JSON 불러오기')}</div><div class="hint">JSON에 업로드 이미지의 데이터가 포함되므로 이미지가 크면 백업 파일도 커집니다.</div>`;break;

function applyPreset(key){let p=presets[key];if(!p)return;project.theme.preset=key;project.theme.primary=p.primary;project.theme.accent=p.accent;project.outcome.label=p.label;document.documentElement.style.setProperty('--accent',p.accent)}
function syncUi(){buildPanel();$('#presetTop').value=project.theme.preset;$('#loop').checked=project.animation.loop;$('#seek').value=Math.round(1000*t/project.animation.duration);$('#play').textContent=playing?'❚❚ 일시정지':'▶ 재생';$('#clock').textContent=`${t.toFixed(2)} / ${num(project.animation.duration,4).toFixed(2)}`;syncHistory();render()}
function normalize(p){let d=defaultProject();if(!p||typeof p!=='object'||!Array.isArray(p.characters))throw Error('유효하지 않은 프로젝트 구조입니다');let q={...d,...p,theme:{...d.theme,...p.theme},background:{...d.background,...p.background},outcome:{...d.outcome,...p.outcome},animation:{...d.animation,...p.animation},layout:{...d.layout,...p.layout},settings:{...d.settings,...p.settings}};q.characters=[0,1].map(i=>{let a=p.characters[i]||{},c=d.characters[i];return {...c,...a,metadata:Array.isArray(a.metadata)?a.metadata:c.metadata,stats:Array.isArray(a.stats)?a.stats:c.stats,inventory:Array.isArray(a.inventory)?a.inventory:c.inventory,injuries:Array.isArray(a.injuries)?a.injuries:c.injuries,imageTransform:{...c.imageTransform,...a.imageTransform},equipment:{...c.equipment,...a.equipment}}});q.dialogues=Array.isArray(p.dialogues)?p.dialogues:d.dialogues;q.timeline=Array.isArray(p.timeline)?p.timeline:d.timeline;return q}
function selectTab(s){tab=s;buildPanel()}
function moveIn(a,i,dir){let j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function updateInjury(){const c=project.characters[selectedChar],part=selectedPart;const st=$('#injuryState').value,sev=num($('#injurySeverity').value,1),desc=$('#injuryDesc').value;snapshot();c.injuries=c.injuries.filter(x=>x.part!==part);if(st!=='normal')c.injuries.push({id:uid(),part,state:st,severity:sev,description:desc});buildPanel();render()}
function doAction(raw){let [a,sub,index]=raw.split(':'),c=project.characters[selectedChar];switch(a){case 'charA':selectedChar=0;buildPanel();return;case 'charB':selectedChar=1;buildPanel();return;case 'resetTransform':snapshot();c.imageTransform=mkChar(c.id).imageTransform;break;case 'clearImage':snapshot();set(sub,null);if(sub==='background.source')project.background.style='gradient';imageCache.delete(sub);break;case 'resetLayout':snapshot();project.layout=defaultProject().layout;break;case 'savePNG':exportPNG();return;case 'saveGIF':exportGIF();return;case 'saveJSON':saveJSON();return;case 'loadJSON':$('#jsonFile').click();return;case 'restart':restart();return;case 'finish':finish();return;case 'add':snapshot();if(sub==='metadata')c.metadata.push({id:uid(),name:'새 항목',value:'내용'});if(sub==='inventory')c.inventory.push({id:uid(),name:'새 소지품',icon:'question',quantity:1,equipped:false});if(sub==='dialogues'){project.dialogues.push({id:uid(),speaker:0,text:'새 대사',style:'rounded',effect:'fade',start:.6,size:1,color:'#3b202b',align:'left'});project.settings.dialoguePage=Math.floor((project.dialogues.length-1)/2)}if(sub==='timeline')project.timeline.push({id:uid(),title:'새 사건',description:'사건 설명',time:'00:00',side:'left',color:project.theme.accent,emphasized:false,risk:3});break;case 'clear':if(sub==='inventory'&&confirm('소지품을 모두 비울까요?')){snapshot();c.inventory=[]}break;case 'up':case 'down':case 'del':{let isStat=sub==='stat',groupIndex=num(index),entryIndex=num(raw.split(':')[3]);let arr=sub==='metadata'?c.metadata:sub==='inventory'?c.inventory:sub==='dialogues'?project.dialogues:sub==='timeline'?project.timeline:isStat?c.stats[groupIndex]?.entries:null;if(!arr)return;let at=isStat?entryIndex:num(index);snapshot();if(a==='del')arr.splice(at,1);else moveIn(arr,at,a==='up'?-1:1);if(sub==='dialogues')project.settings.dialoguePage=clamp(num(project.settings.dialoguePage),0,Math.max(0,Math.ceil(project.dialogues.length/2)-1));break}case 'duplicate':if(sub==='timeline'){snapshot();let v=JSON.parse(JSON.stringify(project.timeline[num(index)]));v.id=uid();project.timeline.splice(num(index)+1,0,v)}break;case 'upgroup':case 'downgroup':case 'delgroup':snapshot();if(a==='delgroup')c.stats.splice(num(sub),1);else moveIn(c.stats,num(sub),a==='upgroup'?-1:1);break;case 'addgroup':snapshot();c.stats.push(statGroup('새 능력 그룹',['새 능력치']));break;case 'addstat':snapshot();c.stats[num(sub)].entries.push({id:uid(),name:'새 능력치',value:5,max:10});break;case 'statval':{let ent=c.stats[num(sub)].entries[num(index)],n=num(raw.split(':')[3]);snapshot();ent.value=ent.value===n?n-1:n;break}case 'applyInjury':updateInjury();return;case 'removeInjury':snapshot();c.injuries=c.injuries.filter(x=>x.part!==selectedPart);break;default:return;}buildPanel();render()}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)selectTab(b.dataset.tab)});
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)doAction(b.dataset.action)});
const recordFocus=new WeakMap();$('#panel').addEventListener('focusin',e=>{if(e.target.dataset.path)recordFocus.set(e.target,JSON.stringify(project))});
$('#panel').addEventListener('input',e=>{const el=e.target,path=el.dataset.path;if(!path)return;let tp=el.dataset.valueType,v=tp==='checkbox'?el.checked:tp==='number'||tp==='range'?num(el.value):el.value;if(path.endsWith('.max'))v=clamp(v,5,12);if(path.endsWith('.value')&&path.includes('.entries.'))v=clamp(v,0,12);set(path,v);if(path==='animation.duration')t=clamp(t,0,v);if(path==='theme.preset'){applyPreset(v);$('#presetTop').value=v}let lab=document.querySelector('[data-range-label="'+path+'"]');if(lab)lab.textContent=String(v);render();if(tp==='select'||tp==='checkbox'||tp==='color'){const old=recordFocus.get(el);if(old)history.push(old);else snapshot();if(history.length>30)history.shift();future=[];recordFocus.delete(el);syncHistory();if(['theme.preset','animation.duration','mode'].includes(path))buildPanel();}});
$('#panel').addEventListener('change',e=>{const el=e.target,path=el.dataset.path;if(!path)return;if(!['select','checkbox','color'].includes(el.dataset.valueType)){let old=recordFocus.get(el);if(old&&old!==JSON.stringify(project)){history.push(old);if(history.length>30)history.shift();future=[];syncHistory()}recordFocus.delete(el)}if(path==='animation.loop')$('#loop').checked=project.animation.loop;if(path==='theme.preset'||path==='settings.statsPage.'+selectedChar||path==='settings.timelinePage'||path==='settings.dialoguePage')buildPanel();if(path==='animation.duration')syncUi()});
$('#panel').addEventListener('change',e=>{if(e.target.id==='injuryPart'){selectedPart=e.target.value;buildPanel();return}let target=e.target.dataset.upload;if(target)loadImage(e.target.files?.[0],target)},true);
function readFile(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=()=>reject(new Error('파일을 읽을 수 없습니다'));rd.onload=()=>resolve(rd.result);rd.readAsDataURL(file)})}
async function loadImage(file,target){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){notify('PNG, JPG 또는 WebP 이미지가 필요합니다.',true);return}if(file.size>25*1024*1024){notify('이미지는 25MB 이하를 권장합니다.',true);return}try{let data=await readFile(file);let img=await decodeImage(data);snapshot();set(target,data);imageCache.set(data,img);if(target==='background.source')project.background.style='image';buildPanel();render();notify('이미지를 적용했습니다.')}catch(e){notify('이미지 불러오기 실패: '+e.message,true)}}
function decodeImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('이미지 디코딩 오류'));im.src=src})}
async function preload(){let sources=[project.background.source,...project.characters.map(x=>x.image),...project.characters.map(x=>x.equipment.image)].filter(Boolean);for(let src of new Set(sources)){if(!imageCache.has(src))try{imageCache.set(src,await decodeImage(src))}catch(e){imageCache.set(src,null)}}render()}

function restart(){t=0;playing=true;lastTick=performance.now();syncUi()}function finish(){playing=false;t=project.animation.duration;syncUi()}$('#restart').onclick=restart;$('#finish').onclick=finish;$('#play').onclick=()=>{playing=!playing;if(playing){if(t>=project.animation.duration)t=0;lastTick=performance.now()}syncUi()};$('#seek').oninput=e=>{playing=false;t=num(e.target.value)/1000*project.animation.duration;syncUi()};$('#loop').onchange=e=>{snapshot();project.animation.loop=e.target.checked;render()};

function tick(now){if(playing&&!exporting){let dt=Math.min(.05,(now-lastTick)/1000);lastTick=now;t+=dt*num(project.animation.speed,1);if(t>=project.animation.duration){if(project.animation.loop)t=t%project.animation.duration;else{t=project.animation.duration;playing=false}}$('#seek').value=Math.round(t/project.animation.duration*1000);$('#clock').textContent=`${t.toFixed(2)} / ${Number(project.animation.duration).toFixed(2)}`;$('#play').textContent=playing?'❚❚ 일시정지':'▶ 재생';render()}requestAnimationFrame(tick)}
