<header><h1>STILL ON CALL</h1><span>아직 안 끊었어 · 영상통화와 지워진 말</span></header><main><aside><h2>두 사람</h2><div class="row"><div><label>A 이름</label><input id="nameA" value="캐릭터 A" maxlength="20"><label>A 이미지</label><input id="fileA" type="file" accept="image/*"></div><div><label>B 이름</label><input id="nameB" value="캐릭터 B" maxlength="20"><label>B 이미지</label><input id="fileB" type="file" accept="image/*"></div></div><small>원본 비율을 유지해 배치합니다. 이미지는 이 기기 안에서만 사용됩니다.</small><label>크게 보이는 사람</label><select id="mainWho"><option value="B">B</option><option value="A">A</option></select><label>메시지를 쓰는 사람</label><select id="writer"><option value="A">A</option><option value="B">B</option></select><details><summary>이미지 배치</summary><label>A 크기</label><input id="scaleA" type="range" min="50" max="180" value="100"><label>A 상하 위치</label><input id="yA" type="range" min="-120" max="120" value="0"><label>B 크기</label><input id="scaleB" type="range" min="50" max="180" value="100"><label>B 상하 위치</label><input id="yB" type="range" min="-120" max="120" value="0"><label>사진 배치</label><select id="fit"><option value="contain">전체 보이기</option><option value="cover">창 채우기</option></select></details><h2>통화와 메시지</h2><label>통화 중 대사</label><input id="spoken" value="이제 자야 하는 거 아니야?" maxlength="60"><label>썼다가 지울 말</label><textarea id="unsent" maxlength="100">조금만 더 같이 있고 싶어서.</textarea><label>실제로 보낼 답장</label><textarea id="sent" maxlength="70">아직 안 졸려.</textarea><label>상대의 답장</label><input id="reply" value="그럼 조금만 더 있자." maxlength="70"><label>끝에 남을 말</label><input id="ending" value="잠깐만. 끊지 마." maxlength="60"><label>장면 프리셋</label><select id="preset"><option value="night">밤 통화</option><option value="sorry">사과하기 전</option><option value="wait">돌아올 때까지</option><option value="rival">신경 쓰이는 상대</option></select><h2>화면</h2><label>색상</label><select id="theme"><option value="lilac">라일락</option><option value="rose">로즈</option><option value="night">나이트</option><option value="sage">세이지</option></select><label>마지막 연출</label><se
