function validColor(s,fallback){return /^#[0-9a-f]{6}$/i.test(s||'')?s:fallback}
function sanitizeCard(c){let out={...newCard()};if(!c||typeof c!=='object')return out;for(let k of ['shape','background','color','color2','frame','frameColor','surface','backColor','backPattern','backText','backSymbol'])if(typeof c[k]==='string')out[k]=c[k].slice(0,100);for(let k of ['color','color2','frameColor','backColor'])out[k]=validColor(out[k],newCard()[k]);if(Array.isArray(c.objects))out.objects=c.objects.slice(0,180).filter(o=>o&&['image','deco'].includes(o.type)).map(o=>({...o,id:String(o.id||uid()),type:o.type,kind:decos.includes(o.kind)?o.kind:'star',assetId:o.assetId===1?1:0,x:clamp(+o.x||0,-.4,1.4),y:clamp(+o.y||0,-.4,1.4),scale:clamp(+o.scale||.1,.05,2.5),rotation:clamp(+o.rotation||0,-180,180),visible:o.visible!==false,opacity:clamp(o.opacity??1,0,1),color:validColor(o.color,'#c78391'),flipX:!!o.flipX}));return out}
async function importJSON(file){try{if(file.size>30*1024*1024)throw Error('파일 크기가 너무 큽니다 (30MB 초과).');let parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.cards)||!Array.isArray(parsed.assets))throw Error('프로젝트 형식이 올바르지 않습니다.');const p={...project,assets:[null,null],cards:[sanitizeCard(parsed.cards[0]),sanitizeCard(parsed.cards[1])],layout:['solo','side','overlap','pair'].includes(parsed.layout)?parsed.layout:'solo'};
for(let i=0;i<2;i++){const a=parsed.assets[i];if(a&&typeof a.data==='string'&&/^data:image\/(png|jpeg|webp);base64,/i.test(a.data))p.assets[i]={id:String(a.id||uid()),name:String(a.name||'image').slice(0,100),data:a.data}}
for(let k of ['theme','sleeve','package','packColor','seal','sealColor','sealInitial','ribbonColor','desk','camera'])if(typeof parsed[k]==='string')p[k]=parsed[k];for(let k of ['packColor','sealColor','ribbonColor'])p[k]=validColor(p[k],project[k]);
imageCache.clear();await Promise.all(p.assets.map(a=>loadImage(a)));project=p;app.activeCard=clamp(+parsed.activeCard||0,0,project.layout==='pair'?1:0);app.side=parsed.side==='back'?'back':'front';app.selected=null;app.show={open:0,pull:0,flip:0,zoom:clamp(+parsed.showcase?.zoom||1,.7,1.35)};app.showTargets={open:0,pull:0,flip:0};$('#theme').value=['cream','silver','black'].includes(p.theme)?p.theme:'cream';document.body.dataset.theme=$('#theme').value;app.mode='edit';updateTabs();toast('이미지와 프로젝트 설정을 불러왔어요')

// ---------- Integrated browser-only GIF89a encoder ----------
function createPaletteHistogram(times,w,h){let hist=new Uint32Array(32768);for(let t of times){if(app.cancelGif)throw Error('취소됨');let c=sceneCanvas('craft',t,w,h),d=c.getContext('2d').getImageData(0,0,w,h).data;for(let y=0;y<h;y+=3)for(let x=0;x<w;x+=3){let i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2],bin=(r>>3)<<10|(g>>3)<<5|(b>>3);hist[bin]++}}return hist}
function medianCut(hist){const bins=[];for(let i=0;i<32768;i++)if(hist[i])bins.push({r:((i>>10)&31)*8+4,g:((i>>5)&31)*8+4,b:(i&31)*8+4,n:hist[i]});if(!bins.length)return new Uint8Array(768);
function makeBox(arr){let min=[255,255,255],max=[0,0,0],n=0;for(let v of arr){n+=v.n;for(let k=0;k<3;k++){const x=k===0?v.r:k===1?v.g:v.b;min[k]=Math.min(min[k],x);max[k]=Math.max(max[k],x)}}return {arr,n,range:[max[0]-min[0],max[1]-min[1],max[2]-min[2]]}}
let boxes=[makeBox(bins)];while(boxes.length<256){let best=-1,maxScore=0;for(let i=0;i<boxes.length;i++){let b=boxes[i],sc=Math.max(...b.range)*Math.sqrt(b.n);if(b.arr.length>1&&sc>maxScore){best=i;maxScore=sc}}if(best<0)break;let box=boxes.splice(best,1)[0],dim=box.range.indexOf(Math.max(...box.range)),field=['r','g','b'][dim];box.arr.sort((a,b)=>a[field]-b[field]);let half=box.n*.5,k=0,sum=0;while(k<box.arr.length-1&&sum<half)sum+=box.arr[k++].n;boxes.push(makeBox(box.arr.slice(0,k)),makeBox(box.arr.slice(k)))}
let pal=new Uint8Array(256*3);for(let i=0;i<boxes.length;i++){let box=boxes[i],r=0,g=0,b=0;for(let v of box.arr){r+=v.r*v.n;g+=v.g*v.n;b+=v.b*v.n}let n=box.n||1;pal[i*3]=clamp(Math.round(r/n),0,255);pal[i*3+1]=clamp(Math.round(g/n),0,255);pal[i*3+2]=clamp(Math.round(b/n),0,255)}for(let i=boxes.length;i<256;i++){pal[i*3]=pal[(boxes.length-1)*3];pal[i*3+1]=pal[(boxes.length-1)*3+1];pal[i*3+2]=pal[(boxes.length-1)*3+2]}
return pal}
function paletteIndices(data,w,h,pal,cache){const len=w*h,out=new Uint8Array(len);const bayer=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];for(let y=0;y<h;y++)for(let x=0;x<w;x++){let p=y*w+x,j=p*4,dither=(bayer[(y&3)*4+(x&3)]-7.5)*1.25;
let rr=clamp((data[j]+dither)|0,0,255),gg=clamp((data[j+1]+dither)|0,0,255),bb=clamp((data[j+2]+dither)|0,0,255);let key=(rr>>3)<<10|(gg>>3)<<5|(bb>>3),which=cache[key];if(which<0){let dist=Infinity,idx=0;for(let c=0;c<256;c++){let r=rr-pal[c*3],g=gg-pal[c*3+1],b=bb-pal[c*3+2];let score=r*r*.92+g*g*1.1+b*b*.8;if(score<dist){dist=score;idx=c;if(score<2)break}}cache[key]=idx;which=idx}out[p]=which}return out}
class GIFWriter{constructor(w,h,palette){this.bytes=[];this.w=w;this.h=h;this.uStr('GIF89a');this.u16(w);this.u16(h);this.u8(0xf7);this.u8(0);this.u8(0);this.add(palette);this.add([0x21,0xff,0x0b]);this.uStr('NETSCAPE2.0');this.add([3,1,0,0,0])}u8(v){this.bytes.push(v&255)}u16(v){this.u8(v);this.u8(v>>8)}uStr(s){for(let c of s)this.u8(c.charCodeAt(0))}add(arr){for(let b of arr)this.bytes.push(b)}
frame(indices,delay){this.add([0x21,0xf9,4,0x04]);this.u16(delay);this.add([0,0]);this.u8(0x2c);this.u16(0);this.u16(0);this.u16(this.w);this.u16(this.h);this.u8(0);this.u8(8);
let lzw=encodeLZW(indices,8);for(let start=0;start<lzw.length;start+=255){const count=Math.min(255,lzw.length-start);this.u8(count);for(let j=start;j<start+count;j++)this.u8(lzw[j])}this.u8(0)}finish(){this.u8(0x3b);return new Blob([Uint8Array.from(this.bytes)],{type:'image/gif'})}}
function encodeLZW(indices,minSize){const clear=1<<minSize,end=clear+1;let next=end+1,codeSize=minSize+1,dict=new Map();const out=[];let bits=0,buffer=0;
function emit(code){buffer|=code<<bits;bits+=codeSize;while(bits>=8){out.push(buffer&255);buffer>>>=8;bits-=8}}
emit(clear);let prefix=indices[0];for(let i=1;i<indices.length;i++){const k=indices[i],key=(prefix<<8)|k,existing=dict.get(key);if(existing!==undefined){prefix=existing;continue}emit(prefix);
if(next<4096){dict.set(key,next++);if(next>(1<<codeSize)&&codeSize<12)codeSize++}else{emit(clear);dict.clear();next=end+1;codeSize=minSize+1}prefix=k}
emit(prefix);emit(end);if(bits>0)out.push(buffer&255);return out}

async function saveGIF(){if(app.gifBusy)return;app.gifBusy=true;app.cancelGif=false;let load=$('#loading'),text=$('#loadingText'),bar=$('#loadingBar'),percent=$('#loadingPct');load.classList.remove('hide');$('#saveGif').disabled=true;$('#gifProgress').textContent='GIF 인코딩 중';let current=0;
