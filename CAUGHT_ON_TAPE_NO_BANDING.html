<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAUGHT ON TAPE</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#302f30;background:#e9e6df}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:22px 30px;background:#f5f2eb;border-bottom:1px solid #d4d0c8;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:.075em;margin:0}header small{font-size:11px;color:#858077;letter-spacing:.16em}.layout{display:grid;grid-template-columns:minmax(300px,385px) minmax(0,1fr);gap:22px;padding:22px;max-width:1540px;margin:auto}.panel{background:#f8f6f1;border:1px solid #d9d4cb;border-radius:14px;overflow:hidden;align-self:start}.panelhead{padding:19px 20px;border-bottom:1px solid #ded9d1;font-size:13px;font-weight:750;letter-spacing:.05em}details{border-bottom:1px solid #e3ded6}summary{cursor:pointer;padding:15px 20px;font-weight:700;font-size:13px;list-style:none;display:flex;justify-content:space-between}summary:after{content:'＋';font-weight:400;color:#888}details[open] summary:after{content:'−'}.section{padding:0 19px 19px;display:grid;gap:13px}.field{display:grid;gap:6px}.field>label,.minilabel{font-size:11px;color:#666158;font-weight:650}.field input[type=text],.field input[type=datetime-local],select{width:100%;background:#fff;border:1px solid #d7d1c7;padding:10px;border-radius:8px;color:#393630;font-size:12px}.field input[type=range]{width:100%;accent-color:#ac635c}.value{font-size:11px;color:#a05c55;float:right}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chiprow{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #d2ccc3;background:#fff;color:#514e4a;border-radius:7px;padding:9px 11px;font-size:11px}.chip.active{background:#383a3b;color:white;border-color:#383a3b}.upload{display:block;border:1px dashed #bbb2a8;background:#fff;border-radius:9px;padding:10px;text-align:center;font-size:12px;cursor:pointer}.upload input{display:none}.check{display:flex;gap:7px;align-items:center;font-size:12px}.check input{accent-color:#ae655e}.previewSide{position:sticky;top:14px;align-self:start;display:grid;gap:14px}.screenbox{border-radius:17px;background:#25282b;padding:26px 24px 19px;box-shadow:0 12px 35px #25232119}.screenTop{display:flex;justify-content:space-between;color:#9c9e9e;font-size:10px;letter-spacing:.18em;margin-bottom:13px}.stage{display:flex;justify-content:center;align-items:center;min-height:310px}.stage canvas{display:block;max-width:100%;max-height:66vh;object-fit:contain;box-shadow:0 4px 20px #0007;background:#181a1b}.controls{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}.controls button,.export button{border:1px solid #5b5d5d;color:#f0efed;background:#393c3f;border-radius:8px;padding:10px 16px;font-size:12px}.controls .primary{background:#a9635c;border-color:#a9635c}.timeline{width:100%;accent-color:#bb7971}.time{color:#d6d2ce;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}.export{padding:18px;background:#f8f6f1;border-radius:12px;border:1px solid #d9d4cb}.export h3{margin:0 0 14px;font-size:13px}.export .buttons{display:flex;flex-wrap:wrap;gap:8px}.export button{background:#303335;flex:1}.export button:disabled{opacity:.5;cursor:wait}.status{font-size:11px;color:#807a71;margin-top:9px;min-height:16px}.progress{width:100%;height:6px;margin-top:10px;accent-color:#a9655f}.hint{color:#868078;font-size:10px;line-height:1.6}.hide{display:none!important}@media(max-width:830px){header{padding:16px}h1{font-size:18px}.layout{display:flex;flex-direction:column-reverse;padding:12px;gap:13px}.previewSide{position:static;width:100%}.screenbox{padding:14px}.stage{min-height:210px}.panel{width:100%}}
</style></head><body>
<header><div><h1>CAUGHT ON TAPE</h1></div></header>
<main class="layout"><aside class="panel"><div class="panelhead">촬영 설정</div>
<details open><summary>01 · 캐릭터</summary><div class="section">
<div class="two"><label class="upload">캐릭터 A 업로드<input id="fileA" type="file" accept="image/*"></label><label class="upload">캐릭터 B 업로드<input id="fileB" type="file" accept="image/*"></label></div>
<div class="field"><label>인원</label><select id="people"><option value="2">2인</option><option value="1">1인</option></select></div>
<div class="field"><label>배치 편집 대상</label><select id="editChar"><option value="A">캐릭터 A</option><option value="B">캐릭터 B</option></select></div>
<div class="field"><label>크기 <span class="value" id="sizeVal"></span></label><input type="range" id="size" min="20" max="180" value="85"></div>
<div class="two"><div class="field"><label>가로 <span id="xVal" class="value"></span></label><input type="range" id="posX" min="-100" max="100"></div><div class="field"><label>세로 <span id="yVal" class="value"></span></label><input type="range" id="posY" min="-100" max="100"></div></div>
<div class="field"><label>회전 <span class="value" id="rotVal"></span></label><input type="range" id="rot" min="-45" max="45"></div>
<div class="two"><button class="chip" id="swap">A/B 이미지 교체</button><button class="chip" id="layer">앞뒤 순서 바꾸기</button></div>
<div class="hint">이미지는 변형하지 않으며, 프레임 바깥쪽만 잘려 보여요. 업로드 전에는 배치 확인용 실루엣이 표시됩니다.</div>
</div></details>
<details open><summary>02 · 촬영 상황</summary><div class="section"><div class="chiprow" id="scenes"></div></div></details>
<details open><summary>03 · 접근과 카메라</summary><div class="section">
<div class="field"><label>접근 거리 <span class="value" id="distanceVal"></span></label><input id="distance" type="range" min="0" max="100" value="75"></div>
<div class="two"><div class="field"><label>접근 속도</label><select id="speed"><option value="slow">느리게</option><option value="normal" selected>보통</option><option value="fast">빠르게</option></select></div><div class="field"><label>접근 방향</label><select id="approach"><option value="left">왼쪽</option><option value="center" selected>중앙</option><option value="right">오른쪽</option></select></div></div>
<div class="field"><label>카메라 반응</label><select id="reaction"><option value="stable">안정적</option><option value="hand">손떨림</option><option value="surprise" selected>깜짝 놀람</option><option value="back">뒷걸음질</option><option value="follow">따라가기</option><option value="tilt">넘어질 뻔</option></select></div>
<div class="two"><label class="check"><input id="pauseNear" type="checkbox"> 접근 중 멈춤</label><label class="check"><input id="stepBack" type="checkbox" checked> 카메라 뒷걸음질</label></div>
</div></details>
<details id="lensSection"><summary>04 · 렌즈 가리기</summary><div class="section"><div class="field"><label>가림 방식</label><select id="cover"><option value="dark">완전 암전</option><option value="none">가림 없음</option></select></div></div></details>
<details><summary>05 · 캠코더 화면</summary><div class="section">
<div class="field"><label>화면 비율</label><div id="ratios" class="chiprow"></div></div>
<div class="field"><label>캠코더 스타일</label><select id="filter"><option>Mini DV</option><option>VHS</option><option>Digital</option><option>Night Vision</option><option>Soft Film</option><option>No Filter</option></select></div>
<div class="two"><label class="check"><input id="preserve" type="checkbox" checked> 캐릭터 색상 보존</label><label class="check"><input id="noise" type="checkbox"> 필름 입자</label></div>
<div class="field"><label>배경 색상</label><input type="color" id="bgColor" value="#8b8885"></div>
<div class="two"><label class="check"><input id="rec" type="checkbox" checked> REC</label><label class="check"><input id="tc" type="checkbox" checked> 타임코드</label><label class="check"><input id="dateOn" type="checkbox" checked> 날짜·시간</label><label class="check"><input id="battery" type="checkbox" checked> 배터리</label><label class="check"><input id="focus" type="checkbox" checked> 초점 표시</label><label class="check"><input id="zoom" type="checkbox"> 줌</label><label class="check"><input id="warning" type="checkbox"> 녹화 경고</label></div>
<div class="field"><label>촬영 날짜·시간</label><input id="datetime" type="datetime-local" value="2026-10-20T20:08"></div><div class="field"><label>영상 문구 (선택)</label><input id="caption" type="text" maxlength="45" placeholder=""></div>
</div></details>
<details><summary>06 · 애니메이션</summary><div class="section"><div class="two"><div class="field"><label>길이</label><select id="duration"><option value="3">3초</option><option value="3.6" selected>3.6초</option><option value="4">4초</option><option value="5">5초</option><option value="6">6초</option></select></div><div class="field"><label>반복 방식</label><select id="loop"><option value="natural">자연스럽게 반복</option><option value="hold">마지막 장면 정지</option><option value="stop">녹화 종료 후 복귀</option></select></div></div>
<div class="field"><label>마지막 장면</label><select id="ending"><option value="near">그대로 촬영</option><option value="dark">화면 암전</option><option value="off">촬영 종료</option><option value="both">둘이 함께</option><option value="fall">카메라 추락</option><option value="blur">초점 이탈</option></select></div>
<div class="field"><label>마지막 장면 유지 시간 <span id="holdVal" class="value"></span></label><input id="hold" type="range" min="0" max="35" value="12"></div>
</div></details>
</aside><section class="previewSide"><div class="screenbox"><div class="screenTop"><span>LIVE CAMCORDER PREVIEW</span><span>● STANDBY</span></div><div class="stage"><canvas id="view" width="960" height="540"></canvas></div><input id="seek" class="timeline" type="range" min="0" max="1000" value="0"><div class="time" id="clock">00:00 / 00:03.6</div><div class="controls"><button id="restart">↺ 처음부터</button><button id="play" class="primary">❚❚ 일시정지</button></div></div>
<div class="export"><h3>저장</h3><div class="two"><div class="field"><label>PNG 프레임</label><select id="pngFrame"><option value="current">현재 프레임</option><option value="first">첫 번째 프레임</option><option value="last">마지막 프레임</option></select></div><div class="field"><label>GIF 프레임 속도</label><select id="fps"><option value="10">10 FPS</option><option value="12" selected>12 FPS</option></select></div></div><div class="check" style="margin:13px 0"><input type="checkbox" id="transparent"><label for="transparent">PNG 투명 배경 (필터 배경 제외)</label></div><div class="buttons"><button id="savePng">PNG 저장</button><button id="saveGif">GIF 저장</button></div><progress id="progress" class="progress hide" max="100" value="0"></progress><div class="status" id="status">이미지를 업로드하면 바로 미리볼 수 있어요.</div></div></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d',{willReadFrequently:true}),sceneNames=['촬영 들킴','렌즈 가리기','카메라 빼앗기','황급히 도망','너무 가까워!','둘이 찍기','녹화 중단','몰래 구경'];
const chars={A:{img:null,x:-31,y:13,size:85,rot:0},B:{img:null,x:34,y:12,size:79,rot:0}};let scene=0,ratio='16:9',front='B',playing=true,elapsed=0,lastStamp=0,saving=false;
const num=id=>+$ (id).value,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>{t=clamp(t);return t*t*(3-2*t)},ease=t=>1-Math.pow(1-clamp(t),3),seg=(t,a,b)=>smooth((t-a)/(b-a));
function duration(){return num('duration')}function isTwo(){return $('people').value==='2'}
function chips(id,labels,get,set){const root=$(id);root.innerHTML='';labels.forEach((s,i)=>{let b=document.createElement('button');b.className='chip'+(get()===i?' active':'');b.textContent=s;b.onclick=()=>{set(i);[...root.children].forEach((c,j)=>c.classList.toggle('active',i===j));render()};root.append(b)})}
chips('scenes',sceneNames,()=>scene,i=>{scene=i;const ends=['near','dark','fall','near','blur','both','off','near'];$('ending').value=ends[i];$('lensSection').open=i===1;elapsed=0});chips('ratios',['16:9','4:3','1:1','9:16'],()=>0,i=>{ratio=['16:9','4:3','1:1','9:16'][i];resize()});
function loadChar(){let c=chars[$('editChar').value];for(const [input,k] of [['size','size'],['posX','x'],['posY','y'],['rot','rot']]){$(input).value=c[k];$(input==='posX'?'xVal':input==='posY'?'yVal':input+'Val').textContent=c[k]+(k==='size'?'%':k==='rot'?'°':'')}}
loadChar();for(const [input,k] of [['size','size'],['posX','x'],['posY','y'],['rot','rot']])$(input).oninput=()=>{chars[$('editChar').value][k]=num(input);loadChar();render()};$('editChar').onchange=loadChar;
for(let who of ['A','B'])$('file'+who).onchange=e=>{const file=e.target.files[0];if(!file)return;let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{chars[who].img=img;URL.revokeObjectURL(url);$('status').textContent=`캐릭터 ${who} 불러오기 완료`;render()};img.src=url};
$('swap').onclick=()=>{[chars.A.img,chars.B.img]=[chars.B.img,chars.A.img];render()};$('layer').onclick=()=>{front=front==='A'?'B':'A';render()};
for(let id of ['people','distance','speed','approach','reaction','pauseNear','stepBack','cover','filter','preserve','noise','bgColor','rec','tc','dateOn','battery','focus','zoom','warning','datetime','caption','duration','loop','ending','hold'])$(id).addEventListener('input',()=>{if(id==='distance')$('distanceVal').textContent=$(id).value+'%';if(id==='hold')$('holdVal').textContent=$(id).value+'%';resize();render()});$('distanceVal').textContent=$('distance').value+'%';$('holdVal').textContent=$('hold').value+'%';
function resize(){let [w,h]=ratio.split(':').map(Number);if(ratio==='9:16'){cv.width=540;cv.height=960}else if(ratio==='1:1'){cv.width=720;cv.height=720}else if(ratio==='4:3'){cv.width=960;cv.height=720}else{cv.width=960;cv.height=540}render()}
function characterPose(who,p){const c=chars[who],t=p.t;let x=c.x/100,y=c.y/100,scale=c.size/100,rot=c.rot*Math.PI/180,alpha=1,lead=who===(isTwo()?'B':'A');const distance=num('distance')/100,speed=$('speed').value;let a=speed==='fast'?.23:speed==='slow'?.48:.36,b=speed==='fast'?.64:speed==='slow'?.82:.73;
let advance=seg(t,a,b);if($('pauseNear').checked){advance=t<.54?seg(t,a,.52)*.57:.57+seg(t,.63,b)*.43}
let side=$('approach').value==='left'?-.26:$('approach').value==='right'?.26:0;
if(lead){
if([0,1,2,4,6].includes(scene)){let pow=scene===4?2.3:scene===2?1.6:1.35;scale*=1+advance*distance*pow;x=lerp(x,side,advance*.82);y+=advance*.12}
if(scene===3){let flee=seg(t,.28,.66);x+=flee*1.55;y-=flee*.04;rot+=flee*.2;scale*=1-.4*flee}
if(scene===5){let pop=seg(t,.14,.37),settle=seg(t,.46,.78);scale*=1+pop*1.9-settle*1.65;x=lerp(x,.7,pop);x=lerp(x,.3,settle);y+=pop*.13-settle*.12}
if(scene===7){let peek=seg(t,.12,.24)*(1-seg(t,.34,.43)),peek2=seg(t,.57,.66)*(1-seg(t,.82,.93));x=lerp(1.05,.45,peek)-peek2*1.35;y+=.03;scale*=.82;alpha=clamp(peek+peek2)}
if(scene===0&&t>.86)scale*=1-.12*seg(t,.86,1);
if(scene===4&&t>.76){let retreat=seg(t,.76,.98);scale*=1-retreat*.4;y-=retreat*.05}
}else if(scene===5){x=lerp(x,-.27,seg(t,.4,.75))}
if($('ending').value==='both'&&isTwo()){let settle=seg(t,.79,.98);x=lerp(x,who==='A'?-.29:.29,settle);y=lerp(y,.05,settle);scale=lerp(scale,c.size/100*.92,settle);alpha=lerp(alpha,1,settle)}
if(!isTwo()&&who==='B')alpha=0;
return {x,y,scale,rot,alpha};}
function cameraPose(t){let x=0,y=0,rot=0,z=1;const impact=seg(t,.54,.67)*(1-seg(t,.8,.93)),wave=Math.sin(t*87)*Math.sin(t*37);const r=$('reaction').value;if(r==='hand'){x=wave*.009;y=Math.cos(t*69)*.007;rot=wave*.008}if(r==='surprise'){x=impact*wave*.045;y=impact*Math.cos(t*71)*.035;rot=impact*wave*.037}if(r==='back'||$('stepBack').checked&&[0,4].includes(scene)){z-=impact*.12;y-=impact*.03}if(r==='follow'||scene===3){x-=seg(t,.43,.8)*(scene===3?.32:.13)}if(r==='tilt'){rot+=impact*.33;y+=impact*.075}
if(scene===2){let q=seg(t,.56,.68);rot+=q*.55;x+=q*.18;y+=q*.12;z+=q*.12;let recover=seg(t,.78,.96);rot-=recover*.38;x-=recover*.12}
if(scene===6){x+=impact*wave*.025}if($('ending').value==='fall'){let f=seg(t,.8,.97);rot+=f*.76;y+=f*.24;x+=f*.18}return {x,y,rot,z};}
function drawPlaceholder(c,w,h){c.fillStyle='#dad0c4';c.beginPath();c.ellipse(0,-h*.17,w*.19,h*.22,0,0,Math.PI*2);c.fill();c.beginPath();c.moveTo(-w*.32,h*.44);c.quadraticCurveTo(-w*.35,-h*.02,-w*.16,0);c.quadraticCurveTo(0,h*.1,w*.16,0);c.quadraticCurveTo(w*.35,-h*.02,w*.32,h*.44);c.closePath();c.fill();c.fillStyle='#5a5652';c.font=`${Math.max(16,w*.09)}px sans-serif`;c.textAlign='center';c.fillText('PNG',0,h*.32)}
function drawChar(who,t,W,H){let c=chars[who],p=characterPose(who,{t});if(p.alpha<=0)return;ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(W*(.5+p.x*.5),H*(.53+p.y*.5));ctx.rotate(p.rot);let iw=c.img?.naturalWidth||500,ih=c.img?.naturalHeight||700,fit=Math.min(W*.46/iw,H*.78/ih),dw=iw*fit*p.scale,dh=ih*fit*p.scale;if(c.img)ctx.drawImage(c.img,-dw/2,-dh/2,dw,dh);else drawPlaceholder(ctx,dw,dh);ctx.restore()}
function coverLayer(t,W,H){if(scene!==1&&scene!==0||$('cover').value==='none')return 0;let k=seg(t,.62,.81)*(1-seg(t,.88,.99));if(scene===0)k*=.3;return k}
function text(s,x,y,size=17,align='left'){ctx.fillStyle='#f7f6f2';ctx.font=`600 ${size}px monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function overlay(t,W,H,turnedOff){const pad=Math.min(W,H)*.045,unit=Math.min(W,H)/540;ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=2;let red=t>.35&&t<.76&&scene===6||turnedOff;if($('rec').checked&&!red){ctx.fillStyle='#e8524f';ctx.beginPath();ctx.arc(pad+7*unit,pad+4*unit,7*unit,0,7);ctx.fill();text('REC',pad+22*unit,pad+10*unit,17*unit)}if($('battery').checked){ctx.strokeStyle='#fff';ctx.lineWidth=2*unit;ctx.strokeRect(W-pad-45*unit,pad-8*unit,36*unit,16*unit);ctx.fillStyle='#fff';ctx.fillRect(W-pad-7*unit,pad-3*unit,4*unit,7*unit);ctx.fillRect(W-pad-41*unit,pad-4*unit,24*unit,9*unit)}if($('focus').checked){let fw=W*.19,fh=H*.27,x=W/2,y=H/2,l=14*unit;ctx.strokeStyle='#ffffffae';ctx.lineWidth=1.5*unit;ctx.beginPath();for(let sx of [-1,1])for(let sy of [-1,1]){let a=x+sx*fw/2,b=y+sy*fh/2;ctx.moveTo(a-sx*l,b);ctx.lineTo(a,b);ctx.lineTo(a,b-sy*l)}ctx.stroke()}if($('zoom').checked)text('ZOOM '+Math.round(100+num('distance')*seg(t,.35,.74))+'%',pad,H-pad-56*unit,14*unit);if($('warning').checked&&t>.56&&t<.8)text('! CAMERA SHAKE',W/2,H*.13,15*unit,'center');let d=$('datetime').value.replace('T',' ');if($('dateOn').checked)text(d,pad,H-pad-8*unit,14*unit);if($('tc').checked)text('00:00:'+String(Math.floor(t*duration())).padStart(2,'0')+':'+String(Math.floor(t*duration()%1*12)).padStart(2,'0'),W-pad,H-pad-8*unit,16*unit,'right');if($('caption').value)text($('caption').value,W/2,H-pad-39*unit,15*unit,'center');ctx.restore()}
function drawFilm(t,W,H){const filter=$('filter').value,keep=$('preserve').checked;if(!keep){ctx.save();if(filter==='Night Vision'){ctx.fillStyle='rgba(25,104,43,.53)';ctx.fillRect(0,0,W,H)}else if(filter==='Soft Film'){ctx.fillStyle='rgba(242,201,167,.13)';ctx.fillRect(0,0,W,H)}else if(filter==='VHS'){ctx.fillStyle='rgba(47,35,58,.07)';ctx.fillRect(0,0,W,H)}ctx.restore()}

// GIF89a encoder. One stable, image-aware palette across all frames prevents colour pumping.
// No external libraries, no network use. RGBA frames are composited by the common Canvas renderer.
function colorHistogramFrame(data, hist) {

    // GIF has a one-bit transparency channel; always composite to opaque instead.
    const a=data[i+3]/255;

    // unseen RGB555 bins mapped to palette index zero (large colour bands).
    hist[code]++;

$('saveGif').onclick=async()=>{
