<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 사이 계약서</title><style>
:root{--paper:#fffdf8;--ink:#292b2a;--line:#c9c3b7;--bg:#efede8;--accent:#425c58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Malgun Gothic',serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 60px}h1{font-size:30px;margin:0 0 8px}.hint{font-size:13px;color:#68675f;margin:0 0 20px}.panel{background:var(--paper);border:1px solid var(--line);padding:22px;margin:14px 0;border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;margin:0 0 7px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:3px;background:white;color:var(--ink);font:inherit}textarea{min-height:85px;resize:vertical}button{font:inherit;cursor:pointer;border:1px solid var(--accent);padding:11px 17px;background:white;color:var(--accent);border-radius:3px}button.primary{background:var(--accent);color:white}button:disabled{opacity:.4;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.progress{height:4px;background:#ddd9d1;margin:15px 0 24px}.progress>div{height:100%;background:var(--accent);transition:width .2s}.question{font-size:21px;font-weight:bold;margin:10px 0 20px}.options{display:grid;gap:9px}.option{text-align:left;width:100%;padding:15px;line-height:1.6;border-color:var(--line);color:var(--ink)}.option:hover,.option.selected{border-color:var(--accent);background:#eaf0ed}.option.selected:before{content:'✓ ';color:var(--accent)}.tiny{font-size:12px;color:#737269}.doc{background:var(--paper);border:1px solid #c5bfb3;padding:48px 52px;margin:16px auto;max-width:780px;box-shadow:0 8px 28px #0000000a}.doc-head{text-align:center;border-bottom:3px double var(--ink);padding-bottom:22px}.doc-head h2{font-size:30px;letter-spacing:5px;margin:0 0 15px}.doc-head p{font-size:13px;margin:0}.doc-body{margin:28px 0}.article{margin:0 0 20px;line-height:1.85;font-size:15px;break-inside:avoid}.article strong{display:block;font-size:16px;margin-bottom:5px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid var(--line);padding-top:25px;margin-top:30px}.sig{min-height:105px}.sig-name{font-weight:bold;margin:8px 0}.sig img{max-width:75px;max-height:75px;object-fit:contain;vertical-align:middle}.stamp{display:inline-flex;border:2px solid #a34c48;color:#a34c48;border-radius:50%;width:50px;height:50px;align-items:center;justify-content:center;transform:rotate(-12deg);font-size:12px;margin-left:10px}.footer{text-align:center;font-size:12px;color:#777168;margin-top:30px}.result-controls{display:flex;gap:9px;flex-wrap:wrap}.muted{color:#666;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.doc{padding:25px 20px}.doc-head h2{font-size:24px}.signatures{gap:10px}.wrap{padding:15px 10px}}@media print{body{background:white}.wrap{max-width:none;padding:0}.panel,.result-controls,h1,.hint{display:none!important}.doc{border:0;box-shadow:none;margin:0;max-width:none;page-break-inside:auto}}
</style></head><body><main class="wrap"><h1>우리 사이 계약서</h1><p class="hint">두 캐릭터가 함께 지킬 조항을 선택해 계약서를 작성합니다.</p><section id="setup" class="panel"><div class="grid"><div><label for="nameA">계약 당사자 A</label><input id="nameA" maxlength="30" value="로완"></div><div><label for="nameB">계약 당사자 B</label><input id="nameB" maxlength="30" value="엘리엇"></div><div><label for="imgA">A 이미지 (선택)</label><input id="imgA" type="file" accept="image/*"></div><div><label for="imgB">B 이미지 (선택)</label><input id="imgB" type="file" accept="image/*"></div><div><label for="date">체결일</label><input id="date" type="date"></div><div><label for="style">문서 양식</label><select id="style"><option value="formal">정식 계약서</option><option value="archive">보관 기록문</option></select></div></div><div class="actions"><button class="primary" id="start">조항 작성 시작</button></div></section><section id="wizard" class="panel hidden"><div class="tiny" id="counter"></div><div class="progress"><div id="progress"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="actions"><button id="prev">이전</button><button id="next" class="primary" disabled>다음 조항</button></div></section><section id="result" class="hidden"><div class="result-controls"><button id="edit">조항 다시 수정</button><button id="restart">처음으로</button><button id="save" class="primary">계약서 PNG 저장</button></div><p class="muted">PNG는 계약서 전체 길이에 맞춰 저장됩니다.</p><div id="document" class="doc"><header class="doc-head"><h2 id="docTitle">관계 유지 계약서</h2><p id="docSubtitle"></p></header><div class="doc-body" id="articles"></div><div class="signatures"><div class="sig"><div>갑 (A)</div><div class="sig-name" id="sigA"></div><div id="photoA"></div><span class="stamp">서명</span></div><div class="sig"><div>을 (B)</div><div class="sig-name" id="sigB"></div><div id="photoB"></div><span class="stamp">서명</span></div></div><div class="footer" id="docDate"></div></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const bank=[
['연락','서로 연락이 닿지 않을 때의 원칙은?',['사전 통보 없이 장시간 연락을 끊지 않는다.','연락이 어려운 경우 가능한 시점에 사유를 알린다.','각자의 시간을 존중하되 긴급 연락에는 응답한다.']],
['안전','위험한 일을 앞두었을 때의 약속은?',['위험한 행동을 혼자 결정하지 않고 상대와 상의한다.','위험이 예상되는 장소에는 가능한 한 동행한다.','각자의 판단을 존중하되 귀환 여부를 반드시 확인한다.']],
['부상','다치거나 아플 때는?',['부상 및 건강 이상을 상대에게 숨기지 않는다.','도움이 필요할 경우 상대에게 우선 요청한다.','상대가 회복할 때까지 무리한 활동을 요구하지 않는다.']],
['비밀','둘 사이에서 비밀을 다루는 방식은?',['상대가 맡긴 비밀을 제삼자에게 누설하지 않는다.','말하기 어려운 사정이 있음을 인정하고 추궁하지 않는다.','관계에 중대한 영향을 주는 사실은 숨기지 않는다.']],
['갈등','다툼이 생겼을 때 지켜야 할 규칙은?',['감정이 격해져도 상대를 모욕하거나 위협하지 않는다.','일방적으로 대화를 끝내지 않고 다시 이야기할 시간을 정한다.','사과가 필요한 경우 잘못한 당사자가 먼저 인정한다.']],
['화해','화해는 어떤 방식으로 진행할까?',['서로의 입장을 말로 확인한 뒤 갈등을 마무리한다.','말보다 행동으로 달라진 점을 보여준다.','서로에게 생각할 시간을 준 뒤 먼저 손을 내미는 쪽을 탓하지 않는다.']],
['거리','혼자 있고 싶은 순간에는?',['혼자만의 시간을 요구할 권리를 인정한다.','공간을 분리하더라도 연락 가능한 상태를 유지한다.','상대가 원한다면 말없이 곁에 머무를 수 있다.']],
['질투','질투나 서운함이 생기면?',['상대를 시험하거나 일부러 질투를 유발하지 않는다.','서운한 점을 제삼자보다 상대에게 먼저 말한다.','불안하다는 이유로 상대의 인간관계를 통제하지 않는다.']],
['신뢰','서로의 신뢰를 지키는 방법은?',['약속을 어길 상황이 생기면 미리 알린다.','상대의 말을 의심하기 전에 사실을 확인한다.','상대의 실수 한 번으로 관계 전체를 부정하지 않는다.']],
['도움','상대가 도움을 거절할 때는?',['명확한 거절 의사를 존중한다.','당장 개입하지 않되 필요할 때 도움을 받을 수 있도록 한다.','긴급한 위험이 있는 경우 안전 확보를 우선한다.']],
['우선순위','중요한 선택이 생기면?',['둘 모두에게 영향을 주는 결정은 함께 논의한다.','각자의 목표를 존중하며 일방적인 희생을 요구하지 않는다.','서로의 안전에 관련된 결정은 다른 일정보다 우선한다.']],
['귀환','헤어졌다가 다시 만날 때의 약속은?',['늦어지거나 귀환이 어려워지면 가능한 한 알린다.','재회한 직후 서로의 상태를 먼저 확인한다.','헤어지기 전 다음 만남의 약속을 정한다.']]
];let index=0,answers=Array(bank.length).fill(null),images=[null,null];const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('date').value=new Date().toLocaleDateString('en-CA');function show(id){['setup','wizard','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function render(){let b=bank[index];$('counter').textContent=`제${index+1}조 / 전체 ${bank.length}조 · ${b[0]}`;$('progress').style.width=((index+1)/bank.length*100)+'%';$('question').textContent=b[1];$('options').replaceChildren();b[2].forEach((opt,i)=>{let btn=document.createElement('button');btn.className='option'+(answers[index]===i?' selected':'');btn.textContent=opt;btn.onclick=()=>{answers[index]=i;render()};$('options').append(btn)});$('prev').disabled=index===0;$('next').disabled=answers[index]===null;$('next').textContent=index===bank.length-1?'계약서 완성':'다음 조항'}async function fileData(input){let f=input.files[0];if(!f)return null;return new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)})}$('start').onclick=async()=>{try{images=await Promise.all([fileData($('imgA')),fileData($('imgB'))])}catch(e){alert('이미지를 읽지 못했습니다.');return}index=0;show('wizard');render()};$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(answers[index]===null)return;if(index<bank.length-1){index++;render()}else finish()};function finish(){let A=$('nameA').value.trim()||'A',B=$('nameB').value.trim()||'B';$('docTitle').textContent=$('style').value==='archive'?'상호 약속 기록문':'관계 유지 계약서';$('docSubtitle').textContent=`계약 당사자: ${A} · ${B}`;let intro=`<p class="article">${escapeHTML(A)}(이하 ‘갑’)와 ${escapeHTML(B)}(이하 ‘을’)은 상호 합의에 따라 다음 조항을 준수하기로 한다.</p>`;$('articles').innerHTML=intro+bank.map((b,i)=>`<section class="article"><strong>제${i+1}조 (${escapeHTML(b[0])})</strong><div>${escapeHTML(b[2][answers[i]])}</div></section>`).join('')+'<p class="article"><strong>부칙 (효력)</strong>본 계약은 양 당사자의 합의로 체결되며, 조항의 변경은 상호 동의하에 가능하다.</p>';$('sigA').textContent=A;$('sigB').textContent=B;['photoA','photoB'].forEach((id,i)=>{$(id).replaceChildren();if(images[i]){let img=document.createElement('img');img.src=images[i];$(id).append(img)}});let d=$('date').value;$('docDate').textContent=d?`체결일: ${d}`:'체결일: 미기재';show('result')}$('edit').onclick=()=>{index=0;show('wizard');render()};$('restart').onclick=()=>show('setup');function wrapCanvasText(ctx,text,maxWidth){
  const lines=[]; let line='';
  for(const ch of String(text)){
    if(ch==='\n'){lines.push(line);line='';continue;}
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=ch;}else line=test;
  }
  if(line)lines.push(line);
  return lines;
}
function loadDataImage(src){return new Promise((resolve,reject)=>{if(!src){resolve(null);return;}const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});}
function drawContained(ctx,img,x,y,w,h){if(!img)return;const r=Math.min(w/img.width,h/img.height),dw=img.width*r,dh=img.height*r;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
$('save').onclick=async()=>{
  const btn=$('save');btn.disabled=true;btn.textContent='PNG 생성 중…';
  try{
    await document.fonts.ready;
    const A=$('nameA').value.trim()||'A',B=$('nameB').value.trim()||'B';
    const title=$('style').value==='archive'?'상호 약속 기록문':'관계 유지 계약서';
    const items=[`${A}(이하 ‘갑’)와 ${B}(이하 ‘을’)은 상호 합의에 따라 다음 조항을 준수하기로 한다.`,...bank.map((b,i)=>`제${i+1}조 (${b[0]})\n${b[2][answers[i]]}`),'부칙 (효력)\n본 계약은 양 당사자의 합의로 체결되며, 조항의 변경은 상호 동의하에 가능하다.'];
    const W=1400,pad=110,contentW=W-pad*2;
    const m=document.createElement('canvas').getContext('2d');let bodyH=0;
    for(const it of items){const parts=it.split('\n');if(parts.length>1){bodyH+=48;m.font='30px Georgia, Malgun Gothic, serif';bodyH+=wrapCanvasText(m,parts.slice(1).join('\n'),contentW).length*48+30;}else{m.font='30px Georgia, Malgun Gothic, serif';bodyH+=wrapCanvasText(m,it,contentW).length*48+36;}}
    const H=Math.max(1900,390+bodyH+430),cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
    c.fillStyle='#fffdf8';c.fillRect(0,0,W,H);c.strokeStyle='#c5bfb3';c.lineWidth=2;c.strokeRect(36,36,W-72,H-72);
    c.fillStyle='#292b2a';c.textAlign='center';c.font='700 56px Georgia, Malgun Gothic, serif';c.fillText(title,W/2,125);c.font='26px Georgia, Malgun Gothic, serif';c.fillText(`계약 당사자: ${A} · ${B}`,W/2,178);
    c.strokeStyle='#292b2a';c.beginPath();c.moveTo(pad,220);c.lineTo(W-pad,220);c.moveTo(pad,228);c.lineTo(W-pad,228);c.stroke();
    let y=290;c.textAlign='left';
    for(const it of items){const parts=it.split('\n');if(parts.length>1){c.fillStyle='#292b2a';c.font='700 31px Georgia, Malgun Gothic, serif';c.fillText(parts[0],pad,y);y+=46;c.font='30px Georgia, Malgun Gothic, serif';for(const line of wrapCanvasText(c,parts.slice(1).join('\n'),contentW)){c.fillText(line,pad,y);y+=48;}y+=30;}else{c.fillStyle='#292b2a';c.font='30px Georgia, Malgun Gothic, serif';for(const line of wrapCanvasText(c,it,contentW)){c.fillText(line,pad,y);y+=48;}y+=36;}}
    c.strokeStyle='#c9c3b7';c.beginPath();c.moveTo(pad,y);c.lineTo(W-pad,y);c.stroke();y+=55;
    const [imA,imB]=await Promise.all([loadDataImage(images[0]),loadDataImage(images[1])]);
    const cols=[{x:pad,name:A,img:imA,label:'갑 (A)'},{x:W/2+40,name:B,img:imB,label:'을 (B)'}];
    for(const col of cols){c.fillStyle='#292b2a';c.font='26px Georgia, Malgun Gothic, serif';c.fillText(col.label,col.x,y);c.font='700 32px Georgia, Malgun Gothic, serif';c.fillText(col.name,col.x,y+48);if(col.img){c.strokeStyle='#d7d0c4';c.strokeRect(col.x,y+72,130,130);drawContained(c,col.img,col.x,y+72,130,130);}c.save();c.translate(col.x+190,y+135);c.rotate(-0.12);c.strokeStyle='#a34c48';c.fillStyle='#a34c48';c.lineWidth=4;c.beginPath();c.arc(0,0,44,0,Math.PI*2);c.stroke();c.font='24px Georgia, Malgun Gothic, serif';c.textAlign='center';c.fillText('서명',0,8);c.restore();}
    c.textAlign='center';c.fillStyle='#777168';c.font='24px Georgia, Malgun Gothic, serif';const d=$('date').value;c.fillText(d?`체결일: ${d}`:'체결일: 미기재',W/2,H-95);
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));if(!blob)throw new Error('PNG 변환 실패');
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`우리_사이_계약서_${Date.now()}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
  }catch(e){console.error(e);alert('PNG 저장에 실패했습니다. 업로드한 이미지를 다시 선택한 뒤 시도해 주세요.');}
  finally{btn.disabled=false;btn.textContent='계약서 PNG 저장';}
};
})();</script></body></html>
