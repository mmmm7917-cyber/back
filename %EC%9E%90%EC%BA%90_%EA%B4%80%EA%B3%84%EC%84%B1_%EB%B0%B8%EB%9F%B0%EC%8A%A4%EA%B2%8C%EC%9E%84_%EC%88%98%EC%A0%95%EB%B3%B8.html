<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>자캐 밸런스 게임 — 케미 시뮬레이터</title>
  <style>
    :root{
      --bg:#f7f3ec; --ink:#2d2a26; --muted:#6f695f; --line:#ddd3c4;
      --card:#fffdf8; --accent:#7a5cff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
    button,input,select{font:inherit}
    .wrap{max-width:980px;margin:0 auto;padding:24px}
    h1{margin:0 0 6px;font-size:30px}
    .sub{color:var(--muted);margin-bottom:18px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    .grid{display:grid;gap:12px}
    .g2{grid-template-columns:1fr 1fr}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    input[type="text"]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
    input[type="file"]{font-size:13px}
    button{border:1px solid var(--line);background:white;padding:10px 12px;border-radius:10px;cursor:pointer}
    button:hover{background:#f5f1ff}
    .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
    .primary:hover{background:#684cf0}
    .muted{color:var(--muted);font-size:13px}
    .hidden{display:none!important}
    .qhead{font-size:13px;color:var(--muted);margin-bottom:8px}
    .qtext{font-size:22px;line-height:1.35;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choice{padding:16px;min-height:92px;text-align:left}
    .choice strong{display:block;font-size:16px;margin-bottom:6px}
    .choice span{color:var(--muted);font-size:13px}
    .prog{height:10px;background:#eee5d8;border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0;background:linear-gradient(90deg,#7a5cff,#b085ff)}
    .result h2{margin-top:0}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .chip{padding:6px 10px;border-radius:999px;background:#f0ebff;color:#4c37af;font-size:12px;font-weight:700}
    canvas{width:100%;max-width:860px;border:1px solid var(--line);border-radius:12px;background:#fff}
    .small{font-size:12px;color:var(--muted)}
    @media (max-width:780px){ .choices,.g2{grid-template-columns:1fr} .qtext{font-size:19px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>자캐 밸런스 게임</h1>
  <div class="sub">두 캐릭터의 행동과 관계를 선택해 결과를 확인하세요.</div>

  <section id="setup" class="panel">
    <div class="grid g2">
      <div>
        <label>캐릭터 A 이름</label>
        <input id="nameA" type="text" value="루아" maxlength="20">
      </div>
      <div>
        <label>캐릭터 B 이름</label>
        <input id="nameB" type="text" value="세인" maxlength="20">
      </div>
      <div>
        <label>캐릭터 A 이미지(선택)</label>
        <input id="imgA" type="file" accept="image/*">
      </div>
      <div>
        <label>캐릭터 B 이미지(선택)</label>
        <input id="imgB" type="file" accept="image/*">
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="start" class="primary">게임 시작</button>
      <button id="randomNames">이름 랜덤</button>
      <span class="muted">관계성 질문 20개</span>
    </div>
  </section>

  <section id="game" class="panel hidden">
    <div class="qhead"><span id="qIndex">1</span> / <span id="qTotal">20</span></div>
    <div class="prog"><div id="bar" class="bar"></div></div>
    <div id="qText" class="qtext" style="margin-top:12px"></div>
    <div class="choices">
      <button id="btnA" class="choice"></button>
      <button id="btnB" class="choice"></button>
    </div>
  </section>

  <section id="result" class="panel result hidden">
    <h2>결과</h2>
    <div id="endingTitle" style="font-size:24px;font-weight:900;margin:8px 0"></div>
    <p id="endingDesc"></p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button id="retry">다시 하기</button>
      <button id="saveCard" class="primary">결과 카드 PNG 저장</button>
    </div>
    <p class="small">아래 카드 이미지를 저장해도 됩니다.</p>
    <canvas id="card" width="1200" height="630"></canvas>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const questions = [
    {...q("상대가 평소와 다르게 조용할 때, 먼저 알아채는 쪽은?", "{A}", "{B}", w({care:2,trust:1}), w({care:2,trust:1})), kind:"who"},
    {...q("다툰 뒤 먼저 화해를 시도하는 쪽은?", "{A}", "{B}", w({trust:2,care:1}), w({trust:2,care:1})), kind:"who"},
    {...q("둘 중 상대의 사소한 습관을 더 잘 기억하는 쪽은?", "{A}", "{B}", w({care:2,curious:1}), w({care:2,curious:1})), kind:"who"},
    {...q("상대가 위험에 처하면 먼저 뛰어드는 쪽은?", "{A}", "{B}", w({brave:2,care:1}), w({brave:2,care:1})), kind:"who"},
    {...q("먼저 장난을 걸어 분위기를 바꾸는 쪽은?", "{A}", "{B}", w({play:2,chaos:1}), w({play:2,chaos:1})), kind:"who"},
    {...q("상대에게 먼저 중요한 비밀을 털어놓는 쪽은?", "{A}", "{B}", w({trust:2,brave:1}), w({trust:2,brave:1})), kind:"who"},
    {...q("약속 장소에 먼저 도착해 기다리는 쪽은?", "{A}", "{B}", w({order:2,care:1}), w({order:2,care:1})), kind:"who"},
    {...q("상대가 거짓말한다면 더 빨리 눈치채는 쪽은?", "{A}", "{B}", w({curious:2,trust:1}), w({curious:2,trust:1})), kind:"who"},
    {...q("서로 연락이 끊기면 둘은?", "먼저 찾아가서 직접 확인한다", "상대가 돌아올 자리를 지키며 기다린다", w({brave:2,care:1}), w({trust:2,order:1})), kind:"bond"},
    {...q("서로의 약점을 알게 되었을 때 둘은?", "말하지 않아도 서로 감싸준다", "약점을 두고 농담할 만큼 편해진다", w({care:2,trust:1}), w({play:2,trust:1})), kind:"bond"},
    {...q("둘이 크게 다투는 이유로 더 어울리는 것은?", "상대를 지키려다 중요한 사실을 숨긴다", "서로 양보하지 않고 자기 방식을 고집한다", w({care:2,tsun:1}), w({tsun:2,chaos:1})), kind:"bond"},
    {...q("화해하는 장면으로 더 어울리는 것은?", "솔직한 대화 끝에 마음을 확인한다", "말없이 곁에 앉아 평소처럼 행동한다", w({trust:2,care:1}), w({care:2,tsun:1})), kind:"bond"},
    {...q("둘만 아는 신호가 있다면?", "눈빛만으로 의도를 알아챈다", "서로만 이해하는 농담을 주고받는다", w({trust:2,order:1}), w({play:2,curious:1})), kind:"bond"},
    {...q("다른 사람들 앞에서 두 사람의 모습은?", "평소보다 서로를 더 챙긴다", "오히려 서로를 더 놀리고 투닥거린다", w({care:2,trust:1}), w({play:2,tsun:1})), kind:"bond"},
    {...q("함께 어려운 결정을 내려야 한다면?", "충분히 의논한 뒤 같은 선택을 한다", "의견이 달라도 각자 맡은 일을 해낸다", w({trust:2,order:1}), w({brave:2,trust:1})), kind:"bond"},
    {...q("상대의 오래된 상처를 마주한다면?", "묻지 않고 이야기할 때까지 기다린다", "직접 물어보고 함께 해결하려 한다", w({care:2,trust:1}), w({brave:2,curious:1})), kind:"bond"},
    {...q("두 사람의 가장 자연스러운 일상은?", "별말 없이 같은 공간에서 각자 시간을 보낸다", "사소한 일에도 서로 끼어들어 떠든다", w({trust:2,order:1}), w({play:2,chaos:1})), kind:"bond"},
    {...q("한 사람이 떠나야 하는 상황이라면?", "붙잡지 않지만 돌아오리라 믿는다", "어떻게든 함께 갈 방법을 찾는다", w({trust:2,care:1}), w({brave:2,care:1})), kind:"bond"},
    {...q("둘의 관계를 가장 잘 보여주는 순간은?", "모두가 등을 돌려도 서로의 편에 선다", "서로 앞에서만 무장해제되어 웃는다", w({trust:2,brave:1}), w({play:2,care:1})), kind:"bond"},
    {...q("시간이 오래 흐른 뒤 두 사람은?", "달라진 모습까지 이해하며 곁에 남는다", "여전히 티격태격하며 새로운 일을 벌인다", w({trust:2,care:1}), w({play:2,chaos:1})), kind:"bond"}
  ];

  const namePool = ["아린","리오","단이","유하","세아","레온","하온","시아","도윤","이브"];

  let state = null;

  function q(question, aLabel, bLabel, aW, bW){ return {question, aLabel, bLabel, aW, bW}; }
  function w(obj){ return Object.assign({care:0,trust:0,order:0,chaos:0,play:0,brave:0,tsun:0,curious:0}, obj); }

  function newState(){
    return {
      i: 0,
      score: w({}),
      picks: [],
      nameA: $("nameA").value.trim() || "A",
      nameB: $("nameB").value.trim() || "B",
      imgA: null,
      imgB: null
    };
  }

  function mergeScore(add){
    for(const k in state.score) state.score[k] += add[k] || 0;
  }

  function renderQ(){
    const question = questions[state.i];
    const fill = str => str.replaceAll('{A}',state.nameA).replaceAll('{B}',state.nameB);
    $("qIndex").textContent = state.i + 1;
    $("qTotal").textContent = questions.length;
    $("bar").style.width = `${(state.i/questions.length)*100}%`;
    $("qText").textContent = fill(question.question);
    $("btnA").textContent = fill(question.aLabel);
    $("btnB").textContent = fill(question.bLabel);
  }

  function pick(side){
    const q = questions[state.i];
    if(side==="A"){ mergeScore(q.aW); state.picks.push("A"); }
    else { mergeScore(q.bW); state.picks.push("B"); }
    state.i++;
    if(state.i < questions.length) renderQ();
    else finish();
  }

  function finish(){
    $("game").classList.add("hidden");
    $("result").classList.remove("hidden");
    $("bar").style.width = "100%";
    const out = evaluate(state.score, state.nameA, state.nameB);
    $("endingTitle").textContent = out.title;
    $("endingDesc").textContent = out.desc;
    $("chips").innerHTML = out.tags.map(t=>`<span class="chip">#${t}</span>`).join("");
    drawCard(out);
  }

  function topTags(score, n=3){
    return Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,n).map(v=>v[0]);
  }

  function evaluate(s, A, B){
    const t = topTags(s,3);
    const sum = (k)=>s[k]||0;
    if(sum("trust")+sum("care") >= 22 && sum("order") >= 8){
      return {
        title:`${A} × ${B} · 헌신형 보호자 듀오`,
        desc:`서로를 최우선으로 지키는 안정형 관계. 말보다 행동으로 신뢰를 쌓고, 위기에서 더 단단해집니다.`,
        tags:["안정","신뢰","헌신", ...t.map(mapTag)]
      };
    }
    if(sum("play")+sum("chaos") >= 22){
      return {
        title:`${A} × ${B} · 장난폭주 파트너`,
        desc:`예측 불가, 그러나 함께 있을 때 가장 빛나는 타입. 티키타카와 즉흥성이 이 관계의 엔진입니다.`,
        tags:["즉흥","티키타카","축제", ...t.map(mapTag)]
      };
    }
    if(sum("brave")+sum("trust") >= 20){
      return {
        title:`${A} × ${B} · 전우형 동반자`,
        desc:`어려운 길을 함께 선택하는 관계. 서로의 등을 맡기고 끝까지 간다는 확신이 강합니다.`,
        tags:["전우","돌파","각오", ...t.map(mapTag)]
      };
    }
    if(sum("tsun")+sum("play") >= 18 && sum("care") >= 8){
      return {
        title:`${A} × ${B} · 티격태격 애착 콤비`,
        desc:`겉으로는 투닥거리지만 결정적 순간엔 제일 먼저 달려오는 관계. 말투와 마음이 다른 타입.`,
        tags:["츤데레","애착","코믹", ...t.map(mapTag)]
      };
    }
    return {
      title:`${A} × ${B} · 느슨하지만 깊은 동행`,
      desc:`크게 요란하지 않아도 오래 이어지는 관계. 각자의 속도로 가면서도 결국 같은 방향을 봅니다.`,
      tags:["동행","잔잔","장기전", ...t.map(mapTag)]
    };
  }

  function mapTag(k){
    return ({
      care:"다정", trust:"신뢰", order:"질서", chaos:"혼돈",
      play:"장난", brave:"용기", tsun:"츤기", curious:"호기심"
    })[k] || k;
  }

  async function loadImageFromInput(input){
    const f = input.files?.[0];
    if(!f) return null;
    return new Promise((resolve,reject)=>{
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("이미지 로딩 실패")); };
      img.src = url;
    });
  }

  function circleImage(ctx, img, x, y, r){
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
    const s = Math.max((r*2)/img.width,(r*2)/img.height);
    const w = img.width*s, h=img.height*s;
    ctx.drawImage(img,x-r+(2*r-w)/2,y-r+(2*r-h)/2,w,h);
    ctx.restore();
  }

  function drawCard(out){
    const cv = $("card"), c = cv.getContext("2d");
    c.clearRect(0,0,cv.width,cv.height);

    const g = c.createLinearGradient(0,0,cv.width,cv.height);
    g.addColorStop(0,"#f8f3ea"); g.addColorStop(1,"#efe7d8");
    c.fillStyle = g; c.fillRect(0,0,cv.width,cv.height);

    c.fillStyle = "#ffffff";
    c.strokeStyle = "#d8cfbf";
    c.lineWidth = 3;
    roundRect(c,40,40,1120,550,26,true,true);


    c.fillStyle = "#2d2a26";
    c.font = "900 48px system-ui";
    wrapText(c, out.title, 80, 145, 1020, 58);

    c.fillStyle = "#5f574b";
    c.font = "500 28px system-ui";
    wrapText(c, out.desc, 80, 280, 1020, 40);

    // Avatars
    c.fillStyle = "#f2ecff"; c.beginPath(); c.arc(170,460,68,0,Math.PI*2); c.fill();
    c.fillStyle = "#f2ecff"; c.beginPath(); c.arc(360,460,68,0,Math.PI*2); c.fill();
    if(state.imgA) circleImage(c,state.imgA,170,460,62); else fallbackAvatar(c,state.nameA,170,460);
    if(state.imgB) circleImage(c,state.imgB,360,460,62); else fallbackAvatar(c,state.nameB,360,460);

    c.fillStyle="#2d2a26"; c.font="700 24px system-ui";
    c.fillText(state.nameA,130,545); c.fillText(state.nameB,320,545);

    c.fillStyle = "#4c37af";
    c.font = "700 22px system-ui";
    c.fillText(out.tags.slice(0,6).map(t=>`#${t}`).join("  "), 520, 465);

    c.fillStyle = "#8b8478";
    c.font = "500 18px system-ui";
    c.fillText(`질문 ${questions.length}개 기반 · ${new Date().toLocaleDateString("ko-KR")}`, 520, 505);
  }

  function fallbackAvatar(c, name, x, y){
    c.fillStyle="#d9cdff"; c.beginPath(); c.arc(x,y,62,0,Math.PI*2); c.fill();
    c.fillStyle="#4c37af"; c.font="800 36px system-ui"; c.textAlign="center";
    c.fillText((name?.[0]||"?"), x, y+12); c.textAlign="left";
  }

  function roundRect(c,x,y,w,h,r,fill,stroke){
    c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
    if(fill)c.fill(); if(stroke)c.stroke();
  }

  function wrapText(c, text, x, y, maxW, lineH){
    const words = text.split(" ");
    let line = "", yy = y;
    for(let i=0;i<words.length;i++){
      const test = line + words[i] + " ";
      if(c.measureText(test).width > maxW && i>0){
        c.fillText(line, x, yy); line = words[i] + " "; yy += lineH;
      } else line = test;
    }
    c.fillText(line, x, yy);
  }

  $("start").addEventListener("click", async () => {
    state = newState();
    try{
      state.imgA = await loadImageFromInput($("imgA"));
      state.imgB = await loadImageFromInput($("imgB"));
    }catch(e){ alert("이미지 로딩에 실패했어요. 다시 선택해 주세요."); return; }

    $("setup").classList.add("hidden");
    $("result").classList.add("hidden");
    $("game").classList.remove("hidden");
    renderQ();
  });

  $("btnA").addEventListener("click", ()=>pick("A"));
  $("btnB").addEventListener("click", ()=>pick("B"));

  $("retry").addEventListener("click", ()=>{
    $("setup").classList.remove("hidden");
    $("game").classList.add("hidden");
    $("result").classList.add("hidden");
  });

  $("saveCard").addEventListener("click", ()=>{
    const url = $("card").toDataURL("image/png");
    const a = document.createElement("a");
    a.href = url;
    a.download = `relationship-result-${Date.now()}.png`;
    a.click();
  });

  $("randomNames").addEventListener("click", ()=>{
    const a = namePool[Math.floor(Math.random()*namePool.length)];
    let b = namePool[Math.floor(Math.random()*namePool.length)];
    if(a===b) b = namePool[(namePool.indexOf(a)+1)%namePool.length];
    $("nameA").value = a; $("nameB").value = b;
  });
})();
</script>
</body>
</html>
