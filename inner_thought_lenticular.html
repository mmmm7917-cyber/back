const warpedCard=document.createElement('canvas');
function drawTiltedCard(g,W,H,angle){
 const u=W/800,co=Math.cos(angle),si=Math.sin(angle),source=cg.getImageData(0,0,600,720).data;
 if(warpedCard.width!==W||warpedCard.height!==H){warpedCard.width=W;warpedCard.height=H}
 const wg=warpedCard.getContext('2d'),frame=wg.createImageData(W,H),out=frame.data;
 for(let x=0;x<W;x++){
  const dx=(x+.5)/u-400,q=dx*1800/(co*1800-dx*si),sx=q+299.5;
  if(sx<-.5||sx>=599.5)continue;
  const f=1800/(1800+si*q),x0=Math.floor(sx),fx=sx-x0;
  const first=Math.max(0,Math.floor((450-360*f)*u)),last=Math.min(H,Math.ceil((450+360*f)*u));
  for(let y=first;y<last;y++){
   const sy=((y+.5)/u-450)/f+359.5,y0=Math.floor(sy),fy=sy-y0;
   let r=0,green=0,b=0,a=0;
   for(let yy=0;yy<2;yy++)for(let xx=0;xx<2;xx++){
    const px=x0+xx,py=y0+yy;if(px<0||px>=600||py<0||py>=720)continue;
    const j=(py*600+px)*4,weight=(xx?fx:1-fx)*(yy?fy:1-fy),alpha=source[j+3]*weight;
    a+=alpha;r+=source[j]*alpha;green+=source[j+1]*alpha;b+=source[j+2]*alpha;
   }
   if(a){const j=(y*W+x)*4;out[j]=r/a;out[j+1]=green/a;out[j+2]=b/a;out[j+3]=a}
  }
 }
 wg.putImageData(frame,0,0);g.drawImage(warpedCard,0,0,W/u,H/u);
}
function render(g,W,H,value,s,edit=false){const data=makeCard(value,s,edit),u=W/800;g.clearRect(0,0,W,H);g.save();g.scale(u,u);if(!s.transparent){g.fillStyle='#ede8f2';g.fillRect(0,0,800,900);}const angle=s.perspective&&!edit?value*.29:0,co=Math.cos(angle),si=Math.sin(angle);if(!s.transparent){g.fillStyle='#58426716';g.beginPath();g.ellipse(400,829,230*co,16,0,0,Math.PI*2);g.fill();}if(Math.abs(angle)<.002){g.drawImage(card,100,90);}else{drawTiltedCard(g,W,H,angle)}g.restore();if(g===ctx){rects=data.geo;const both=data.rs.every(n=>n>.95),i=value<0?0:1;$('sceneStatus').textContent=both?'두 사람의 속마음':Math.max(...data.rs)>.95?(chars[i].name.trim()||(i?'B':'A'))+'의 속마음':Math.abs(value)>.08?'장면 전환 중':'겉으로 하는 말';$('showA').classList.toggle('active',value<-.4);$('showOuter').classList.toggle('active',Math.abs(value)<=.08);$('showB').classList.toggle('active',value>.4);}}
function stop(){playing=false;$('play').textContent='자동 재생'}function setTilt(v){tilt=clamp(v,-1,1);$('tilt').value=Math.round(tilt*100);render(ctx,800,900,tilt,settings(),$('edit').checked)}$('tilt').oninput=e=>{stop();setTilt(+e.target.value/100)};function show(v){stop();$('edit').checked=false;setTilt(v)}$('showA').onclick=()=>show(-.78);$('showB').onclick=()=>show(.78);$('showOuter').onclick=()=>show(0);$('center').onclick=()=>show(0);
function loopValue(t){const keys=[[0,0],[.1,0],[.24,-1],[.39,-1],[.5,0],[.6,0],[.74,1],[.89,1],[1,0]];for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const a=keys[i-1],b=keys[i];return lerp(a[1],b[1],ease((t-a[0])/(b[0]-a[0])))}return 0}
$('play').onclick=()=>{playing=!playing;if(playing){$('edit').checked=false;phase=0;lastTime=0}$('play').textContent=playing?'일시 정지':'자동 재생'};$('edit').onchange=()=>{stop();if($('edit').checked)setTilt(0);needsRender=true};
function animate(time){if(playing&&!busy){if(lastTime)phase=(phase+(time-lastTime)/(+$('duration').value*1000))%1;setTilt(loopValue(phase))}lastTime=time;if(needsRender||playing){render(ctx,800,900,tilt,settings(),$('edit').checked);needsRender=false}requestAnimationFrame(animate)}sync();requestAnimationFrame(animate);
canvas.onpointerdown=e=>{if(busy)return;stop();canvas.setPointerCapture(e.pointerId);const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*800/b.width-100,y=(e.clientY-b.top)*900/b.height-90;if($('edit').checked){const found=[1,0].find(i=>{const d=rects[i],dx=x-d.x,dy=y-d.y,a=-d.rot,rx=dx*Math.cos(a)-dy*Math.sin(a),ry=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(rx)<=d.w/2&&ry<=0&&ry>=-d.h});if(found===undefined)return;active=found;sync();drag={mode:'edit',x,y,ox:chars[active].x,oy:chars[active].y}}else drag={mode:'tilt',x:e.clientX,start:tilt}};canvas.onpointermove=e=>{if(!drag)return;const b=canvas.getBoundingClientRect();if(drag.mode==='tilt')setTilt(drag.start+(e.clientX-drag.x)/(b.width*.4));else{const x=(e.clientX-b.left)*800/b.width-100,y=(e.clientY-b.top)*900/b.height-90;chars[active].x=Math.round(clamp(drag.ox+x-drag.x,-170,170));chars[active].y=Math.round(clamp(drag.oy+y-drag.y,-150,100));sync()}};for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();stop();setTilt(e.key==='Home'?0:tilt+(e.key==='ArrowRight'?.05:-.05))}};
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('png').onclick=()=>{const scale=+$('pngScale').value,c=document.createElement('canvas');c.width=800*scale;c.height=900*scale;render(c.getContext('2d'),c.width,c.height,tilt,settings());c.toBlob(b=>{if(b){download(b,'겉으로는_속으로는.png');$('progress').textContent='현재 장면을 PNG로 저장했어요.'}else $('progress').textContent='PNG 저장에 실패했어요.'},'image/png')};
const breathe=()=>new Promise(r=>setTimeout(r,0));
function paletteFrom(samples){let boxes=[samples];while(boxes.length<255){let best=-1,score=-1;for(let i=0;i<boxes.length;i++){const b=boxes[i];if(b.length<2)continue;const range=[0,1,2].map(k=>{let lo=255,hi=0;for(const p of b){lo=Math.min(lo,p[k]);hi=Math.max(hi,p[k])}return hi-lo});const v=Math.max(...range)*Math.sqrt(b.length);if(v>score){score=v;best=i;b.axis=range.indexOf(Math.max(...range));}}if(best<0||score===0)break;const b=boxes[best],k=b.axis;b.sort((a,c)=>a[k]-c[k]);const m=b.length>>1;boxes.splice(best,1,b.slice(0,m),b.slice(m));}const pal=[[0,0,0]];for(const b of boxes){const sum=[0,0,0];for(const p of b)for(let k=0;k<3;k++)sum[k]+=p[k];pal.push(sum.map(v=>Math.round(v/b.length)))}while(pal.length<256)pal.push(pal[pal.length-1]||[255,255,255]);return pal;}
function quantize(rgba,pal,cache){const out=new Uint8Array(rgba.length/4);for(let i=0,j=0;i<rgba.length;i+=4,j++){if(rgba[i+3]<128){out[j]=0;continue}const r=rgba[i],g=rgba[i+1],b=rgba[i+2],key=(r<<16)|(g<<8)|b;let idx=cache.get(key);if(idx===undefined){let best=1,dist=Infinity;for(let k=1;k<256;k++){const p=pal[k],d=(r-p[0])**2*.3+(g-p[1])**2*.59+(b-p[2])**2*.11;if(d<dist){dist=d;best=k;if(!d)break}}idx=best;if(cache.size<250000)cache.set(key,idx)}out[j]=idx;}return out}
function lzw(data){let dict=new Map(),next=258,width=9,acc=0,bits=0,bytes=[];function emit(code){acc|=code<<bits;bits+=width;while(bits>=8){bytes.push(acc&255);acc>>>=8;bits-=8}}emit(256);let prefix=data[0];for(let i=1;i<data.length;i++){const k=data[i],key=prefix*256+k,found=dict.get(key);if(found!==undefined){prefix=found;continue}emit(prefix);dict.set(key,next++);prefix=k;if(next>(1<<width)&&width<12)width++;if(next===4096){emit(256);dict.clear();next=258;width=9}}emit(prefix);if(next===(1<<width)&&width<12)width++;emit(257);if(bits)bytes.push(acc&255);return bytes;}
function gifWriter(w,h,pal){const a=[];const byte=n=>a.push(n&255),word=n=>{byte(n);byte(n>>8)},str=s=>{for(const c of s)byte(c.charCodeAt(0))};str('GIF89a');word(w);word(h);byte(247);byte(0);byte(0);for(const p of pal)for(const v of p)byte(v);str('!');byte(255);byte(11);str('NETSCAPE2.0');byte(3);byte(1);word(0);byte(0);return {frame(data,delay){byte(33);byte(249);byte(4);byte(9);word(delay);byte(0);byte(0);byte(44);word(0);word(0);word(w);word(h);byte(0);byte(8);const z=lzw(data);for(let i=0;i<z.length;i+=255){byte(Math.min(255,z.length-i));for(let j=i;j<Math.min(i+255,z.length);j++)byte(z[j])}byte(0)},finish(){byte(59);return new Blob([new Uint8Array(a)],{type:'image/gif'})}}}
function signature(){return JSON.stringify({s:settings(),chars:chars.map(c=>({...c,img:c.img?c.img.toDataURL():null})),duration:$('duration').value,size:$('gifSize').value})}
function displayGif(){if(gifURL)URL.revokeObjectURL(gifURL);gifURL=URL.createObjectURL(lastGif);$('gifImage').src=gifURL;$('gifDialog').showModal()}
async function exportGif(preview){if(busy)return;stop();const sig=signature();if(lastGif&&sig===lastGifSignature){if(preview)displayGif();else download(lastGif,'겉으로는_속으로는.gif');return}busy=true;for(const b of document.querySelectorAll('button,input,select,textarea'))b.disabled=true;const s=settings(),seconds=+$('duration').value,n=seconds*12,h=+$('gifSize').value,w=Math.round(h*800/900),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true}),hi=document.createElement('canvas');hi.width=w*2;hi.height=h*2;const hg=hi.getContext('2d');function gifFrame(value){render(hg,hi.width,hi.height,value,s);g.clearRect(0,0,w,h);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(hi,0,0,w,h)}try{const samples=[];for(let i=0;i<18;i++){gifFrame(loopValue(i/18));const d=g.getImageData(0,0,w,h).data;for(let j=(i%4)*4;j<d.length;j+=Math.max(4,Math.floor(w*h/3500))*4)if(d[j+3]>=128)samples.push([d[j],d[j+1],d[j+2]]);$('progress').textContent=`GIF 색상 준비 중 ${Math.round((i+1)/18*100)}%`;await breathe()}if(!samples.length)samples.push([255,255,255]);const pal=paletteFrom(samples),cache=new Map(),writer=gifWriter(w,h,pal);for(let i=0;i<n;i++){gifFrame(loopValue(i/n));const data=g.getImageData(0,0,w,h).data;writer.frame(quantize(data,pal,cache),Math.round((i+1)*100/12)-Math.round(i*100/12));$('progress').textContent=`GIF 만드는 중 ${Math.round((i+1)/n*100)}%`;await breathe()}lastGif=writer.finish();lastGifSignature=sig;$('progress').textContent=`GIF 완성 · ${(lastGif.size/1048576).toFixed(1)}MB`;if(preview)displayGif();else download(lastGif,'겉으로는_속으로는.gif');}catch(err){console.error(err);$('progress').textContent='GIF 생성에 실패했어요. 크기를 줄여 다시 시도해 주세요.'}finally{busy=false;for(const b of document.querySelectorAll('button,input,select,textarea'))b.disabled=false;}}
