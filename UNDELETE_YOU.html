</style><header><h1>삭제되지 않는 너</h1><span>삭제 · 숨기 · 재등장</span></header><main><aside><section><h2>01 / 캐릭터</h2><label>A · 컴퓨터 주인</label><input id="nameA" value="캐릭터 A" maxlength="16"><input id="imgA" type="file" accept="image/*"><label>B · 삭제할 캐릭터</label><input id="nameB" value="캐릭터 B" maxlength="16"><input id="imgB" type="file" accept="image/*"><label>역할</label><select id="direction"><option value="AB">A의 컴퓨터에서 B 삭제</option><option value="BA">B의 컴퓨터에서 A 삭제</option><option value="solo">1인 · A</option></select></section><section><h2>02 / 삭제와 재등장</h2><label>삭제 방식</label><select id="action"><option value="drag">휴지통으로 끌어넣기</option><option value="uninstall">프로그램 제거</option><option value="shred">파일 분쇄</option></select><label>다시 나타나는 곳</label><select id="hide"><option value="folder">사진 폴더</option><option value="popup">삭제 확인창</option><option value="taskbar">작업 표시줄</option></select><label>결말</label><select id="ending"><option value="stay">삭제 취소</option><option value="bin">휴지통에서 동거</option><option value="swap">주인 계정 바꾸기</option><option value="erase">완전 삭제</option></select><label>파일 이름</label><input id="program" value="공간" maxlength="20"><label>재등장 메시지</label><input id="message" value="여기 있었지." maxlength="30"><label>캐릭터 크기</label><input id="charSize" type="range" min="70" max="130" value="100"></section><section><h2>03 / 화면</h2><div class="row"><div><label>배경</label><input type="color" id="before" value="#cbbde5"></div><div><label>창 색상</label><input type="color" id="accent" value="#edbfd3"></div></div><label>배경 패턴</label><select id="pattern"><option value="grid">격자</option><option value="dots">도트</option><option value="plain">단색</option></select><label>모서리</label><input id="radius" type="range" min="0" max="20" value="10"><label><input type="checkbox" id="labels" checked>이름 표시</label></section></aside><div class="viewer"><div class="screen"><canvas id="cv" width="1000" height="750"></canvas></div><div class="tools"><button id="play" class="primary">자동 재생</button><button id="delet for(let k of ['A','B'])$('img'+k).onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image;im.onload=()=>{imgs[k]=im;URL.revokeObjectURL(url)};im.onerror=()=>{$('status').textContent='이미지를 읽을 수 없어요.';URL.revokeObjectURL(url)};im.src=url};function pt(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*750/r.height}}cv.onpointerdown=e=>{if(busy)return;let p=pt(e),h=[...hits].reverse().find(h=>p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h);if(h?.drag){drag=true;playing=false;t=.2;dragPos={x:p.x-70,y:p.y-80};cv.setPointerCapture(e.pointerId)}else h?.fn?.()};cv.onpointermove=e=>{if(drag){let p=pt(e);dragPos={x:p.x-70,y:p.y-80}}};cv.onpointerup=e=>{if(drag){let p=pt(e);drag=false;dragPos=null;if(p.x>780&&p.y>440)playAt(.30);else t=0}};

function palette(hist){let bins=[];for(let i=0;i<32768;i++)if(hist[i])bins.push({r:((i>>10)&31)*8+4,g:((i>>5)&31)*8+4,b:(i&31)*8+4,n:hist[i]});let boxes=[bins];while(boxes.length<256){let best=-1,score=-1,axis='r';for(let i=0;i<boxes.length;i++){let b=boxes[i];if(b.length<2)continue;let n=0,mins=[255,255,255],maxs=[0,0,0];for(let p of b){n+=p.n;['r','g','b'].forEach((k,j)=>{mins[j]=Math.min(mins[j],p[k]);maxs[j]=Math.max(maxs[j],p[k])})}let ranges=maxs.map((v,j)=>v-mins[j]),range=Math.max(...ranges),v=range*Math.sqrt(n);if(v>score){score=v;best=i;axis=['r','g','b'][ranges.indexOf(range)]}}if(best<0)break;let b=boxes[best];b.sort((a,d)=>a[axis]-d[axis]);let total=b.reduce((s,p)=>s+p.n,0),n=0,j=0;for(;j<b.length-1;j++){n+=b[j].n;if(n>=total/2)break}j=Math.min(j,b.length-2);boxes.splice(best,1,b.slice(0,j+1),b.slice(j+1))}let pal=[];for(let b of boxes){let n=0,r=0,g=0,bl=0;for(let p of b){n+=p.n;r+=p.r*p.n;g+=p.g*p.n;bl+=p.b*p.n}pal.push([Math.round(r/n),Math.round(g/n),Math.round(bl/n)])}while(pal.length<256)pal.push([0,0,0]);return pal}
