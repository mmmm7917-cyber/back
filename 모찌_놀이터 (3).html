function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*1000/r.height}}

function gifPalette(rgba){const hist=new Map();for(let p=0;p<rgba.length;p+=16){if(rgba[p+3]<128)continue;const r=rgba[p],g=rgba[p+1],b=rgba[p+2],k=(r>>3)<<10|(g>>3)<<5|(b>>3);let a=hist.get(k);if(!a)hist.set(k,a=[0,0,0,0]);a[0]+=r;a[1]+=g;a[2]+=b;a[3]++}let colors=[...hist.values()].map(a=>[a[0]/a[3],a[1]/a[3],a[2]/a[3],a[3]]);if(!colors.length)colors=[[255,255,255,1]];function box(cs){const ranges=[0,1,2].map(k=>Math.max(...cs.map(a=>a[k]))-Math.min(...cs.map(a=>a[k])));const axis=ranges.indexOf(Math.max(...ranges));return{cs,axis,score:ranges[axis]*Math.sqrt(cs.reduce((s,a)=>s+a[3],0))}}const boxes=[box(colors)];while(boxes.length<255){let at=-1,best=-1;boxes.forEach((b,i)=>{if(b.cs.length>1&&b.score>best){at=i;best=b.score}});if(at<0)break;const b=boxes.splice(at,1)[0],cs=b.cs.sort((a,d)=>a[b.axis]-d[b.axis]),total=cs.reduce((s,a)=>s+a[3],0);let count=0,split=1;for(let i=0;i<cs.length-1;i++){count+=cs[i][3];split=i+1;if(count>=total/2)break}boxes.push(box(cs.slice(0,split)),box(cs.slice(split)))}const palette=[[0,0,0],...boxes.map(b=>{const total=b.cs.reduce((s,a)=>s+a[3],0);return[0,1,2].map(k=>Math.round(b.cs.reduce((s,a)=>s+a[k]*a[3],0)/total))})];while(palette.length<256)palette.push(palette[palette.length-1]);return palette}
function gifIndex(rgba,palette,cache){const out=new Uint8Array(rgba.length/4);for(let i=0,p=0;i<rgba.length;i+=4,p++){if(rgba[i+3]<128){out[p]=0;continue}const r=rgba[i],g=rgba[i+1],b=rgba[i+2],key=(r>>3)<<10|(g>>3)<<5|(b>>3);if(cache[key]){out[p]=cache[key];continue}let best=Infinity,idx=1;for(let j=1;j<256;j++){const col=palette[j],dist=(col[0]-r)**2+(col[1]-g)**2+(col[2]-b)**2;if(dist<best){best=dist;idx=j}}cache[key]=idx;out[p]=idx}return out}

function gifWriter(width,height,palette){const chunks=[],header=[];const word=(arr,v)=>arr.push(v&255,v>>8&255);for(const ch of 'GIF89a')header.push(ch.charCodeAt(0));word(header,width);word(header,height);header.push(247,0,0);palette.forEach(c=>header.push(...c));header.push(33,255,11,...Array.from('NETSCAPE2.0').map(c=>c.charCodeAt(0)),3,1,0,0,0);chunks.push(Uint8Array.from(header));return{frame(pixels,delay,transparent){const h=[33,249,4,transparent?9:4];word(h,delay);h.push(0,0,44,0,0,0,0);word(h,width);word(h,height);h.push(0,8);chunks.push(Uint8Array.from(h));const compressed=gifLzw(pixels);for(let p=0;p<compressed.length;p+=255){const block=compressed.subarray(p,p+255);chunks.push(Uint8Array.of(block.length),block)}chunks.push(Uint8Array.of(0))},finish(){return new Blob([...chunks,Uint8Array.of(59)],{type:'image/gif'})}}}
