<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로완이 눈 뜨기 전에</title>
<style>:root {
  --ink: #3b2a26;
  --ink-soft: #7a605a;
  --paper: #fff8ef;
  --accent: #e2725b;
  --accent-ink: #fffaf4;
  --leaf: #9cbf8a;
  --sky-top: #f7c9a8;
  --sky-mid: #fbe3c6;
  --sky-low: #fdf1df;
  --danger: rgba(76, 28, 40, .55);
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky-low); }
body { user-select: none; -webkit-user-select: none; touch-action: none; }

#sky { position: fixed; inset: 0; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%); transition: filter .5s; }
#sky .sun { position: absolute; width: 38vmin; height: 38vmin; border-radius: 50%; left: 50%; top: 14%; transform: translateX(-50%); background: radial-gradient(circle, #fff3d6 0%, #ffe2b3 55%, rgba(255, 226, 179, 0) 72%); }
#sky .hill { position: absolute; left: -10%; right: -10%; border-radius: 50% 50% 0 0; }
#sky .hill-a { bottom: -32vh; height: 62vh; background: #e9d2b4; }
#sky .hill-b { bottom: -40vh; height: 58vh; left: 30%; right: -30%; background: #dfc4a3; }

#stage { position: fixed; inset: 0; }
#rowan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .18s; background: radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 38%, var(--danger) 100%); }
body.watching #stage::after { opacity: 1; }
body.watching #sky { filter: saturate(.7) brightness(.92); }
body.walking #rowan { cursor: grabbing; }
body.can-tag #rowan { cursor: pointer; }

.bubble { position: absolute; left: 0; top: 0; max-width: min(340px, 70vw); padding: 12px 18px; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 rgba(59, 42, 38, .12); font-size: clamp(20px, 3.2vmin, 30px); font-weight: 700; letter-spacing: .02em; white-space: nowrap; opacity: 0; transform: translate(-50%, -100%) scale(.9); transform-origin: 50% 100%; transition: opacity .15s, transform .15s; pointer-events: none; }
.bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 20px; height: 20px; background: var(--paper); transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
.bubble .said { color: var(--ink); }
.bubble .now { color: var(--accent); display: inline-block; transform: translateY(-2px) scale(1.18); }
.bubble .todo { color: rgba(59, 42, 38, .2); }
.bubble.alert { background: var(--accent); color: var(--accent-ink); }
.bubble.alert::after { background: var(--accent); }

#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; pointer-events: none; }
#hearts { display: flex; gap: 8px; }
#hearts svg { width: 34px; height: 34px; transition: transform .3s, opacity .3s; }
#hearts svg.lost { opacity: .22; transform: scale(.8); }
#clock { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; background: rgba(255, 248, 239, .75); padding: 6px 14px; border-radius: 999px; margin-right: 150px; }

#track { position: absolute; left: 50%; bottom: 26px; width: min(560px, 80vw); height: 14px; transform: translateX(-50%); border-radius: 999px; background: rgba(59, 42, 38, .14); pointer-events: none; }
#track-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: var(--accent); }
#track-me { position: absolute; top: 50%; left: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--paper); border: 4px solid var(--accent); transform: translate(-50%, -50%); }
#track::after { content: ""; position: absolute; right: -6px; top: 50%; width: 22px; height: 22px; transform: translateY(-50%); border-radius: 50%; background: var(--ink); }

#tag-hint { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); font-weight: 800; font-size: 20px; color: var(--accent); background: var(--paper); padding: 8px 18px; border-radius: 999px; animation: pulse .7s ease-in-out infinite alternate; pointer-events: none; }
@keyframes pulse { to { transform: translateX(-50%) scale(1.08); } }

#sound { position: absolute; top: 16px; right: 18px; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: rgba(255, 248, 239, .8); border: 2px solid rgba(59, 42, 38, .15); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
#sound[aria-pressed="false"] { color: var(--ink-soft); text-decoration: line-through; }

.panel { position: absolute; right: max(4vw, 24px); top: 50%; transform: translateY(-50%); width: min(380px, 86vw); padding: 30px 30px 26px; border-radius: 28px; background: rgba(255, 248, 239, .9); box-shadow: 0 10px 0 rgba(59, 42, 38, .1); text-align: center; backdrop-filter: blur(6px); }
.panel h1 { margin: 0 0 14px; font-size: clamp(34px, 5vmin, 48px); line-height: 1.12; letter-spacing: -.02em; }
.panel h2 { margin: 0 0 10px; font-size: 34px; }
.panel p { margin: 0 0 14px; line-height: 1.6; color: var(--ink-soft); }
.panel .rule { color: var(--ink); font-weight: 600; }
.panel .best { margin: 14px 0 0; font-size: 14px; min-height: 1.2em; }
kbd { font: inherit; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: #fff; border: 1px solid rgba(59, 42, 38, .2); border-bottom-width: 3px; }
.panel button { font: inherit; font-weight: 800; font-size: 18px; border-radius: 999px; padding: 12px 26px; margin: 4px; cursor: pointer; border: 2px solid rgba(59, 42, 38, .2); background: #fff; color: var(--ink); }
.panel button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 5px 0 #b9533f; }
.panel button.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #b9533f; }
.panel button:focus-visible, #sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

@media (max-width: 760px) {
  .panel { right: 50%; top: auto; bottom: 18px; transform: translateX(50%); padding: 22px; }
  #clock { margin-right: 120px; }
}
@media (prefers-reduced-motion: reduce) { #tag-hint { animation: none; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><div class="sun"></div><div class="hill hill-a"></div><div class="hill hill-b"></div></div>
<main id="stage">
  <canvas id="rowan" aria-label="로완"></canvas>
  <div id="bubble" class="bubble" aria-live="polite"></div>
  <header id="hud" hidden>
    <div id="hearts" aria-label="남은 기회"></div>
    <div id="clock" aria-label="경과 시간">0.0</div>
  </header>
  <div id="track" hidden aria-label="남은 거리"><div id="track-fill"></div><div id="track-me"></div></div>
  <div id="tag-hint" hidden>지금! 로완을 터치</div>
  <button id="sound" type="button" aria-pressed="true" title="효과음">효과음 켜짐</button>
  <section id="title" class="panel">
    <h1>로완이<br>눈 뜨기 전에</h1>
    <p class="rule">로완이 눈을 감고 있을 때만 다가가세요.<br>곰 귀가 움찔하면, 실눈을 조심.</p>
    <p class="keys"><kbd>Space</kbd> 또는 화면을 꾹 눌러 걷기</p>
    <button id="start" type="button" class="primary">시작</button>
    <p id="best" class="best"></p>
  </section>
  <section id="result" class="panel" hidden>
    <h2 id="result-title"></h2>
    <p id="result-detail"></p>
    <button id="again" type="button" class="primary">다시 하기</button>
    <button id="home" type="button">처음으로</button>
  </section>
</main>
