<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>페어 배송 조회</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f2;color:#222b28;font:14px system-ui,-apple-system,'Malgun Gothic',sans-serif}header{padding:22px 30px;background:#fff;border-bottom:1px solid #dce2de;display:flex;align-items:center;gap:12px}header b{font-size:21px}header span{color:#77827c;font-size:12px}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:360px 1fr;gap:32px;padding:28px}aside{min-width:0}details{background:white;border:1px solid #dde4df;border-radius:12px;margin-bottom:10px;padding:16px}summary{font-weight:700;cursor:pointer}section{padding-top:15px}label{display:block;color:#627068;font-size:12px;margin:10px 0 5px}input,select,textarea,button{font:inherit}input:not([type=range]):not([type=color]),select,textarea{width:100%;padding:10px;border:1px solid #d9e1dc;border-radius:6px;background:#fff;color:#202b25}input[type=range]{width:100%;accent-color:#29785f}input[type=color]{width:100%;height:36px;border:0;background:none}button{border:1px solid #cdd9d1;border-radius:7px;background:white;padding:10px 14px;cursor:pointer;color:#314c40}button:hover{background:#edf4ef}button.primary{background:#276c53;color:white;border-color:#276c53}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person,.step{border-top:1px solid #edf0ee;margin-top:15px;padding-top:5px}.person b,.step b{font-size:13px}.preview{position:sticky;top:24px;align-self:start;min-width:0;text-align:center}.stage{background:#e4eae6;border-radius:18px;padding:28px;display:flex;justify-content:center}canvas{display:block;max-width:100%;height:auto;max-height:76vh;box-shadow:0 14px 40px #1e3b2520;background:white;border-radius:12px}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.save{padding:16px;background:white;border-radius:12px;margin-top:12px}progress{width:100%;accent-color:#29785f;height:8px}.hint{font-size:12px;color:#758279;margin:7px 0}.upload{font-size:11px!important;padding:8px!important}.tag{background:#e6f0e9;padding:5px 9px;border-radius:20px;color:#37674e}#notice{min-height:18px;font-size:12px;color:#586a5e}@media(max-width:800px){header{padding:18px}main{display:flex;flex-direction:column;padding:14px;gap:16px}.preview{order:-1;position:static}.stage{padding:12px}canvas{max-height:60vh}aside{width:100%}}
</style><header><svg width="27" height="27" viewBox="0 0 32 32" fill="none" stroke="#347b61" stroke-width="1.5" aria-hidden="true"><path d="M5 10 16 4l11 6v13l-11 6-11-6Z M5 10l11 6 11-6M16 16v13M10 7l11 6v5"/></svg><b>페어 배송 조회</b><span class="tag">배송 기록 만들기</span></header><main><aside id="editor"></aside><div class="preview"><div class="stage"><canvas id="view" width="800" height="1000" aria-label="배송 조회 미리보기"></canvas></div><div class="toolbar"><button id="play" class="primary">조회부터 재생</button><button id="pause">일시 정지</button><button id="end">마지막 화면</button></div><input id="seek" aria-label="재생 위치" type="range" min="0" max="1000" value="1000"><div id="notice" role="status"></div></div></main>
<script>
const $=s=>document.querySelector(s),S={a:'보내는 사람',b:'받는 사람',number:'20261020',item:'',from:'',to:'',status:'배송 완료',stop:2,reason:'',layout:'페어 이미지 1장',relation:'',memo:'',receive:'직접 수령',stamp:'수령 완료',color:'#347b61',style:'배송 앱',marker:'소포',mode:'조회부터 재생',speed:1,hold:1.5,ratio:'4:5',png:'현재 화면',quality:640};
let steps=[['첫 만남 접수','서로의 이름을 알게 됨'],['관심 이동 중','별일 없이도 연락하기 시작함'],['신뢰 전달 중','혼자 하던 이야기를 나누게 됨'],['마음 도착','서로의 곁에 머무르기로 함']].map(x=>({name:x[0],desc:x[1],date:'',time:'',place:''}));let assets={a:null,b:null,pair:null},poses={a:{z:1,x:0,y:0},b:{z:1,x:0,y:0},pair:{z:1,x:0,y:0}},playing=false,t=6,previous=0,busy=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(k,l,type='text',opts){return `<label for="f_${k}">${l}</label>`+(opts?`<select id="f_${k}" data-k="${k}">${opts.map(v=>`<option ${S[k]==v?'selected':''}>${v}</option>`).join('')}</select>`:`<input id="f_${k}" data-k="${k}" type="${type}" value="${esc(S[k])}" ${type==='text'?'maxlength="100"':''}>`)}
function pic(k,label){return `<div class="person"><b>${label}</b><label>이미지</label><input class="upload" type="file" accept="image/*" data-img="${k}"><button type="button" data-remove="${k}">이미지 제거</button>${[['z','크기',0.3,3,.01],['x','가로 위치',-150,150,1],['y','세로 위치',-150,150,1]].map(([v,l,min,max,st])=>`<label>${l}</label><input aria-label="${label} ${l}" type="range" data-pose="${k}:${v}" min="${min}" max="${max}" step="${st}" value="${poses[k][v]}">`).join('')}</div>`}
function box(title,body,open=false){return `<details ${open?'open':''}><summary>${title}</summary><section>${body}</section></details>`}
function build(){ $('#editor').innerHTML=box('01 두 사람',`<div class="grid"><div>${field('a','A 이름')}</div><div>${field('b','B 이름')}</div></div><p><button id="swap">보내는 사람 ↔ 받는 사람</button></p>${pic('a','A 이미지')}${pic('b','B 이미지')}`,true)+box('02 배송 정보',field('number','운송장 번호')+field('item','배송 물품')+field('from','출발지')+field('to','도착지'))+box('03 배송 단계',`<label>단계 수</label><select id="count">${[3,4,5,6].map(n=>`<option ${n===steps.length?'selected':''}>${n}</option>`).join('')}</select><div id="steps"></div>`)+box('04 현재 상태',field('status','배송 상태','text',['배송 완료','배송 중','배송 지연','수취인 부재','반송','수령 거부'])+`<label>멈출 단계 (배송 중·지연)</label><select id="stop">${steps.map((x,i)=>`<option value="${i}" ${S.stop===i?'selected':''}>${i+1}. ${esc(x.name)}</option>`).join('')}</select>`+field('reason','지연·부재·반송·거부 사유'))+box('05 도착 카드',field('layout','사진 배치','text',['페어 이미지 1장','개별 이미지 2장'])+pic('pair','페어 이미지')+field('relation','현재 관계 (직접 입력)')+field('receive','수령 장소')+field('memo','수령 메모')+field('stamp','수령 도장 (빈칸이면 숨김)'))+box('06 디자인 · 재생',field('color','포인트색','color')+field('style','스타일','text',['배송 앱','종이 운송장','국제 우편'])+field('marker','움직이는 표시','text',['소포','봉투','점'])+field('ratio','화면 비율','text',['4:5','1:1'])+field('mode','재생 범위','text',['조회부터 재생','배송 경로만 재생','도착 카드만 공개'])+`<label>재생 속도</label><select data-k="speed">${[.5,.75,1,1.25,1.5,2].map(n=>`<option value="${n}" ${n==S.speed?'selected':''}>${n}배</option>`).join('')}</select><label>마지막 화면 유지 (초)</label><input data-k="hold" type="number" min="0" max="6" step="0.5" value="${S.hold}">`)+`<div class="save"><div class="grid"><div>${field('png','PNG 범위','text',['현재 화면','도착 카드만'])}</div><div><label>GIF 너비</label><select data-k="quality"><option value="480">480px</option><option value="640" selected>640px</option><option value="800">800px</option></select></div></div><div class="toolbar"><button id="png">PNG 저장</button><button id="gif" class="primary">GIF 저장</button></div><progress id="progress" max="100" value="0"></progress><div class="hint" id="exportStatus" role="status"></div></div>`;renderSteps();bind();}
function renderSteps(){$('#steps').innerHTML=steps.map((s,i)=>`<div class="step"><b>${i+1}단계</b>${[['name','단계명'],['date','날짜'],['time','시간'],['place','장소'],['desc','설명']].map(([k,l])=>`<label>${l}</label><input maxlength="90" data-step="${i}:${k}" value="${esc(s[k])}" type="${k==='date'?'date':k==='time'?'time':'text'}">`).join('')}</div>`).join('')}
function bind(){document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{let k=el.dataset.k;S[k]=['speed','hold','quality'].includes(k)?Number(el.value):el.value;S.hold=Math.max(0,Math.min(6,S.hold));$('#play').textContent=S.mode;draw();});document.querySelectorAll('[data-step]').forEach(el=>el.oninput=()=>{let [i,k]=el.dataset.step.split(':');steps[i][k]=el.value;draw()});document.querySelectorAll('[data-pose]').forEach(el=>el.oninput=()=>{let[k,v]=el.dataset.pose.split(':');poses[k][v]=+el.value;draw()});document.querySelectorAll('[data-img]').forEach(el=>el.onchange=async()=>{if(!el.files[0])return;try{let im=new Image(),url=URL.createObjectURL(el.files[0]);await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url});URL.revokeObjectURL(url);assets[el.dataset.img]=im;draw()}catch(e){$('#notice').textContent='이미지를 읽지 못했어요. PNG 또는 JPG로 다시 선택해 주세요.'}});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{assets[el.dataset.remove]=null;draw()});$('#swap').onclick=()=>{[S.a,S.b]=[S.b,S.a];[S.from,S.to]=[S.to,S.from];[assets.a,assets.b]=[assets.b,assets.a];[poses.a,poses.b]=[poses.b,poses.a];build();draw()};$('#count').onchange=e=>{let n=+e.target.value;while(steps.length<n)steps.push({name:`배송 ${steps.length+1}단계`,date:'',time:'',place:'',desc:''});steps.length=n;S.stop=Math.min(S.stop,n-1);build();draw()};$('#stop').onchange=e=>{S.stop=+e.target.value;draw()};$('#png').onclick=savePNG;$('#gif').onclick=saveGIF;}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));function startOffset(){return S.mode==='배송 경로만 재생'?.8:S.mode==='도착 카드만 공개'?3:0}function duration(){return (4.5-startOffset())/S.speed+S.hold}function logical(time){return Math.min(6,startOffset()+time*S.speed)}
function rect(c,x,y,w,h,r=0,color='#fff'){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}function text(c,s,x,y,size=16,color='#27352e',weight=400,max){c.font=`${weight} ${size}px system-ui, "Malgun Gothic", sans-serif`;c.fillStyle=color;c.fillText(s||'',x,y,max)}function line(c,x,y,xx,yy,color='#e1e7e2',width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke()}function wrap(c,s,x,y,max,size=16,limit=2,color='#58675f'){c.font=`${size}px system-ui, "Malgun Gothic", sans-serif`;let row='',rows=[];for(let ch of s){if(c.measureText(row+ch).width>max){rows.push(row);row=ch}else row+=ch}rows.push(row);rows.slice(0,limit).forEach((r,i)=>text(c,r+(i===limit-1&&rows.length>limit?'…':''),x,y+i*(size+6),size,color));}
function photo(c,key,x,y,w,h){let im=assets[key];if(!im)return;let p=poses[key],scale=Math.min(w/im.width,h/im.height)*p.z;c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.drawImage(im,x+(w-im.width*scale)/2+p.x*w/300,y+(h-im.height*scale)/2+p.y*h/300,im.width*scale,im.height*scale);c.restore()}
function icon(c,x,y,kind,sz=20){c.save();c.translate(x,y);c.strokeStyle=S.color;c.fillStyle='#fff';c.lineWidth=2;if(kind==='점'){c.fillStyle=S.color;c.beginPath();c.arc(0,0,7,0,7);c.fill()}else{c.beginPath();c.roundRect(-sz/2,-sz/2,sz,sz*(kind==='봉투'?.7:1),2);c.fill();c.stroke();if(kind==='봉투'){line(c,-sz/2,-sz/2,0,0,S.color,2);line(c,0,0,sz/2,-sz/2,S.color,2)}else{line(c,0,-sz/2,0,sz/2,S.color,2);line(c,-sz/2,-sz/6,sz/2,-sz/6,S.color,2)}}c.restore()}
function card(c,x,y,w,h,q=6){rect(c,x,y,w,h,S.style==='배송 앱'?14:0,'#f3f7f4');text(c,'도착 카드',x+22,y+30,13,S.color,700);const has=S.layout==='페어 이미지 1장'?assets.pair:assets.a||assets.b;let ih=has?Math.max(25,h-157):0;if(has){if(S.layout==='페어 이미지 1장')photo(c,'pair',x+18,y+42,w-36,ih);else{photo(c,'a',x+18,y+42,(w-44)/2,ih);photo(c,'b',x+26+(w-44)/2,y+42,(w-44)/2,ih)}}let yy=y+55+ih;text(c,S.a+'  &  '+S.b,x+22,yy,19,'#27352e',700,w-44);if(S.relation){text(c,S.relation,x+22,yy+27,17,S.color,650,w-170)}text(c,[S.item&&'물품 '+S.item,'수령인 '+S.b,S.receive].filter(Boolean).join(' · '),x+22,yy+52,12,'#6c7a71',400,w-44);if(S.memo)wrap(c,S.memo,x+22,yy+76,w-160,14,2);if(S.stamp&&q>=4){let a=clamp((q-4)/.4);c.save();c.globalAlpha=a;c.translate(x+w-80,y+h-55);c.rotate(-.13);c.scale(1+(1-a)*.5,1+(1-a)*.5);c.strokeStyle=S.color;c.lineWidth=2;c.strokeRect(-58,-23,116,46);text(c,S.stamp,-49,6,17,S.color,700,100);c.restore()}}
function render(c,W,H,time,onlyCard=false){c.save();c.scale(W/800,H/(S.ratio==='4:5'?1000:800));let height=S.ratio==='4:5'?1000:800;rect(c,0,0,800,height,0,'#fff');let q=logical(time);if(onlyCard){card(c,25,25,750,height-50,6);c.restore();return}let paper=S.style!=='배송 앱';if(S.style==='국제 우편'){for(let i=0;i<800;i+=28)rect(c,i,0,14,7,0,i%56?'#344e79':S.color)}text(c,S.style==='국제 우편'?'국제 우편 배송 조회':S.style==='종이 운송장'?'배송 운송장':'배송 조회',42,55,23,'#20352a',750);text(c,'운송장 번호',42,86,12,'#7b8880');rect(c,40,99,720,48,paper?0:8,'#f3f5f3');let num=q<.6?S.number.slice(0,Math.ceil(S.number.length*q/.6)):S.number;text(c,num,58,129,19,'#263c30',600,570);rect(c,664,105,88,36,paper?0:6,q<.8&&q>.6?'#173c2d':S.color);text(c,'조회',688,129,15,'#fff',600);
let target=['배송 중','배송 지연'].includes(S.status)?S.stop:steps.length-1;let p=clamp((q-.8)/2.2)*target,arrived=q>=3;let status=q<.8?'조회 대기':arrived?S.status:'배송 경로 조회 중';text(c,status,42,188,27,S.color,750);if(paper){let xx=580;for(let i=0;i<52;i++){let code=S.number.charCodeAt(i%Math.max(1,S.number.length))||48;let ww=1+(code+i)%3;rect(c,xx,163,ww,27,0,'#23382b');xx+=ww+1}}else text(c,arrived?'현재 배송 상태':'',620,184,12,'#7c887f');
for(let [key,name,xx,lbl] of [['a',S.a,42,'보내는 사람'],['b',S.b,430,'받는 사람']]){if(assets[key])photo(c,key,xx,211,44,44);else{rect(c,xx,211,44,44,22,'#edf2ee');text(c,name.slice(0,1),xx+14,239,18,S.color,650)}text(c,lbl,xx+57,223,11,'#859087');text(c,name,xx+57,248,17,'#2d3f33',650,250)}text(c,S.from,42,277,12,'#7a867e',400,330);text(c,S.to,430,277,12,'#7a867e',400,330);
let routeY=317,dx=672/(steps.length-1);line(c,64,routeY,736,routeY,'#e5ebe6',4);line(c,64,routeY,64+dx*p,routeY,S.color,4);steps.forEach((s,i)=>{let active=i<=p&&q>=.8;let blink=S.status==='배송 중'&&arrived&&i===target?.55+.45*Math.sin(q*6):1;c.save();c.globalAlpha=blink;rect(c,54+i*dx,routeY-10,20,20,10,active?S.color:'#e5ebe6');text(c,String(i+1),60+i*dx,routeY+5,11,active?'#fff':'#8a948d',600);c.restore();text(c,s.name,Math.max(42,Math.min(680,64+i*dx-33)),349,11,active?S.color:'#a3aaa5',active?650:400,85)});
let markerP=p;if(arrived&&S.status==='반송')markerP=(steps.length-1)*(1-clamp((q-3)/1.4));if(arrived&&S.status==='배송 중')markerP=Math.max(0,target-.55+.35*Math.sin(q*4));if(S.status==='수령 거부')markerP=Math.min(markerP,steps.length-1.18);if(q>=.8&&!(S.status==='배송 완료'&&arrived))icon(c,64+dx*markerP,routeY-27,S.marker,22);
const recordsTop=380,rowH=height===1000?44:36;steps.forEach((s,i)=>{let yy=recordsTop+i*rowH;let shown=q>=.8&&p>=i; c.save();c.globalAlpha=shown?1:.22;rect(c,42,yy-10,5,5,2,shown?S.color:'#98a49b');text(c,s.name,61,yy,13,'#2e4336',650,160);let meta=[s.date,s.time,s.place].filter(Boolean).join(' · ');text(c,meta,240,yy,11,'#718076',400,510);text(c,s.desc,61,yy+18,12,'#7a877e',400,675);c.restore()});let cy=recordsTop+steps.length*rowH+6;line(c,42,cy-12,758,cy-12);let ch=height-cy-24;
if(arrived&&S.status==='배송 완료'){let reveal=clamp((q-3)/.7);c.save();c.beginPath();c.rect(40,cy,720,ch*reveal);c.clip();card(c,40,cy,720,ch,q);c.restore()}else if(arrived){rect(c,40,cy,720,ch,paper?0:12,'#f5f7f5');text(c,S.status,64,cy+38,21,S.color,700);if(S.reason)wrap(c,S.reason,64,cy+73,650,17,3);if(S.status==='수취인 부재'){line(c,670,cy+30,710,cy+30,S.color,2);line(c,710,cy+30,710,cy+85,S.color,2);line(c,710,cy+85,670,cy+85,S.color,2);text(c,'부재',671,cy+62,14,S.color)}if(S.status==='수령 거부'){text(c,'×',677,cy+65,44,S.color)}if(S.status==='반송')text(c,'← '+S.a,64,cy+ch-24,16,S.color,650,630)}c.restore()}
function draw(){let c=$('#view');c.height=S.ratio==='4:5'?1000:800;render(c.getContext('2d'),800,c.height,t);$('#seek').value=clamp(t/duration())*1000}$('#play').onclick=()=>{t=0;playing=true};$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'일시 정지':'계속 재생'};$('#end').onclick=()=>{playing=false;t=duration();draw()};$('#seek').oninput=e=>{playing=false;t=duration()*e.target.value/1000;draw()};$('#view').onclick=e=>{let r=e.target.getBoundingClientRect(),y=(e.clientY-r.top)/r.height;if(y>.09&&y<.19){t=0;playing=true}};function tick(now){if(playing&&!busy){t+=(now-previous)/1000;if(t>duration())t=0;draw()}previous=now;requestAnimationFrame(tick)}

// Adaptive per-frame palette, median-cut RGB histogram; no external dependencies.
