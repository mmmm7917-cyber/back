</style><header><div><h1>CLEAR ACRYLIC SHELF</h1><small>투명 아크릴 선반 꾸미기</small></div><button onclick="preview()">미리보기 ↗</button></header><button class="exit" onclick="preview()">편집으로 돌아가기 ×</button><div class="layout"><aside>
<details open><summary>01　선반</summary><label>구조</label><select id="structure"><option value="3">3단</option><option value="2">2단</option><option value="4">4단</option><option value="wide">폭이 넓은 3단</option><option value="tall">좁고 높은 4단</option></select><label>아크릴 재질</label><select id="material"><option>CLEAR</option><option>FROST</option><option>PALE PINK</option><option>PALE BLUE</option><option>SMOKE</option><option>MILKY</option></select><label><input id="snap" type="checkbox" checked> 선반 안쪽 · 단 높이 자동 맞춤</label></details>

<details open id="editbox"><summary>03　선택한 굿즈</summary><div id="editor"><p class="muted">선반 위의 굿즈를 선택하세요.</p></div></details>
<details><summary>04　받침대 · 소품</summary><label>투명 계단</label><div class="chips" id="risers"></div><label>작은 전시 소품</label><div class="chips" id="props"></div></details>
<details><summary>05　배경</summary><select id="background"><option>WARM IVORY</option><option>PURE WHITE</option><option>PALE PINK</option><option>PALE BLUE</option><option>PALE GRAY</option><option>SOFT GRID</option><option>WALL PANEL</option><option>TRANSPARENT</option></select></details>
<details><summary>06　조명 · 반사</summary><label>조명</label><select id="light"><option>DAYLIGHT</option><option>WARM</option><option>COOL</option><option>PINK</option><option>DISPLAY LED</option></select><label>LED 색</label><select id="led"><option>WHITE</option><option>WARM</option><option>PINK</option><option>BLUE</option><option>MINT</option></select><label>광량</label><input id="intensity" type="range" min="0" max="100" value="35"><label>아크릴 반사</label><select id="shine"><option>SOFT</option><option>OFF</option><option>GLASS</option><option>SPARKLE</option></select></details>

<details><summary>08　자동 배치</summary><select id="arrangement"><option>BALANCED</option><option>CENTER FOCUS</option><option>SYMMETRY</option><option>DENSE</option><option>MINIMAL</option></select><button class="wide" style="margin-top:8px" onclick="arrange()">AUTO ARRANGE</button><label>현재 편집 단 정렬</label><div class="row"><button onclick="alignItems('left')">왼쪽</button><button onclick="alignItems('center')">가운데</button><button onclick="alignItems('right')">오른쪽</button></div><button class="wide" style="margin-top:6px" onclick="alignItems('space')">간격 맞추기</button></details>
<details open><summary>09　저장</summary><label>저장 범위</label><select id="scope"><option value="full">선반 + 배경</option><option value="shelf">전체 선반만 · 투명</option><option value="tier">선택한 단</option><option value="transparent">전체 화면 · 투명 배경</option></select><label>PNG 해상도</label><select id="resolution"><option value="2">2배 · 1800px</option><option value="3">3배 · 2700px</option><option value="1">1배 · 900px</option></select><button class="primary wide" style="margin-top:8px" onclick="savePNG()">PNG 저장 ↓</button><label>GIF 애니메이션</label><select id="gifmode"><option value="CLEAR SHINE">반사광 지나가기</option><option value="LED ON">LED 순차 점등</option><option value="KEYRING SWING">키링 흔들림</option><option value="SPARKLE">가장자리 반짝임</option></select><label><input type="checkbox" id="gifpreview"> 선택한 GIF 효과 미리보기</label><p id="gifhint" class="muted"></p><button id="gifbtn" class="wide" style="margin-top:8px" onclick="saveGIF()">GIF 저장 ↓</button><p class="muted">3초 · 10fps · 540px · 무한 반복<br>GIF는 배경을 포함하여 저장합니다.</p><div id="progress" role="status"></div><div class="row"><button onclick="saveProject()">배치 파일 저장</button><button onclick="project.click()">불러오기</button></div><input hidden id="project" type="file" accept="application/json,.json"></details>
</aside><main><div class="view"><div class="toolbar"><span class="badge" id="count">3 TIERS / CLEAR</span><div class="row"><select id="tier" aria-label="편집할 단"><option value="all">ALL · 전체</option></select><button onclick="preview()">PREVIEW</button></div></div><div class="stage"><canvas id="canvas" width="1080" height="936" aria-label="굿즈 전시 선반. 드래그로 이동하거나 아래 편집 패널을 사용하세요."></canvas></div><div class="caption"><span>드래그하여 배치 · 선택 후 크기와 높이 조절</span><span id="selectedLabel">900 × 780</span></div></div></main></div><div id="notice" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),upload=$('upload'),project=$('project');let items=[],selected=null,uid=1,busy=false,gifStart=0;const images=new Map();const cfg={structure:'3',material:'CLEAR',background:'WARM IVORY',light:'DAYLIGHT',led:'WHITE',intensity:35,shine:'SOFT',camera:'FRONT',snap:true};
const names={stand:'아크릴 스탠드',card:'포토카드',key:'키링',doll:'인형 이미지',frame:'작은 액자',post:'엽서',ticket:'티켓',free:'자유 이미지',step1:'1단 받침대',step2:'2단 계단',step3:'3단 계단',round:'원형 받침대',rect:'직사각 받침대',star:'투명 별',ribbon:'작은 리본',vase:'작은 꽃병',flower:'꽃',book:'작은 책',mini:'미니 카드',shell:'작은 조개',pearl:'진주',orb:'유리 구슬',lamp:'미니 램프',cushion:'작은 쿠션'};
const props=['star','ribbon','vase','flower','book','mini','shell','pearl','orb','lamp','cushion'],risers=['step1','step2','step3','round','rect'];
function geom(){let n=cfg.structure==='tall'?4:cfg.structure==='wide'?3:+cfg.structure,w=cfg.structure==='wide'?744:cfg.structure==='tall'?440:640;return{n,w,l:450-w/2,r:450+w/2,ys:Array.from({length:n},(_,i)=>240+i*420/(n-1))}}
function toast(s){$('notice').textContent=s;$('notice').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('notice').style.display='none',3000)}
function make(type,src=null,tier=0,x=450){let o={id:uid++,type,src,tier,x,lift:0,size:risers.includes(type)?1:props.includes(type)?.65:1,rot:0,depth:1,alpha:1,shadow:.25,flip:false,z:0,base:'ellipse',baseMat:'clear',holder:'basic',finish:'MATTE',hook:'clear',metal:'SILVER',swing:true,seat:'plain',frame:'clear',shape:'portrait',color:'#c6dcd0'};items.push(o);return o}
function add(type){if(items.length>=20)return toast('최대 20개까지 배치할 수 있어요.');const t=$('tier').value;let o=make(type,null,t==='all'?1:+t);selected=o.id;updateUI()}
function selection(){return items.find(o=>o.id===selected)}
function tiers(){let g=geom(),old=$('tier').value;$('tier').innerHTML='<option value="all">ALL · 전체</option>'+g.ys.map((_,i)=>`<option value="${i}">${i===0?'TOP':i===g.n-1?'BOTTOM':'MIDDLE '+i} · ${i+1}단</option>`).join('');$('tier').value=old==='all'||+old<g.n?old:'all';for(const o of items)o.tier=Math.min(o.tier,g.n-1)}
for(const k of Object.keys(cfg)){$(k).addEventListener('input',()=>{cfg[k]=$(k).type==='checkbox'?$(k).checked:$(k).type==='range'?+$(k).value:$(k).value;if(k==='structure'){tiers();for(const o of items)clamp(o);updateUI()}$('count').textContent=geom().n+' TIERS / '+cfg.material})}
$('tier').onchange=()=>{selected=null;updateUI()};
for(const [container,types] of [['props',props],['risers',risers]])$(container).innerHTML=types.map(t=>`<button onclick="add('${t}')">${names[t]}</button>`).join('');
function range(k,label,min,max,step=1){let o=selection();return `<label>${label}<output id="out_${k}">${o[k]}</output></label><input aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${o[k]}" oninput="edit('${k}',+this.value)">`}
function choose(k,label,options){let o=selection();return `<label>${label}</label><select onchange="edit('${k}',this.value)">${options.map(a=>{let v=Array.isArray(a)?a[0]:a,l=Array.isArray(a)?a[1]:a;return `<option value="${v}" ${String(o[k])===String(v)?'selected':''}>${l}</option>`}).join('')}</select>`}
function updateUI(){gifHint();let o=selection();$('itemlist').innerHTML=items.map((a,i)=>`<button class="${a.id===selected?'active':''}" onclick="selectItem(${a.id})">${String(i+1).padStart(2,'0')}　${names[a.type]}　· ${a.tier+1}단</button>`).join('');$('selectedLabel').textContent=o?names[o.type]+' · '+items.length+'/20':items.length+' / 20';if(!o){$('editor').innerHTML='<p class="muted">선반 위의 굿즈를 선택하세요.</p>';return}let html=`<b>${names[o.type]}</b>`+choose('tier','선반 단',geom().ys.map((_,i)=>[i,(i+1)+'단']))+choose('depth','깊이',[[0,'뒤쪽'],[1,'가운데'],[2,'앞쪽']])+range('size','크기',.25,2.5,.01)+range('x','좌우 위치',50,850)+range('lift','높이 · 받침대 위로 올리기',-60,200)+range('rot','회전',-60,60)+range('alpha','투명도',.1,1,.01)+range('shadow','그림자',0,.6,.01)+range('z','앞뒤 순서',-10,10);
if(o.type==='stand')html+=choose('base','받침대 형태',[['ellipse','타원'],['circle','원형'],['square','사각'],['star','별'],['heart','하트']])+choose('baseMat','받침대 재질',[['clear','투명'],['frost','프로스트'],['pink','연핑크'],['blue','연블루']]);
if(o.type==='card')html+=choose('holder','포카 형태',[['basic','기본 카드'],['clear','투명 홀더'],['ribbon','리본 홀더'],['easel','작은 이젤'],['clip','투명 클립']])+choose('finish','포카 재질',['MATTE','GLOSS','PEARL','HOLOGRAM']);
if(o.type==='key')html+=choose('hook','훅',[['corner','선반 모서리'],['clear','투명 훅'],['metal','금속 훅'],['none','눕혀 놓기']])+choose('metal','고리 색',['SILVER','GOLD','ROSE GOLD'])+`<label><input type="checkbox" ${o.swing?'checked':''} onchange="edit('swing',this.checked)"> 느린 흔들림</label>`;
if(o.type==='doll')html+=choose('seat','배치',[['plain','그냥 앉혀두기'],['stand','투명 받침대'],['cushion','미니 쿠션'],['basket','작은 바구니']]);
if(o.type==='frame')html+=choose('frame','프레임',[['clear','투명 아크릴'],['white','화이트'],['silver','실버'],['cream','크림']])+choose('shape','형태',[['portrait','세로'],['landscape','가로'],['square','정사각']]);
if(props.includes(o.type))html+=`<label>소품 색</label><input type="color" value="${o.color}" oninput="edit('color',this.value)">`;
html+=`<div class="row" style="margin-top:12px"><button onclick="edit('flip',!selection().flip)">좌우 반전</button><button onclick="duplicate()">복제</button><button onclick="removeItem()">삭제</button></div>`;if(!props.includes(o.type)&&!risers.includes(o.type))html+='<button class="wide" style="margin-top:8px" onclick="replaceInput.click()">이미지 교체</button>';$('editor').innerHTML=html}
function edit(k,v){let o=selection();if(!o)return;o[k]=['tier','depth'].includes(k)?+v:v;if($('out_'+k))$('out_'+k).textContent=v}
function selectItem(id){selected=id;let o=selection();if($('tier').value!=='all')$('tier').value=o.tier;updateUI()}
function duplicate(){let o=selection();if(!o)return;if(items.length>=20)return toast('최대 20개입니다.');let a={...o,id:uid++,x:o.x+25};items.push(a);selected=a.id;updateUI()}
function removeItem(){items=items.filter(o=>o.id!==selected);selected=null;updateUI()}
const replaceInput=document.createElement('input');replaceInput.type='file';replaceInput.accept='image/png,image/jpeg,image/webp';
async function readImage(file){if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('PNG, JPG, WEBP 파일을 선택하세요.');let src=await new Promise((r,j)=>{let f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(file)});await loadImage(src);return src}
async function loadImage(src){if(images.has(src))return;let im=new Image();im.src=src;await im.decode();images.set(src,im)}
upload.onchange=async()=>{try{for(const f of upload.files){if(items.length>=20){toast('최대 20개까지 추가됩니다.');break}let src=await readImage(f),g=geom(),t=$('tier').value==='all'?Math.min(1,g.n-1):+$('tier').value;selected=make($('type').value,src,t,360+(items.length%4)*60).id}updateUI()}catch(e){toast(e.message)}upload.value=''};
replaceInput.onchange=async()=>{let o=selection();if(o&&replaceInput.files[0])try{o.src=await readImage(replaceInput.files[0]);updateUI()}catch(e){toast(e.message)}};
function clamp(o){let g=geom();o.x=Math.max(g.l+40,Math.min(g.r-40,o.x));o.lift=Math.max(-30,Math.min(190,o.lift))}
function activeItems(){return items.filter(o=>$('tier').value==='all'||o.tier===+$('tier').value)}
function arrange(){let list=activeItems(),g=geom(),mode=$('arrangement').value,fixed=$('tier').value!=='all';list.forEach((o,i)=>{o.tier=fixed?+$('tier').value:i%g.n;o.lift=0;o.rot=0;o.depth=1});for(let t=0;t<g.n;t++){let a=list.filter(o=>o.tier===t),span=g.w*(mode==='DENSE'?.48:.78);a.forEach((o,i)=>{o.x=a.length===1?450:450-span/2+i*span/(a.length-1);if(mode==='CENTER FOCUS'){o.x=450+(i===0?0:(i%2?1:-1)*Math.ceil(i/2)*95);o.size=i===0?1.15:.8}else if(mode==='MINIMAL'){o.size=.65;o.x=450+(i-(a.length-1)/2)*Math.min(170,g.w/(a.length+1))}else if(mode==='SYMMETRY'){o.size=.85}else if(mode==='DENSE')o.size=.8;clamp(o)})}updateUI()}
function alignItems(mode){let g=geom();for(let t=0;t<g.n;t++){let a=activeItems().filter(o=>o.tier===t).sort((a,b)=>a.x-b.x);a.forEach((o,i)=>{let spacing=Math.min(110,(g.w-110)/Math.max(1,a.length-1));o.x=mode==='left'?g.l+60+i*spacing:mode==='right'?g.r-60-(a.length-1-i)*spacing:mode==='center'?450+(i-(a.length-1)/2)*spacing:g.l+60+i*(g.w-120)/Math.max(1,a.length-1)})}updateUI()}
function preview(){document.body.classList.toggle('preview')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('preview');if((e.key==='Delete'||e.key==='Backspace')&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))removeItem()});
// One renderer serves preview, PNG, and animated export.
let ctx;function rect(x,y,w,h,fill,r=0,stroke=null){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function line(x,y,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,c,stroke){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function poly(points,c,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(c){ctx.fillStyle=c;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function star(x,y,r,c){poly(Array.from({length:10},(_,i)=>{let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.46:r;return[x+Math.cos(a)*rr,y+Math.sin(a)*rr]}),c)}
function glass(x,y,w,h,mat=cfg.material){const colors={'CLEAR':['rgba(215,236,233,.15)','rgba(132,173,170,.34)'],'FROST':['rgba(227,239,236,.58)','rgba(161,190,186,.45)'],'PALE PINK':['rgba(246,223,232,.20)','rgba(211,167,188,.4)'],'PALE BLUE':['rgba(222,239,249,.22)','rgba(150,185,207,.42)'],'SMOKE':['rgba(131,151,152,.19)','rgba(109,130,132,.45)'],'MILKY':['rgba(255,255,255,.65)','rgba(194,211,205,.5)']};let c=colors[mat]||colors.CLEAR;rect(x,y,w,h,c[0],3,c[1]);line(x+2,y+1,x+w-2,y+1,'rgba(255,255,255,.95)',1.4);line(x+2,y+2,x+2,y+h-2,'rgba(255,255,255,.8)');line(x+w-2,y+3,x+w-2,y+h,'rgba(146,190,181,.15)',2)}
function slab(x,y,w,depth=30){ctx.save();ctx.shadowColor='rgba(65,89,77,.09)';ctx.shadowBlur=11;ctx.shadowOffsetY=7;poly([[x,y],[x+18,y-depth],[x+w-18,y-depth],[x+w,y]],'rgba(216,234,228,.15)');ctx.restore();poly([[x,y],[x+18,y-depth],[x+w-18,y-depth],[x+w,y]],cfg.material==='MILKY'?'rgba(255,255,255,.55)':cfg.material==='FROST'?'rgba(228,238,232,.45)':'rgba(234,246,241,.12)','rgba(163,193,181,.35)');glass(x,y,w,8);line(x+20,y-depth+1,x+w-20,y-depth+1,'rgba(255,255,255,.9)')}
function dims(o){if(risers.includes(o.type))return[125, o.type==='step3'?70:o.type==='step2'?48:28];if(props.includes(o.type))return[75,90];let im=images.get(o.src);if(o.type==='stand'||o.type==='doll'||o.type==='free'||o.type==='key'){let ratio=im?im.width/im.height:.65;return[Math.min(180,150*ratio),Math.min(150,180/ratio) + (o.type==='key'?30:0)]}if(o.type==='frame')return o.shape==='landscape'?[140,105]:o.shape==='square'?[120,120]:[105,140];if(o.type==='post')return[125,90];if(o.type==='ticket')return[155,65];return[94,140]}
function pos(o){let g=geom();return{x:o.x,y:g.ys[o.tier]-7-o.lift-(2-o.depth)*7,s:o.size*(.94+o.depth*.03)}}
function cameraMatrix(t,mode){let x=0,y=0,s=1,a=0,b=1;switch(cfg.camera){case'SLIGHT LEFT':a=.035;b=.96;break;case'SLIGHT RIGHT':a=-.035;b=.96;break;case'HIGH ANGLE':s=.94;y=-12;break;case'CLOSE UP':s=1.12;y=-18}return{a:b*s,b:a,c:0,d:s,e:450*(1-b*s)+x,f:390*(1-s)-450*a+y}}
function applyCam(m){ctx.transform(m.a,m.b,m.c,m.d,m.e,m.f)}
function drawImageFit(o,x,y,w,h){let im=images.get(o.src);if(im){let s=Math.min(w/im.width,h/im.height);ctx.drawImage(im,x+(w-im.width*s)/2,y+(h-im.height*s)/2,im.width*s,im.height*s)}else{rect(x,y,w,h,'#f0f4ef',3);ellipse(x+w*.5,y+h*.44,w*.2,w*.2,'#d4e1d7');poly([[x+w*.15,y+h*.85],[x+w*.48,y+h*.54],[x+w*.85,y+h*.85]],'#dce6df');ellipse(x+w*.77,y+h*.22,5,5,'#fff')}}
function ribbon(x,y,s,c){ctx.save();ctx.translate(x,y);ctx.scale(s,s);poly([[0,0],[-26,-14],[-28,13]],c);poly([[0,0],[26,-14],[28,13]],c);poly([[-4,0],[-14,30],[-4,25],[2,30],[4,0]],c);poly([[4,0],[13,28],[17,22],[23,25],[7,-1]],c);ellipse(0,0,6,7,c);ctx.restore()}
function flower(x,y,s,c){line(x,y,x-3,y-45*s,'#a7bda7',2*s);ellipse(x-7*s,y-20*s,8*s,3*s,'#c3d2b9');for(let i=0;i<5;i++)ellipse(x-3+Math.cos(i*1.256)*7*s,y-45*s+Math.sin(i*1.256)*7*s,6*s,6*s,c);ellipse(x-3,y-45*s,3*s,3*s,'#e2d5ab')}
function prop(o,w,h){let c=o.color;switch(o.type){case'star':star(0,-35,32,'rgba(211,232,227,.55)');line(-12,-42,0,-64,'#fff',2);break;case'ribbon':ribbon(0,-35,1,c);break;case'vase':flower(0,-37,.9,'#e7d0d7');flower(12,-36,.7,'#f3eee1');glass(-19,-46,38,46);ellipse(0,-46,19,4,'rgba(214,236,232,.3)','rgba(176,198,193,.5)');break;case'flower':flower(0,0,1.2,c);flower(17,0,1,'#e9d7db');break;case'book':rect(-30,-52,60,52,c,3);rect(-25,-48,50,43,'#f5f3e9',2);rect(-30,-52,7,52,c,2);line(-16,-32,15,-32,'#c9d0c4');break;case'mini':rect(-26,-48,52,47,'#fffdf5',2);star(0,-26,10,c);break;case'shell':for(let i=0;i<7;i++){ctx.save();ctx.translate(0,-5);ctx.rotate((i-3)*.22);ellipse(0,-17,10,25,i%2?'#e9dfd5':'#f1e7de');ctx.restore()}break;case'pearl':for(let i=0;i<5;i++){ellipse((i-2)*13,-8-Math.sin(i)*3,8,8,'#e5e4da');ellipse((i-2)*13-2,-11-Math.sin(i)*3,3,2,'#fff')}break;case'orb':ellipse(0,-24,25,25,'rgba(200,223,216,.35)','rgba(163,195,185,.4)');ellipse(-9,-33,8,5,'rgba(255,255,255,.8)');break;case'lamp':ellipse(0,-4,24,5,'#d5ddcf');rect(-3,-50,6,46,'#c5d0c3',2);poly([[-25,-42],[-15,-75],[15,-75],[25,-42]],'#f3edd7');ellipse(0,-44,22,4,'#fff6ce');break;case'cushion':rect(-40,-24,80,24,c,12);line(-28,-19,28,-19,'rgba(255,255,255,.45)');break}}
function drawItem(o,t,mode,editMode){let {x,y,s}=pos(o),[w,h]=dims(o);ctx.save();ctx.translate(x,y);let swing=o.type==='key'&&o.hook!=='none'&&(mode==='KEYRING SWING'||(!mode&&o.swing))?Math.sin(t*Math.PI*2/3+o.id*.7)*(mode==='KEYRING SWING'?.11:.035):0;ctx.rotate(o.rot*Math.PI/180);ctx.scale(s*(o.flip?-1:1),s);ctx.globalAlpha*=o.alpha;if(o.shadow>0){ctx.save();ctx.filter='blur(4px)';ellipse(0,3,w*.38,5,'rgba(62,86,72,'+o.shadow*.4+')');ctx.restore()}
if(risers.includes(o.type)){let n=o.type==='step3'?3:o.type==='step2'?2:1;if(o.type==='round'){glass(-45,-25,90,25);ellipse(0,-25,45,12,'rgba(224,240,235,.25)','rgba(171,199,191,.5)')}else for(let i=0;i<n;i++){let yy=-i*21;glass(-w/2+i*12,yy-23,w-i*24,23);slab(-w/2+i*12,yy-23,w-i*24,11)}}else if(props.includes(o.type))prop(o,w,h);else if(o.type==='stand'){let c={clear:'rgba(216,235,231,.35)',frost:'rgba(225,238,233,.7)',pink:'rgba(241,216,225,.5)',blue:'rgba(207,229,240,.5)'}[o.baseMat];ctx.save();ctx.translate(0,-3);ctx.scale(1,.35);if(o.base==='star')star(0,0,49,c);else if(o.base==='heart'){ctx.beginPath();ctx.moveTo(0,30);ctx.bezierCurveTo(-70,-10,-28,-60,0,-25);ctx.bezierCurveTo(28,-60,70,-10,0,30);ctx.fillStyle=c;ctx.fill()}else if(o.base==='square')rect(-43,-26,86,52,c,4);else ellipse(0,0,o.base==='circle'?34:48,30,c,'rgba(164,193,185,.6)');ctx.restore();ctx.save();ctx.shadowColor='white';ctx.shadowBlur=0;for(let i=0;i<4;i++){ctx.shadowOffsetX=i%2?2:-2;ctx.shadowOffsetY=i<2?2:-2;drawImageFit(o,-w/2,-h,w,h-10)}ctx.restore();line(-w/2,-h+10,-w/2,-20,'rgba(231,245,240,.5)')}
else if(o.type==='key'){let m={SILVER:'#b5c4c5',GOLD:'#c7b580','ROSE GOLD':'#caa79d'}[o.metal];if(o.hook!=='none'){if(o.hook==='clear')glass(-12,-h-10,24,22);else line(-12,-h-8,12,-h-8,o.hook==='metal'?m:'#d1dfd7',3);ctx.beginPath();ctx.arc(0,-h+8,10,0,Math.PI*2);ctx.strokeStyle=m;ctx.lineWidth=3;ctx.stroke();line(0,-h+18,0,-h+32,m,2)}ctx.translate(0,-h+20);ctx.rotate(swing);glass(-w/2-4,12,w+8,h-28);drawImageFit(o,-w/2,16,w,h-38)}
else if(o.type==='doll'||o.type==='free'){if(o.type==='doll'&&o.seat==='stand'){glass(-w*.45,-12,w*.9,12);slab(-w*.45,-12,w*.9,8)}if(o.type==='doll'&&o.seat==='cushion')rect(-w*.6,-15,w*1.2,20,'#dfd7dc',13);drawImageFit(o,-w/2,-h,w,h-(o.seat==='stand'?12:0));if(o.type==='doll'&&o.seat==='basket'){rect(-w*.55,-28,w*1.1,31,'#dcd1bb',9);for(let i=-w*.45;i<w*.5;i+=9)line(i,-25,i+5,0,'#efe8d7',3);line(-w*.5,-24,w*.5,-24,'#c5bba5',3)}}
else{if(o.type==='frame'||o.holder==='easel'){poly([[-w*.3,2],[-w*.1,-h*.7],[w*.28,2]],'#d0d9d0');line(-w*.42,1,w*.42,1,'#c0cfc5',4)}let frame=o.type==='frame'?({clear:'rgba(219,236,231,.4)',white:'#fff',silver:'#cbd4d5',cream:'#ece8d9'}[o.frame]):'#fffefa';rect(-w/2,-h,w,h,frame,4,'rgba(173,193,181,.4)');let pad=o.type==='frame'?10:6;drawImageFit(o,-w/2+pad,-h+pad,w-pad*2,h-pad*2);if(o.type==='card'&&o.holder==='clear')glass(-w/2-5,-h-6,w+10,h+10);if(o.type==='card'&&o.holder==='ribbon')ribbon(0,-h+4,.7,'#dcc7cf');if(o.type==='card'&&o.holder==='clip')glass(-12,-18,24,22);if(o.type==='card'&&o.finish!=='MATTE'){ctx.save();rect(-w/2,-h,w,h,null,4);ctx.clip();let gr=ctx.createLinearGradient(-w/2,-h,w/2,0);if(o.finish==='HOLOGRAM'){['rgba(193,226,245,.2)','rgba(238,194,226,.2)','rgba(239,235,177,.2)','rgba(176,234,220,.2)'].forEach((c,i)=>gr.addColorStop(i/3,c))}else{gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,o.finish==='PEARL'?'rgba(240,218,237,.3)':'rgba(255,255,255,.42)');gr.addColorStop(1,'rgba(255,255,255,0)')}rect(-w/2,-h,w,h,gr);ctx.restore()}if(o.type==='ticket'){for(let yy=-h+8;yy<-5;yy+=8)line(w*.27,yy,w*.27,yy+4,'#b7c3b9')}}
if((mode==='CLEAR SHINE'||(!mode&&['SOFT','GLASS'].includes(cfg.shine)))&&['stand','key','frame','card'].includes(o.type)){let yy=o.type==='key'?16:-h,hh=o.type==='key'?h-38:h;surfaceShine(-w/2,yy,w,hh,t,o.id*.035,mode?1:.45)}
if(editMode&&selected===o.id){ctx.setLineDash([4,4]);rect(-w/2-9,-h-10,w+18,h+20,null,4,'#83a695');ctx.setLineDash([]);ellipse(w/2+8,10,4,4,'#83a695')}
ctx.restore()}

function surfaceShine(x,y,w,h,t,offset=0,strength=1){let phase=((t/3-offset)%1+1)%1,bw=Math.min(85,w*.48),cx=x-bw*2+phase*(w+bw*4),slant=h*.24;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();let gr=ctx.createLinearGradient(cx-bw,y,cx+bw,y);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.42,`rgba(255,255,255,${.12*strength})`);gr.addColorStop(.55,`rgba(255,255,255,${.62*strength})`);gr.addColorStop(1,'rgba(255,255,255,0)');poly([[cx-bw,y],[cx+bw,y],[cx+bw-slant,y+h],[cx-bw-slant,y+h]],gr);line(cx+3,y,cx+3-slant,y+h,`rgba(255,255,255,${.65*strength})`,1.5);ctx.restore()}
function spark(x,y,a,r){if(a<.01)return;ctx.save();ctx.globalAlpha*=a;ctx.shadowColor='white';ctx.shadowBlur=5;poly([[x,y-r],[x+1.4,y-1.4],[x+r,y],[x+1.4,y+1.4],[x,y+r],[x-1.4,y+1.4],[x-r,y],[x-1.4,y-1.4]],'rgba(255,255,255,.95)');ellipse(x,y,1.4,1.4,'#d2e2dc');ctx.restore()}
function ledEnvelope(t,i,n){let p=((t%3)+3)%3,start=.12+i*.3,up=Math.max(0,Math.min(1,(p-start)/.38)),down=1-Math.max(0,Math.min(1,(p-2.25)/.6));return up*down}
function gifHint(){let mode=$('gifmode').value,has=items.some(o=>o.type==='key'&&o.hook!=='none');$('gifhint').textContent=mode==='KEYRING SWING'?(has?'걸린 키링만 고리를 축으로 흔들립니다.':'걸린 키링이 없습니다. 키링을 추가하거나 훅을 선택하세요.'):({'CLEAR SHINE':'선반과 아크릴 굿즈 위로 빛이 지나갑니다.','LED ON':'위층부터 점등한 뒤 부드럽게 꺼집니다.','SPARKLE':'선반과 굿즈 가장자리가 번갈아 반짝입니다.'}[mode]);$('gifbtn').disabled=busy||(mode==='KEYRING SWING'&&!has)}
$('gifmode').onchange=()=>{$('gifpreview').checked=true;gifStart=performance.now()/1000;gifHint()};$('gifpreview').onchange=()=>{gifStart=performance.now()/1000;gifHint()};

function render(target,t=0,{editing=false,transparent=false,onlyTier=null,mode=null}={}){ctx=target.getContext('2d');let cw=target.width,ch=target.height;ctx.setTransform(cw/900,0,0,ch/780,0,0);ctx.clearRect(0,0,900,780);let bg={'PURE WHITE':'#fff','WARM IVORY':'#f7f5ee','PALE PINK':'#faf0f2','PALE BLUE':'#f0f6fa','PALE GRAY':'#f2f4f2','SOFT GRID':'#f7f8f3','WALL PANEL':'#f5f5ef','TRANSPARENT':null}[cfg.background];if(!transparent&&bg){rect(0,0,900,780,bg);if(cfg.background==='SOFT GRID'){for(let x=0;x<900;x+=30)line(x,0,x,780,'rgba(144,170,153,.1)');for(let y=0;y<780;y+=30)line(0,y,900,y,'rgba(144,170,153,.1)')}if(cfg.background==='WALL PANEL')for(let x=70;x<900;x+=150){line(x,0,x,780,'rgba(161,176,160,.16)');line(x+2,0,x+2,780,'#fff')}}ctx.save();applyCam(cameraMatrix(t,mode));let g=geom();if(onlyTier===null){ctx.save();ctx.filter='blur(11px)';ellipse(450,686,g.w*.46,15,'rgba(83,104,86,.13)');ctx.restore();for(let x of[g.l+20,g.r-29])glass(x,219,9,459);for(let x of[g.l+2,g.r-11])glass(x,239,9,446)}
for(let ti=0;ti<g.n;ti++){if(onlyTier!==null&&ti!==onlyTier)continue;let y=g.ys[ti];ctx.save();if(editing&&$('tier').value!=='all'&&ti!==+$('tier').value)ctx.globalAlpha=.25;slab(g.l,y,g.w,cfg.camera==='HIGH ANGLE'?48:30);for(let x of[g.l+1,g.r-12]){glass(x,y-5,12,18);ellipse(x+6,y+4,2,2,'#d8e7df')}
let list=items.filter(o=>o.tier===ti).sort((a,b)=>a.depth-b.depth||a.z-b.z||a.id-b.id);list.forEach(o=>drawItem(o,t,mode,editing));let lc={WHITE:'#fff',WARM:'#ffe9b4',PINK:'#f6cada',BLUE:'#c8e7ff',MINT:'#c8efe0'}[cfg.led];if(cfg.light==='DISPLAY LED'||mode==='LED ON'){ctx.save();let power=+cfg.intensity/100;if(mode==='LED ON')power=Math.max(.35,power)*ledEnvelope(t,ti,g.n);ctx.globalAlpha*=power;ctx.shadowColor=lc;ctx.shadowBlur=18;line(g.l+14,y+9,g.r-14,y+9,lc,5);ctx.globalAlpha*=.32;line(g.l+18,y+15,g.r-18,y+15,lc,9);ctx.restore()}
let shine=mode==='CLEAR SHINE'?'SOFT':mode==='SPARKLE'?'SPARKLE':mode?'OFF':cfg.shine;
if(shine==='SOFT'||shine==='GLASS'){surfaceShine(g.l,y-29,g.w,38,t,ti*.08,mode?1:.45);for(let x of[g.l+2,g.r-11])surfaceShine(x,y-125,10,125,t,ti*.08,.7)}else if(shine==='SPARKLE'){for(let j=0;j<5;j++){let a=Math.pow(Math.max(0,Math.sin(t*Math.PI*2/3+j*1.7+ti*.9)),5);spark(g.l+24+j*(g.w-48)/4,y+2,a,mode?7:4)}for(let o of list.filter(o=>['stand','card','key','frame'].includes(o.type))){let p=pos(o),d=dims(o),a=Math.pow(Math.max(0,Math.sin(t*Math.PI*2/3+o.id*1.3)),5);spark(p.x+d[0]*p.s*.46,p.y-d[1]*p.s+8,a,6)}}ctx.restore()}
if(cfg.light!=='DAYLIGHT'&&cfg.light!=='DISPLAY LED'){ctx.globalCompositeOperation='source-atop';let color={WARM:'255,215,154',COOL:'176,217,250',PINK:'244,179,203'}[cfg.light];rect(80,160,740,540,`rgba(${color},${+cfg.intensity/100*.08})`);ctx.globalCompositeOperation='source-over'}ctx.restore();ctx.setTransform(1,0,0,1,0,0)}
function point(e){let b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*900,y=(e.clientY-b.top)/b.height*780,m=cameraMatrix(0,null);return{x:(x-m.e)/m.a,y:(y-m.f-m.b*((x-m.e)/m.a))/m.d}}
let drag=null;canvas.onpointerdown=e=>{if(document.body.classList.contains('preview')||busy)return;let p=point(e),list=activeItems().slice().sort((a,b)=>b.tier-a.tier||b.depth-a.depth||b.z-a.z||b.id-a.id);let hit=list.find(o=>{let q=pos(o),[w,h]=dims(o),a=-o.rot*Math.PI/180,dx=(p.x-q.x)/q.s,dy=(p.y-q.y)/q.s,xx=dx*Math.cos(a)-dy*Math.sin(a),yy=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(xx)<w/2+12&&yy>-h-14&&yy<16});selected=hit?.id||null;if(hit){drag={id:hit.id,dx:p.x-hit.x,dy:p.y-pos(hit).y};canvas.setPointerCapture(e.pointerId)}updateUI()};canvas.onpointermove=e=>{if(!drag)return;let o=items.find(o=>o.id===drag.id),p=point(e),g=geom(),y=p.y-drag.dy;o.x=p.x-drag.dx;if($('tier').value==='all')o.tier=g.ys.reduce((best,yy,i)=>Math.abs(yy-y)<Math.abs(g.ys[best]-y)?i:best,0);o.lift=g.ys[o.tier]-7-(2-o.depth)*7-y;if(cfg.snap){clamp(o);if(Math.abs(o.lift)<16)o.lift=0}o.x=Math.round(o.x);o.lift=Math.round(o.lift)};function endDrag(){if(drag){drag=null;updateUI()}}canvas.onpointerup=endDrag;canvas.onpointercancel=endDrag;
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportCanvas(scale=1,t=0,mode=null,gif=false){let scope=$('scope').value,ti=scope==='tier'?($('tier').value==='all'?selection()?.tier??0:+$('tier').value):null;let c=document.createElement('canvas');c.width=900*scale;c.height=780*scale;render(c,t,{transparent:!gif&&(scope==='shelf'||scope==='transparent'),onlyTier:ti,mode});if(gif){let q=c.getContext('2d');q.globalCompositeOperation='destination-over';q.fillStyle='#f7f5ee';q.fillRect(0,0,c.width,c.height)}if(scope==='shelf'||scope==='tier'){let y=scope==='tier'?Math.max(0,geom().ys[ti]-200):60,h=scope==='tier'?260:660,x=scope==='tier'?50:Math.max(0,geom().l-55),w=scope==='tier'?800:Math.min(900,geom().w+110);if(cfg.camera!=='FRONT'){x=0;y=0;w=900;h=780}let out=document.createElement('canvas');out.width=Math.round(w*scale);out.height=Math.round(h*scale);out.getContext('2d').drawImage(c,x*scale,y*scale,w*scale,h*scale,0,0,out.width,out.height);return out}return c}

function makePalette(frames){let hist=new Map();for(let d of frames)for(let i=0;i<d.length;i+=16){let r=d[i],g=d[i+1],b=d[i+2],k=(r>>3)<<10|(g>>3)<<5|(b>>3),v=hist.get(k);if(v){v[0]+=r;v[1]+=g;v[2]+=b;v[3]++}else hist.set(k,[r,g,b,1])}let points=[...hist.values()].map(v=>[v[0]/v[3],v[1]/v[3],v[2]/v[3],v[3]]);function box(p){let min=[255,255,255],max=[0,0,0],n=0;for(let v of p){n+=v[3];for(let c=0;c<3;c++){min[c]=Math.min(min[c],v[c]);max[c]=Math.max(max[c],v[c])}}let ranges=max.map((v,i)=>v-min[i]),axis=ranges.indexOf(Math.max(...ranges));return{p,n,axis,score:p.length>1?ranges[axis]*Math.sqrt(n):0}}let boxes=[box(points)];while(boxes.length<256){boxes.sort((a,b)=>b.score-a.score);let b=boxes.shift();if(!b.score){boxes.unshift(b);break}b.p.sort((a,c)=>a[b.axis]-c[b.axis]);let acc=0,j=0;for(;j<b.p.length-1;j++){acc+=b.p[j][3];if(acc>=b.n/2)break}boxes.push(box(b.p.slice(0,j+1)),box(b.p.slice(j+1)))}return boxes.map(b=>{let c=[0,0,0];for(let v of b.p)for(let j=0;j<3;j++)c[j]+=v[j]*v[3];return c.map(v=>Math.round(v/b.n))})}
