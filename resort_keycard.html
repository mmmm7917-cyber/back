function processImage(i){let p=S.photos[i];if(!p)return;if(!S.xf[i].remove){p.image=p.original;return}const c=document.createElement('canvas'),im=p.original,k=Math.min(1,1800/Math.max(im.width,im.height));c.width=Math.max(1,im.width*k);c.height=Math.max(1,im.height*k);let g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,c.width,c.height);let d=g.getImageData(0,0,c.width,c.height),a=d.data,w=c.width,h=c.height,t=S.xf[i].tol;let corners=[0,(w-1)*4,(h-1)*w*4,(w*h-1)*4].map(n=>[a[n],a[n+1],a[n+2]]);for(let n=0;n<a.length;n+=4){let dist=Math.min(...corners.map(c=>Math.hypot(a[n]-c[0],a[n+1]-c[1],a[n+2]-c[2])));if(dist<t)a[n+3]=0;else if(dist<t+20)a[n+3]*=(dist-t)/20}g.putImageData(d,0,0);p.image=c;}
