<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>둘만 방에 가두기 실험</title>
<style>
:root{
  --bg:#ece9e1;--paper:#f9f7f1;--ink:#262626;--muted:#777268;--line:#cfc9bd;
  --accent:#30363d;--soft:#e5e0d5;--danger:#8b3d3d;--ok:#52634f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1050px;margin:0 auto;padding:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.head h1{font-size:28px;margin:0;letter-spacing:-.04em}
.head .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(40,40,40,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.field input[type=text],.field select{width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:10px}
.field input[type=file]{width:100%;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:10px}
.btn:hover{background:#f1eee7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(.93)}
.btn.ghost{background:transparent}
.hidden{display:none!important}
.mini{font-size:12px;color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:14px}
.room{position:relative;aspect-ratio:16/10;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(#e8e5dc 0 70%,#cfc8bc 70%)}
.room:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.25),transparent 35%),repeating-linear-gradient(90deg,transparent 0 72px,rgba(0,0,0,.025) 73px 74px)}
.window{position:absolute;left:7%;top:9%;width:28%;height:31%;border:5px solid #b4afa6;background:#dfe7e8;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.window:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #b4afa6}
.bed{position:absolute;right:6%;bottom:12%;width:44%;height:28%;border-radius:10px;background:#d7d0c6;border:2px solid #9f998f;box-shadow:inset 0 -12px 0 #c1baae}
.bed:before{content:"";position:absolute;left:5%;top:10%;width:30%;height:28%;border-radius:10px;background:#f1eee7;border:1px solid #bbb5aa}
.chair{position:absolute;left:8%;bottom:15%;width:17%;height:20%;border:4px solid #777268;border-top-width:11px;border-radius:8px 8px 2px 2px}
.table{position:absolute;left:31%;bottom:16%;width:19%;height:5%;background:#756f65;border-radius:3px}.table:before,.table:after{content:"";position:absolute;top:100%;width:4%;height:380%;background:#6c665d}.table:before{left:12%}.table:after{right:12%}
.door{position:absolute;right:3%;top:8%;width:12%;height:47%;border:4px solid #8d887f;background:#c7c0b5}.door:after{content:"";position:absolute;right:10%;top:50%;width:7px;height:7px;border-radius:50%;background:#5f5b54}
.item{position:absolute;z-index:2;font-size:11px;background:#ffffffd9;border:1px solid #bdb7ac;border-radius:999px;padding:5px 8px;backdrop-filter:blur(3px)}
.phone{left:36%;bottom:26%}.food{left:43%;bottom:26%}.clock{right:4%;top:62%}
.person{position:absolute;z-index:3;width:110px;height:150px;bottom:12%;transition:.35s ease;filter:drop-shadow(0 8px 8px rgba(0,0,0,.12))}
.person .avatar{width:78px;height:78px;border-radius:50%;overflow:hidden;border:4px solid #f7f5ef;background:#d9d4c9;margin:0 auto 3px;display:grid;place-items:center;font-weight:900;font-size:28px;color:#5c5850}
.person .avatar img{width:100%;height:100%;object-fit:cover}
.person .body{width:58px;height:65px;border-radius:26px 26px 12px 12px;margin:auto;background:#676f77;border:3px solid #f7f5ef}
.person .name{text-align:center;font-size:12px;background:#f8f6f0;border:1px solid #bbb5aa;padding:3px 7px;border-radius:999px;white-space:nowrap;margin-top:-1px}
.person.a{left:25%}.person.b{left:47%}.person.closeA{left:36%}.person.closeB{left:45%}.person.farA{left:10%}.person.farB{left:65%}
.sidebar{display:flex;flex-direction:column;gap:12px}
.progress{height:8px;background:#e2ddd2;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:#535c63;transition:.25s}
.qnum{font-size:12px;color:var(--muted);margin-bottom:7px}
.qtitle{font-size:22px;font-weight:850;line-height:1.35;letter-spacing:-.035em;margin-bottom:7px}
.qnote{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.choices{display:grid;gap:8px}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;line-height:1.45}
.choice:hover{border-color:#8f8a80;background:#f4f1ea}
.choice b{display:block;font-size:14px;margin-bottom:3px}.choice span{font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}.metric strong{font-size:16px;display:block}.metric span{font-size:10px;color:var(--muted)}
.log{max-height:160px;overflow:auto;border-top:1px dashed var(--line);padding-top:8px}.log p{font-size:11px;margin:0 0 5px;color:#5f5b54}
.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.resultBox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.resultBox h3{margin:0 0 9px;font-size:15px}.doc{background:#fff;border:1px solid var(--line);padding:24px;position:relative}.doc:before{content:"EXPERIMENT RECORD";position:absolute;right:20px;top:18px;font-size:11px;letter-spacing:.18em;color:#aaa59b}.doc h2{margin:0 0 4px;font-size:25px}.doc .sub{font-size:12px;color:var(--muted);margin-bottom:18px}.summary{font-size:16px;font-weight:800;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0;margin:14px 0}.facts{display:grid;gap:7px}.fact{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13px;border-bottom:1px solid #ece8df;padding:6px 0}.fact b{color:#625e56}.fact span{min-width:0;overflow-wrap:anywhere;word-break:keep-all;line-height:1.55}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:72px 1fr 36px;gap:8px;align-items:center;font-size:12px}.bartrack{height:8px;background:#e8e4db;border-radius:999px;overflow:hidden}.barfill{height:100%;background:#4f585e}.signature{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}.sig{font-size:12px}.sigline{margin-top:24px;border-bottom:1px solid #777;padding-bottom:4px;font-weight:700}
#exportCanvas{display:none}
@media(max-width:820px){.stage,.resultGrid{grid-template-columns:1fr}.fact{grid-template-columns:74px minmax(0,1fr)}.grid2{grid-template-columns:1fr}.room{aspect-ratio:4/3}.head{align-items:flex-start;flex-direction:column}.head .meta{text-align:left}.metrics{grid-template-columns:repeat(2,1fr)}.person{transform:scale(.86);transform-origin:bottom center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>둘만 방에 가두기 실험</h1><div class="mini">폐쇄 공간 24시간 관찰 기록</div></div>
    <div class="meta">피험자 2명 / 외부 연락 제한<br>문 개방까지 24시간</div>
  </div>

  <section id="setup" class="panel">
    <div class="grid2">
      <div class="field"><label>피험자 A 이름</label><input id="nameA" type="text" value="로완" maxlength="20"></div>
      <div class="field"><label>피험자 B 이름</label><input id="nameB" type="text" value="엘리엇" maxlength="20"></div>
      <div class="field"><label>피험자 A 이미지 (선택)</label><input id="imgA" type="file" accept="image/*"></div>
      <div class="field"><label>피험자 B 이미지 (선택)</label><input id="imgB" type="file" accept="image/*"></div>
      <div class="field"><label>실험실 유형</label><select id="roomType"><option value="basic">기본 관찰실</option><option value="hotel">작은 호텔방</option><option value="safe">대피용 안전실</option><option value="old">낡은 휴게실</option></select></div>
      <div class="field"><label>문이 열리는 시간</label><select id="hours"><option>12시간</option><option selected>24시간</option><option>48시간</option></select></div>
    </div>
    <div class="row" style="margin-top:12px"><button id="start" class="btn primary">실험 시작</button><span class="mini">선택 12회 · 결과 PNG 저장 가능</span></div>
  </section>

  <section id="game" class="panel hidden">
    <div class="stage">
      <div id="room" class="room">
        <div class="window"></div><div class="door"></div><div class="bed"></div><div class="chair"></div><div class="table"></div>
        <div class="item phone">휴대폰 1대</div><div class="item food">식량 1세트</div><div class="item clock">남은 시간</div>
        <div id="personA" class="person a"><div class="avatar" id="avA">A</div><div class="body"></div><div class="name" id="roomNameA">A</div></div>
        <div id="personB" class="person b"><div class="avatar" id="avB">B</div><div class="body"></div><div class="name" id="roomNameB">B</div></div>
      </div>
      <div class="sidebar">
        <div><div class="qnum"><span id="qIndex">1</span> / <span id="qTotal">12</span></div><div class="progress"><div id="prog"></div></div></div>
        <div><div id="qTitle" class="qtitle"></div><div id="qNote" class="qnote"></div><div id="choices" class="choices"></div></div>
        <div class="metrics">
          <div class="metric"><strong id="mTrust">0</strong><span>신뢰</span></div>
          <div class="metric"><strong id="mDistance">50</strong><span>거리감</span></div>
          <div class="metric"><strong id="mCare">0</strong><span>보호</span></div>
          <div class="metric"><strong id="mConflict">0</strong><span>긴장</span></div>
          <div class="metric"><strong id="mPlay">0</strong><span>장난</span></div>
          <div class="metric"><strong id="mDepend">0</strong><span>의존</span></div>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </section>

  <section id="result" class="panel hidden">
    <div class="resultGrid">
      <div class="doc" id="doc">
        <h2>관찰 결과 보고서</h2>
        <div class="sub" id="docMeta"></div>
        <div class="summary" id="summary"></div>
        <div class="facts" id="facts"></div>
        <div class="signature"><div class="sig">피험자 A<div class="sigline" id="sigA"></div></div><div class="sig">피험자 B<div class="sigline" id="sigB"></div></div></div>
      </div>
      <div class="resultBox">
        <h3>관계 수치</h3><div id="bars" class="bars"></div>
        <div class="row" style="margin-top:16px"><button id="save" class="btn primary">결과 PNG 저장</button><button id="retry" class="btn">다시 하기</button></div>
        <p class="mini" style="margin-bottom:0">PNG는 현재 결과 보고서를 세로형 기록지로 저장합니다.</p>
      </div>
    </div>
  </section>
</div>
<canvas id="exportCanvas"></canvas>
<script>
(()=>{
const $=id=>document.getElementById(id);
function hasBatchim(name){
  const text=String(name??"");
  if(!text) return false;
  const ch=text[text.length-1];
  const code=ch.charCodeAt(0);
  return code>=0xAC00 && code<=0xD7A3 && ((code-0xAC00)%28)!==0;
}
function subject(name){
  const text=String(name??"");
  if(!text) return "";
  return text + (hasBatchim(text) ? "이" : "가");
}
function topic(name){
  const text=String(name??"");
  if(!text) return "";
  return text + (hasBatchim(text) ? "은" : "는");
}
function pastCopula(name){
  const text=String(name??"");
  if(!text) return "";
  return text + (hasBatchim(text) ? "이었다" : "였다");
}
const baseScore=()=>({trust:0,distance:50,care:0,conflict:0,play:0,depend:0});
let state=null;
const Q=[
  {title:"문이 잠겼다는 걸 확인한 직후, 먼저 반응하는 쪽은?",note:"실험 시작 00:03",type:"who",choices:[
    {label:a=>`${subject(a)} 먼저 문과 창문을 확인한다.`,delta:{trust:1,care:1,conflict:1},fact:(A,B)=>`상황 확인은 ${subject(A)} 먼저 맡았다.`},
    {label:(a,b)=>`${subject(b)} 먼저 방 안의 물건을 살핀다.`,delta:{trust:1,play:1},fact:(A,B)=>`상황 확인은 ${subject(B)} 먼저 맡았다.`}
  ]},
  {title:"침대는 하나뿐이다.",note:"실험 시작 00:20",choices:[
    {label:()=>"한 사람은 침대, 한 사람은 바닥. 자연스럽게 나눈다.",delta:{trust:2,distance:2,care:1},fact:()=>`잠자리 문제는 역할을 나누는 방식으로 정리됐다.`},
    {label:()=>"둘 다 침대를 쓰거나, 아예 둘 다 바닥을 택한다.",delta:{trust:2,distance:-5,depend:2},move:"close",fact:()=>`잠자리에서 서로 간 거리를 크게 두지 않았다.`}
  ]},
  {title:"의자는 하나뿐이다. 누가 앉는가?",note:"실험 시작 01:10",type:"who",choices:[
    {label:a=>`${subject(a)} 앉고 상대는 다른 곳에 자리 잡는다.`,delta:{distance:2},fact:(A)=>`${subject(A)} 의자를 차지했다.`},
    {label:(a,b)=>`${subject(b)} 앉고 ${topic(a)} 다른 곳에 자리 잡는다.`,delta:{care:1},fact:(A,B)=>`${subject(B)} 의자를 차지했다.`}
  ]},
  {title:"휴대폰 한 대가 있다. 배터리는 8%다.",note:"외부 연락은 한 번만 가능",choices:[
    {label:()=>"둘이 상의한 뒤 꼭 필요한 연락 한 번만 한다.",delta:{trust:3,conflict:-1},fact:()=>`제한된 연락 수단은 합의 후 사용했다.`},
    {label:()=>"더 급한 사정이 있는 사람이 먼저 쓴다.",delta:{care:2,depend:1},fact:()=>`연락 우선권은 더 급한 쪽에게 넘겼다.`}
  ]},
  {title:"식량은 사실상 한 사람분이다.",note:"실험 시작 04:30",choices:[
    {label:()=>"정확히 반으로 나눈다.",delta:{trust:2,care:1},fact:()=>`식량은 정확히 분배됐다.`},
    {label:()=>"한 사람이 상대에게 더 많이 준다.",delta:{care:4,depend:2,distance:-2},move:"close",fact:()=>`식량 배분에서 한쪽의 양보가 확인됐다.`}
  ]},
  {title:"긴 정적이 찾아왔다. 먼저 말을 거는 쪽은?",note:"실험 시작 07:05",type:"who",choices:[
    {label:a=>`${subject(a)} 먼저 아무 말이나 꺼낸다.`,delta:{play:2,distance:-2},fact:(A)=>`침묵을 먼저 깬 사람은 ${pastCopula(A)}.`},
    {label:(a,b)=>`${subject(b)} 먼저 말을 건다.`,delta:{trust:1,distance:-2},fact:(A,B)=>`침묵을 먼저 깬 사람은 ${pastCopula(B)}.`}
  ]},
  {title:"사소한 문제로 의견이 엇갈렸다.",note:"실험 시작 09:40",choices:[
    {label:()=>"금방 말로 정리하고 다음 문제로 넘어간다.",delta:{trust:3,conflict:-2},fact:()=>`의견 충돌은 대화로 짧게 종료됐다.`},
    {label:()=>"한동안 신경전을 벌이지만 결국 같은 편으로 돌아온다.",delta:{conflict:4,depend:2,trust:1},fact:()=>`신경전은 있었으나 관계 단절로 이어지지 않았다.`}
  ]},
  {title:"한 사람이 갑자기 몸 상태가 안 좋아졌다.",note:"실험 시작 12:15",choices:[
    {label:a=>`${subject(a)} 아프고, 상대가 곁에서 상태를 계속 본다.`,delta:{care:4,depend:3,distance:-4},move:"close",fact:(A,B)=>`${A}의 상태가 나빠졌을 때 ${subject(B)} 곁을 지켰다.`},
    {label:(a,b)=>`${subject(b)} 아프고, ${subject(a)} 필요한 것만 챙겨주며 쉬게 둔다.`,delta:{care:3,trust:2,distance:1},fact:(A,B)=>`${B}의 상태가 나빠졌을 때 ${subject(A)} 필요한 것을 챙겼다.`}
  ]},
  {title:"잠들기 직전, 둘의 위치는?",note:"실험 시작 17:50",choices:[
    {label:()=>"서로 닿지 않을 정도로 각자 자리를 잡는다.",delta:{distance:5,trust:1},move:"far",fact:()=>`취침 시에는 각자의 공간을 확보했다.`},
    {label:()=>"가까운 거리에서 잠든다.",delta:{distance:-8,depend:3,trust:2},move:"close",fact:()=>`취침 시 물리적 거리가 크게 줄었다.`}
  ]},
  {title:"새벽에 한 사람이 먼저 깼다.",note:"실험 시작 20:30",choices:[
    {label:()=>"상대를 깨우지 않고 조용히 혼자 시간을 보낸다.",delta:{trust:1,distance:2},fact:()=>`새벽 시간에는 상대의 수면을 방해하지 않았다.`},
    {label:()=>"상대가 깨어 있는지 확인하고 말을 건다.",delta:{depend:2,distance:-3,play:1},move:"close",fact:()=>`새벽에도 상대의 상태를 확인했다.`}
  ]},
  {title:"문이 열리기 10분 전이다.",note:"실험 종료 직전",choices:[
    {label:()=>"각자 나갈 준비를 한다.",delta:{distance:3,trust:1},move:"far",fact:()=>`종료 직전에는 각자 퇴실 준비를 했다.`},
    {label:()=>"둘이 같이 문 앞에서 기다린다.",delta:{trust:2,depend:2,distance:-4},move:"close",fact:()=>`종료 직전까지 함께 움직였다.`}
  ]},
  {title:"문이 열렸다. 가장 먼저 하는 행동은?",note:"실험 종료",choices:[
    {label:()=>"아무 일 없었다는 듯 각자 밖으로 나온다.",delta:{trust:1,distance:3},fact:()=>`퇴실은 큰 반응 없이 종료됐다.`},
    {label:()=>"상대 상태부터 한 번 확인하고 같이 나온다.",delta:{care:3,trust:2,depend:2,distance:-3},move:"close",fact:()=>`퇴실 순간에도 상대 상태를 먼저 확인했다.`}
  ]}
];
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function newState(){return {i:0,A:$("nameA").value.trim()||"A",B:$("nameB").value.trim()||"B",score:baseScore(),facts:[],picks:[],imgA:null,imgB:null}}
function loadImage(input){const f=input.files&&input.files[0];if(!f)return Promise.resolve(null);return new Promise((res,rej)=>{const reader=new FileReader();reader.onerror=()=>rej(new Error("파일 읽기 실패"));reader.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("이미지 해석 실패"));im.src=reader.result};reader.readAsDataURL(f)})}
function setAvatar(box,img,name){box.innerHTML="";if(img){const im=document.createElement("img");im.src=img.src;box.appendChild(im)}else box.textContent=(name[0]||"?").toUpperCase()}
function render(){const q=Q[state.i];$("qIndex").textContent=state.i+1;$("qTotal").textContent=Q.length;$("prog").style.width=`${state.i/Q.length*100}%`;$("qTitle").textContent=q.title;$("qNote").textContent=q.note;const c=$("choices");c.innerHTML="";q.choices.forEach((o,idx)=>{const b=document.createElement("button");b.className="choice";const text=o.label(state.A,state.B);b.innerHTML=`<b>${idx+1}. ${text}</b><span>이 선택을 관찰 기록에 반영합니다.</span>`;b.onclick=()=>pick(o);c.appendChild(b)});metrics()}
function pick(o){for(const k in o.delta)state.score[k]=(state.score[k]||0)+o.delta[k];state.score.distance=clamp(state.score.distance,0,100);state.score.conflict=clamp(state.score.conflict,0,100);state.facts.push(o.fact(state.A,state.B));state.picks.push(o);if(o.move==="close")movePeople("close");if(o.move==="far")movePeople("far");addLog(state.facts[state.facts.length-1]);state.i++;if(state.i<Q.length)render();else finish()}
function movePeople(mode){const a=$("personA"),b=$("personB");a.className="person "+(mode==="close"?"closeA":mode==="far"?"farA":"a");b.className="person "+(mode==="close"?"closeB":mode==="far"?"farB":"b")}
function addLog(t){const p=document.createElement("p");p.textContent=`• ${t}`;$("log").prepend(p)}
function metrics(){const s=state.score;$("mTrust").textContent=clamp(s.trust,0,99);$("mDistance").textContent=clamp(s.distance,0,100);$("mCare").textContent=clamp(s.care,0,99);$("mConflict").textContent=clamp(s.conflict,0,99);$("mPlay").textContent=clamp(s.play,0,99);$("mDepend").textContent=clamp(s.depend,0,99)}
function ending(){const s=state.score;const closeness=100-s.distance;let title,desc;if(s.trust>=16&&s.care>=15&&closeness>=55){title="밀착형 동행";desc="폐쇄 상황에서 서로를 우선순위에 두며 자연스럽게 행동 반경이 겹쳤다."}else if(s.conflict>=8&&s.depend>=8){title="충돌형 결속";desc="마찰은 분명했지만, 갈등이 관계 이탈보다 재접촉으로 이어지는 경향이 강했다."}else if(s.distance>=58&&s.trust>=10){title="독립형 신뢰";desc="각자의 공간을 유지하면서도 필요한 순간에는 협력하는 안정된 패턴을 보였다."}else if(s.play>=5&&closeness>=45){title="적응형 콤비";desc="긴장 상황에서도 대화를 만들며 공간 자체를 빠르게 일상화했다."}else{title="관찰형 동거";desc="서로를 크게 압박하지 않고 상황을 지켜보며 필요한 만큼만 개입했다."}return{title,desc}}
function finish(){$("game").classList.add("hidden");$("result").classList.remove("hidden");const e=ending();$("docMeta").textContent=`${state.A} × ${state.B} · ${$("roomType").selectedOptions[0].textContent} · ${$("hours").value}`;$("summary").textContent=`${e.title} — ${e.desc}`;$("facts").innerHTML=state.facts.map((f,i)=>`<div class="fact"><b>기록 ${String(i+1).padStart(2,"0")}</b><span>${f}</span></div>`).join("");$("sigA").textContent=state.A;$("sigB").textContent=state.B;renderBars()}
function renderBars(){const s=state.score;const vals=[['신뢰',clamp(s.trust*4,0,100)],['친밀도',clamp(100-s.distance,0,100)],['보호',clamp(s.care*4,0,100)],['긴장',clamp(s.conflict*8,0,100)],['장난',clamp(s.play*10,0,100)],['의존',clamp(s.depend*6,0,100)]];$("bars").innerHTML=vals.map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="bartrack"><div class="barfill" style="width:${v}%"></div></div><b>${Math.round(v)}</b></div>`).join("")}
function wrap(ctx,text,x,y,maxWidth,lineHeight){const chars=[...text];let line='',yy=y;for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,yy);line=ch;yy+=lineHeight}else line=test}if(line)ctx.fillText(line,x,yy);return yy}
function drawCircleImage(ctx,img,x,y,r){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();const sc=Math.max(2*r/img.width,2*r/img.height);const w=img.width*sc,h=img.height*sc;ctx.drawImage(img,x-r+(2*r-w)/2,y-r+(2*r-h)/2,w,h);ctx.restore()}
function exportPNG(){const cv=$("exportCanvas"),ctx=cv.getContext("2d");const W=1200,pad=80;ctx.font="400 26px sans-serif";let linesCount=0;state.facts.forEach(f=>{linesCount+=Math.max(1,Math.ceil(ctx.measureText(f).width/850))});const H=Math.max(1600,780+state.facts.length*68+linesCount*20);cv.width=W;cv.height=H;ctx.fillStyle="#f3f0e9";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.strokeStyle="#c9c3b8";ctx.lineWidth=2;ctx.fillRect(45,45,W-90,H-90);ctx.strokeRect(45,45,W-90,H-90);ctx.fillStyle="#222";ctx.font="800 54px sans-serif";ctx.fillText("관찰 결과 보고서",pad,130);ctx.fillStyle="#777268";ctx.font="500 22px sans-serif";ctx.fillText(`${state.A} × ${state.B} · ${$("roomType").selectedOptions[0].textContent} · ${$("hours").value}`,pad,172);ctx.textAlign="right";ctx.font="600 18px sans-serif";ctx.fillText("EXPERIMENT RECORD",W-pad,110);ctx.textAlign="left";const e=ending();ctx.fillStyle="#242424";ctx.font="800 30px sans-serif";let y=245;y=wrap(ctx,`${e.title} — ${e.desc}`,pad,y,W-pad*2,42)+38;ctx.strokeStyle="#222";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=45;
if(state.imgA||state.imgB){if(state.imgA)drawCircleImage(ctx,state.imgA,pad+70,y+65,55);else{ctx.fillStyle="#ddd8cd";ctx.beginPath();ctx.arc(pad+70,y+65,55,0,Math.PI*2);ctx.fill()}if(state.imgB)drawCircleImage(ctx,state.imgB,pad+230,y+65,55);else{ctx.fillStyle="#ddd8cd";ctx.beginPath();ctx.arc(pad+230,y+65,55,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#333";ctx.font="700 20px sans-serif";ctx.fillText(state.A,pad+35,y+140);ctx.fillText(state.B,pad+195,y+140);y+=180}
ctx.fillStyle="#222";ctx.font="800 26px sans-serif";ctx.fillText("관찰 기록",pad,y);y+=38;ctx.font="500 23px sans-serif";state.facts.forEach((f,i)=>{ctx.fillStyle="#6d685f";ctx.font="700 19px sans-serif";ctx.fillText(`기록 ${String(i+1).padStart(2,"0")}`,pad,y);ctx.fillStyle="#222";ctx.font="500 22px sans-serif";const yy=wrap(ctx,f,pad+135,y,W-pad*2-135,32);y=Math.max(y+48,yy+28);ctx.strokeStyle="#ece7de";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y-12);ctx.lineTo(W-pad,y-12);ctx.stroke()});y+=22;ctx.fillStyle="#222";ctx.font="800 26px sans-serif";ctx.fillText("관계 수치",pad,y);y+=40;const vals=[['신뢰',clamp(state.score.trust*4,0,100)],['친밀도',clamp(100-state.score.distance,0,100)],['보호',clamp(state.score.care*4,0,100)],['긴장',clamp(state.score.conflict*8,0,100)],['장난',clamp(state.score.play*10,0,100)],['의존',clamp(state.score.depend*6,0,100)]];vals.forEach(([n,v])=>{ctx.fillStyle="#555";ctx.font="600 20px sans-serif";ctx.fillText(n,pad,y);ctx.fillStyle="#e8e3da";ctx.fillRect(pad+100,y-17,650,18);ctx.fillStyle="#4f585e";ctx.fillRect(pad+100,y-17,650*v/100,18);ctx.fillStyle="#222";ctx.fillText(String(Math.round(v)),pad+780,y);y+=42});y+=40;ctx.strokeStyle="#777";ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(pad+380,y);ctx.moveTo(W-pad-380,y);ctx.lineTo(W-pad,y);ctx.stroke();ctx.fillStyle="#333";ctx.font="700 20px sans-serif";ctx.fillText(state.A,pad,y+28);ctx.textAlign="right";ctx.fillText(state.B,W-pad,y+28);ctx.textAlign="left";const a=document.createElement("a");a.download=`room-experiment-${state.A}-${state.B}.png`;a.href=cv.toDataURL("image/png");a.click()}
$("start").onclick=async()=>{state=newState();try{state.imgA=await loadImage($("imgA"));state.imgB=await loadImage($("imgB"))}catch{alert("이미지를 불러오지 못했습니다. 다른 파일로 다시 시도해 주세요.");return}$("roomNameA").textContent=state.A;$("roomNameB").textContent=state.B;setAvatar($("avA"),state.imgA,state.A);setAvatar($("avB"),state.imgB,state.B);$("setup").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");$("log").innerHTML="";movePeople("normal");render()};$("retry").onclick=()=>{$("setup").classList.remove("hidden");$("game").classList.add("hidden");$("result").classList.add("hidden")};$("save").onclick=exportPNG;
})();
</script>
