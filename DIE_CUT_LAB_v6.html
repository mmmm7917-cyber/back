function decorBox(s){let points=geometry(s).contours.flat().map(p=>transformPoint(s,p));if(!points.length){let b=fitBounds(s);return{x:s.x-b.w/2,y:s.y-b.h/2,w:b.w,h:b.h}}let xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}

class GIFWriter{constructor(w,h){this.a=[];this.w=w;this.h=h;this.text('GIF89a');this.word(w);this.word(h);this.bytes([0x70,0,0]);this.bytes([0x21,0xff,11]);this.text('NETSCAPE2.0');this.bytes([3,1,0,0,0])}bytes(a){for(let b of a)this.a.push(b)}text(s){this.bytes([...s].map(c=>c.charCodeAt(0)))}word(n){this.bytes([n&255,n>>8&255])}frame(data,delay){let {pal,indexed}=paletteFor(data);this.bytes([0x21,0xf9,4,4]);this.word(delay);this.bytes([0,0,0x2c]);this.word(0);this.word(0);this.word(this.w);this.word(this.h);this.bytes([0x87]);this.bytes(pal.flat());this.bytes([8]);let bytes=lzw(indexed);for(let i=0;i<bytes.length;i+=255){let part=bytes.slice(i,i+255);this.bytes([part.length]);this.bytes(part)}this.bytes([0])}finish(){this.bytes([0x3b]);return new Blob([new Uint8Array(this.a)],{type:'image/gif'})}}
async function exportGIF(kind){if(exporting||!need())return;exporting=true;play=false;let locked=[...document.querySelectorAll('button,input,select')].map(e=>({e,disabled:e.disabled}));locked.forEach(v=>v.e.disabled=true);let fps=Number($('fps').value),w=Number($('gifSize').value),h=w*.75,duration=kind==='full'?13.5:kind==='cut'?4:2.5,n=Math.ceil(duration*fps),c=canvas(w,h),g=c.getContext('2d'),writer=new GIFWriter(w,h);try{for(let i=0;i<n;i++){let t=i/(n-1)*duration;g.setTransform(w/960,0,0,h/720,0,0);g.clearRect(0,0,960,720);renderScene(g,kind==='full'?'craft':kind,kind==='full'?Math.min(12,t):t,{ui:false,autoPeel:kind==='peel'});g.setTransform(1,0,0,1,0,0);writer.frame(g.getImageData(0,0,w,h).data,Math.max(1,Math.round((i+1)*100/fps)-Math.round(i*100/fps)));$('exportStatus').textContent=`GIF 생성 ${Math.round((i+1)/n*100)}% · ${i+1}/${n}`;await new Promise(r=>setTimeout(r,0))}let blob=writer.finish();download(blob,`DIE_CUT_${kind.toUpperCase()}.gif`);$('exportStatus').textContent=`저장 완료 · ${(blob.size/1048576).toFixed(1)} MB`}catch(err){$('exportStatus').textContent='저장 실패';toast('GIF를 만들지 못했어요. 크기나 FPS를 낮춰 주세요.');console.error(err)}finally{exporting=false;locked.forEach(v=>v.e.disabled=v.disabled)}}document.querySelectorAll('.gif').forEach(b=>b.onclick=()=>exportGIF(b.dataset.gif));
