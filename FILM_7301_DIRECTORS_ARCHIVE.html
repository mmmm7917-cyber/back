<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FILM 7301 — Director's Archive</title><style>
:root{color-scheme:dark;--bg:#151717;--panel:#202323;--line:#3b4140;--muted:#a6aaa5;--accent:#d4e0c4}*{box-sizing:border-box}body{margin:0;height:auto;overflow:auto;background:var(--bg);color:#f1f0e8;font:13px/1.55 system-ui,'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#2a2e2d;color:#e9ece7;border-radius:5px;padding:9px 12px}button:hover{border-color:#aab7a5}button.on,button.primary{background:var(--accent);color:#1b2620;border-color:var(--accent)}header{padding:20px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line)}header strong{font:500 23px Georgia,serif;letter-spacing:.12em}header small{font-size:10px;letter-spacing:.16em;color:var(--muted)}main{max-width:1550px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:22px}.work,.controls{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:15px}.bar .push{margin-left:auto}.view{background:#111313;border-radius:7px;min-height:360px;padding:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}.view canvas{display:block;max-width:100%;max-height:75vh;width:auto;height:auto;box-shadow:0 18px 38px #0008;touch-action:none;cursor:grab}.hint{color:var(--muted);font-size:11px;margin:14px 2px 0}.controls h2{font-size:11px;letter-spacing:.18em;font-weight:650;margin:0 0 18px;color:var(--accent)}.field{margin:0 0 14px}.field label{display:flex;justify-content:space-between;color:#b7c0b8;font-size:10px;letter-spacing:.1em;margin-bottom:6px}.field input:not([type=range]):not([type=file]),.field select,.field textarea,.field input[type=file]{display:block;width:100%;border:1px solid #4b5350;background:#171b1a;color:#f6f6f1;border-radius:5px;padding:10px;min-width:0}.field input[type=file]{font-size:11px}.field textarea{resize:vertical;min-height:65px}.field input[type=range]{width:100%;accent-color:#c6d7bb}.row{display:flex;gap:7px}.row>*{flex:1;min-width:0}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.note{font-size:11px;color:var(--muted);min-height:20px}.sub{font-size:10px;letter-spacing:.14em;color:var(--muted);margin:0 0 9px}.selectscene button{padding:8px}.toggle{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:12px}.toggle input{accent-color:#c6d7bb}@media(max-width:940px){main{grid-template-columns:1fr;padding:12px}.view{padding:10px;min-height:230px}.view canvas{max-height:65vh}header{padding:15px}header strong{font-size:18px}.controls{padding:16px}}@media(max-width:480px){.bar button{font-size:11px;padding:8px}.bar .push{margin-left:0}.view canvas{max-height:none}.view{overflow:auto;justify-content:flex-start}.view canvas{min-width:0}}
</style></head><body><header><strong>FILM 7301</strong><small>DIRECTOR'S ARCHIVE / EDITION 01</small></header><main><section class="work"><div class="bar"><button data-layout="contact" class="on">CONTACT SHEET</button><button data-layout="editorial">EDITOR'S NOTE</button><button data-layout="strip">FILM STRIP</button><button id="saveScene" class="push">선택 장면 PNG</button><button id="saveAll" class="primary">전체 PNG 저장</button></div><div class="view"><canvas id="art" width="1200" height="1200" aria-label="필름 아카이브 미리보기"></canvas></div><p class="hint">사진을 올리고 미리보기의 프레임을 드래그해 위치를 조절하세요. 프레임을 클릭하면 해당 장면이 선택됩니다. 저장되는 이미지는 미리보기와 같은 구성을 사용합니다.</p></section><aside class="controls"><h2>ARCHIVE EDITOR</h2><div class="field"><label>EDIT FRAME</label><div class="row selectscene" id="sceneBtns"><button data-scene="0" class="on">FRAME 01</button><button data-scene="1">FRAME 02</button><button data-scene="2">FRAME 03</button></div></div><div class="field"><label>CHARACTER IMAGE</label><input id="upload" type="file" accept="image/*"></div><div class="row"><button id="copyImage">이 사진을 3장에 적용</button><button id="clearImage">사진 제거</button></div><hr class="divider"><p class="sub">PROJECT DETAILS</p><div class="field"><label>FILM TITLE</label><input id="title" maxlength="65" value="THE DAYS WE KEPT"></div><div class="field"><label>SUBTITLE / PRODUCTION</label><input id="subtitle" maxlength="80" value="MOTION PICTURE ARCHIVE"></div><div class="field"><label>ARCHIVE NUMBER</label><input id="archive" maxlength="20" value="7301"></div><div class="field"><label>CHARACTER NAME</label><input id="character" maxlength="45" placeholder="이름 입력"></div><hr class="divider"><p class="sub">SELECTED FRAME</p><div class="field"><label>SCENE TITLE</label><input id="sceneTitle" maxlength="55"></div><div class="field"><label>FRAME TIMECODE</label><input id="timecode" maxlength="20"></div><div class="field"><label>DIRECTOR'S NOTE / DIALOGUE</label><textarea id="memo" maxlength="150"></textarea></div><div class="field"><label>PHOTO ZOOM <span id="zoomRead">100%</span></label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div><div class="field"><label>HORIZONTAL POSITION</label><input id="posX" type="range" min="-1" max="1" step=".01" value="0"></div><div class="field"><label>VERTICAL POSITION</label><input id="posY" type="range" min="-1" max="1" step=".01" value="0"></div><div class="row"><button id="reset">사진 위치 초기화</button><button id="randomTime">타임코드 변경</button></div><hr class="divider"><p class="sub">PRINT FINISH</p><div class="field"><label>PAPER TONE</label><select id="paper"><option value="ivory">WARM IVORY</option><option value="cool">COOL GREY</option><option value="sage">PALE SAGE</option><option value="black">DARKROOM</option></select></div><div class="field"><label>IMAGE TREATMENT</label><select id="filter"><option value="normal">ORIGINAL</option><option value="mono">MONOCHROME</option><option value="warm">WARM FILM</option><option value="cool">COOL FILM</option></select></div><label class="toggle"><input type="checkbox" id="numbers" checked> 필름 구멍 및 프레임 번호</label><label class="toggle"><input type="checkbox" id="notes" checked> 장면별 메모 표시</label><p id="status" class="note" role="status">이미지 없이도 레이아웃을 미리 볼 수 있습니다.</p></aside></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('art'),ctx=canvas.getContext('2d'),frames=Array.from({length:3},(_,i)=>({image:null,src:'',x:0,y:0,zoom:1,title:['THE BEGINNING','THE MOMENT','THE END'][i],time:['00:00:17','00:12:43','01:03:09'][i],memo:''}));let selected=0,layout='contact',boxes=[],scaleX=1,scaleY=1,drag=null;const meta={title:'THE DAYS WE KEPT',subtitle:'MOTION PICTURE ARCHIVE',archive:'7301',character:''};const state={paper:'ivory',filter:'normal',numbers:true,notes:true};const tones={ivory:['#e9e5da','#252c2a','#626c65'],cool:['#e2e5e5','#263037','#6a777c'],sage:['#dbe2d5','#27382f','#6a8072'],black:['#242a29','#ecece5','#a6b5ab']};function text(s,x,y,size=20,color='#222',font='sans',align='left',max=10000){ctx.save();ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font=`${font==='serif'?'normal':'500'} ${size}px ${font==='serif'?'Georgia, serif':'system-ui, sans-serif'}`;ctx.fillText(String(s||''),x,y,max);ctx.restore()}function line(x,y,xx,yy,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}function wrap(s,x,y,maxW,size,color,maxLines=3,lh=1.5){ctx.save();ctx.font=`${size}px system-ui,sans-serif`;let lines=[''];for(const word of String(s||'').split(/(\s+)/)){let a=lines.length-1;if(ctx.measureText(lines[a]+word).width>maxW&&lines[a])lines.push(word.trimStart());else lines[a]+=word}ctx.restore();lines.slice(0,maxLines).forEach((l,i)=>text(l,x,y+i*size*lh,size,color,'sans','left',maxW))}function picture(f,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='#aeb8b4';ctx.fillRect(x,y,w,h);if(f.image){const im=f.image,fit=Math.max(w/im.width,h/im.height)*f.zoom,iw=im.width*fit,ih=im.height*fit;ctx.filter=state.filter==='mono'?'grayscale(1) contrast(1.08)':state.filter==='warm'?'sepia(.22) saturate(.85)':state.filter==='cool'?'saturate(.78) hue-rotate(12deg)':'none';ctx.drawImage(im,x+(w-iw)/2+f.x*w,y+(h-ih)/2+f.y*h,iw,ih);ctx.filter='none'}else{ctx.fillStyle='#778984';for(let k=-h;k<w+h;k+=34){ctx.beginPath();ctx.moveTo(x+k,y);ctx.lineTo(x+k+h,y+h);ctx.lineWidth=1;ctx.strokeStyle='#ffffff25';ctx.stroke()}text('DROP IN A FRAME',x+w/2,y+h/2,18,'#f0f4ef','sans','center',w-20)}ctx.restore()}function frame(i,x,y,w,h,mode){const f=frames[i],hole=state.numbers,edge=hole?22:11;ctx.fillStyle='#202422';ctx.fillRect(x,y,w,h);if(hole){ctx.fillStyle='#d1c9b5';for(let xx=x+24;xx<x+w-12;xx+=38){ctx.fillRect(xx,y+7,18,9);ctx.fillRect(xx,y+h-16,18,9)}}const ix=x+edge,iy=y+edge,iw=w-edge*2,ih=h-edge*2;picture(f,ix,iy,iw,ih);if(state.numbers){text(`0${i+1}A`,x+edge+8,y+h-29,12,'#e9e6d9');text(`7301 / ${String(i+1).padStart(2,'0')}`,x+w-edge-8,y+h-29,12,'#e9e6d9','sans','right')}boxes.push({i,x:ix,y:iy,w:iw,h:ih});if(i===selected){ctx.strokeStyle='#d2e2be';ctx.lineWidth=3;ctx.strokeRect(x-3,y-3,w+6,h+6)}}function setup(w,h){canvas.width=w;canvas.height=h;boxes=[];const [paper,ink,muted]=tones[state.paper];ctx.fillStyle=paper;ctx.fillRect(0,0,w,h);return {paper,ink,muted}}function contact(){let w=1200,h=1170,{ink,muted}=setup(w,h);text('FILM / 7301',66,75,19,ink);text('ARCHIVE SERIES — 001',1134,75,16,muted,'sans','right');line(66,95,1134,95,ink,1);text(meta.subtitle.toUpperCase(),66,141,16,muted);text(meta.title,66,218,64,ink,'serif','left',1040);const fy=285,fw=337,fh=472,gap=25;for(let i=0;i<3;i++){const x=66+i*(fw+gap);frame(i,x,fy,fw,fh,'contact');text(`0${i+1} / ${frames[i].time}`,x,792,15,muted);text(frames[i].title,x,827,19,ink,'serif','left',fw);if(state.notes)wrap(frames[i].memo,x,859,fw-8,15,muted,3,1.35)}line(66,1010,1134,1010,ink);text('DIRECTOR’S NOTES',66,1046,13,muted);text(meta.character||'UNNAMED SUBJECT',66,1089,26,ink,'serif');text(`COLLECTION ${meta.archive}    /    03 FRAMES`,1134,1085,14,muted,'sans','right');text('CONTACT PRINT • FILM 7301',1134,1132,12,muted,'sans','right')}
function editorial(){let w=1200,h=1450,{ink,muted}=setup(w,h);text('7301   /   EDITOR’S WORKBOOK',70,74,18,ink);text('CUT 01—03',1130,74,16,muted,'sans','right');line(70,98,1130,98,ink);text(meta.title,70,185,73,ink,'serif','left',1050);text(meta.subtitle.toUpperCase(),74,226,15,muted);frame(0,70,275,700,555);text('01 / PRIMARY TAKE',806,321,17,muted);text(frames[0].title,806,382,30,ink,'serif','left',310);text(frames[0].time,806,422,16,muted);if(state.notes)wrap(frames[0].memo,806,472,310,17,ink,7);frame(1,70,893,500,330);frame(2,600,893,530,330);[1,2].forEach((i)=>{let x=i===1?70:600;text(`0${i+1} / ${frames[i].time}`,x,1260,14,muted);text(frames[i].title,x,1295,24,ink,'serif');if(state.notes)wrap(frames[i].memo,x,1325,i===1?500:530,14,muted,2)});line(70,1382,1130,1382,ink);text(meta.character||'UNNAMED SUBJECT',70,1414,17,ink);text(`ARCHIVE ${meta.archive}`,1130,1414,15,muted,'sans','right')}
function strip(){let w=800,h=1610,{ink,muted}=setup(w,h);text('FILM 7301',50,74,29,ink,'serif');text('NEGATIVE / 03',750,74,15,muted,'sans','right');line(50,94,750,94,ink);for(let i=0;i<3;i++){const y=125+i*445;frame(i,50,y,700,344,'strip');text(`0${i+1}   ${frames[i].time}   /   ${frames[i].title}`,52,y+378,19,ink,'sans','left',690);if(state.notes)text(frames[i].memo,52,y+407,14,muted,'sans','left',680)}line(50,1494,750,1494,ink);text(meta.title,50,1543,35,ink,'serif','left',700);text(meta.character||meta.subtitle,50,1580,15,muted)}function render(){if(layout==='contact')contact();else if(layout==='editorial')editorial();else strip()}function sync(){const f=frames[selected];$('sceneTitle').value=f.title;$('timecode').value=f.time;$('memo').value=f.memo;$('zoom').value=f.zoom;$('zoomRead').textContent=Math.round(f.zoom*100)+'%';$('posX').value=f.x;$('posY').value=f.y;document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('on',+b.dataset.scene===selected));render()}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{selected=+b.dataset.scene;sync()});document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(k=>k.classList.toggle('on',k===b));render()});['title','subtitle','archive','character'].forEach(k=>$(k).oninput=()=>{meta[k]=$(k).value;render()});[['sceneTitle','title'],['timecode','time'],['memo','memo'],['zoom','zoom'],['posX','x'],['posY','y']].forEach(([id,k])=>$(id).oninput=()=>{frames[selected][k]=['zoom','x','y'].includes(k)?Number($(id).value):$(id).value;if(id==='zoom')$('zoomRead').textContent=Math.round(frames[selected].zoom*100)+'%';render()});['paper','filter'].forEach(k=>$(k).onchange=()=>{state[k]=$(k).value;render()});['numbers','notes'].forEach(k=>$(k).onchange=()=>{state[k]=$(k).checked;render()});$('upload').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{frames[selected].image=img;frames[selected].src=url;frames[selected].x=frames[selected].y=0;frames[selected].zoom=1;sync();$('status').textContent='사진을 불러왔습니다.'};img.onerror=()=>{URL.revokeObjectURL(url);$('status').textContent='이미지를 열 수 없습니다.'};img.src=url};$('copyImage').onclick=()=>{const f=frames[selected];frames.forEach(v=>{v.image=f.image;v.src=f.src;v.x=f.x;v.y=f.y;v.zoom=f.zoom});render();$('status').textContent='세 장면에 동일한 이미지를 적용했습니다.'};$('clearImage').onclick=()=>{frames[selected].image=null;frames[selected].src='';render()};$('reset').onclick=()=>{Object.assign(frames[selected],{x:0,y:0,zoom:1});sync()};$('randomTime').onclick=()=>{const t=n=>String(n).padStart(2,'0');frames[selected].time=`${t(Math.floor(Math.random()*2))}:${t(Math.floor(Math.random()*60))}:${t(Math.floor(Math.random()*60))}`;sync()};function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{const p=coords(e),b=[...boxes].reverse().find(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h);if(!b)return;selected=b.i;sync();drag={x:p.x,y:p.y,ox:frames[selected].x,oy:frames[selected].y,b};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e),f=frames[selected];f.x=Math.max(-1,Math.min(1,drag.ox+(p.x-drag.x)/drag.b.w));f.y=Math.max(-1,Math.min(1,drag.oy+(p.y-drag.y)/drag.b.h));$('posX').value=f.x;$('posY').value=f.y;render()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>drag=null));canvas.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();frames[selected].zoom=Math.max(1,Math.min(3,frames[selected].zoom+(e.deltaY>0?-.05:.05)));sync()},{passive:false});function download(single){let backup;if(single){backup=layout;layout='strip';render();const copy=document.createElement('canvas');copy.width=760;copy.height=490;const c=copy.getContext('2d');const f=frames[selected];const old=canvas,original=ctx; // use temporary crop from current strip at chosen frame
const src=boxes.find(b=>b.i===selected);if(src){c.fillStyle='#202422';c.fillRect(0,0,760,490);c.drawImage(canvas,0,src.y-22,800,410,0,0,760,390);c.fillStyle='#e9e5da';c.fillRect(0,390,760,100);c.fillStyle='#252c2a';c.font='25px Georgia';c.fillText(f.title,26,440);c.font='15px system-ui';c.fillText(f.time,26,470)}layout=backup;render();save(copy,`FILM7301_FRAME_${selected+1}.png`)}else save(canvas,'FILM7301_DIRECTORS_ARCHIVE.png')}function save(c,name){c.toBlob(blob=>{if(!blob){$('status').textContent='PNG 저장에 실패했습니다.';return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);$('status').textContent='PNG 파일을 저장했습니다.'},'image/png')}$('saveScene').onclick=()=>download(true);$('saveAll').onclick=()=>download(false);sync()})();
