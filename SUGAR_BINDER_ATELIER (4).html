function redo(){if(!state.future.length)return;let snap=state.future.pop();state.history.push(snap);project=JSON.parse(snap);state.selected=null;assetCache.clear();applyTheme();renderAll()}
let autoTimer=0;function queueAutoSave(){clearTimeout(autoTimer);if(!project.settings.autosave)return;autoTimer=setTimeout(()=>{try{localStorage.setItem('sugar-binder-autosave',JSON.stringify(project))}catch(e){console.warn('Auto save unavailable',e)}},1100)}

function safeFileName(){return (project.projectName||'sugar-binder').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim().slice(0,80)||'sugar-binder'}
function download(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000)}

function getAsset(id){return project.assets[id]||null}

function imageCacheGet(key,src){if(!src)return Promise.resolve(null);let cached=assetCache.get(key);if(cached)return cached;let task=new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('이미지 읽기에 실패했습니다.'));img.src=src;});assetCache.set(key,task);return task}
function svgImage(kind,color){let key=kind+safeColor(color);if(svgCache.has(key))return svgCache.get(key);const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(stickerSVG(kind,color));let task=new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src});svgCache.set(key,task);return task}

function layerHTML(l,interactive=true){if(!l.visible)return '';const sel=interactive&&state.mode==='edit'&&state.selected===l.id?' is-selected':'';
 const style=`left:${l.x}px;top:${l.y}px;width:${l.width}px;height:${l.height}px;opacity:${l.opacity};z-index:${l.zIndex};transform:rotate(${l.rotation}deg) scale(${l.scaleX},${l.scaleY})`;
 let content='';const color=safeColor(l.color);
 if(l.type==='image'){const src=getAssetImage(l.assetId);content=src?`<img src="${esc(src)}" alt="사용자 업로드 이미지" draggable="false">`:`<div style="border:2px dashed #d9bdd0;width:100%;height:100%;display:grid;place-items:center;color:#d9b7ce">PHOTO</div>`}
 if(l.type==='svg'||l.type==='sticker')content=stickerSVG(l.sticker||'heart',color);
 if(l.type==='text')content=`<div class="layer-text" style="font-family:${fontCSS(l.fontFamily)};font-size:${l.fontSize||20}px;font-weight:${l.fontWeight||'normal'};line-height:${clamp(Number(l.lineHeight)||1.35,1,3)};text-align:${['left','center','right'].includes(l.align)?l.align:'left'};color:${color};width:100%;height:100%">${esc(l.text||'')}</div>`;
 if(l.type==='paper')content=`<div class="layer-paper ${l.paperStyle==='lined'?'lined':l.paperStyle==='envelope'?'envelope':''}" style="border-color:${color}"></div>`;
 if(l.type==='frame')content=`<div class="layer-frame ${['dots','polaroid','lace'].includes(l.frameStyle)?l.frameStyle:''}" style="color:${color}"></div>`;
 if(l.type==='shape')content=`<div class="layer-shape ${l.shapeStyle==='circle'?'circle':l.shapeStyle==='tape'?'tape':''}" style="color:${color}"></div>`;
 const handles=sel&&!l.locked?`<span class="edit-handle handle-delete" data-handle="delete" title="삭제">×</span><span class="edit-handle handle-rotate" data-handle="rotate" title="회전">⟳</span><span class="edit-handle handle-resize" data-handle="resize" title="크기 조절">↘</span>`:'';
 return `<div class="layer-shell${sel}" data-layer="${esc(l.id)}" style="${style}"><div class="layer-motion"><div class="layer-content">${content}</div></div>${handles}</div>`;
}
function fontCSS(name){return name==='Georgia'?'Georgia,serif':name==='serif'?"'Batang','Nanum Myeongjo',serif":name==='mono'?"'Consolas','Courier New',monospace":"'Malgun Gothic','Apple SD Gothic Neo',sans-serif"}
function pageBackground(p){const color=safeColor(p.background||projectColors().paper);let pattern=p.pattern||'none';if(pattern==='dots')return `background:radial-gradient(#e8cbdb 1.5px,transparent 1.5px) 0 0/20px 20px,${color}`;
 if(pattern==='check')return `background:linear-gradient(90deg,#e6d5e455 1px,transparent 1px),linear-gradient(#e6d5e455 1px,transparent 1px),${color};background-size:25px 25px`;
 if(pattern==='stripes')return `background:repeating-linear-gradient(90deg,#f4e6ee 0 13px,${color} 13px 26px)`;
 if(pattern==='lines')return `background:repeating-linear-gradient(${color} 0 30px,#e8d9e7 31px,${color} 32px)`;
 return `background:${color}`;
}
function pageHTML(p,side,interactive=true){return `<div class="page-canvas" data-page="${side}" style="${pageBackground(p)}">${p.layers.slice().sort((a,b)=>a.zIndex-b.zIndex).map(l=>layerHTML(l,interactive)).join('')}${!p.layers.length&&interactive&&state.mode==='edit'?'<div class="page-empty-note">✿</div>':''}</div>`}
function ringCurve(size=1){const s=clamp(Number(size)||1,.7,1.6);return `M24 38 C9 ${38-11*s} 16 ${38-30*s} 48 ${38-29*s} C78 ${38-30*s} 88 ${38-11*s} 72 38`}
function ringHTML(){
 const b=project.binder,sz=clamp(Number(b.ringSize)||1,.7,1.6),th=clamp(Number(b.ringThickness)||7,3,12);
 const shades=b.metal==='gold'?['#887044','#c4a363','#fff5c5','#dcb76e','#8c6e3b']:b.metal==='rose'?['#986b7e','#c998aa','#fff1f6','#dfb1c2','#906478']:['#69798b','#a6b4c3','#fbfdff','#becbd7','#6f8092'];
 let parts=[];
 for(let i=0;i<b.rings;i++){
  const y=350+((i+.5)-b.rings/2)*(565/b.rings)*(b.ringSpacing||1),curve=ringCurve(sz),gradient='binderMetal-'+i;
  parts.push(`<span class="ring-hole left" style="top:${y}px"></span><span class="ring-hole right" style="top:${y}px"></span>`);
  parts.push(`<svg class="metal-ring" style="top:${y-38}px" viewBox="0 0 96 57" aria-hidden="true"><defs><linearGradient id="${gradient}" x1="0%" y1="8%" x2="95%" y2="90%"><stop offset="0" stop-color="${shades[0]}"/><stop offset=".20" stop-color="${shades[1]}"/><stop offset=".40" stop-color="${shades[2]}"/><stop offset=".65" stop-color="${shades[3]}"/><stop offset="1" stop-color="${shades[4]}"/></linearGradient></defs><path d="${curve}" fill="none" stroke="${shades[0]}" stroke-width="${th+2.4}" stroke-linecap="round"/><path d="${curve}" fill="none" stroke="url(#${gradient})" stroke-width="${th}" stroke-linecap="round"/><path d="${curve}" fill="none" stroke="${shades[2]}" stroke-width="${Math.max(.85,th*.21)}" stroke-linecap="round" opacity=".8" transform="translate(0 -1.1)"/><path d="M24 38 l-2.4 -2.2 M72 38 l2.4 -2.2" stroke="${shades[4]}" stroke-width="2" stroke-linecap="round" opacity=".65"/></svg>`)
 }
 return parts.join('');
}

function animationAt(l,time){let a=l.animation||defaultAnimation();if(!project.settings.motion||!a.enabled||a.type==='none')return {x:0,y:0,rot:0,scale:1,opacity:1};const speed=clamp(Number(a.speed)||1,.1,12),amp=clamp(Number(a.amplitude)||0,0,8),delay=Number(a.delay)||0,phase=Math.max(0,time-delay)*Math.PI*2*speed;if(time<delay)return {x:0,y:0,rot:0,scale:1,opacity:1};if(a.repeat===false&&time-delay>1/speed)return {x:0,y:0,rot:0,scale:1,opacity:1};const wave=Math.sin(phase),ab=Math.abs(Math.sin(phase));let out={x:0,y:0,rot:0,scale:1,opacity:1};switch(a.type){case'float':out.y=-10*amp*wave;break;case'sway':out.rot=9*amp*wave;break;case'pulse':out.scale=1+.08*amp*wave;break;case'twinkle':out.opacity=1-.65*clamp(amp,0,1)*ab;break;case'bounce':out.y=-16*amp*ab;break;case'wiggle':out.rot=4*amp*Math.sin(phase*3);out.x=3*amp*wave;break;}return out}

function medianPalette(frames){const bins=new Map();for(const fr of frames){for(let p=0;p<fr.length;p+=64){let a=fr[p+3],r=fr[p],g=fr[p+1],b=fr[p+2];if(a<128){r=255;g=255;b=255}const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);bins.set(k,(bins.get(k)||0)+1)}}
 let entries=[...bins.entries()].map(([key,n])=>({r:((key>>10)&31)*8+4,g:((key>>5)&31)*8+4,b:(key&31)*8+4,n}));if(!entries.length)entries=[{r:255,g:255,b:255,n:1}];
 const extents=box=>{let minR=256,maxR=0,minG=256,maxG=0,minB=256,maxB=0,total=0;for(const p of box){minR=Math.min(minR,p.r);maxR=Math.max(maxR,p.r);minG=Math.min(minG,p.g);maxG=Math.max(maxG,p.g);minB=Math.min(minB,p.b);maxB=Math.max(maxB,p.b);total+=p.n}let ranges=[maxR-minR,maxG-minG,maxB-minB];return {ranges,total,axis:ranges.indexOf(Math.max(...ranges)),score:Math.max(...ranges)*Math.sqrt(total)}};
 let boxes=[entries];for(let k=1;k<256;k++){let best=-1,score=-1;for(let j=0;j<boxes.length;j++){if(boxes[j].length<2)continue;let r=extents(boxes[j]);if(r.score>score){score=r.score;best=j}}if(best<0)break;let items=boxes.splice(best,1)[0],meta=extents(items);items.sort((a,b)=>[a.r,a.g,a.b][meta.axis]-[b.r,b.g,b.b][meta.axis]);let sum=0,split=0;for(;split<items.length-1;split++){sum+=items[split].n;if(sum>=meta.total/2){split++;break}}split=clamp(split,1,items.length-1);boxes.push(items.slice(0,split),items.slice(split))}
 const pal=new Uint8Array(768);boxes.forEach((box,i)=>{let count=0,r=0,g=0,b=0;for(let p of box){count+=p.n;r+=p.r*p.n;g+=p.g*p.n;b+=p.b*p.n}pal[i*3]=Math.round(r/count);pal[i*3+1]=Math.round(g/count);pal[i*3+2]=Math.round(b/count)});for(let i=boxes.length;i<256;i++){pal[3*i]=pal[0];pal[3*i+1]=pal[1];pal[3*i+2]=pal[2]}return pal;
}
function nearestIndex(rgb,palette,cache){const r=rgb[0],g=rgb[1],b=rgb[2],k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);let hit=cache[k];if(hit!==65535)return hit;let best=0,dist=1e20;for(let i=0;i<256;i++){let dx=r-palette[i*3],dy=g-palette[i*3+1],dz=b-palette[i*3+2],d=2*dx*dx+4*dy*dy+3*dz*dz;if(d<dist){dist=d;best=i}}cache[k]=best;return best}
function quantizePixels(rgba,palette,cache){let pixels=new Uint8Array(rgba.length/4);let rgb=[0,0,0];for(let i=0,j=0;i<rgba.length;i+=4,j++){if(rgba[i+3]<128){rgb[0]=255;rgb[1]=255;rgb[2]=255}else{rgb[0]=rgba[i];rgb[1]=rgba[i+1];rgb[2]=rgba[i+2]}pixels[j]=nearestIndex(rgb,palette,cache)}return pixels}
function lzwGif(indices){const clear=256,end=257;let dict=new Map(),next=258,size=9;let bytes=[],bitBuffer=0,bits=0;
 const write=(code)=>{bitBuffer|=(code<<bits);bits+=size;while(bits>=8){bytes.push(bitBuffer&255);bitBuffer>>>=8;bits-=8}};
 write(clear);let prev=indices[0];for(let i=1;i<indices.length;i++){const k=indices[i],key=prev*256+k;if(dict.has(key)){prev=dict.get(key);continue}write(prev);if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++}else{write(clear);dict.clear();next=258;size=9}prev=k}write(prev);write(end);if(bits)bytes.push(bitBuffer&255);return bytes;
}
function encodeGIF(frames,width,height,fps,palette,onProgress){let result=[],push=(...x)=>result.push(...x),u16=n=>{push(n&255,(n>>8)&255)};
 for(const c of 'GIF89a')push(c.charCodeAt(0));u16(width);u16(height);push(0xf7,0,0);for(let i=0;i<768;i++)push(palette[i]);
 push(0x21,0xff,11);for(const c of 'NETSCAPE2.0')push(c.charCodeAt(0));push(3,1,0,0,0);
 const colorMemo=new Uint16Array(32768);colorMemo.fill(65535);
 for(let f=0;f<frames.length;f++){if(state.exportCanceled)throw new Error('사용자가 GIF 저장을 취소했습니다.');let pixels=quantizePixels(frames[f],palette,colorMemo),packed=lzwGif(pixels),delay=Math.max(2,Math.round(100/fps));

}
async function exportGIF(){let width=Number($('gifWidth').value)||640,fps=Number($('gifFps').value)||10,duration=Number($('gifDuration').value)||3,mode=$('gifMode').value,total=Math.ceil(fps*duration),oldS=project.spreads[state.current],nextS=project.spreads[state.current+1];
 if(mode!=='loop'&&!nextS)throw new Error('다음 스프레드가 없습니다. 먼저 페이지를 추가하거나 장식 애니메이션 모드를 선택해 주세요.');
 await prepareRender([oldS,nextS]);const h=Math.round(700*width/1000),canvas=canvasFor(width,h),ctx=canvas.getContext('2d',{willReadFrequently:true});let frames=[];
 for(let i=0;i<total;i++){if(state.exportCanceled)throw new Error('저장이 취소되었습니다.');let t=i/fps;ctx.clearRect(0,0,width,h);ctx.fillStyle=projectColors().paper;ctx.fillRect(0,0,width,h);ctx.save();ctx.scale(width/1000,h/700);
 if(mode==='loop')drawSpread(ctx,oldS,t,false);else{let p=t/duration,flipStart=mode==='preview'?.28:.2,flipEnd=mode==='preview'?.72:.58;if(p<flipStart)drawSpread(ctx,oldS,t);else if(p<flipEnd){let alpha=(p-flipStart)/(flipEnd-flipStart);drawFlip(ctx,oldS,nextS,t,.5-.5*Math.cos(Math.PI*alpha))}else drawSpread(ctx,nextS,t)}ctx.restore();frames.push(ctx.getImageData(0,0,width,h).data);
 setProgress(Math.round((i+1)*42/total),'GIF 프레임 렌더링 '+(i+1)+' / '+total);if(i%2===0)await new Promise(requestAnimationFrame)}
 canvas.width=0;canvas.height=0;if(state.exportCanceled)return;
 setProgress(48,'공통 색상 팔레트 생성 중…');await new Promise(r=>setTimeout(r,0));const palette=medianPalette(frames);setProgress(60,'GIF89a 압축 중…');await new Promise(r=>setTimeout(r,0));
 // Encode in manageable slices of work: gif encoding itself is deterministic and offline.
 const blob=encodeGIF(frames,width,h,fps,palette,(f,n)=>{if(f%4===0)setProgress(60+Math.floor((f+1)*40/n),'GIF 압축 '+(f+1)+' / '+n)});
 frames.length=0;download(blob,safeFileName()+'-'+(mode==='loop'?'decoration':mode==='flip'?'page-flip':'binder-preview')+'.gif');toast('GIF89a 애니메이션 저장을 시작했어요.')}

// ─────────── STANDALONE READ-ONLY HOMEPAGE EXPORT ───────────
function viewerHtml(){const css=document.querySelector('head style').textContent;const pages=project.spreads.map(s=>({left:pageHTML(s.leftPage,'left',false),right:pageHTML(s.rightPage,'right',false),rings:ringHTML(),template:s.templateId,animations:Object.fromEntries([...s.leftPage.layers,...s.rightPage.layers].map(l=>[l.id,l.animation||defaultAnimation()]))}));
 const wallpaper=homeWallpaper();const payload=JSON.stringify({pages,current:state.current,motion:project.settings.motion,flipMotion:project.settings.flipMotion}).replace(/</g,'\\u003c');const banner=$('siteBanner').outerHTML,sidebar=$('webSidebar').outerHTML;
 return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(project.projectName)} · SUGAR BINDER</title><style>${css}\n:root{${Object.entries(projectColors()).filter(([k])=>['bg','primary','secondary','aqua','ink','paper','accent','border'].includes(k)).map(([k,v])=>`--${k}:${safeColor(v)}`).join(';')};--wallpaper-color:${wallpaper.base};--wallpaper-image:${wallpaper.image};--wallpaper-size:${wallpaper.size}}body{padding:16px}.viewer{max-width:1420px;margin:auto}.viewer .site-frame{padding:16px}.viewer .site-inner{grid-template-columns:146px minmax(0,1fr)}.viewer .binder-area{min-height:300px}.viewer .binder-viewport{width:100%;overflow:auto}.viewer .page-footer{justify-content:center}.viewer .book-nav{gap:8px}.viewer .book-nav button{padding:9px 16px}.viewer .layer-shell{pointer-events:none!important;cursor:default}.viewer .page-empty-note,.viewer .edit-handle{display:none}.viewer .site-banner{height:145px}@media(max-width:650px){.viewer .site-inner{display:block}.viewer .web-sidebar{display:none}.viewer .site-frame{padding:7px}.viewer .site-banner{height:110px}.viewer .banner-title{font-size:23px}.viewer .banner-character{height:92px;width:85px}.viewer .page-footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.viewer .flip-sheet{transition:none}}</style></head><body><div class="viewer"><div class="site-frame">${banner}<div class="site-inner">${sidebar}<main class="binder-area"><div class="book-heading"><span class="book-name">✿ MY BINDER</span><span id="viewerCount" class="page-indicator"></span><div class="book-nav"><button class="btn" id="viewerPrev">◀ 이전</button><button class="btn" id="viewerNext">다음 ▶</button></div></div><div class="binder-viewport" id="viewerViewport"><div class="binder-stage" id="viewerStage"><div class="book-scale" id="viewerScale"><div class="binder-scene" id="viewerScene"></div></div></div></div><div class="page-footer"><span class="hint">♡ PAGE DIARY ♡</span></div></main></div><div class="site-info">SUGAR BINDER</div></div></div>
 <script id="viewerData" type="application/json">${payload}<${'/'}script>
 <script>(function(){'use strict';const data=JSON.parse(document.getElementById('viewerData').textContent),pages=data.pages;let current=data.current||0,busy=false;const scene=document.getElementById('viewerScene');function base(p){return '<div class="binder-base"></div><div class="book-page left" data-side="left">'+p.left+'</div><div class="book-page right" data-side="right">'+p.right+'</div><div class="binder-gutter"></div><div class="binder-rings">'+p.rings+'</div>'}function measure(){let v=document.getElementById('viewerViewport'),scale=Math.min((v.clientWidth-16)/1000,.92);document.getElementById('viewerScale').style.transform='scale('+scale+')';let h=document.getElementById('viewerStage');h.style.width=(1000*scale)+'px';h.style.height=(700*scale)+'px'}function render(){scene.innerHTML=base(pages[current]);document.getElementById('viewerCount').textContent=String(current+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');document.getElementById('viewerPrev').disabled=current===0;document.getElementById('viewerNext').disabled=current>=pages.length-1;measure()}function flip(dir){if(busy)return;let to=current+dir;if(to<0||to>=pages.length)return;if(!data.flipMotion||matchMedia('(prefers-reduced-motion: reduce)').matches){current=to;render();return}busy=true;let old=pages[current],next=pages[to],forward=dir===1;scene.innerHTML='<div class="binder-base"></div>'+(forward?'<div class="book-page left" data-side="left">'+old.left+'</div><div class="book-page right" data-side="right">'+next.right+'</div>':'<div class="book-page left" data-side="left">'+next.left+'</div><div class="book-page right" data-side="right">'+old.right+'</div>')+'<div class="binder-gutter"></div><div id="viewerFlip" class="flip-sheet '+(forward?'forward':'backward')+'"><div class="flip-face front">'+(forward?old.right:old.left)+'</div><div class="flip-face back">'+(forward?next.left:next.right)+'</div></div><div class="binder-rings">'+old.rings+'</div>';requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('viewerFlip')?.classList.add('go')));setTimeout(()=>{current=to;busy=false;render()},690)}document.getElementById('viewerNext').onclick=()=>flip(1);document.getElementById('viewerPrev').onclick=()=>flip(-1);scene.addEventListener('click',e=>{let pg=e.target.closest('.book-page');if(pg){let r=pg.getBoundingClientRect();if(pg.dataset.side==='left'&&e.clientX<r.left+40)flip(-1);if(pg.dataset.side==='right'&&e.clientX>r.right-40)flip(1)}});let start=0;scene.addEventListener('touchstart',e=>{start=e.touches[0].clientX},{passive:true});scene.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>65)flip(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip(-1);if(e.key==='ArrowRight')flip(1)});document.querySelectorAll('[data-webnav]').forEach(b=>b.addEventListener('click',()=>{let mode=b.dataset.webnav;if(mode==='home')current=0;else if(mode==='gallery')current=Math.max(0,pages.findIndex(x=>x.template==='photo'));else if(mode==='decorate')current=Math.max(0,pages.findIndex(x=>x.template==='scrap'));else if(mode==='diary')current=Math.min(current+1,pages.length-1);else if(mode==='settings'){alert('읽기 전용 SUGAR BINDER · '+pages.length+'개 스프레드');return}render()}));function motion(t){if(data.motion){const map=pages[current]?.animations||{};for(let el of scene.querySelectorAll('.layer-shell')){const a=map[el.dataset.layer],inner=el.querySelector('.layer-motion');if(!inner||!a||a.enabled===false||a.type==='none')continue;const phase=Math.max(0,t-(+a.delay||0))*2*Math.PI*(+a.speed||1),wave=Math.sin(phase),amp=+a.amplitude||0;let x=0,y=0,rot=0,scale=1,alpha=1;if(a.type==='float')y=-10*amp*wave;if(a.type==='sway')rot=9*amp*wave;if(a.type==='pulse')scale=1+.08*amp*wave;if(a.type==='twinkle')alpha=1-.65*Math.min(1,amp)*Math.abs(wave);if(a.type==='bounce')y=-16*amp*Math.abs(wave);if(a.type==='wiggle'){rot=4*amp*Math.sin(phase*3);x=3*amp*wave}inner.style.transform='translate('+x+'px,'+y+'px) rotate('+rot+'deg) scale('+scale+')';inner.style.opacity=alpha}}requestAnimationFrame(t0=>motion(t0/1000))}window.addEventListener('resize',measure);new ResizeObserver(measure).observe(document.getElementById('viewerViewport'));render();requestAnimationFrame(t=>motion(t/1000));})();<\/script></body></html>`;
}
