<header><div><h1>PHOTO RECEIVED</h1><p>사진 한 장 보냈어</p></div><span class="mark" aria-hidden="true">↗</span></header>
<main><aside>
<section class="controls"><h2><b>01</b>사진과 두 사람</h2><div class="row"><div><label for="nameA">A 이름</label><input id="nameA" value="캐릭터 A" maxlength="18"><label class="upload" for="imageA"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="3" y="3" width="22" height="22" rx="5" stroke="currentColor"/><path d="m5 22 7-8 5 5 3-4 5 7M17 9h.01" stroke="currentColor" stroke-width="2"/></svg><span id="filenameA">A 사진 추가</span><input id="imageA" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="remove" id="removeA">사진 제거</button></div><div><label for="nameB">B 이름</label><input id="nameB" value="캐릭터 B" maxlength="18"><label class="upload" for="imageB"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="3" y="3" width="22" height="22" rx="5" stroke="currentColor"/><path d="m5 22 7-8 5 5 3-4 5 7M17 9h.01" stroke="currentColor" stroke-width="2"/></svg><span id="filenameB">B 사진 추가</span><input id="imageB" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="remove" id="removeB">사진 제거</button></div></div>
<details><summary>프로필 사진 (대화창 상단)</summary><p class="hint">주고받는 사진과 별도로 설정합니다. 선택하지 않으면 이름 첫 글자가 표시됩니다.</p><div class="row"><div><label class="upload" for="profileA"><span id="profileFilenameA">A 프로필 추가</span><input id="profileA" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="remove" id="removeProfileA">프로필 제거</button></div><div><label class="upload" for="profileB"><span id="profileFilenameB">B 프로필 추가</span><input id="profileB" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="remove" id="removeProfileB">프로필 제거</button></div></div></details>
<label for="composition">사진 구성</label><select id="composition"><option value="single">한 사람이 보낸 사진 한 장</option><option value="pair">두 사람이 함께 나온 사진</option><option value="exchange">서로 한 장씩 보낸 사진</option></select><label for="sender">먼저 사진을 보내는 사람</label><select id="sender"><option value="A">A</option><option value="B">B</option></select><p class="hint">원본 비율을 유지합니다. ‘함께 나온 사진’은 A·B 이미지를 한 프레임 안에 배치합니다.</p>
<details><summary>사진 크기·위치</summary><label for="fit">이미지 맞춤</label><select id="fit"><option value="contain">전체 보이기</option><option value="cover">사진 칸 채우기</option></select><div class="row"><div><label for="scaleA">A 크기</label><input id="scaleA" type="range" min="40" max="200" value="100"><label for="xA">A 좌우</label><input id="xA" type="range" min="-100" max="100" value="0"><label for="yA">A 상하</label><input id="yA" type="range" min="-100" max="100" value="0"></div><div><label for="scaleB">B 크기</label><input id="scaleB" type="range" min="40" max="200" value="100"><label for="xB">B 좌우</label><input id="xB" type="range" min="-100" max="100" value="0"><label for="yB">B 상하</label><input id="yB" type="range" min="-100" max="100" value="0"></div></div><button id="resetPosition" style="width:100%;margin-top:10px">사진 배치 초기화</button></details></section>
<section class="controls"><h2><b>02</b>대화</h2><label for="preset">상황 프리셋</label><select id="preset"><option value="daily">지금 뭐 해?</option><option value="miss">네 생각이 나서</option><option value="proof">잘 도착했어</option><option value="secret">너한테만 보여 줄게</option></select><label id="labelAsk" for="ask">B의 첫 메시지</label><textarea id="ask" maxlength="65">지금 뭐 해?</textarea><label id="labelBefore" for="before">A의 사진 전 메시지</label><textarea id="before" maxlength="65">잠깐만. 사진 보내 줄게.</textarea><label for="caption">사진 아래 설명</label><input id="caption" value="방금 찍은 사진" maxlength="42"><label id="labelReply" for="reply">B의 답장</label><textarea id="reply" maxlength="65">이거 나한테만 보낸 거야?</textarea><label id="labelFinal" for="final">A의 마지막 메시지</label><textarea id="final" maxlength="65">응. 너한테만.</textarea><div id="exchangeField" hidden><label for="captionB">두 번째 사진 설명</label><input id="captionB" value="나도 한 장 보낼게." maxlength="42"></div><label for="reaction">사진에 남길 반응</label><select id="reaction"><option value="heart">하트</option><option value="star">별</option><option value="none">없음</option></select></section>
<section class="controls"><h2><b>03</b>화면</h2><label for="theme">색상</label><select id="theme"><option value="sage">세이지</option><option value="lilac">라일락</option><option value="rose">로즈</option><option value="night">나이트</option></select><label for="frame">사진 프레임</label><select id="frame"><option value="paper">사진 인화지</option><option value="window">사진 뷰어 창</option><option value="polaroid">폴라로이드</option></select><div class="row"><div><label for="time">시각</label><input id="time" value="오후 10:47" maxlength="16"></div><div><label for="duration">재생 길이</label><select id="duration"><option value="6">6초</option><option value="8" selected>8초</option><option value="10">10초</option></select></div></div><label for="backdrop">사진 뒤 배경</label><input id="backdrop" type="color" value="#ece9e2" style="height:38px;padding:4px"><label><input id="transparent" type="checkbox"> PNG 바깥 배경 투명</label></section>
</aside><section class="stage"><div class="preview-wrap"><div class="preview-top"><span id="phaseLabel">메시지 도착</span><span>1200 × 900</span></div><canvas id="preview" width="1200" height="900" aria-label="사진과 대화 미리보기"></canvas><div class="playbar"><button id="play">일시정지</button><button id="restart">처음부터</button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치"><output id="timer">0.0 / 8초</output><button id="complete">완성 장면</button></div></div>
<div class="export"><div class="row"><div><label for="pngSize">PNG 크기</label><select id="pngSize"><option value="2">2400 × 1800</option><option value="3">3600 × 2700</option><option value="1">1200 × 900</option></select></div><div><label for="gifSize">GIF 크기</label><select id="gifSize"><option value="600">600 × 450</option><option value="800">800 × 600</option></select></div></div><div class="buttons"><button id="png" class="primary">PNG 저장</button><button id="gif" class="primary">GIF 저장</button></div><div class="progress" id="progressWrap" hidden><progress id="progress" value="0" max="100"></progress></div><p id="status" role="status" aria-live="polite">도착한 사진을 누르면 크게 열립니다.</p></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),v=id=>$(id).value,num=id=>Number(v(id));
const canvas=$('preview'),context=canvas.getContext('2d');let profiles={A:null,B:null};let photos={A:null,B:null},phase=0,playing=true,busy=false,last=performance.now(),hits=[];
const palettes={sage:{bg:'#e9eee7',paper:'#fffefa',ink:'#354c43',muted:'#87978c',accent:'#668b78',pale:'#e5ede3',sent:'#d4e2cf',photo:'#ffffff'},lilac:{bg:'#e9e5f0',paper:'#fdfbff',ink:'#544460',muted:'#998ba4',accent:'#9580ac',pale:'#eee8f5',sent:'#ded3ee',photo:'#ffffff'},rose:{bg:'#f2e7e8',paper:'#fffafa',ink:'#694b54',muted:'#ae929a',accent:'#b27c8d',pale:'#f5e9ed',sent:'#ecd1da',photo:'#ffffff'},night:{bg:'#222a31',paper:'#303c43',ink:'#e3e9e5',muted:'#9caca8',accent:'#89b5a4',pale:'#3a4950',sent:'#486257',photo:'#e7ece7'}};
function rr(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,Math.max(.1,w),Math.max(.1,h),r);c.fillStyle=fill;c.fill()}
function txt(c,s,x,y,size=18,color='#354c43',weight=400,align='left'){c.font=`${weight} ${size}px system-ui,"Malgun Gothic",sans-serif`;c.textAlign=align;c.fillStyle=color;c.fillText(s,x,y);c.textAlign='left'}
function lines(c,s,width,size){c.font=`400 ${size}px system-ui,"Malgun Gothic",sans-serif`;let rows=[],line='';for(const ch of Array.from(s)){if(ch==='\n'){rows.push(line);line='';continue}if(line&&c.measureText(line+ch).width>width){rows.push(line);line=''}line+=ch}rows.push(line);return rows}
function write(c,s,x,y,width,size,color,max=3){let rows=lines(c,s,width,size);rows.slice(0,max).forEach((r,i)=>{if(i===max-1&&rows.length>max){while(c.measureText(r+'…').width>width&&r.length)r=r.slice(0,-1);r+='…'}txt(c,r,x,y+i*size*1.4,size,color)});return rows.length}
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),ease=t=>{t=clamp(t);return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t;
function roles(){let sender=v('sender');return {sender,receiver:sender==='A'?'B':'A'}}
function personName(who){return v('name'+who).trim()||'캐릭터 '+who}
function avatar(c,who,x,y,r,t){c.save();c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.clip();c.fillStyle=who==='A'?t.accent:t.sent;c.fillRect(x-r,y-r,r*2,r*2);const im=profiles[who];if(im){const k=Math.max(r*2/im.naturalWidth,r*2/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;c.drawImage(im,x-w/2,y-h/2,w,h)}else{let color=who==='A'?(v('theme')==='night'?'#263e34':'#fff'):t.ink;txt(c,Array.from(personName(who))[0]||who,x,y+r*.35,r*.82,color,500,'center')}c.restore()}

function bubble(c,s,who,y,alpha,t){if(!s.trim())return 0;let {sender}=roles(),out=who===sender;c.save();c.globalAlpha=alpha;let size=18,max=277,rows=lines(c,s,max,size);while((rows.length*size*1.4+22>78||rows.length>3)&&size>11){size-=.5;rows=lines(c,s,max,size)}let w=Math.min(310,Math.max(65,...rows.map(r=>c.measureText(r).width))+30),h=rows.length*size*1.4+22,x=out?457-w:126;rr(c,x,y,w,h,15,out?t.sent:t.pale);write(c,s,x+15,y+size+11,w-30,size,t.ink,3);c.restore();return h}
function imageArea(c,who,x,y,w,h,t){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.fillStyle=v('backdrop');c.fillRect(x,y,w,h);let im=photos[who];if(im){let k=(v('fit')==='cover'?Math.max(w/im.naturalWidth,h/im.naturalHeight):Math.min(w/im.naturalWidth,h/im.naturalHeight))*num('scale'+who)/100;let iw=im.naturalWidth*k,ih=im.naturalHeight*k;c.drawImage(im,x+(w-iw)/2+num('x'+who)*w/200,y+(h-ih)/2+num('y'+who)*h/200,iw,ih)}else{let mid=x+w/2;c.globalAlpha=.16;c.fillStyle=who==='A'?'#846b5c':'#586e8d';c.beginPath();c.arc(mid,y+h*.34,Math.min(w,h)*.12,0,Math.PI*2);c.fill();rr(c,mid-w*.23,y+h*.54,w*.46,h*.5,Math.min(w,h)*.14,c.fillStyle);c.globalAlpha=1;txt(c,who,mid,y+h*.8,Math.min(w,h)*.11,'#6a756e',500,'center')}c.restore()}
function picture(c,x,y,w,h,t,who,paired=false){let gap=paired?5:0;if(paired){imageArea(c,'A',x,y,(w-gap)/2,h,t);imageArea(c,'B',x+(w+gap)/2,y,(w-gap)/2,h,t)}else imageArea(c,who,x,y,w,h,t)}
function heart(c,x,y,size,color){c.save();c.translate(x,y);c.scale(size/24,size/24);c.fillStyle=color;c.beginPath();c.moveTo(0,8);c.bezierCurveTo(-22,-5,-11,-20,0,-9);c.bezierCurveTo(11,-20,22,-5,0,8);c.fill();c.restore()}
function star(c,x,y,r,color){c.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,k=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k)}c.closePath();c.fillStyle=color;c.fill()}
function badge(c,x,y,t,alpha=1){if(v('reaction')==='none')return;c.save();c.globalAlpha=alpha;rr(c,x-29,y-21,58,42,21,t.photo);if(v('reaction')==='heart')heart(c,x,y+4,18,'#ce7d8c');else star(c,x,y,14,'#c9a75c');c.restore()}
function phaseName(p){return p<.15?'메시지 도착':p<.25?'답장':p<.38?'사진 전송 중':p<.44?'사진 도착':p<.59?'사진 열기':p<.73?'사진 보기':p<.85?'상대의 답장':'완성 장면'}
function draw(c,p,transparent=false,interactive=false){const t=palettes[v('theme')],{sender,receiver}=roles(),mode=v('composition'),pair=mode==='pair',exchange=mode==='exchange';let photoWho=sender;c.clearRect(0,0,1200,900);if(!transparent){c.fillStyle=t.bg;c.fillRect(0,0,1200,900);c.save();c.strokeStyle=t.accent;c.globalAlpha=.055;c.lineWidth=1;for(let x=0;x<1200;x+=36){c.beginPath();c.moveTo(x,0);c.lineTo(x,900);c.stroke()}for(let y=0;y<900;y+=36){c.beginPath();c.moveTo(0,y);c.lineTo(1200,y);c.stroke()}c.restore()}
if(interactive)hits=[];const chat={x:68,y:89,w:423,h:724};rr(c,chat.x+4,chat.y+8,chat.w,chat.h,24,t.accent+'12');rr(c,chat.x,chat.y,chat.w,chat.h,24,t.paper);avatar(c,receiver,111,137,22,t);txt(c,personName(receiver),147,133,21,t.ink,550);txt(c,v('time'),147,157,12,t.muted);txt(c,'···',456,143,24,t.muted,500,'right');c.fillStyle=t.pale;c.fillRect(88,177,383,1);
let first=ease(p/.1);bubble(c,v('ask'),receiver,205,first,t);bubble(c,v('before'),sender,286,ease((p-.12)/.1),t);
const thumb={x:241,y:391,w:214,h:151};let pa=ease((p-.24)/.06);if(pa>0){c.save();c.globalAlpha=pa;rr(c,thumb.x,thumb.y,thumb.w,thumb.h,12,t.photo);c.save();c.beginPath();c.roundRect(thumb.x+5,thumb.y+5,thumb.w-10,thumb.h-10,9);c.clip();picture(c,thumb.x+5,thumb.y+5,thumb.w-10,thumb.h-10,t,sender,pair);c.restore();if(p<.38){rr(c,thumb.x,thumb.y,thumb.w,thumb.h,12,'#283b3990');let loaded=clamp((p-.25)/.13);rr(c,thumb.x+26,thumb.y+68,162,5,3,'#ffffff55');rr(c,thumb.x+26,thumb.y+68,162*loaded,5,3,'#fff');txt(c,Math.floor(loaded*100)+'%',thumb.x+107,thumb.y+100,14,'#fff',400,'center')}else{rr(c,thumb.x+8,thumb.y+112,198,31,7,'#ffffffec');txt(c,'사진  '+(pair?'2인':'1장'),thumb.x+20,thumb.y+133,12,'#60736a');txt(c,'↗',thumb.x+184,thumb.y+134,17,'#60736a');if(interactive)hits.push({x:thumb.x,y:thumb.y,w:thumb.w,h:thumb.h,action:'open'})}c.restore();if(p>=.38)txt(c,p>=.59?'읽음':'도착',453,565,11,t.muted,400,'right')}
if(exchange&&p>=.77){c.save();c.globalAlpha=ease((p-.77)/.05);rr(c,126,488,104,76,9,t.photo);picture(c,130,492,96,68,t,receiver,false);c.restore();if(interactive)hits.push({x:126,y:488,w:104,h:76,action:'openSecond'})}
let replyP=ease((p-.71)/.08);bubble(c,v('reply'),receiver,588,replyP,t);bubble(c,v('final'),sender,679,ease((p-.83)/.08),t);rr(c,88,758,383,37,18,t.pale);txt(c,'메시지',106,782,13,t.muted);txt(c,'↑',450,783,21,t.muted,400,'center');

function render(){draw(context,phase,false,true);$('phaseLabel').textContent=phaseName(phase);$('seek').value=Math.round(phase*1000);$('timer').textContent=(phase*num('duration')).toFixed(1)+' / '+v('duration')+'초';$('play').textContent=playing?'일시정지':'재생'}
function tick(now){let dt=Math.min((now-last)/1000,.08);last=now;if(playing&&!busy){phase=(phase+dt/num('duration'))%1;render()}requestAnimationFrame(tick)}
function sync(){let {sender,receiver}=roles();$('labelAsk').textContent=personName(receiver)+'의 첫 메시지';$('labelBefore').textContent=personName(sender)+'의 사진 전 메시지';$('labelReply').textContent=personName(receiver)+'의 답장';$('labelFinal').textContent=personName(sender)+'의 마지막 메시지';$('exchangeField').hidden=v('composition')!=='exchange';render()}

for(const who of ['A','B']){$('image'+who).addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{photos[who]=im;URL.revokeObjectURL(url);$('filename'+who).textContent=file.name;$('status').textContent='사진을 불러왔어요.';sync()};im.onerror=()=>{URL.revokeObjectURL(url);$('status').textContent='이미지를 읽을 수 없어요. PNG 또는 JPG로 다시 선택해 주세요.'};im.src=url});$('remove'+who).onclick=()=>{photos[who]=null;$('image'+who).value='';$('filename'+who).textContent=who+' 사진 추가';render()}}
for(const who of ['A','B']){let request=0;$('profile'+who).addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const token=++request,url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(token!==request)return;profiles[who]=im;$('profileFilename'+who).textContent=file.name;$('status').textContent=who+' 프로필 사진을 불러왔어요.';render()};im.onerror=()=>{URL.revokeObjectURL(url);if(token===request)$('status').textContent='프로필 이미지를 읽을 수 없어요. PNG 또는 JPG로 다시 선택해 주세요.'};im.src=url});$('removeProfile'+who).onclick=()=>{request++;profiles[who]=null;$('profile'+who).value='';$('profileFilename'+who).textContent=who+' 프로필 추가';render()}};
$('resetPosition').onclick=()=>{for(const who of ['A','B']){ $('scale'+who).value=100;$('x'+who).value=0;$('y'+who).value=0}render()};$('play').onclick=()=>{playing=!playing;last=performance.now();render()};$('restart').onclick=()=>{phase=0;playing=true;last=performance.now();render()};$('complete').onclick=()=>{phase=.96;playing=false;render()};$('seek').oninput=e=>{phase=Number(e.target.value)/1000;playing=false;render()};canvas.onclick=e=>{if(busy)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*900/r.height;for(let i=hits.length-1;i>=0;i--){let h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){if(h.action==='openSecond'){phase=.8;playing=true;last=performance.now()}else if(h.action==='open'){phase=.44;playing=true;last=performance.now()}else{phase=.4;playing=false}render();break}}};

function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('png').onclick=async()=>{let c=document.createElement('canvas'),k=num('pngSize');c.width=1200*k;c.height=900*k;let g=c.getContext('2d');g.scale(k,k);draw(g,phase,$('transparent').checked);c.toBlob(b=>{if(b){download(b,'PHOTO_RECEIVED.png');$('status').textContent='PNG 저장 완료'}else $('status').textContent='저장하지 못했어요. 다시 시도해 주세요.'},'image/png')};
function addColors(hist,data){for(let i=0;i<data.length;i+=4){let r=data[i],g=data[i+1],b=data[i+2],key=(r<<16)|(g<<8)|b;hist.set(key,(hist.get(key)||0)+1)}}
function makePalette(hist){
let colors=Array.from(hist,([key,n])=>[key>>16,(key>>8)&255,key&255,n]);
if(colors.length<=256)return colors.map(c=>c.slice(0,3));
colors.sort((a,b)=>b[3]-a[3]);let palette=colors.slice(0,32).map(c=>c.slice(0,3)),bins=new Map();
for(let c of colors.slice(32)){let k=(c[0]>>3)<<10|(c[1]>>3)<<5|(c[2]>>3),v=bins.get(k)||[0,0,0,0];for(let j=0;j<3;j++)v[j]+=c[j]*c[3];v[3]+=c[3];bins.set(k,v)}
let points=Array.from(bins.values(),v=>[v[0]/v[3],v[1]/v[3],v[2]/v[3],v[3]]);
const box=a=>{let lo=[255,255,255],hi=[0,0,0],n=0;for(let c of a){n+=c[3];for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],c[j]);hi[j]=Math.max(hi[j],c[j])}}let ranges=hi.map((v,j)=>v-lo[j]),axis=ranges.indexOf(Math.max(...ranges));return {a,n,axis,score:a.length>1?Math.max(...ranges)*Math.sqrt(n):0}};
let boxes=[box(points)];while(boxes.length<224){let idx=0;for(let i=1;i<boxes.length;i++)if(boxes[i].score>boxes[idx].score)idx=i;let b=boxes[idx];if(!b.score)break;b.a.sort((a,c)=>a[b.axis]-c[b.axis]);let n=0,k=0;for(;k<b.a.length-1;k++){n+=b.a[k][3];if(n>=b.n/2)break}k++;boxes.splice(idx,1,box(b.a.slice(0,k)),box(b.a.slice(k)))}
for(let b of boxes){let sum=[0,0,0];for(let c of b.a)for(let j=0;j<3;j++)sum[j]+=c[j]*c[3];palette.push(sum.map(v=>Math.round(v/b.n)))}return palette}
function paletteMapper(palette){let cache=new Map();palette.forEach((c,i)=>cache.set((c[0]<<16)|(c[1]<<8)|c[2],i));return (r,g,b)=>{let key=(r<<16)|(g<<8)|b;if(cache.has(key))return cache.get(key);let best=0,dist=Infinity;for(let i=0;i<palette.length;i++){let c=palette[i],d=2*(r-c[0])**2+3*(g-c[1])**2+(b-c[2])**2;if(d<dist){best=i;dist=d}}if(cache.size<150000)cache.set(key,best);return best}}

function gifFrame(rgba,w,h,mapper){
const a=[33,249,4,4,10,0,0,0,44,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8],bytes=[];let bits=0,used=0;
const emit=code=>{bits|=code<<used;used+=9;while(used>=8){bytes.push(bits&255);bits>>>=8;used-=8}};
let dictionary=new Map(),next=258,prefix=-1;emit(256);
for(let i=0;i<rgba.length;i+=4){let symbol=mapper(rgba[i],rgba[i+1],rgba[i+2]);if(prefix<0){prefix=symbol;continue}let key=prefix*256+symbol,known=dictionary.get(key);if(known!==undefined){prefix=known;continue}emit(prefix);if(next<510)dictionary.set(key,next++);else{emit(256);dictionary.clear();next=258}prefix=symbol}
if(prefix>=0)emit(prefix);emit(257);if(used)bytes.push(bits&255);for(let i=0;i<bytes.length;i+=255){let block=bytes.slice(i,i+255);a.push(block.length,...block)}a.push(0);return new Uint8Array(a)
}
$('gif').onclick=async()=>{if(busy)return;busy=true;let previous=playing;playing=false;const controls=Array.from(document.querySelectorAll('input,select,textarea,button'));controls.forEach(e=>e.disabled=true);$('progressWrap').hidden=false;$('progress').value=0;

parts.push(new Uint8Array([59]));let blob=new Blob(parts,{type:'image/gif'});download(blob,'PHOTO_RECEIVED.gif');$('status').textContent='GIF 저장 완료 · '+(blob.size/1024/1024).toFixed(1)+' MB';
