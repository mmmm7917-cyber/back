<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const art=$('#artCanvas'),overlay=$('#overlayCanvas'),area=$('#canvasArea'),stack=$('#canvasStack');const W0=600,H0=840;let project,images={},side='A',matTab='characters',fxTab='object',selected=null,zoom=1,impactPick=false,drag=null,history=[],future=[],anim={kind:'idleA',from:0,at:0,duration:2400,paused:false,freeze:0},shardsCache={key:'',list:[]},sceneCache={key:null,A:null,B:null},renderVersion=0,lastDraw=0,toastTimer=null,exporting=false;

function medianPalette(hist){let colors=[];for(let key=0;key<32768;key++){const w=hist[key];if(w)colors.push({r:((key>>10)&31)*8+4,g:((key>>5)&31)*8+4,b:(key&31)*8+4,w})}if(colors.length===0)colors=[{r:30,g:26,b:34,w:1}];let groups=[colors];while(groups.length<256){let best=-1,bestScore=-1;for(let i=0;i<groups.length;i++){const g=groups[i];if(g.length<2)continue;let min=[255,255,255],max=[0,0,0],weight=0;for(const p of g){min[0]=Math.min(min[0],p.r);min[1]=Math.min(min[1],p.g);min[2]=Math.min(min[2],p.b);max[0]=Math.max(max[0],p.r);max[1]=Math.max(max[1],p.g);max[2]=Math.max(max[2],p.b);weight+=p.w}const score=Math.max(...max.map((x,j)=>x-min[j]))*Math.log2(weight+2);if(score>bestScore){bestScore=score;best=i}}
if(best<0)break;const arr=groups.splice(best,1)[0],min=[255,255,255],max=[0,0,0];for(const p of arr){min[0]=Math.min(min[0],p.r);min[1]=Math.min(min[1],p.g);min[2]=Math.min(min[2],p.b);max[0]=Math.max(max[0],p.r);max[1]=Math.max(max[1],p.g);max[2]=Math.max(max[2],p.b)}const dif=max.map((x,j)=>x-min[j]),ch=dif.indexOf(Math.max(...dif));arr.sort((a,b)=>[a.r,a.g,a.b][ch]-[b.r,b.g,b.b][ch]);let total=0;arr.forEach(p=>total+=p.w);let n=0,cut=1;for(let i=0;i<arr.length-1;i++){n+=arr[i].w;if(n>=total/2){cut=i+1;break}}groups.push(arr.slice(0,cut),arr.slice(cut))}
let palette=[];for(const g of groups){let count=0,rs=0,gs=0,bs=0;for(const p of g){count+=p.w;rs+=p.r*p.w;gs+=p.g*p.w;bs+=p.b*p.w}palette.push([Math.round(rs/count),Math.round(gs/count),Math.round(bs/count)])}while(palette.length<256)palette.push(palette[palette.length-1]||[0,0,0]);return palette.slice(0,256)}
function gifLZW(indexed){const clear=256,end=257,bytes=[],dict=new Map();let size=9,next=258,bits=0,bitCount=0;
function emit(code){bits|=code<<bitCount;bitCount+=size;while(bitCount>=8){bytes.push(bits&255);bits>>>=8;bitCount-=8}}
function reset(){dict.clear();size=9;next=258}
reset();emit(clear);let prev=indexed[0];for(let i=1;i<indexed.length;i++){const k=indexed[i],key=prev*256+k;let code=dict.get(key);if(code!==undefined){prev=code;continue}emit(prev);if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++}else{emit(clear);reset()}prev=k}emit(prev);emit(end);if(bitCount>0)bytes.push(bits&255);return new Uint8Array(bytes)}
function putU16(out,v){out.push(v&255,(v>>8)&255)}
function writeGIFHeader(w,h,palette){let out=[71,73,70,56,57,97];putU16(out,w);putU16(out,h);out.push(0xF7,0,0);for(let i=0;i<256;i++)out.push(...palette[i]);out.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(x=>x.charCodeAt(0)),3,1,0,0,0);return out}
function addGIFFrame(chunks,w,h,indexed,delay){const header=[0x21,0xF9,4,0x08];putU16(header,delay);header.push(0,0,0x2C);putU16(header,0);putU16(header,0);putU16(header,w);putU16(header,h);header.push(0,8);chunks.push(new Uint8Array(header));const payload=gifLZW(indexed);for(let p=0;p<payload.length;p+=255){chunks.push(new Uint8Array([Math.min(255,payload.length-p)]));chunks.push(payload.subarray(p,p+255))}chunks.push(new Uint8Array([0]))}
function makeLookup(palette){const lookup=new Int16Array(32768);lookup.fill(-1);return function(r,g,b){let key=((r>>3)<<10)|((g>>3)<<5)|(b>>3),index=lookup[key];if(index!==-1)return index;let best=0,dmin=Infinity;for(let i=0;i<256;i++){const c=palette[i],dr=r-c[0],dg=g-c[1],db=b-c[2],d=dr*dr*.9+dg*dg*1.1+db*db*.8;if(d<dmin){dmin=d;best=i}}lookup[key]=best;return best}}
const dither=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];function indexedFrame(img,palette){const w=img.width,h=img.height,src=img.data,dst=new Uint8Array(w*h),nearest=makeLookup(palette);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x,j=k*4,noise=(dither[((y&3)<<2)|(x&3)]-7.5)*.50,r=clamp(Math.round(src[j]+noise),0,255),g=clamp(Math.round(src[j+1]+noise),0,255),b=clamp(Math.round(src[j+2]+noise),0,255);dst[k]=nearest(r,g,b)}return dst}
function paintGIFFrame(ctx,mode,u,w,h){const scale=w/project.canvas.width;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#211b23';ctx.fillRect(0,0,w,h);ctx.setTransform(scale,0,0,scale,0,0);drawAnimAt(ctx,mode,u);ctx.setTransform(1,0,0,1,0,0)}
function updateExportProgress(fraction,message){const p=$('#exportProgress');if(!p)return;p.classList.add('show');const bar=$('#exportProgressBar'),txt=$('#exportProgressText');if(bar)bar.style.width=Math.round(fraction*100)+'%';if(txt)txt.textContent=message||Math.round(fraction*100)+'%'}
const idle=()=>new Promise(resolve=>setTimeout(resolve,0));
async function saveGIF(){if(exporting)return;exporting=true;$('#gifTopBtn').disabled=true;try{fxTab='export';renderPanels();updateExportProgress(.02,'GIF 렌더링 준비 중…');await idle();const width=Number(exportOptions.gifWidth)||480,height=Math.round(width*project.canvas.height/project.canvas.width),fps=Number(exportOptions.gifFPS)||10,seconds=Math.max(1.5,project.animation.duration/1000),count=Math.max(12,Math.round(seconds*fps)),mode=exportOptions.gifMode;if(width>900||height>1200||count>110)throw Error('GIF 출력 설정이 너무 큽니다.');
const c=offscreen(width,height),ctx=c.getContext('2d',{willReadFrequently:true}),hist=new Uint32Array(32768);for(const u of [0,.17,.35,.52,.72,.90]){paintGIFFrame(ctx,mode,u,width,height);const img=ctx.getImageData(0,0,width,height).data;for(let y=0;y<height;y+=4)for(let x=0;x<width;x+=4){const k=(y*width+x)*4;hist[((img[k]>>3)<<10)|((img[k+1]>>3)<<5)|(img[k+2]>>3)]++}}updateExportProgress(.15,'공통 색상 팔레트 생성 중…');await idle();const palette=medianPalette(hist),chunks=[new Uint8Array(writeGIFHeader(width,height,palette))],delay=Math.max(1,Math.round(100/fps));
for(let i=0;i<count;i++){const u=mode==='reveal'?i/(count-1):i/count;paintGIFFrame(ctx,mode,u,width,height);const pixels=ctx.getImageData(0,0,width,height),indexed=indexedFrame(pixels,palette);addGIFFrame(chunks,width,height,indexed,delay);updateExportProgress(.16+.83*(i+1)/count,`GIF 인코딩 ${i+1} / ${count} 프레임`);await idle()}
chunks.push(new Uint8Array([0x3B]));const blob=new Blob(chunks,{type:'image/gif'});downloadBlob(blob,`BROKEN_REFLECTION_${mode}_${fps}fps.gif`);updateExportProgress(1,'GIF 저장 완료');flash('애니메이션 GIF를 저장했습니다.');setTimeout(()=>$('#exportProgress')?.classList.remove('show'),2800)}catch(e){console.error(e);flash('GIF 저장 실패: '+e.message);updateExportProgress(0,'오류: '+e.message)}finally{exporting=false;$('#gifTopBtn').disabled=false}}
init();
})();
