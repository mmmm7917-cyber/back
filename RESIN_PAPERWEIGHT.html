stroke-width:1.4}.shape.active{border-color:var(--accent);background:#fbefeb}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0}.row:last-child{margin-bottom:0}.row label{font-size:12px}.row output{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:33px;text-align:right}.range{margin:15px 0}.range .row{margin:0 0 7px}input[type=range]{width:100%;accent-color:var(--accent);height:4px;display:block;cursor:pointer}input[type=color]{border:1px solid var(--line);background:white;border-radius:5px;width:34px;height:28px;padding:3px;cursor:pointer}select{border:1px solid var(--line);border-radius:5px;background:white;padding:7px;min-width:110px}input[type=checkbox]{accent-color:var(--accent)}.chips{display:flex;gap:8px;align-items:center}.swatch{width:26px;height:26px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px var(--line);background:var(--c)}.swatch.active{box-shadow:0 0 0 1.5px var(--accent)}.uploads{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.upload{border:1px dashed #cfbcb6;border-radius:7px;display:flex;align-items:center;gap:11px;padding:11px;cursor:pointer;background:#fbf6f1}.upload input{display:none}.upload .icon{width:34px;height:34px;border-radius:50%;background:#f0e5de;display:grid;place-items:center;font-size:19px;color:#9e7975}.upload strong{display:block;font-size:12px;font-weight:500}.upload small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.mini{padding:5px 8px;border:1px solid var(--line);background:white;border-radius:4px;font-size:11px}.hint{font-size:11px;color:var(--muted);line-height:1.7;margin:9px 0 0}.editing{margin-top:15px;padding:12px;border-radius:7px;background:#f6f0e9}.editing .range{margin:12px 0}.editing .range:last-child{margin-bottom:2px}details summary{cursor:pointer;font-size:12px;list-style:none;display:flex;justify-content:space-between}details summary:after{content:'＋';color:var(--muted)}details[open] summary:aft o-top{margin-bottom:12px}.stage{max-width:570px}.exports{margin-top:15px}.under{font-size:10px}footer{display:none}}@media(max-width:520px){aside{display:block;padding:22px}.section{margin-bottom:22px}.studio-top .seg{max-width:210px}.studio-top .seg button{padding:7px 12px}.exports{gap:7px}.save{padding:12px 8px;font-size:12px}.exports select{min-width:75px;width:75px;font-size:11px}.sub{font-size:10px}}

<header><div class="brand"><svg viewBox="0 0 40 44" aria-hidden="true"><path d="M20 12C6 2 0 18 5 30Q11 44 20 38Q31 44 36 27C41 11 29 6 20 12" fill="#e9b9b2"/><path d="M20 13Q18 5 24 2" fill="none" stroke="#a54851" stroke-width="2.3"/><path d="M24 7Q27 1 34 5Q31 11 24 7" fill="#b4bea4"/><path d="M9 17Q5 24 11 31" fill="none" stroke="#fff9" stroke-width="3" stroke-linecap="round"/></svg><div><h1>레진 문진 제작기</h1><div class="sub">모양 · 색 · 작은 조각들</div></div></div><div class="local">이미지는 기기 안에서만 사용돼요</div></header>
<main><aside>
<div class="section"><h2 class="section-title">문진 모양 <span>01</span></h2><div class="shapes" id="shapes">
<button class="shape active" data-shape="apple"><svg viewBox="0 0 50 50"><path d="M25 13C9 2 1 20 9 36Q16 48 25 41Q37 47 43 32C49 12 36 4 25 13Z"/><path d="M25 13Q24 5 29 1M28 7Q35 1 39 5Q36 11 28 7" fill="none"/></svg>사과</button>
<button class="shape" data-shape="oval"><svg viewBox="0 0 50 50"><ellipse cx="25" cy="25" rx="18" ry="22"/></svg>타원</button>
<button class="shape" data-shape="drop"><svg viewBox="0 0 50 50"><path d="M25 3C21 13 6 23 7 33C8 51 44 51 43 31C42 20 28 12 25 3Z"/></svg>물방울</button>
<button class="shape" data-shape="pebble"><svg viewBox="0 0 50 50"><path d="M15 5C29 0 46 13 46 27C46 43 31 48 18 44C0 39 0 14 15 5Z"/></svg>조약돌</button>
</div><div class="row"><label for="layout">구성</label><select id="layout"><option value="solo">1인 · 문진 하나</option><option value="together">2인 · 함께 담기</option><option value="pair">2인 · 문진 두 개</option></select></div></div>
<div class="section"><h2 class="section-title">캐릭터 <span>02</span></h2><div class="uploads"><label class="upload"><input id="fileA" type="file" accept="image/png,image/jpeg,image/webp"><span class="icon">＋</span><span><strong id="nameA">A 이미지 넣기</strong><small>PNG · JPG · WEBP</small></span></label><label class="upload" id="uploadB" hidden><input id="fileB" type="file" accept="image/png,image/jpeg,image/webp"><span class="icon">＋</span><span><strong id="nameB">B 이미지 넣기</strong><small>PNG · JPG · WEBP</small></span></label></div>
<div class="editing"><div class="row" style="margin-top:0"><div class="seg" id="target"><button class="active" data-target="0">A 조절</button><button data-target="1" id="targetB" hidden>B 조절</button></div><button class="mini" id="fit">맞춤</button><button class="mini" id="remove">삭제</button></div><div class="range"><div class="row"><label for="imgScale">그림 크기</label><output id="imgScaleOut"></output></div><input id="imgScale" type="range" min="25" max="220" value="100"></div><div class="range"><div class="row"><label for="imgRot">그림 회전</label><output id="imgRotOut"></output></div><input id="imgRot" type="range" min="-45" max="45" value="0"></div><div class="row"><label><input id="flip" type="checkbox"> 좌우 반전</label></div></div><p class="hint">미리보기에서 그림을 드래그해 위치를 조절하세요.<br>투명 PNG를 넣으면 레진 색이 자연스럽게 비쳐요.</p></div>
<div class="section"><h2 class="section-title">레진 색과 두께 <span>03</span></h2><div class="row"><div class="chips" id="colors"><button class="swatch active" data-color="#e66d7b" style="--c:#e66d7b" aria-label="딸기 분홍"></button><button class="swatch" data-color="#d9a34b" style="--c:#d9a34b" aria-label="꿀빛"></button><button class="swatch" data-color="#94b69e" style="--c:#94b69e" aria-label="세이지"></button><button class="swatch" data-color="#8aadde" style="--c:#8aadde" aria-label="하늘"></button><button class="swatch" data-color="#b9a1d6" style="--c:#b9a1d6" aria-label="라일락"></button></div><input id="resinColor" type="color" value="#e66d7b" aria-label="레진 색 직접 선택"></div><div class="row" id="colorBRow" hidden><label for="resinColorB">B 문진 색</label><input id="resinColorB" type="color" value="#91a7cf"></div><div class="range"><div class="row"><label for="tint">색 농도</label><output id="tintOut"></output></div><input id="tint" type="range" min="0" max="100" value="45"></div><div class="range"><div class="row"><label for="depth">두께</label><output id="depthOut"></output></div><input id="depth" type="range" min="5" max="35" value="20"></div><div class="range"><div class="row"><label for="gloss">표면 광택</label><output id="glossOut"></output></div><input id="gloss" type="range" min="0" max="100" value="65"></div><div class="range"><div class="row"><label for="size">문진 크기</label><output id="sizeOut"></output></div><input id="size" type="range" min="65" max="115" value="95"></div></div>
<div class="section"><details open><summary>봉입 장식</summary><div class="row"><label for="foil">반짝이 종류</label><select id="foil"><option value="silver">은박 조각</option><option value="gold">금박 조각</option><option value="holo">오팔 조각</option><option value="star">작은 별</option><option value="none">없음</option></select></div><div class="range"><div class="row"><label for="flakes">반짝이 양</label><output id="flakesOut"></output></div><input id="flakes" type="range" min="0" max="100" value="35"></div><div class="range"><div class="row"><label for="bubbles">기포</label><output id="bubblesOut"></output></div><input id="bubbles" type="range" min="0" max="100" value="25"></div><div class="row"><label><input type="checkbox" id="flower" checked> 작은 꽃 넣기</label><button class="mini" id="shuffle">장식 재배치</button></div></details></div>
<div class="section"><details><summary>배경과 저장</summary><div class="row"><label for="background">배경</label><select id="background"><option value="ivory">아이보리</option><option value="pink">연분홍</option><option value="sage">세이지</option><option value="white">흰색</option><option value="custom">직접 선택</option><option value="transparent">투명</option></select><input type="color" id="bgColor" value="#f4eee4" aria-label="배경 직접 선택" hidden></div><div class="row"><label for="ratio">화면 비율</label><select id="ratio"><option value="square">정사각형</option><option value="portrait">세로 4:5</option><option value="wide">가로 4:3</option></select></div><div class="row"><label><input type="checkbox" id="shadow" checked> 바닥 그림자</label></div><p class="hint">PNG는 투명 배경을 지원해요.<br>GIF는 3초 반복, 긴 변 600px이며 투명 배경은 흰색으로 저장돼요.</p></details></div>
</aside><section class="studio"><div class="studio-top"><span>미리보기</span><div class="seg" id="views"><button class="active" data-view="front">정면</button><button data-view="angle">비스듬히</button></div></div><div class="stage"><canvas id="canvas" width="1000" height="1000" aria-label="레진 문진 미리보기"></canvas></div><div class="under"><span id="previewHint">이미지를 넣기 전에는 꽃 장식이 보여요.</span><button class="mini" id="animate" aria-pressed="false">▷ 빛 움직임</button></div><div class="exports"><select id="resolution" aria-label="PNG 해상도"><option value="1">PNG 1×</option><option value="2" selected>PNG 2×</option><option value="3">PNG 3×</option></select><button class="save" id="png">PNG 저장</button><button class="save secondary" id="gif">GIF 저장</button></div><progress id="progress" value="0" max="100" hidden></progress><div id="status" role="status" aria-live="polite"></div><footer>레진 문진 제작기</footer></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const S={shape:'apple',layout:'solo',view:'front',resinColor:'#e66d7b',resinColorB:'#91a7cf',tint:45,depth:20,gloss:65,size:95,foil:'silver',flakes:35,bubbles:25,flower:true,background:'ivory',bgColor:'#f4eee4',ratio:'square',shadow:true,seed:42};
const chars=[{img:null,scale:100,rot:0,x:0,y:0,flip:false},{img:null,scale:100,rot:0,x:0,y:0,flip:false}];let selected=0,playing=false,phase=0,busy=false,geometries=[],raf=0;
const paths={apple:new Path2D('M 0 -178 C -67 -220 -168 -205 -192 -123 C -226 -9 -157 171 -77 196 C -40 209 -18 183 0 189 C 27 182 52 211 88 193 C 171 153 221 -26 185 -121 C 155 -202 70 -217 0 -178 Z'),oval:new Path2D('M 0 -230 C 133 -230 195 -130 195 0 C 195 130 133 230 0 230 C -133 230 -195 130 -195 0 C -195 -130 -133 -230 0 -230 Z'),drop:new Path2D('M 0 -244 C -33 -170 -196 -54 -196 65 C -196 264 195 264 195 65 C 195 -56 38 -166 0 -244 Z'),pebble:new Path2D('M -97 -200 C -9 -251 136 -175 192 -91 C 269 26 151 193 33 213 C -76 240 -202 166 -210 45 C -222 -77 -179 -153 -97 -200 Z')};
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dims(){return S.ratio==='portrait'?[1000,1250]:S.ratio==='wide'?[1200,900]:[1000,1000]}
function star(c,x,y,r,a=1){c.save();c.translate(x,y);c.globalAlpha*=a;c.beginPath();for(let i=0;i<8;i++){const t=i*Math.PI/4,rr=i%2?r*.19:r;c.lineTo(Math.cos(t)*rr,Math.sin(t)*rr)}c.closePath();c.fill();c.restore()}
function flower(c,x,y,r,color,angle){c.save();c.translate(x,y);c.rotate(angle);c.strokeStyle='#78937c88';c.lineWidth=1.5;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-8,30,-19,55);c.stroke();for(let i=0;i<7;i++){c.save();c.rotate(i*Math.PI*2/7);c.fillStyle=color;c.beginPath();c.ellipse(0,-r*.62,r*.29,r*.62,0,0,Math.PI*2);c.fill();c.restore()}c.fillStyle='#d9b569';c.beginPath();c.arc(0,0,r*.26,0,Math.PI*2);c.fill();c.restore()}
function composition(w,h){let scale=Math.min(w,h)/680*S.size/100;let y=h*.49;const angle=S.view==='angle'?-.13:0,sy=S.view==='angle'?.78:1;
if(S.layout==='pair'){scale*=.62;return[{x:w*.29,y:y-26,scale,angle:angle-.13,sy,ids:[0],color:S.resinColor},{x:w*.71,y:y+28,scale,angle:angle+.12,sy,ids:[1],color:S.resinColorB}]}return[{x:w*.5,y,scale,angle,sy,ids:S.layout==='together'?[0,1]:[0],color:S.resinColor}]}
function imagePlacement(g,id){const q=chars[id],both=g.ids.length===2;return{x:q.x+(both?(id===0?-77:77):0),y:q.y+8,baseW:both?190:300,baseH:330}}
function drawChar(c,g,id){const q=chars[id],p=imagePlacement(g,id);if(!q.img)return;c.save();c.translate(p.x,p.y);c.rotate(q.rot*Math.PI/180);c.scale(q.flip?-1:1,1);const k=Math.min(p.baseW/q.img.width,p.baseH/q.img.height)*q.scale/100;c.drawImage(q.img,-q.img.width*k/2,-q.img.height*k/2,q.img.width*k,q.img.height*k);c.restore()}
function drawResin(c,g,t){const p=paths[S.shape],color=g.color,d=S.depth;c.save();c.translate(g.x,g.y);c.rotate(g.angle);c.scale(g.scale,g.scale*g.sy);
if(S.shadow){c.save();c.translate(7,d+13);c.shadowColor='rgba(80,49,39,.22)';const shadowScale=Math.hypot(c.getTransform().a,c.getTransform().b);c.shadowBlur=25*shadowScale;c.shadowOffsetY=18*shadowScale;c.fillStyle='rgba(119,91,74,.10)';c.fill(p);c.restore()}
// Transparent body: stacked edge and colored optical rim.
for(let j=d;j>=1;j-=2){c.save();c.translate(j*.16,j);let edge=c.createLinearGradient(-220,-80,220,180);edge.addColorStop(0,'rgba(255,255,255,.30)');edge.addColorStop(.24,rgba(color,.13));edge.addColorStop(.63,'rgba(141,137,150,.12)');edge.addColorStop(.86,rgba(color,.22));edge.addColorStop(1,'rgba(255,255,255,.4)');c.strokeStyle=edge;c.lineWidth=4;c.stroke(p);c.restore()}
c.save();c.clip(p);let body=c.createLinearGradient(0,-230,35,250);body.addColorStop(0,rgba(color,.30+S.tint*.006));body.addColorStop(.3,rgba(color,.06+S.tint*.003));body.addColorStop(.65,rgba('#ffffff',.10));body.addColorStop(1,rgba(color,.12+S.tint*.005));c.fillStyle=body;c.fillRect(-260,-270,520,560);
let glow=c.createRadialGradient(-90,-130,10,-90,-130,390);glow.addColorStop(0,'#ffffff55');glow.addColorStop(.55,'#ffffff00');glow.addColorStop(1,rgba(color,.24));c.fillStyle=glow;c.fillRect(-260,-270,520,560);
const random=rng(S.seed+g.ids[0]*849);const empty=g.ids.every(id=>!chars[id].img);
if(empty&&S.flower){flower(c,-35,-30,43,'#fffdf1',-.16);flower(c,50,46,31,'#fff7e6',.5);flower(c,-64,91,20,'#f9e1df',-.5);c.save();c.strokeStyle='#8d9a7788';c.lineWidth=2;c.beginPath();c.moveTo(22,126);c.quadraticCurveTo(66,10,90,-67);c.stroke();for(let j=0;j<5;j++){c.fillStyle='#96a58577';c.beginPath();c.ellipse(70+j*5,30-j*20,17,5,-.6,0,Math.PI*2);c.fill()}c.restore()}
for(const id of g.ids)drawChar(c,g,id);
if(S.flower&&!empty){flower(c,-125,119,21,'#fffcef',-.4);flower(c,112,141,15,'#fff4e5',.6)}
