<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강박적 반복 — Take ∞</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d10;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#e8e4dc;padding:10px}
#vn-container{position:relative;width:100%;max-width:800px;aspect-ratio:16/10;min-height:460px;background:#111418;overflow:hidden;border:1px solid #2a3036;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none}
@media (max-width:600px){#vn-container{aspect-ratio:3/4.4;min-height:560px}}

/* ===== 상단 바 ===== */
#topbar{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));z-index:30;font-size:11px;letter-spacing:.08em;color:#b9c4c6}
#topbar .ch{font-weight:700;color:#e9d6b8}
#topbar .pl{flex:1;text-align:center;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#topbar .tk{font-family:"Courier New",monospace;color:#ff6b5b;font-weight:700}
#topbar .tk::before{content:"● ";animation:rec 1.2s steps(2) infinite}
@keyframes rec{0%{opacity:1}50%{opacity:0}}

/* ===== 장면 ===== */
#scene{position:absolute;inset:0;background:#15191e center/cover no-repeat}
#scene .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
#scene .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.25) 0%,rgba(8,10,14,.15) 45%,rgba(8,10,14,.85) 100%)}
#vn-container.flash #scene .bgimg{filter:sepia(.75) contrast(1.05) brightness(.85)}
#vn-container.flash #scene::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,240,210,.04) 0 2px,transparent 2px 4px);pointer-events:none;animation:grain .25s steps(3) infinite}
@keyframes grain{0%{transform:translateY(0)}33%{transform:translateY(-1px)}66%{transform:translateY(1px)}}
.scene-in{animation:sceneIn 1s ease-out both}
@keyframes sceneIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}

/* ===== 스탠딩 (캐릭터 이미지) ===== */
#stage{position:absolute;left:0;right:0;bottom:24%;height:66%;display:flex;justify-content:center;align-items:flex-end;gap:4%;z-index:5;pointer-events:none}
.sp{position:relative;height:100%;display:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.sp img{height:100%;width:auto;display:block}
.sp.on{display:block;animation:spIn .7s ease-out both}
@keyframes spIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.sp.dim{filter:brightness(.45) saturate(.6) drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.sp.talk{animation:talk .35s ease-out both}
@keyframes talk{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
#sp-child{height:68%}
#sp-child img{filter:sepia(.55) brightness(1.05)}
@media (max-width:600px){#stage{height:52%;bottom:30%}}

/* ===== 대화창 ===== */
#dialog{position:absolute;left:3%;right:3%;bottom:3%;min-height:28%;background:linear-gradient(180deg,rgba(14,18,22,.80),rgba(10,12,15,.92));border:1px solid rgba(233,214,184,.25);border-radius:4px;padding:22px 20px 16px;z-index:20;cursor:pointer;backdrop-filter:blur(3px)}
#dialog.dimmed{opacity:.35}
#nameplate{position:absolute;top:-14px;left:16px;padding:4px 16px;font-size:13px;font-weight:700;letter-spacing:.12em;background:#e9d6b8;color:#1b1e22;border-radius:2px;display:none}
#nameplate.on{display:block;animation:np .3s ease-out both}
@keyframes np{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
#nameplate.rowan{background:#e7c79c;color:#26322f}
#nameplate.elliot{background:#2a3b5c;color:#e7ecf5}
#nameplate.child{background:#efe2c6;color:#5a4a30}
#nameplate.other{background:#6b7177;color:#f1f1f1}
#text{font-size:15.5px;line-height:1.85;min-height:3.6em;white-space:pre-wrap;word-break:keep-all}
#text.narr{color:#cfd3d4}
#text.inner{font-style:italic;color:#aab8d0}
#next{position:absolute;right:14px;bottom:8px;font-size:12px;color:#e9d6b8;display:none;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ===== 선택지 ===== */
#choices{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:25;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.7));padding:0 8%}
#choices.on{display:flex;animation:fadeIn .4s ease-out both}
#choices .who{font-size:11px;letter-spacing:.35em;color:#8fa3c7;margin-bottom:4px}
.choice{width:100%;max-width:460px;padding:13px 18px;font-size:14.5px;font-family:inherit;color:#e8ecf3;background:linear-gradient(90deg,rgba(28,38,60,.92),rgba(20,24,32,.92));border:1px solid rgba(143,163,199,.45);border-left:3px solid #8fa3c7;border-radius:2px;cursor:pointer;text-align:left;word-break:keep-all;animation:chIn .45s ease-out both}
.choice:nth-child(3){animation-delay:.08s}.choice:nth-child(4){animation-delay:.16s}.choice:nth-child(5){animation-delay:.24s}
.choice:hover{border-left-color:#e9d6b8;background:linear-gradient(90deg,rgba(40,52,78,.95),rgba(24,28,36,.95))}
.choice:active{transform:scale(0.95)}
.choice.secret{border-left-color:#ff6b5b;color:#ffd9d3}
@keyframes chIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== 슬레이트(장면 전환) ===== */
#slate{position:absolute;inset:0;background:#050607;z-index:40;display:none;flex-direction:column;justify-content:center;align-items:center;gap:10px;font-family:"Courier New",monospace}
#slate.on{display:flex;animation:slate 1.9s ease-in-out both}
@keyframes slate{0%{opacity:0}18%{opacity:1}80%{opacity:1}100%{opacity:0}}
#slate .clap{width:120px;height:16px;background:repeating-linear-gradient(135deg,#eee 0 12px,#111 12px 24px);transform-origin:left bottom;animation:clap 1.9s ease-in-out both}
@keyframes clap{0%,20%{transform:rotate(-18deg)}32%,100%{transform:rotate(0)}}
#slate .s1{font-size:12px;letter-spacing:.4em;color:#9aa3a8}
#slate .s2{font-size:20px;letter-spacing:.12em;color:#efe6d6;font-family:inherit;text-align:center;padding:0 20px}
#slate .s3{font-size:12px;letter-spacing:.3em;color:#ff6b5b}

/* ===== 타이틀 / 엔딩 ===== */
.screen{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#1d2630 0%,#07090b 75%)}
.screen.on{display:flex;animation:fadeIn .9s ease-out both}
.screen h1{font-size:34px;letter-spacing:.32em;font-weight:300;color:#efe6d6;margin-bottom:8px}
.screen .sub{font-size:12px;letter-spacing:.35em;color:#8fa3c7;margin-bottom:26px}
.screen .quote{font-size:13px;line-height:1.9;color:#a9b0b4;max-width:460px;margin-bottom:28px;word-break:keep-all}
.screen .btn{padding:11px 34px;font-family:"Courier New",monospace;font-size:14px;letter-spacing:.3em;color:#111;background:#e9d6b8;border:none;border-radius:2px;cursor:pointer;margin:5px}
.screen .btn.ghost{background:transparent;color:#e9d6b8;border:1px solid #e9d6b8}
.screen .btn:active{transform:scale(0.95)}
.screen .end-k{font-size:11px;letter-spacing:.5em;color:#ff6b5b;margin-bottom:10px}
.screen .end-t{font-size:26px;letter-spacing:.2em;color:#efe6d6;margin-bottom:16px}
.screen .end-d{font-size:13px;line-height:1.9;color:#a9b0b4;max-width:440px;margin-bottom:24px;word-break:keep-all}
.screen .tally{font-family:"Courier New",monospace;font-size:11px;color:#6d777d;margin-top:14px;letter-spacing:.15em}
</style>
</head>

 ["N","실비아는 웃었다. 놀란 기색이 없었다."],
 ["Y","또 먼저 갔구나. 걔 어릴 때도 그랬어요. 내가 일어나기도 전에 먼저 울었어. 남들은 천재라고 했는데… 나는 그게 늘 마음에 걸렸어요."],
 ["Y","혹시 다음에 보면 전해 줄래요? 다음 달 GV, 나는 간다고. 이번엔 컷 없이 보자고."],
 ["N","실비아가 다시 올라갔다. 엘리엇은 그 말을 전할 수 있을지 몰랐다. 로완은 내일 또 이 계단에 올 것이고, 엘리엇은 또 ‘가’라고 말할지도 몰랐다."],
 ["N","엘리엇은 어둠 속에서 휴대폰을 꺼냈다. 〈정류장〉을 틀었다. 여덟 살 로완이 버스를 향해 손을 뻗었다."],
 ["N","한 번 더."],
 ["N","그리고 내일도, 아마 같은 계단에서."]
],end:{k:"ENDING · NG",t:"한 번 더",d:"보내 주는 것도, 기다리는 것도 결국 같은 장면을 다시 찍는 일이었다.<br>— 아직 고르지 않은 대사가 하나 남아 있다.",loop:true}}
};

/* ================= 오디오 (Web Audio) ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,type,vol,when){const a=ac();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function blip(who){const base={rowan:196,elliot:262,child:392,other:160}[who]||140;tone(base+Math.random()*18,.045,who?"square":"triangle",who?.028:.022);}
function sfxChoice(){tone(523,.08,"triangle",.06);tone(784,.14,"triangle",.05,.07);}
function sfxClap(){const a=ac();if(!a)return;const len=a.sampleRate*.12,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource(),g=a.createGain();g.gain.value=.25;s.buffer=b;s.connect(g).connect(a.destination);s.start(a.currentTime+.55);}
function sfxEnd(){[392,330,262,196].forEach((f,i)=>tone(f,.5,"sine",.05,i*.22));}

/* ================= 엔진 ================= */
const $=id=>document.getElementById(id);
const C=$("vn-container"),TXT=$("text"),NP=$("nameplate"),NX=$("next"),CH=$("choices");
let take=1,node=null,lines=[],li=0,typing=false,timer=null,full="",locked=false,ctx={};

function setTop(){ $("tb-tk").textContent="TAKE "+String(take).padStart(2,"0"); }
function setBg(key){
  const b=BG[key]; if(!b) return;
  const el=document.querySelector("#scene .bgimg");
  el.style.backgroundImage="url('"+b.u+"'),"+b.f;
  const sc=$("scene"); sc.classList.remove("scene-in"); void sc.offsetWidth; sc.classList.add("scene-in");
}
function setCast(cast){
  ["rowan","elliot","child"].forEach(k=>{const s=$("sp-"+k);s.classList.remove("on","dim","talk");if(cast&&cast.includes(k)){void s.offsetWidth;s.classList.add("on");}});
}
function setLong(){}

function goto(id){
  const n=STORY[id]; if(!n) return;
  const enter=()=>{
    node=n;
    if(n.ch){ctx.ch=n.ch;$("tb-ch").textContent=n.ch;}
    if(n.pl){ctx.pl=n.pl;$("tb-pl").textContent=n.pl;}
    if(n.bg && n.bg!==ctx.bg){ctx.bg=n.bg;setBg(n.bg);}
    if("flash" in n || n.ch){ C.classList.toggle("flash",!!n.flash); }
    if(n.cast){ctx.cast=n.cast;setCast(n.cast);}
    if(n.ch) setLong(!!n.long);
    lines=n.lines.filter(l=>!(l[2]&&l[2].c)||l[2].c(take));
    li=0; showLine();
  };
  if(n.slate){ slate(n.slate,enter); } else enter();
}
function slate(s,cb){
  locked=true;
  $("sl-1").textContent=s[0]; $("sl-2").textContent=s[1]; $("sl-3").textContent="TAKE "+String(take).padStart(2,"0");
  const el=$("slate"); el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); sfxClap();
  setTimeout(cb,900);
  el.onanimationend=e=>{ if(e.target===el){el.classList.remove("on");locked=false;} };
}
function showLine(){
  const L=lines[li]; if(!L){ return endNode(); }
  const [k,t,o]=L, sp=SPK[k];
  NX.style.display="none";
  TXT.className="";
  if(sp){NP.textContent=sp[0];NP.className="on "+sp[1];}else{NP.className="";NP.textContent="";TXT.classList.add("narr");}
  if(o&&o.i) TXT.classList.add("inner");
  // 말하는 캐릭터 강조
  const who=sp?sp[1]:null;
  ["rowan","elliot","child"].forEach(c=>{const s=$("sp-"+c);if(!s.classList.contains("on"))return;s.classList.remove("talk");if(who&&who!=="other"){s.classList.toggle("dim",c!==who);if(c===who){void s.offsetWidth;s.classList.add("talk");}}else s.classList.remove("dim");});
  full=t; TXT.textContent=""; typing=true; let i=0;
  clearInterval(timer);
  timer=setInterval(()=>{
    i++; TXT.textContent=full.slice(0,i);
    if(i%2===0 && full[i-1]!==" ") blip(who);
    if(i>=full.length){clearInterval(timer);typing=false;NX.style.display="block";}
  },34);
}
function advance(){
  if(locked || CH.classList.contains("on")) return;
  ac();
  if(typing){clearInterval(timer);TXT.textContent=full;typing=false;NX.style.display="block";return;}
  li++; showLine();
}
function endNode(){
  if(node.choices){
    $("dialog").classList.add("dimmed");
    CH.innerHTML='';
    node.choices.filter(c=>!c.c||c.c(take)).forEach(c=>{
      const b=document.createElement("button"); b.className="choice"+(c.secret?" secret":""); b.textContent=c.t;
      b.onclick=ev=>{ev.stopPropagation();sfxChoice();CH.classList.remove("on");$("dialog").classList.remove("dimmed");goto(c.go);};
      CH.appendChild(b);
    });
    CH.classList.add("on");
  } else if(node.next){ goto(node.next); }
  else if(node.end){ showEnd(node.end); }
}
function showEnd(e){
  sfxEnd();
  $("end-k").textContent=e.k; $("end-t").textContent=e.t; $("end-d").innerHTML=e.d;
  $("btn-again").textContent=e.loop?("TAKE "+String(take+1).padStart(2,"0")+" — 한 번 더"):"처음부터 다시 (한 번 더)";
  $("end-tally").textContent="이번 촬영: TAKE "+String(take).padStart(2,"0")+" · 다시 볼 때마다 테이크 수가 올라갑니다";
  const s=$("ending"); s.classList.remove("on"); void s.offsetWidth; s.classList.add("on");
}
function start(){
  ac(); ctx={};
  $("title").classList.remove("on"); $("ending").classList.remove("on");
  setTop(); goto("stair1");
}
$("btn-start").onclick=e=>{e.stopPropagation();start();};
$("btn-again").onclick=e=>{e.stopPropagation();take++;start();};
$("dialog").addEventListener("click",advance);
$("scene").addEventListener("click",advance);
document.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!$("title").classList.contains("on")&&!$("ending").classList.contains("on"))advance();}});
setBg("stair");
</script>
