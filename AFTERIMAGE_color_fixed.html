<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERIMAGE — 잔상 공방</title><style>
:root{color-scheme:dark;--bg:#0b0d13;--panel:#151923;--soft:#202634;--line:#343b4b;--txt:#edf0f8;--dim:#a3aabd;--accent:#b9a1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13px system-ui,'Malgun Gothic',sans-serif}button,input,select{font:inherit}button,select,input[type=number],input[type=text]{background:var(--soft);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#7351ca;border-color:#9e82f6}button:disabled{opacity:.45;cursor:wait}input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{height:34px;width:100%;background:transparent;border:0}input[type=file]{max-width:100%;font-size:11px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 18px;gap:8px;flex-wrap:wrap}header strong{font-size:20px;letter-spacing:3px}header small{color:var(--dim)}.app{display:grid;grid-template-columns:260px minmax(300px,1fr) 280px;min-height:calc(100vh - 64px)}aside{background:var(--panel);padding:15px;overflow:auto;border-right:1px solid var(--line)}aside.right{border-right:0;border-left:1px solid var(--line)}h2{font-size:13px;letter-spacing:1px;margin:4px 0 14px}h3{font-size:12px;margin:18px 0 9px;color:var(--accent)}.field{margin:9px 0}.field label{display:flex;align-items:center;justify-content:space-between;color:var(--dim);margin-bottom:5px;font-size:12px}.field input:not([type=range]):not([type=color]):not([type=file]),.field select{width:100%}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons>*{flex:1}.layer{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer}.layer.active{border-color:var(--accent);background:#302943}.layer small{display:block;color:var(--dim);margin-top:3px}.layer button{padding:4px 8px}.center{min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}.viewport{display:flex;align-items:center;justify-content:center;flex:1;min-height:390px;background:repeating-conic-gradient(#1c202a 0 25%,#191d26 0 50%) 50%/24px 24px;border:1px solid var(--line);border-radius:10px;overflow:hidden}canvas{max-width:100%;max-height:68vh;object-fit:contain;touch-action:none;cursor:grab;box-shadow:0 14px 40px #0008}canvas:active{cursor:grabbing}.timeline{background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:10px}.transport{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.transport input{flex:1;min-width:100px}.transport span{font-variant-numeric:tabular-nums;color:var(--dim);min-width:115px}.note{color:var(--dim);font-size:11px;line-height:1.6}#status{min-height:18px;color:var(--accent);font-size:12px}.presetgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.presetgrid button.active{background:#433568;border-color:var(--accent)}.divider{height:1px;background:var(--line);margin:15px 0}.hide{display:none!important}footer{padding:6px 18px;color:#778197;font-size:10px}@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}aside.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 20px}.right h2,.right .wide{grid-column:1/-1}}@media(max-width:680px){.app{display:flex;flex-direction:column}.center{order:0;padding:8px}.viewport{min-height:280px}aside{order:1;border:0;border-top:1px solid var(--line)}aside.right{order:2;display:block}.viewport canvas{max-height:55vh}header{padding:10px}header strong{font-size:16px}}
</style></head><body><header><div><strong>AFTERIMAGE</strong> </div><div class="buttons"><button id="reset">초기화</button><button id="saveProject">JSON 저장</button><button id="loadProject">JSON 불러오기</button><input class="hide" type="file" id="projectFile" accept=".json,application/json"></div></header><main class="app"><aside><h2>이미지 · 레이어</h2><div class="field"><label>캐릭터 1 · PNG</label><input type="file" id="upload1" accept="image/png"></div><div class="field"><label>캐릭터 2 · PNG</label><input type="file" id="upload2" accept="image/png"></div><div id="layers"></div><div class="buttons"><button id="centerLayer">선택 레이어 중앙</button><button id="removeLayer">선택 삭제</button></div><h3>잔상 스타일</h3><div class="presetgrid" id="presets"></div><h3>페어 모드</h3><div class="field"><select id="pair"><option value="SYNC">SYNC · 동기</option><option value="DELAY">DELAY · 시간차</option><option value="CROSS">CROSS · 교차</option><option value="MIRROR">MIRROR · 대칭</option></select></div><div class="field"><label>잔상 개수 <output id="countVal"></output></label><input type="range" id="count" min="1" max="16" value="6"></div><div class="field"><label>잔상 간격 <output id="spreadVal"></output></label><input type="range" id="spread" min="0" max="100" value="26"></div><div class="field"><label>잔상 강도 <output id="strengthVal"></output></label><input type="range" id="strength" min="0" max="100" value="65"></div><h3>배경</h3><div class="field"><select id="bgmode"><option value="solid">단색</option><option value="transparent">투명</option><option value="grid">그래픽 그리드</option></select></div><div class="field"><label>배경 색</label><input type="color" id="bgcolor" value="#11121b"></div></aside><section class="center"><div class="viewport"><canvas id="canvas" width="800" height="800" aria-label="작업 캔버스"></canvas></div><div class="timeline"><div class="transport"><button id="play" class="primary">▶ 재생</button><button id="stop">■</button><input id="scrub" type="range" min="0" max="3000" value="0"><span id="time">0.00 / 3.00s</span></div><div class="twocol"><div class="field"><label>재생 길이 (초)</label><select id="duration"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></div><div class="field"><label>GIF FPS</label><select id="fps"><option value="10">10</option><option value="12" selected>12</option></select></div></div><div class="buttons"><button id="png">PNG 저장</button><button id="gif" class="primary">GIF 저장</button></div><div id="status"></div></div></section><aside class="right"><h2>선택 레이어 속성</h2><div class="field wide"><label>이름</label><input id="name" type="text" placeholder="레이어 이름"></div><div class="twocol wide"><div class="field"><label>X</label><input type="number" id="x" step="1"></div><div class="field"><label>Y</label><input type="number" id="y" step="1"></div></div><div class="field"><label>크기 · 원본 비율 유지 <output id="scaleVal"></output></label><input type="range" id="scale" min="10" max="350" value="100"></div><div class="field"><label>회전 <output id="rotationVal"></output></label><input type="range" id="rotation" min="-180" max="180" value="0"></div><div class="field"><label>불투명도 <output id="opacityVal"></output></label><input type="range" id="opacity" min="0" max="100" value="100"></div><h3>레이어별 모션</h3><div class="field"><label>이동 거리 <output id="distanceVal"></output></label><input type="range" id="distance" min="0" max="220" value="42"></div><div class="field"><label>이동 각도 <output id="angleVal"></output></label><input type="range" id="angle" min="-180" max="180" value="0"></div><div class="field"><label>흔들림 각도 <output id="swingVal"></output></label><input type="range" id="swing" min="0" max="35" value="4"></div><div class="field"><label>모션 시간차 <output id="delayVal"></output></label><input type="range" id="delay" min="0" max="1500" value="0"></div><div class="field"><label>모션 보간</label><select id="ease"><option value="sine">부드럽게</option><option value="linear">일정하게</option><option value="spring">탄성</option><option value="step">계단식</option></select></div><div class="field"><label><input type="checkbox" id="visible" checked> 레이어 표시</label></div><div class="divider"></div></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id), C=$('canvas'),ctx=C.getContext('2d',{willReadFrequently:true}),W=800,H=800;
const styles=['ECHO','RGB SHIFT','STROBE','DRIFT','FRACTURE','ORBIT','PHANTOM','SIGNAL LOSS'];
const state={layers:[],selected:null,style:'ECHO',pair:'SYNC',count:6,spread:26,strength:65,bgmode:'solid',bgcolor:'#11121b',duration:3,fps:12,t:0,playing:false};
let stamp=0,drag=null,working=false;
function current(){return state.layers.find(l=>l.id===state.selected)}
function imageFor(src){return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function newLayer(src,img,n){const max=Math.max(img.width,img.height);return {id:Math.random().toString(36).slice(2),name:'캐릭터 '+n,src,img,x:n===1?320:480,y:400,scale:Math.min(1,420/max)*100,rotation:0,opacity:100,distance:42,angle:0,swing:4,delay:0,ease:'sine',visible:true}}
async function upload(file,n){if(!file)return;if(file.type!=='image/png'){setStatus('PNG 파일만 지원해.');return}const reader=new FileReader();reader.onload=async()=>{try{let src=reader.result,img=await imageFor(src);let previous=state.layers[n-1];let layer=newLayer(src,img,n);if(previous){layer.x=previous.x;layer.y=previous.y;state.layers[n-1]=layer}else state.layers.splice(n-1,0,layer);state.selected=layer.id;refresh()}catch(e){setStatus('이미지 파일을 읽을 수 없어.')}};reader.readAsDataURL(file)}
$('upload1').onchange=e=>upload(e.target.files[0],1);$('upload2').onchange=e=>upload(e.target.files[0],2);
function setStatus(s){$('status').textContent=s}
function wrap(x,m){return((x%m)+m)%m}
function easeValue(v,type){if(type==='linear')return v;if(type==='step')return Math.floor(v*6)/6;if(type==='spring')return Math.sin(v*Math.PI*2)*(1+.16*Math.sin(v*Math.PI*6));return Math.sin(v*Math.PI*2)}
function pos(l,t,index){let d=state.duration,phase=wrap((t*1000-l.delay)/1000,d)/d,second=index===1;let p=phase;if(second&&state.pair==='DELAY')p=wrap(p-.17,1);if(second&&state.pair==='MIRROR')p=1-p;let a=easeValue(p,l.ease),factor=state.pair==='CROSS'?(second?-1:1):state.pair==='MIRROR'?(second?-1:1):1;let r=l.angle*Math.PI/180;return {x:l.x+Math.cos(r)*l.distance*a*factor,y:l.y+Math.sin(r)*l.distance*a,rotation:l.rotation+Math.sin(p*Math.PI*2)*l.swing*factor,phase:p}}
function drawImage(l,x,y,rotation,scale,alpha,filter='none',sx=0,sy=0,sw=null,sh=null){if(!l.img)return;ctx.save();ctx.translate(x,y);ctx.rotate(rotation*Math.PI/180);let sc=scale/100;ctx.scale(sc,sc);ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.filter=filter;let im=l.img; if(sw==null)ctx.drawImage(im,-im.width/2,-im.height/2);else ctx.drawImage(im,sx,sy,sw,sh,-im.width/2+sx,-im.height/2+sy,sw,sh);ctx.restore()}
function paintBackground(){if(state.bgmode==='transparent'){ctx.clearRect(0,0,W,H);return}ctx.fillStyle=state.bgcolor;ctx.fillRect(0,0,W,H);if(state.bgmode==='grid'){ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;for(let i=0;i<=800;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}}}
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);paintBackground();state.layers.forEach((l,li)=>{if(!l.visible||!l.img)return;let p=pos(l,t,li),base=l.opacity/100,n=state.count,s=state.spread,mag=state.strength/100,rot=p.rotation;let dx=Math.cos(l.angle*Math.PI/180),dy=Math.sin(l.angle*Math.PI/180);for(let j=n;j>=1;j--){let k=j/n,alpha=base*mag*(1-k*.75)*.62;let x=p.x-dx*j*s*.48,y=p.y-dy*j*s*.48;let rr=rot-j*.7;let sz=l.scale;switch(state.style){case'ECHO':drawImage(l,x,y,rr,sz,alpha);break;case'RGB SHIFT':drawImage(l,p.x-j*s*.38,p.y,rot,sz,alpha*.72,'sepia(1) saturate(7) hue-rotate(290deg)');drawImage(l,p.x+j*s*.38,p.y,rot,sz,alpha*.65,'sepia(1) saturate(9) hue-rotate(135deg)');break;case'STROBE':if(Math.floor(t*state.fps)%4!==0||j%3===0)drawImage(l,x,y,rr,sz,alpha*.9);break;case'DRIFT':drawImage(l,x,y,rr,sz,alpha*.37,'blur('+(j*.65)+'px)');break;case'FRACTURE':{let strips=8,sw=l.img.width,sh=l.img.height/strips;for(let q=0;q<strips;q++){let shift=Math.sin(q*9.31+j*4.2+t*8)*j*s*.23;drawImage(l,p.x+shift,p.y,rot,sz,alpha,'none',0,q*sh,sw,sh)}break}case'ORBIT':{let a=j/n*Math.PI*1.5+t*2*Math.PI/state.duration;drawImage(l,p.x+Math.cos(a)*s*j*.55,p.y+Math.sin(a)*s*j*.55,rot+j*3,sz,alpha);break}case'PHANTOM':drawImage(l,p.x-j*s*.29,p.y+j*s*.10,rot,sz*(1+k*.35),alpha*.62,'grayscale(1)');break;case'SIGNAL LOSS':{let strips=12,sw=l.img.width,sh=l.img.height/strips;for(let q=0;q<strips;q++){if((q+j+Math.floor(t*12))%5===0)continue;let shift=Math.sin(j*7+q*11+Math.floor(t*12))*s*j*.26;drawImage(l,p.x+shift,p.y,rot,sz,alpha,'none',0,q*sh,sw,sh)}break}}}drawImage(l,p.x,p.y,rot,l.scale,base)})}
function layersUI(){let box=$('layers');box.innerHTML='';for(let l of state.layers){let item=document.createElement('div');item.className='layer'+(l.id===state.selected?' active':'');item.innerHTML='<div><strong></strong><small></small></div><button title="표시 전환">'+(l.visible?'◉':'○')+'</button>';item.querySelector('strong').textContent=l.name;item.querySelector('small').textContent=l.img.width+' × '+l.img.height;item.onclick=()=>{state.selected=l.id;refresh()};item.querySelector('button').onclick=e=>{e.stopPropagation();l.visible=!l.visible;refresh()};box.append(item)}if(!state.layers.length)box.textContent='PNG를 업로드해 시작해.'}
const fields=['name','x','y','scale','rotation','opacity','distance','angle','swing','delay','ease','visible'];
function fieldsUI(){let l=current();for(let key of fields){$(key).disabled=!l;if(!l)continue;$(key)[key==='visible'?'checked':'value']=l[key];}for(let key of ['scale','rotation','opacity','distance','angle','swing','delay'])$(key+'Val').textContent=l?l[key]+({scale:'%',rotation:'°',opacity:'%',distance:'px',angle:'°',swing:'°',delay:'ms'}[key]):'—';}
for(let key of fields){$(key).addEventListener(key==='name'?'change':'input',()=>{let l=current();if(!l)return;l[key]=key==='name'||key==='ease'?$(key).value:key==='visible'?$(key).checked:Number($(key).value);if(key==='name')layersUI();fieldsUI();render(state.t)})}
function refresh(){layersUI();fieldsUI();document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('active',b.dataset.style===state.style));for(let key of ['pair','count','spread','strength','bgmode','bgcolor','duration','fps'])$(key).value=state[key];for(let key of ['count','spread','strength'])$(key+'Val').textContent=state[key];$('scrub').max=state.duration*1000;$('scrub').value=state.t*1000;updateTime();render(state.t)}
for(let key of ['pair','count','spread','strength','bgmode','bgcolor','duration','fps'])$(key).addEventListener('input',()=>{state[key]=['pair','bgmode','bgcolor'].includes(key)?$(key).value:Number($(key).value);if(key==='duration')state.t=Math.min(state.t,state.duration);refresh()});
for(let s of styles){let b=document.createElement('button');b.textContent=s;b.dataset.style=s;b.onclick=()=>{state.style=s;refresh()};$('presets').append(b)}
function updateTime(){$('time').textContent=state.t.toFixed(2)+' / '+state.duration.toFixed(2)+'s'}
$('scrub').oninput=()=>{state.t=Number($('scrub').value)/1000;render(state.t);updateTime()};
function tick(ts){if(state.playing){if(!stamp)stamp=ts;state.t=wrap((ts-stamp)/1000,state.duration);$('scrub').value=state.t*1000;updateTime();render(state.t)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('play').onclick=()=>{state.playing=!state.playing;if(state.playing)stamp=performance.now()-state.t*1000;$('play').textContent=state.playing?'❚❚ 일시정지':'▶ 재생'};
$('stop').onclick=()=>{state.playing=false;state.t=0;stamp=0;$('play').textContent='▶ 재생';refresh()};
$('centerLayer').onclick=()=>{let l=current();if(l){l.x=400;l.y=400;refresh()}};$('removeLayer').onclick=()=>{state.layers=state.layers.filter(l=>l.id!==state.selected);state.selected=state.layers[0]?.id||null;refresh()};
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
$('png').onclick=()=>{render(state.t);C.toBlob(b=>b?download(b,'AFTERIMAGE.png'):setStatus('PNG 저장 실패'),'image/png')};
$('saveProject').onclick=()=>{let data={version:1,settings:Object.fromEntries(['style','pair','count','spread','strength','bgmode','bgcolor','duration','fps'].map(k=>[k,state[k]])),layers:state.layers.map(({img,...l})=>l)};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'AFTERIMAGE-project.json')};
$('loadProject').onclick=()=>$('projectFile').click();$('projectFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.layers)||data.layers.length>2)throw Error('지원하지 않는 프로젝트');let layers=[];for(let l of data.layers){if(typeof l.src!=='string'||!l.src.startsWith('data:image/png;base64,'))throw Error('PNG 데이터 오류');layers.push({...l,img:await imageFor(l.src),id:Math.random().toString(36).slice(2)})}Object.assign(state,data.settings);state.layers=layers;state.selected=layers[0]?.id||null;state.t=0;state.playing=false;$('play').textContent='▶ 재생';refresh();setStatus('프로젝트를 불러왔어.')}catch(err){setStatus('불러오기 실패: '+err.message)}e.target.value=''};
$('reset').onclick=()=>{state.layers=[];state.selected=null;state.style='ECHO';state.pair='SYNC';state.count=6;state.spread=26;state.strength=65;state.bgmode='solid';state.bgcolor='#11121b';state.duration=3;state.fps=12;state.t=0;state.playing=false;$('play').textContent='▶ 재생';$('upload1').value='';$('upload2').value='';refresh()};
function pointerPosition(e){let rect=C.getBoundingClientRect(),scale=Math.min(rect.width/W,rect.height/H),left=rect.left+(rect.width-W*scale)/2,top=rect.top+(rect.height-H*scale)/2;return{x:(e.clientX-left)/scale,y:(e.clientY-top)/scale}}
C.addEventListener('pointerdown',e=>{let p=pointerPosition(e),best=null;for(let i=state.layers.length-1;i>=0;i--){let l=state.layers[i];if(!l.visible)continue;let w=l.img.width*l.scale/100,h=l.img.height*l.scale/100;if(Math.abs(p.x-l.x)<w/2&&Math.abs(p.y-l.y)<h/2){best=l;break}}if(best){state.selected=best.id;drag={id:best.id,x:p.x-best.x,y:p.y-best.y};C.setPointerCapture(e.pointerId);layersUI();fieldsUI()}});
C.addEventListener('pointermove',e=>{if(!drag)return;let p=pointerPosition(e),l=current();if(l&&l.id===drag.id){l.x=Math.round(p.x-drag.x);l.y=Math.round(p.y-drag.y);fieldsUI();render(state.t)}});C.addEventListener('pointerup',()=>drag=null);C.addEventListener('pointercancel',()=>drag=null);
// GIF89a: a single image-wide color palette, learned from all animation frames.
// Sampling every fourth pixel keeps processing predictable without changing the rendered frame.
function paletteFromFrames(rawFrames){
  const counts=new Uint32Array(32768),rs=new Float64Array(32768),gs=new Float64Array(32768),bs=new Float64Array(32768);
  let seen=0;
  for(let fi=0;fi<rawFrames.length;fi++){
    const raw=rawFrames[fi];
    for(let p=((fi%4)*4);p<raw.length;p+=16){
      if(raw[p+3]<128)continue;
      const r=raw[p],g=raw[p+1],b=raw[p+2],k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
      counts[k]++;rs[k]+=r;gs[k]+=g;bs[k]+=b;seen++;
    }
  }
  const active=[];
  for(let k=0;k<32768;k++)if(counts[k])active.push(k);
  const entries=new Uint8Array(256*3);
  if(!active.length)return entries;
  const getBox=ids=>{
    let sum=0,r=0,g=0,b=0,r2=0,g2=0,b2=0,rlo=255,glo=255,blo=255,rhi=0,ghi=0,bhi=0;
    for(const k of ids){let n=counts[k],cr=rs[k]/n,cg=gs[k]/n,cb=bs[k]/n;
      sum+=n;r+=rs[k];g+=gs[k];b+=bs[k];r2+=cr*cr*n;g2+=cg*cg*n;b2+=cb*cb*n;
      if(cr<rlo)rlo=cr;if(cr>rhi)rhi=cr;
      if(cg<glo)glo=cg;if(cg>ghi)ghi=cg;
      if(cb<blo)blo=cb;if(cb>bhi)bhi=cb;
    }
    const variance=[Math.max(0,r2-r*r/sum)*.85,Math.max(0,g2-g*g/sum)*1.15,Math.max(0,b2-b*b/sum)*.8];
    return {ids,sum,r,g,b,variance,priority:ids.length>1?variance[0]+variance[1]+variance[2]:0};
  };
  const boxes=[getBox(active)];
  while(boxes.length<255){
    let which=-1,highest=0;
    for(let i=0;i<boxes.length;i++)if(boxes[i].priority>highest){highest=boxes[i].priority;which=i}
    if(which<0)break;
    const box=boxes[which];let axis=box.variance.indexOf(Math.max(...box.variance));

    for(let i=0;i<box.ids.length-1;i++){running+=counts[box.ids[i]];cut=i+1;if(running>=box.sum/2)break}
    if(cut===0||cut===box.ids.length)break;
    const left=getBox(box.ids.slice(0,cut)),right=getBox(box.ids.slice(cut));

  boxes.sort((a,b)=>b.sum-a.sum);

}
function quantizeFrame(raw,palette){
  const mapped=new Uint8Array(raw.length/4),lut=new Uint16Array(32768);
  for(let i=0,j=0;i<raw.length;i+=4,j++){
    if(raw[i+3]<128){mapped[j]=0;continue}
    const r=raw[i],g=raw[i+1],b=raw[i+2],key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
    let index=lut[key];
    if(!index){let best=Infinity;
      for(let k=1;k<256;k++){
        const a=k*3,dr=r-palette[a],dg=g-palette[a+1],db=b-palette[a+2];
        const distance=3*dr*dr+5*dg*dg+2*db*db;
        if(distance<best){best=distance;index=k;if(!best)break}
      }
      lut[key]=index;
    }
    mapped[j]=index;
  }
  return mapped;
}
function gifEncode(frames,w,h,delay,palette){
  const bytes=[];
  const u16=n=>{bytes.push(n&255,(n>>8)&255)};
  const ascii=s=>{for(let i=0;i<s.length;i++)bytes.push(s.charCodeAt(i))};
  ascii('GIF89a');u16(w);u16(h);bytes.push(0xf7,0,0);
  for(let i=0;i<256*3;i++)bytes.push(palette[i]);
  bytes.push(0x21,0xff,11);ascii('NETSCAPE2.0');bytes.push(3,1,0,0,0);
  for(const pixels of frames){
    bytes.push(0x21,0xf9,4,0x09);u16(delay);bytes.push(0,0);
    bytes.push(0x2c);u16(0);u16(0);u16(w);u16(h);bytes.push(0,8);
    const compressed=lzw(pixels);
    for(let i=0;i<compressed.length;i+=255){const sub=compressed.subarray(i,i+255);bytes.push(sub.length,...sub)}
    bytes.push(0);
  }
  bytes.push(0x3b);
  return new Blob([new Uint8Array(bytes)],{type:'image/gif'});
}
function lzw(pixels){
  // GIF LZW code-width growth is delayed by one dictionary insertion on the decoder.
  const clear=256,end=257,dict=new Map();let next=258,size=9,acc=0,bits=0,out=[];
  function code(n){acc|=n<<bits;bits+=size;while(bits>=8){out.push(acc&255);acc>>>=8;bits-=8}}
  function reset(){dict.clear();next=258;size=9}
  code(clear);let prev=pixels[0];
  for(let i=1;i<pixels.length;i++){
    const cur=pixels[i],key=prev*256+cur;
    if(dict.has(key)){prev=dict.get(key)}
    else{
      code(prev);
      if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++}
      else{code(clear);reset()}
      prev=cur;
    }
  }
  code(prev);code(end);if(bits)out.push(acc&255);
  return new Uint8Array(out);
}
$('gif').onclick=async()=>{
  if(working)return;
  working=true;
  const btn=$('gif');btn.disabled=true;
  const original=state.t,play=state.playing;
  state.playing=false;$('play').textContent='▶ 재생';
  try{
    const fps=state.fps,total=Math.round(state.duration*fps),w=480,h=480;
    const off=document.createElement('canvas');off.width=w;off.height=h;
    const o=off.getContext('2d',{willReadFrequently:true});
    const rawFrames=[];
    for(let i=0;i<total;i++){
      render(i/fps);
      o.clearRect(0,0,w,h);
      o.drawImage(C,0,0,w,h);
      rawFrames.push(o.getImageData(0,0,w,h).data);
      setStatus('GIF 프레임 '+(i+1)+' / '+total);
      if(i%3===0)await new Promise(r=>setTimeout(r,0));
    }
    setStatus('GIF 색상 처리 중');
    const palette=paletteFromFrames(rawFrames);
    const frames=[];
    for(let i=0;i<rawFrames.length;i++){
      frames.push(quantizeFrame(rawFrames[i],palette));
      if(i%3===0)await new Promise(r=>setTimeout(r,0));
    }
    const gif=gifEncode(frames,w,h,Math.round(100/fps),palette);
    download(gif,'AFTERIMAGE.gif');
    setStatus('GIF 저장 완료');
  }catch(e){console.error(e);setStatus('GIF 저장 오류: '+e.message)}
  finally{
    state.t=original;state.playing=play;
    if(play)stamp=performance.now()-state.t*1000;
    $('play').textContent=play?'❚❚ 일시정지':'▶ 재생';
    btn.disabled=false;working=false;refresh();
  }
};
