<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>너 때문에 용량 부족</title><style>
*{box-sizing:border-box}body{margin:0;color:#433750;background:#f5f1f9;font:14px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}header{padding:24px 32px;border-bottom:1px solid #dcd3e6;background:#fffafc;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;letter-spacing:-1px;margin:0}header span{font-size:12px;color:#897594}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:26px;max-width:1480px;margin:auto;padding:26px}aside{display:flex;flex-direction:column;gap:12px}section{background:#fff;border:1px solid #e1d7e9;border-radius:13px;padding:17px}h2{font-size:13px;margin:0 0 14px;color:#8d64a1}label{display:block;font-size:12px;margin:11px 0 5px}input,select,textarea{font:inherit;color:inherit;width:100%;background:#faf8fc;border:1px solid #ded4e7;border-radius:6px;padding:9px}input[type=checkbox]{width:auto;accent-color:#9c6db2}input[type=color]{padding:3px;height:36px}input[type=range]{padding:0}textarea{resize:vertical;min-height:66px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.checks{display:grid;grid-template-columns:1fr 1fr}.checks label{display:flex;gap:5px;align-items:center;font-size:11px}button{font:inherit;cursor:pointer;background:#fff;border:1px solid #cbb8d8;border-radius:6px;color:#674779;padding:10px 13px}button:hover{background:#f0e5f8}button:disabled{opacity:.4;cursor:wait}.primary{background:#9462ae;color:white;border-color:#9462ae}.primary:hover{background:#81529a}.viewer{position:sticky;top:20px;align-self:start;min-width:0}.screen{padding:15px;background:#e6dceF;border:1px solid #c8b6d8;border-radius:17px;box-shadow:0 9px 0 #d7c9e3}canvas{display:block;width:100%;height:auto;border:1px solid #7f678f;border-radius:7px;touch-action:none}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 12px}.tools button{flex:1;white-space:nowrap}.timeline{display:flex;align-items:center;gap:12px;background:white;border-radius:10px;padding:12px}.timeline input{flex:1}.timeline output{min-width:44px;text </style><header><h1>너 때문에 용량 부족</h1><span>사진 · 저장 공간 · 정리</span></header><main><aside><section><h2>01 / 캐릭터</h2><label>A · 컴퓨터 주인</label><input id="nameA" value="캐릭터 A" maxlength="16"><input id="imgA" type="file" accept="image/*"><label>B · 쌓이는 사진</label><input id="nameB" value="캐릭터 B" maxlength="16"><input id="imgB" type="file" accept="image/*"><label>구성</label><select id="direction"><option value="AB">A의 컴퓨터에 B 사진</option><option value="BA">B의 컴퓨터에 A 사진</option><option value="both">두 사람 사진 함께</option><option value="solo">1인 · A</option></select><label>사진 추가</label><input id="gallery" type="file" accept="image/*" multiple><button id="clearGallery" style="margin-top:8px">추가 사진 비우기</button></section><section><h2>02 / 파일이 쌓이는 방식</h2><label>증식 방식</label><select id="mode"><option value="photo">사진 파일 복사</option><option value="windows">사진창 연속 열기</option><option value="folder">폴더가 부풀기</option></select><label>배치</label><select id="layout"><option value="scatter">흩어 쌓기</option><option value="grid">정렬해서 쌓기</option><option value="cascade">계단처럼 쌓기</option></select><label>최대 사진 수 <output id="countOut">18</output></label><input id="count" type="range" min="8" max="30" value="18"><label>사진 크기</label><input id="photoSize" type="range" min="70" max="125" value="100"><label>디스크 용량</label><select id="capacity"><option value="256">256 MB</option><option value="512" selected>512 MB</option><option value="1024">1 GB</option></select><label>폴더 이름</label><input id="program" value="사진 보관함" maxlength="18"><label>용량 부족 알림</label><input id="message" value="사진을 더 저장할 공간이 없어요." maxlength="30"></section><section><h2>03 / 정리 방법</h2><label>결말</label><select id="ending"><option value="zip">압축해서 보관</option><option value="shared">공동 폴더로 정리</option><option value="expand">저장 공간 늘리기</option><option value="keep">정리하지 않기</option></select><label>압축 후 크기</label><input id="ratio" type="range" min="10" max="50" value="25"><div class="row"><div><label>배경</label><input id="before" type="color" value="#c7bce3"></div><div><label>창 색상</label><input id="accent" type="color" value="#eac1d7"></div></div><label>배경 패턴</label><select id="pattern"><option value="grid">격자</option><option value="dots">도트</option><option value="plain">단색</option></select><input id="radius" type="hidden" value="9"><label><input id="labels" type="checkbox" checked>이름 표시</label></section></aside><div class="viewer"><div class="screen"><canvas id="cv" width="1000" height="750"></canvas></div><div class="tools"><button id="play" class="primary">자동 재생</button><button id="add">사진 추가</button><button id="full">용량 부족</button><button id="finish">정리하기</button><button id="reset">처음으로</button></div><div class="timeline"><span id="phase">저장 전</span><input id="seek" type="range" min="0" max="1000" value="0"></div><section class="export"><div class="row"><div><label>길이</label><select id="duration"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div><label>프레임</label><select id="fps"><option>10</option><option selected>12</option></select></div><div><label>PNG 해상도</label><select id="scale"><option value="2">2×</option><option value="3">3×</option></select></div></div><label><input id="transparent" type="checkbox">PNG 투명 배경</label><div class="row"><button id="png">PNG 저장</button><button id="gif" class="primary">GIF 저장</button></div><div id="status" role="status" aria-live="polite"></div></section></div></main><script>
const $=id=>document.getElementById(id),val=id=>$(id).value,ck=id=>$(id).checked,cv=$('cv'),ctx=cv.getContext('2d'),imgs={A:null,B:null};let extras=[],t=0,playing=false,start=0,busy=false,manual=false,hits=[];const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function rr(c,x,y,w,h,r=8,fill='#fff',stroke='#705674'){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke()}}
function txt(c,s,x,y,size=16,color='#493750',align='left'){c.font=`${size>=24?'600 ':''}${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;c.fillStyle=color;c.textAlign=align;c.fillText(s,x,y);c.textAlign='left'}
function name(k){return val('name'+k)||k}function fit(c,k,x,y,w,h){let im=imgs[k];if(im){let s=Math.min(w/im.width,h/im.height);c.drawImage(im,x+(w-im.width*s)/2,y+(h-im.height*s)/2,im.width*s,im.height*s)}else{c.fillStyle=k==='A'?'#b8a0da':'#e6a8c3';c.beginPath();c.arc(x+w/2,y+h*.3,Math.min(w,h)*.2,0,7);c.fill();c.beginPath();c.ellipse(x+w/2,y+h*.7,w*.28,h*.22,0,0,7);c.fill();txt(c,k,x+w/2,y+h*.36,26,'#fff','center')}}
function card(c,k,x,y,w=140,h=172){rr(c,x+4,y+5,w,h,7,'#82698d',null);rr(c,x,y,w,h,7,'#fff8fc');fit(c,k,x+10,y+8,w-20,h-35);if(ck('labels'))txt(c,name(k),x+w/2,y+h-12,13,'#6f547f','center')}
function win(c,title,x,y,w,h){rr(c,x+5,y+6,w,h,+val('radius'),'#80638c',null);rr(c,x,y,w,h,+val('radius'),'#fff8fc');rr(c,x,y,w,36,+val('radius'),val('accent'));txt(c,title,x+15,y+24,15);txt(c,'−   □   ×',x+w-82,y+24,15)}
function button(c,s,x,y,w,fn){rr(c,x,y,w,34,5,'#fff');txt(c,s,x+w/2,y+23,14,'#60446f','center');hits.push({x,y,w,h:34,fn})}

function storage(u){let count=+val('count'),n=Math.floor(clamp(u/.60)*count),capacity=+val('capacity'),ending=val('ending'),r=clamp((u-.76)/.16),base=Math.round(capacity*.18),unit=(capacity-base)/count;let used=base+n*unit,total=capacity;if(u>.76){if(ending==='zip')used=capacity+(base+(capacity-base)*(+val('ratio')/100)-capacity)*r;if(ending==='shared')used=capacity+(base+(capacity-base)*.65-capacity)*r;if(ending==='expand')total=capacity*(1+2*r)}return{n,count,capacity,total,used:Math.round(used),r,ratio:clamp(used/total),ending}}
function folder(c,x,y,w,h,label,zip=false){rr(c,x,y,w*.43,24,6,'#d5b6e2');rr(c,x,y+17,w,h-17,9,zip?'#f4dba7':'#f4c9dd');if(zip){c.fillStyle='#b28b70';c.fillRect(x+w*.48,y+18,10,h-20);for(let j=24;j<h;j+=12){c.fillStyle='#fff2d4';c.fillRect(x+w*.48,y+j,6,5)}}txt(c,label,x+w/2,y+h+23,15,'#674c79','center')}
function imageAt(c,i,k,x,y,w,h){let im=extras.length?extras[i%extras.length]:imgs[k];if(im){let sc=Math.min(w/im.width,h/im.height);c.drawImage(im,x+(w-im.width*sc)/2,y+(h-im.height*sc)/2,im.width*sc,im.height*sc)}else fit(c,k,x,y,w,h)}
function photo(c,i,k,x,y,w,h,windows){rr(c,x+4,y+5,w,h,6,'#82698d',null);rr(c,x,y,w,h,6,'#fff9fc');if(windows){rr(c,x,y,w,23,5,val('accent'));txt(c,'사진_'+String(i+1).padStart(2,'0')+'.png',x+8,y+16,10);imageAt(c,i,k,x+6,y+29,w-12,h-48)}else imageAt(c,i,k,x+7,y+7,w-14,h-30);if(ck('labels'))txt(c,name(k),x+w/2,y+h-9,11,'#765a82','center')}
function render(c,u,opt={}){hits=[];c.clearRect(0,0,1000,750);let s=storage(u),host=val('direction')==='BA'?'B':'A',guest=val('direction')==='BA'||val('direction')==='solo'?'A':'B',settle=s.r,mode=val('mode');if(!opt.transparent){c.fillStyle=val('before');c.fillRect(0,0,1000,750);c.strokeStyle='#ffffff55';c.fillStyle='#ffffff88';if(val('pattern')!=='plain')for(let x=0;x<1000;x+=35)for(let y=0;y<750;y+=35){if(val('pattern')==='grid')c.strokeRect(x,y,35,35);else{c.beginPath();c.arc(x,y,1.5,0,7);c.fill()}}}txt(c,name(host)+'의 컴퓨터',952,40,18,'#654674','right');card(c,host,30,55,108,136);folder(c,45,280,112,98,val('program'));if(mode==='folder'){let w=140+s.n/s.count*190;folder(c,390-w/2,290-w*.22,w,w*.75,val('program'));txt(c,s.n+'개 파일',390,500,21,'#654674','center')}
let max=mode==='folder'?Math.min(s.n,8):s.n;for(let i=0;i<max;i++){let k=val('direction')==='both'?(i%2?'A':'B'):guest,w=112*(+val('photoSize')/100),h=w*1.2,x,y;if(val('layout')==='grid'){x=200+i%6*123;y=75+Math.floor(i/6)*116;w*=.8;h*=.8}else if(val('layout')==='cascade'){x=210+(i%12)*41;y=70+(i%12)*32}else{x=185+((i*197+67)%650);y=64+((i*131+33)%400)}if(mode==='folder'){x=205+i*65;y=90+(i%2)*60;w*=.7;h*=.7}let alpha=1;if(u>.76&&s.ending!=='keep'&&s.ending!=='expand'){let z=clamp(settle*1.5-i/s.count*.5);x+=(510-x)*z;y+=(360-y)*z;alpha=1-z;w*=1-z*.7;h*=1-z*.7}c.save();c.globalAlpha=alpha;photo(c,i,k,x,y,w,h,mode==='windows');c.restore()}
if(u>=.60&&u<.76){win(c,'저장 공간 부족',285,200,440,230);txt(c,val('message'),505,287,18,'#754a68','center');txt(c,'남은 공간 0 MB',505,326,16,'#a0657e','center');button(c,'정리하기',385,365,110,()=>playAt(.76));button(c,'그대로 두기',520,365,110,()=>{$('ending').value='keep';t=.99;playing=false})}
if(u>.76&&s.ending==='zip'){c.save();c.globalAlpha=settle;folder(c,440,230,160,190,val('program')+'.zip',true);txt(c,Math.round((1-(+val('ratio')/100))*100)+'% 압축',520,485,22,'#72537f','center');c.restore()}if(u>.76&&s.ending==='shared'){c.save();c.globalAlpha=settle;win(c,val('program'),290,160,470,345);card(c,host,320,215,175,220);card(c,guest,550,215,175,220);txt(c,'중복 파일 정리 완료',525,478,15,'#72537f','center');c.restore()}if(u>.76&&s.ending==='expand'){win(c,'새 저장 장치',350,190,360,190);rr(c,390,246,80,65,7,'#dcc4e8');txt(c,'+',430,291,40,'#846096','center');txt(c,'저장 공간 3배',555,290,22,'#72537f','center')}if(u>.76&&s.ending==='keep'){win(c,'저장하지 못한 파일',355,220,360,170);txt(c,'사진은 그대로 보관합니다.',535,308,18,'#72537f','center')}
win(c,'저장 공간',200,555,750,130);let color=s.ratio>.9?'#d68d9f':'#ad8bc5';rr(c,225,608,690,20,5,'#e9dceb',null);rr(c,225,608,690*s.ratio,20,5,color,null);txt(c,s.used+' / '+Math.round(s.total)+' MB',225,662,15,'#72537f');txt(c,Math.round(s.ratio*100)+'% 사용',915,662,15,color,'right');rr(c,0,707,1000,43,0,'#f5eaf8');button(c,'시작',12,712,78,()=>{t=0;playing=false});txt(c,s.n+'개 파일',125,738,14);txt(c,'12:00',965,738,14,'#72537f','right')}
function playAt(v){t=v;playing=true;start=performance.now()-v*+val('duration')*1000;$('play').textContent='일시 정지'}function tick(now){if(!busy){if(playing)t=((now-start)/1000/+val('duration'))%1;render(ctx,t);$('seek').value=Math.round(t*1000);$('countOut').value=val('count');$('phase').textContent=t<.6?'사진 복사':t<.76?'용량 부족':'정리 결과'}requestAnimationFrame(tick)}$('play').onclick=()=>{if(playing){playing=false;$('play').textContent='자동 재생'}else playAt(t)};$('add').onclick=()=>{playing=false;t=Math.min(.60,t+.60/+val('count'))};$('full').onclick=()=>{playing=false;t=.65};$('finish').onclick=()=>playAt(.76);$('reset').onclick=()=>{playing=false;t=0;$('play').textContent='자동 재생'};$('seek').oninput=()=>{playing=false;t=+val('seek')/1000};
function loadFile(f){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(f),im=new Image;im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 읽을 수 없어요.'))};im.src=url})}for(let k of ['A','B'])$('img'+k).onchange=async e=>{if(e.target.files[0])try{imgs[k]=await loadFile(e.target.files[0])}catch(err){$('status').textContent=err.message}};$('gallery').onchange=async e=>{try{extras=await Promise.all([...e.target.files].map(loadFile));$('status').textContent=extras.length+'장 추가'}catch(err){$('status').textContent=err.message}};$('clearGallery').onclick=()=>{extras=[];$('gallery').value='';$('status').textContent='추가 사진 비움'};cv.onpointerdown=e=>{if(busy)return;let b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*1000/b.width,y=(e.clientY-b.top)*750/b.height;[...hits].reverse().find(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)?.fn?.()};function download(b,n){let a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}$('png').onclick=()=>{let c=document.createElement('canvas'),sc=+val('scale');c.width=1000*sc;c.height=750*sc;let g=c.getContext('2d');g.scale(sc,sc);render(g,t,{transparent:ck('transparent')});c.toBlob(b=>{download(b,'STORAGE_FULL.png');$('status').textContent='PNG 저장 완료'})};
function palette(hist){let bins=[];for(let i=0;i<32768;i++)if(hist[i])bins.push({r:((i>>10)&31)*8+4,g:((i>>5)&31)*8+4,b:(i&31)*8+4,n:hist[i]});let boxes=[bins];while(boxes.length<256){let best=-1,score=-1,axis='r';for(let i=0;i<boxes.length;i++){let b=boxes[i];if(b.length<2)continue;let n=0,mins=[255,255,255],maxs=[0,0,0];for(let p of b){n+=p.n;['r','g','b'].forEach((k,j)=>{mins[j]=Math.min(mins[j],p[k]);maxs[j]=Math.max(maxs[j],p[k])})}let ranges=maxs.map((v,j)=>v-mins[j]),range=Math.max(...ranges),v=range*Math.sqrt(n);if(v>score){score=v;best=i;axis=['r','g','b'][ranges.indexOf(range)]}}if(best<0)break;let b=boxes[best];b.sort((a,d)=>a[axis]-d[axis]);let total=b.reduce((s,p)=>s+p.n,0),n=0,j=0;for(;j<b.length-1;j++){n+=b[j].n;if(n>=total/2)break}j=Math.min(j,b.length-2);boxes.splice(best,1,b.slice(0,j+1),b.slice(j+1))}let pal=[];for(let b of boxes){let n=0,r=0,g=0,bl=0;for(let p of b){n+=p.n;r+=p.r*p.n;g+=p.g*p.n;bl+=p.b*p.n}pal.push([Math.round(r/n),Math.round(g/n),Math.round(bl/n)])}while(pal.length<256)pal.push([0,0,0]);return pal}

function lzw(data){let out=[],acc=0,bits=0;const put=v=>{acc|=v<<bits;bits+=9;while(bits>=8){out.push(acc&255);acc>>>=8;bits-=8}};let dict=new Map,next=258;put(256);let prefix=data[0];for(let i=1;i<data.length;i++){let k=data[i],key=prefix*256+k,v=dict.get(key);if(v!==undefined)prefix=v;else{put(prefix);if(next<500)dict.set(key,next++);else{put(256);dict.clear();next=258}prefix=k}}put(prefix);put(257);if(bits)out.push(acc&255);return out}
