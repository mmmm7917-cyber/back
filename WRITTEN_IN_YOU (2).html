<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WRITTEN IN YOU — 너로 쓰인 얼굴</title>
<style>
:root{--cream:#f7f3e9;--ivory:#eee9dd;--ink:#302a2b;--wine:#8d4055;--line:#d9d0c5;--soft:#e9d6d8}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#e9e5df;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:13px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}input,select,textarea{outline-color:#a46778}input[type=range]{accent-color:var(--wine);width:100%}input[type=color]{width:46px;height:32px;padding:2px;border:1px solid var(--line);background:white;border-radius:6px;cursor:pointer}input[type=text],input[type=date],select,textarea{width:100%;border:1px solid #d9d0c6;background:#fffdf9;border-radius:6px;padding:9px 10px;color:#30292b;min-width:0}textarea{resize:vertical;min-height:112px;line-height:1.7}label{display:block}small{color:#817877}.shell{display:grid;grid-template-columns:365px minmax(0,1fr);height:100dvh;min-height:580px}.sidebar{overflow-y:auto;background:#f8f6f0;border-right:1px solid #d3c8bf;scrollbar-color:#c3a8aa transparent}.brand{padding:28px 22px 18px;border-bottom:1px solid var(--line)}.eyebrow{letter-spacing:.19em;color:var(--wine);font:600 10px Georgia,serif}.brand h1{font:normal 26px Georgia,'Noto Serif',serif;margin:9px 0 7px;letter-spacing:-.035em}.brand p{font-size:12px;color:#756c6b;margin:0}.panel{padding:17px 20px;border-bottom:1px solid #e5ddd5}.panel h2{font-size:13px;font-weight:700;margin:0 0 15px;display:flex;align-items:center;gap:10px}.panel h2 span{font:normal 12px Georgia;color:#a5707b}.control{margin:11px 0}.control>label,.control .topline{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.control .topline output{font:12px Georgia;color:#9a6474}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.buttons{display:flex;gap:5px}.choice{min-width:0;flex:1;border:1px solid #d8cbc6;background:#fffaf5;color:#6d6061;border-radius:6px;padding:9px 7px;text-align:center;font-size:12px}.choice.active{background:#733c4b;border-color:#733c4b;color:white}.upload{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:10px;padding:9px;background:#fffaf4;border:1px dashed #c9b6b4;border-radius:9px}.thumb{width:54px;height:54px;background:#efebe4;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#b49a9d;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.upload .pick{background:#e9dde0;border:0;border-radius:6px;padding:6px 8px;font-size:11px;color:#6c3c4a}.tinybtn{border:0;background:none;color:#94777c;font-size:11px;padding:5px}.rangegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rangegrid .control{margin:8px 0}.toggleline{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}.toggleline input{accent-color:#814757}.rule{border:0;border-top:1px solid #e9e0d9;margin:17px 0}.hint{line-height:1.6;font-size:11px;color:#87797a;margin:8px 0}.badge{display:inline-block;font-size:10px;background:#e9dadc;color:#824b5e;padding:3px 6px;border-radius:4px}.stage{min-width:0;display:flex;flex-direction:column;padding:20px 24px 18px;gap:13px;overflow:auto;background:radial-gradient(circle at 60% 10%,#f7f1e9,#e5dfda 75%)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar strong{font-size:13px}.tabs{display:flex;gap:5px}.tab{border:1px solid #d1c3be;background:rgba(255,255,255,.48);padding:9px 13px;border-radius:6px;color:#776c6b;font-size:12px}.tab.active{background:#523744;color:#fff;border-color:#523744}.previewWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.canvasFrame{width:min(100%,calc((100dvh - 190px) * 1.3889));max-width:1120px;position:relative;box-shadow:0 20px 44px #3d29262b,0 3px 8px #3d292615;background:white;border:7px solid #fff8f1}#preview{display:block;width:100%;height:auto;touch-action:none;cursor:grab}#preview.dragging{cursor:grabbing}.actions{max-width:1120px;width:100%;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.action{border:1px solid #cdb9b5;background:#fffbf6;padding:12px 19px;border-radius:7px;color:#543f45;font-weight:600}.action.primary{background:#713e4e;border-color:#713e4e;color:white}.action:focus-visible,.choice:focus-visible,.tab:focus-visible{outline:2px solid #c48792}.status{font-size:12px;color:#7b6870;margin-right:auto;min-width:170px}.exportopts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#ffffff7d;border:1px solid #d8d0c9;padding:9px 12px;border-radius:7px;font-size:12px}.exportopts select{width:auto;min-width:100px;padding:5px}.exportopts label{display:flex;align-items:center;gap:5px}.progress{height:5px;background:#ded1ce;overflow:hidden;border-radius:6px;display:none;max-width:1120px;width:100%;margin:0 auto}.progress>div{height:100%;background:#92576b;width:0;transition:width .2s}.footnote{max-width:1120px;width:100%;margin:0 auto;color:#82777a;font-size:11px}.hidden{display:none!important}@media(max-width:930px){.shell{height:auto;display:flex;flex-direction:column}.stage{order:0;padding:15px 12px;min-height:0;overflow:visible}.sidebar{order:1;overflow:visible;border-right:0;border-top:1px solid #ddd0ca}.brand{padding:18px 20px}.canvasFrame{width:100%;border-width:4px}.previewWrap{min-height:0}.actions{justify-content:center}.status{flex-basis:100%;min-width:0}.action{flex:1;padding:12px 6px}.tab{padding:9px 10px}.toolbar strong{display:none}.panel{padding:16px 20px}}@media(max-width:380px){.tab{padding:8px 7px;font-size:11px}.rangegrid{gap:4px}}
</style>
</head>
<body>
<main class="shell">
 <aside class="sidebar">
  <header class="brand"><div class="eyebrow">편지 · 문자 초상</div><h1>WRITTEN IN YOU</h1><p>너로 쓰인 얼굴 · 편지와 문자 초상 제작기</p></header>
  <section class="panel"><h2><span>01</span> 캐릭터</h2>
   <div class="control"><label>인원</label><div class="buttons"><button class="choice active" data-choose="count" data-value="1">1인</button><button class="choice" data-choose="count" data-value="2">2인</button></div></div>
   <div class="control pairOnly hidden"><label>편지 관계</label><div class="buttons"><button class="choice active" data-choose="relation" data-value="one">A의 편지로 A 초상</button><button class="choice" data-choose="relation" data-value="mutual">각자의 편지로 각자 초상</button></div></div>
   <div id="charControls"></div>
  </section>
  <section class="panel"><h2><span>02</span> 편지</h2>
   <div id="letterControls"></div>
   <div class="control"><label>강조할 단어·문장</label><input type="text" data-key="highlight" placeholder="선택 사항"></div>
   <div class="control"><label>지울 문장</label><input type="text" data-key="erase" placeholder="편지에 포함된 문장"></div>
   <div class="control"><label>편지 날짜 <small>비워 두면 표시 안 함</small></label><input type="text" data-key="date" placeholder=""></div>
   <div class="control"><label>서명 <small>비워 두면 표시 안 함</small></label><input type="text" data-key="signature" placeholder=""></div>
  </section>
  <section class="panel"><h2><span>03</span> 문자 초상</h2>
   <div class="control"><label>문자 종류</label><select data-key="charStyle"><option value="letter">편지 문장</option><option value="name">이름 반복</option><option value="ascii">표준 기호</option><option value="fine">세밀한 기호</option><option value="number">숫자</option><option value="binary">이진수</option></select></div>
   <div class="rangegrid"><div class="control"><div class="topline">글자 크기 <output id="out-fontSize">12</output></div><input type="range" min="8" max="21" step="1" data-key="fontSize"></div><div class="control"><div class="topline">문자 밀도 <output id="out-density">100%</output></div><input type="range" min="60" max="140" step="5" data-key="density"></div><div class="control"><div class="topline">명암 대비 <output id="out-contrast">120%</output></div><input type="range" min="50" max="200" step="5" data-key="contrast"></div><div class="control"><div class="topline">반반 경계 <output id="out-split">50%</output></div><input type="range" min="15" max="85" step="5" data-key="split"></div></div>
   <label class="toggleline"><input type="checkbox" data-key="originalColor"> 원본 색상을 글자색에 반영</label><label class="toggleline"><input type="checkbox" data-key="invert"> 글자 명암 반전</label><label class="toggleline"><input type="checkbox" data-key="boldHighlight" checked> 강조 문구 굵게</label>
   <div class="row2"><div class="control"><label>잉크색</label><input type="color" data-key="ink"></div><div class="control"><label>강조색</label><input type="color" data-key="accent"></div></div>
  </section>
  <section class="panel"><h2><span>04</span> 편지지</h2>
   <div class="control"><label>디자인</label><select data-key="paper"><option value="classic">기본 편지지</option><option value="type">타자기 원고</option><option value="dark">검은 편지</option></select></div>
   <div class="control pairOnly hidden"><label>페어 배치</label><select data-key="layout"><option value="side">나란히</option><option value="spread">펼친 편지</option><option value="one">하나의 편지</option></select></div>
   <div class="row3"><div class="control"><label>종이색</label><input type="color" data-key="paperColor"></div><div class="control"><label>바깥 배경</label><input type="color" data-key="backColor"></div><div class="control"><label>테두리색</label><input type="color" data-key="borderColor"></div></div>
   <div class="control"><div class="topline">안쪽 여백 <output id="out-margin">36</output></div><input type="range" min="12" max="70" step="2" data-key="margin"></div>
   <label class="toggleline"><input type="checkbox" data-key="lines" checked> 편지 줄 표시</label><label class="toggleline"><input type="checkbox" data-key="border" checked> 종이 테두리 표시</label><label class="toggleline"><input type="checkbox" data-key="senderThumb"> 작성자 작은 이미지 표시 (2인 단방향)</label>
  </section>
  <section class="panel"><h2><span>05</span> 애니메이션</h2>
   <div class="control"><label>연출</label><select data-key="motion"><option value="main">편지가 초상이 되기까지</option><option value="unsent">미발송</option><option value="swap">각자의 편지 (서로에게 전용)</option></select></div>
   <div class="control"><label>최종 장면</label><select data-key="reveal"><option value="original">원본 이미지 공개</option><option value="ascii">문자 초상 유지</option><option value="split">반반 전환</option></select></div>
   <div class="rangegrid"><div class="control"><div class="topline">타이핑 속도 <output id="out-speed">100%</output></div><input type="range" min="60" max="180" step="10" data-key="speed"></div><div class="control"><div class="topline">이동 강도 <output id="out-flight">100%</output></div><input type="range" min="30" max="180" step="10" data-key="flight"></div><div class="control"><div class="topline">강조 시점 <output id="out-emphasis">70%</output></div><input type="range" min="10" max="100" step="5" data-key="emphasis"></div><div class="control"><div class="topline">마지막 유지 <output id="out-hold">0.3초</output></div><input type="range" min="0" max="1.2" step="0.1" data-key="hold"></div></div>
   <label class="toggleline"><input type="checkbox" data-key="cursor" checked> 타이핑 커서</label><label class="toggleline"><input type="checkbox" data-key="loop" checked> 미리보기 반복</label>
  </section>
 </aside>
 <section class="stage">
  <div class="toolbar"><strong>실시간 미리보기</strong><div class="tabs"><button class="tab" data-stage="letter">편지 화면</button><button class="tab active" data-stage="portrait">문자 초상</button><button class="tab" data-stage="final">완성 화면</button><button class="tab" data-stage="animation">애니메이션</button></div></div>
  <div class="previewWrap"><div class="canvasFrame"><canvas id="preview" width="1000" height="720" aria-label="편지와 문자 초상 미리보기"></canvas></div></div>
  <div class="exportopts"><label>PNG 배율 <select id="pngScale"><option value="1">원본</option><option value="2" selected>2배 고해상도</option></select></label><label>배경 <select id="pngBackground"><option value="solid">배경 포함</option><option value="outer">바깥 배경 투명</option><option value="portrait">초상만 투명</option></select></label><span class="badge">드래그 이동 · 오른쪽 아래 점으로 크기 조절</span></div>
  <div class="actions"><span class="status" id="status" aria-live="polite">이미지를 업로드하거나 편지를 작성해 보세요.</span><button class="action" id="play">▶ 재생</button><button class="action" id="png">PNG 저장</button><button class="action primary" id="gif">GIF 저장</button></div>
  <div class="progress" id="progress"><div id="progressFill"></div></div>
  <div class="footnote">작업 내용은 이 브라우저에서만 처리됩니다. 원본 이미지는 변경되지 않습니다.</div>
 </section>
</main>
<script>
'use strict';
const W=1000,H=720,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const canvas=$('#preview'),ctx=canvas.getContext('2d');
const defaultChar=()=>({image:null,url:'',filename:'',x:0,y:0,scale:100,rotate:0,flip:false,region:'all',cropX:0,cropY:0,cropW:100,cropH:100});
const state={count:1,relation:'one',layout:'side',paper:'classic',motion:'main',reveal:'original',charStyle:'letter',fontSize:12,density:100,contrast:120,split:50,originalColor:false,invert:false,boldHighlight:true,ink:'#302a2b',accent:'#8d4055',paperColor:'#f7f3e9',backColor:'#e8dfd5',borderColor:'#c9bdb1',margin:36,lines:true,border:true,senderThumb:false,speed:100,flight:100,emphasis:70,hold:0.3,cursor:true,loop:true,highlight:'',erase:'',date:'',signature:'',chars:[defaultChar(),defaultChar()],letters:[{from:'',to:'',body:''},{from:'',to:'',body:''}]};
let stage='portrait',playing=false,playStart=0,playTime=0,raf=0,dirty=true,portraits=[],exporting=false,dragging=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},rgb=(s)=>{const n=parseInt(s.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]},rgba=(col,alpha)=>{let c=rgb(col);return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`};
const font=()=>state.paper==='type'?"'Courier New','Malgun Gothic',monospace":"'Noto Serif CJK KR','Nanum Myeongjo','Batang','Malgun Gothic',serif";
const showStatus=(t,bad=false)=>{const e=$('#status');e.textContent=t;e.style.color=bad?'#b04a4a':'#7b6870'};
function addRange(obj,key,label,min,max,step=1,unit=''){return `<div class="control"><div class="topline">${label}<output data-output="${key}">${obj[key]}${unit}</output></div><input type="range" data-prop="${key}" min="${min}" max="${max}" step="${step}" value="${obj[key]}"></div>`}
function charMarkup(i){let c=state.chars[i];return `<div class="charBlock" data-ci="${i}"><div class="control"><label>${i?'캐릭터 B':'캐릭터 A'}</label><div class="upload"><div class="thumb" data-thumb="${i}">${c.url?`<img src="${c.url}" alt="">`:'＋'}</div><div><button class="pick" data-upload="${i}">이미지 선택</button><button class="tinybtn" data-delete="${i}">삭제</button><div style="margin-top:4px"><small>${escapeHtml(c.filename||'PNG · JPG · WEBP')}</small></div></div></div><input class="hidden" type="file" accept="image/png,image/jpeg,image/webp" data-file="${i}"></div><div class="rangegrid">${addRange(c,'x','가로 위치',-180,180,1)}${addRange(c,'y','세로 위치',-160,160,1)}${addRange(c,'scale','크기',35,350,5,'%')}${addRange(c,'rotate','회전',-180,180,5,'°')}</div><label class="toggleline"><input type="checkbox" data-prop="flip" ${c.flip?'checked':''}> 좌우 반전</label><div class="control"><label>문자 변환 범위</label><select data-prop="region"><option value="all" ${c.region==='all'?'selected':''}>이미지 전체 (투명 영역 제외)</option><option value="crop" ${c.region==='crop'?'selected':''}>직접 지정한 사각형</option></select></div><div class="rangegrid ${c.region==='crop'?'':'hidden'}" data-crop>${addRange(c,'cropX','영역 왼쪽',0,90,5,'%')}${addRange(c,'cropY','영역 위쪽',0,90,5,'%')}${addRange(c,'cropW','영역 너비',10,100,5,'%')}${addRange(c,'cropH','영역 높이',10,100,5,'%')}</div></div>`}
function buildChars(){let h=state.count===2?charMarkup(0)+'<hr class="rule">'+charMarkup(1):charMarkup(0);$('#charControls').innerHTML=h;$$('[data-upload]').forEach(b=>b.onclick=()=>document.querySelector(`[data-file="${b.dataset.upload}"]`).click());$$('[data-file]').forEach(f=>f.onchange=async()=>{const n=+f.dataset.file,file=f.files?.[0];if(!file)return;try{if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('PNG, JPG, WEBP만 사용할 수 있습니다.');let url=URL.createObjectURL(file),img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});if(!img.naturalWidth)throw Error('이미지를 열 수 없습니다.');if(state.chars[n].url)URL.revokeObjectURL(state.chars[n].url);Object.assign(state.chars[n],{image:img,url,filename:file.name});buildChars();invalidate();showStatus('이미지를 불러왔습니다.')}catch(e){showStatus(e.message,true)}});$$('[data-delete]').forEach(b=>b.onclick=()=>{let c=state.chars[+b.dataset.delete];if(c.url)URL.revokeObjectURL(c.url);Object.assign(c,defaultChar());buildChars();invalidate()});$$('[data-prop]').forEach(el=>{let i=+el.closest('.charBlock').dataset.ci,key=el.dataset.prop;el.oninput=()=>{state.chars[i][key]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;el.closest('.charBlock').querySelector(`[data-output="${key}"]`)?.replaceChildren(document.createTextNode(el.value+(key==='scale'||key.startsWith('crop')?'%':key==='rotate'?'°':'')));if(key==='region')el.closest('.charBlock').querySelector('[data-crop]').classList.toggle('hidden',el.value!=='crop');invalidate()}})}
function letterMarkup(i){let x=state.letters[i];return `<div class="letterBlock" data-li="${i}"><div class="control"><label>${i===0?(state.count===2?'A가 쓴 편지':'편지 내용'):'B가 쓴 편지'}</label><div class="row2"><input type="text" data-field="from" value="${escapeAttr(x.from)}" placeholder="작성자 이름"><input type="text" data-field="to" value="${escapeAttr(x.to)}" placeholder="수신자 이름"></div></div><div class="control"><textarea data-field="body" placeholder="여기에 편지를 작성하세요.">${escapeHtml(x.body)}</textarea></div></div>`}

   c.x=clamp(c.x+p.x-dragging.prev.x,-300,300);c.y=clamp(c.y+p.y-dragging.prev.y,-240,240);dragging.prev=p;
   for(const k of ['x','y']){const input=block?.querySelector(`[data-prop="${k}"]`);if(input)input.value=Math.round(c[k]);block?.querySelector(`[data-output="${k}"]`)?.replaceChildren(document.createTextNode(Math.round(c[k])))}
  }
  invalidate();e.preventDefault();
 });
 const stop=()=>{dragging=null;canvas.classList.remove('dragging')};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function savePNG(){if(exporting)return;try{const scale=+$('#pngScale').value,off=document.createElement('canvas');off.width=W*scale;off.height=H*scale;let g=off.getContext('2d');g.scale(scale,scale);drawScene(g,stage==='animation'?playTime:null,stage==='animation'?'animation':stage,{transparent:$('#pngBackground').value});let blob=await new Promise((res,rej)=>off.toBlob(b=>b?res(b):rej(Error('PNG 변환에 실패했습니다.')),'image/png'));download(blob,`WRITTEN_IN_YOU_${stage}.png`);showStatus('PNG 저장 완료')}catch(e){showStatus('PNG 저장 실패: '+e.message,true)}}
// A single median-cut color table is used throughout the GIF so the same ink and paper
// color never jump between frames. All GIF frames cover the entire canvas.
function makePalette(samples){
 const range=list=>{let lo=[255,255,255],hi=[0,0,0];for(let v of list){let c=[(v>>>16)&255,(v>>>8)&255,v&255];for(let k=0;k<3;k++){if(c[k]<lo[k])lo[k]=c[k];if(c[k]>hi[k])hi[k]=c[k]}}return hi.map((v,k)=>v-lo[k])};
 const boxes=[samples.length?samples:[0xffffff]];
 while(boxes.length<256){let best=-1,bestScore=-1,dim=0;
  for(let i=0;i<boxes.length;i++){const a=boxes[i];if(a.length<2)continue;let r=range(a),which=r.indexOf(Math.max(...r)),score=Math.max(...r)*Math.sqrt(a.length);if(score>bestScore){bestScore=score;best=i;dim=which}}
  if(best<0)break;
  const a=boxes[best],shift=[16,8,0][dim];a.sort((x,y)=>((x>>>shift)&255)-((y>>>shift)&255));let mid=a.length>>1;
  boxes[best]=a.slice(0,mid);boxes.push(a.slice(mid));
 }
 let colors=[];
 for(let box of boxes){let rr=0,gg=0,bb=0;for(let v of box){rr+=(v>>>16)&255;gg+=(v>>>8)&255;bb+=v&255}let n=box.length||1;colors.push([Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)])}
 while(colors.length<256)colors.push(colors[colors.length-1]||[255,255,255]);return colors;
}
function paletteLookup(palette){const lut=new Uint8Array(32768);for(let code=0;code<32768;code++){
  const r=((code>>10)&31)*8+4,g=((code>>5)&31)*8+4,b=(code&31)*8+4;let best=Infinity,id=0;
  for(let j=0;j<256;j++){let c=palette[j],dr=r-c[0],dg=g-c[1],db=b-c[2],v=3*dr*dr+5*dg*dg+2*db*db;if(v<best){best=v;id=j;if(!v)break}}
  lut[code]=id;
 }return lut}
function pixelsToIndices(pixels,lut){let out=new Uint8Array(pixels.length/4);for(let i=0,p=0;i<pixels.length;i+=4,p++){let key=((pixels[i]>>3)<<10)|((pixels[i+1]>>3)<<5)|(pixels[i+2]>>3);out[p]=lut[key]}return out}
function lzwEncode(indexed){
 const bytes=[],clear=256,eoi=257;let size=9,next=258,table=new Map(),buffer=0,bitCount=0;
 const write=(code)=>{buffer|=code<<bitCount;bitCount+=size;while(bitCount>=8){bytes.push(buffer&255);buffer>>>=8;bitCount-=8}};
 write(clear);let prefix=indexed[0]??0;
 for(let i=1;i<indexed.length;i++){
  const v=indexed[i],key=prefix*256+v,found=table.get(key);
  if(found!==undefined){prefix=found;continue}
  write(prefix);
  if(next<4096){table.set(key,next++);if(next>(1<<size)&&size<12)size++}
  else{write(clear);table.clear();next=258;size=9}
  prefix=v;
 }
 write(prefix);write(eoi);if(bitCount)bytes.push(buffer&255);
 return new Uint8Array(bytes);
}
class GifWriter{
 constructor(w,h,palette){this.data=[];this.ascii('GIF89a');this.word(w);this.word(h);this.byte(0xf7);this.byte(0);this.byte(0);for(let p of palette){this.byte(p[0]);this.byte(p[1]);this.byte(p[2])}this.bytes([0x21,0xff,0x0b]);this.ascii('NETSCAPE2.0');this.bytes([3,1,0,0,0])}
 byte(x){this.data.push(x&255)}word(n){this.byte(n);this.byte(n>>8)}bytes(a){for(let x of a)this.byte(x)}ascii(s){for(let i=0;i<s.length;i++)this.byte(s.charCodeAt(i))}
 frame(indexed,w,h,delay){this.bytes([0x21,0xf9,4,0x08]);this.word(delay);this.bytes([0,0]);this.byte(0x2c);this.word(0);this.word(0);this.word(w);this.word(h);this.byte(0);this.byte(8);let compressed=lzwEncode(indexed);for(let p=0;p<compressed.length;p+=255){let count=Math.min(255,compressed.length-p);this.byte(count);for(let i=0;i<count;i++)this.byte(compressed[p+i])}this.byte(0)}
 finish(){this.byte(0x3b);return new Blob([new Uint8Array(this.data)],{type:'image/gif'})}
}
function progress(p,message){$('#progress').style.display='block';$('#progressFill').style.width=clamp(p*100,0,100)+'%';showStatus(message+' '+Math.round(p*100)+'%')}
const breathe=()=>new Promise(r=>setTimeout(r,0));
async function saveGIF(){if(exporting)return;let controls=$$('button,input,select,textarea');try{
 exporting=true;playing=false;$('#play').textContent='▶ 재생';controls.forEach(c=>c.disabled=true);$('#progress').style.display='block';
 const width=900,height=648,fps=10,duration=3.2+state.hold,count=Math.max(32,Math.ceil(duration*fps));
 const frame=document.createElement('canvas');frame.width=width;frame.height=height;let g=frame.getContext('2d',{willReadFrequently:true});
 const paint=t=>{g.setTransform(width/W,0,0,height/H,0,0);drawScene(g,t,'animation',{edit:false,transparent:'solid'});return g.getImageData(0,0,width,height).data};
 const samples=[];for(let s=0;s<8;s++){const time=duration*s/7,p=paint(time);for(let y=2;y<height;y+=10)for(let x=2;x<width;x+=10){let ix=(y*width+x)*4;samples.push((p[ix]<<16)|(p[ix+1]<<8)|p[ix+2])}progress(.05+s*.035,'색상표 준비 중');await breathe()}
 const palette=makePalette(samples);progress(.35,'색상표 계산 중');await breathe();const lut=paletteLookup(palette),gif=new GifWriter(width,height,palette);
 for(let i=0;i<count;i++){
  const t=Math.min(duration-.001,i/fps),pixels=paint(t),indexed=pixelsToIndices(pixels,lut);
  gif.frame(indexed,width,height,Math.round(100/fps));progress(.4+.59*(i+1)/count,'GIF 제작 중');
  await breathe();
 }
 const blob=gif.finish();if(blob.size<1000)throw Error('GIF 데이터가 비정상적으로 작습니다.');download(blob,'WRITTEN_IN_YOU.gif');progress(1,'GIF 저장 완료');showStatus(`GIF 저장 완료 · ${count}프레임 · ${(blob.size/1048576).toFixed(1)}MB`)
 }catch(e){console.error(e);showStatus('GIF 저장 실패: '+e.message,true)}finally{exporting=false;controls.forEach(c=>c.disabled=false);const swap=$('[data-key="motion"] option[value="swap"]');swap.disabled=state.count!==2||state.relation!=='mutual';setTimeout(()=>{$('#progress').style.display='none'},1000);renderPreview()}}
setup();
