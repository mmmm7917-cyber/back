<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새벽 세 시, 같이 듣는 중</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1124;color:#ece7f2;font:15px Arial,'Malgun Gothic',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;min-height:40px;border:1.5px solid #343a63;border-radius:10px;padding:9px 12px;background:#1a1f3d;color:#ece7f2}
button:hover{background:#262c55}button.active{background:#efd9a8;color:#16192f;border-color:#efd9a8}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8fa5e8;outline-offset:2px}
header{max-width:1420px;margin:auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand span{color:#efd9a8;margin-right:9px}
.brand small{display:block;font-size:12px;font-weight:400;color:#8b8fb5;letter-spacing:0}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.layout{max-width:1420px;padding:0 28px 30px;margin:auto;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px}
.left{min-width:0;position:sticky;top:16px;align-self:start}
.paper-wrap{padding:15px;background:#161a33;border-radius:20px;border:1px solid #2a3054}
.canvas{width:100%;aspect-ratio:1;max-height:730px;background:#05060f;border-radius:10px;overflow:hidden}
.canvas svg{width:100%;height:100%;display:block;touch-action:none}
.hint{color:#7d82a8;font-size:12px;text-align:center;margin:12px 0 0;line-height:1.6}
.settings,.editor{background:#141830;border:1px solid #2a3054;border-radius:17px}
.settings{margin-top:14px;padding:20px}.editor{overflow:hidden;align-self:start}
.tabs{display:flex;background:#0f1328;border-bottom:1px solid #2a3054;padding:8px;gap:6px}
.tabs button{flex:1;border:0;font-size:13px;padding:10px 2px;background:transparent}
.panel{padding:20px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:100px;font-size:13px;color:#9b9fc4}
.field input:not([type=color]),.field select{width:100%;min-height:42px;padding:9px 10px;border:1px solid #343a63;border-radius:9px;background:#0f1328;color:#ece7f2}
.field input[type=color]{width:100%;height:39px;border:1px solid #343a63;border-radius:9px;background:#0f1328;padding:4px}
.group{margin-bottom:20px}.group:last-child{margin-bottom:0}
.label{font-size:14px;font-weight:bold;margin:0 0 10px;color:#ece7f2}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choices button{font-size:13px;padding:10px 3px}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.range{display:grid;grid-template-columns:62px 1fr 44px;gap:9px;align-items:center;margin-top:12px;font-size:13px;color:#9b9fc4}
.range input{width:100%;accent-color:#efd9a8}.range output{text-align:right;font-size:12px}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:12px}
.check input{accent-color:#efd9a8;width:17px;height:17px}
.selection{border-top:1px solid #2a3054;padding:18px 20px;background:#101430}
.selection-title{display:flex;align-items:center;justify-content:space-between;font-weight:bold;margin-bottom:13px;font-size:14px}
.small{font-size:12px;color:#7d82a8}
.tools{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}.tools button{flex:1;min-width:70px;font-size:13px}
.save{background:#efd9a8;color:#16192f;border:0;font-weight:bold;width:100%;margin-top:15px;padding:14px}
.save:hover{background:#fff0c9}
.status{font-size:13px;color:#c9b98f;min-height:18px;text-align:center;margin-top:8px}
[hidden]{display:none!important}
dialog{border:1px solid #2a3054;border-radius:17px;width:min(92%,540px);padding:20px;background:#141830;color:#ece7f2}
dialog::backdrop{background:#05060fcc}dialog img{width:100%;max-height:62vh;object-fit:contain;background:#05060f;border-radius:10px}
dialog p{font-size:14px;color:#9b9fc4}a{color:#efd9a8}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2a3054;border-radius:10px}
@media(max-width:850px){header{padding:18px 15px}.brand{font-size:20px}.header-actions button{font-size:12px;padding:8px}
.layout{padding:0 12px 20px;grid-template-columns:1fr;gap:15px}.left{position:static}.paper-wrap{padding:9px}
.panel{padding:16px}.canvas{max-height:none}.settings{padding:16px}}
</style></head><body>
<header>
  <div class="brand"><span>☾</span>새벽 세 시</div>
  <div class="header-actions"><button id="random">랜덤 꾸미기</button><button id="reset">처음으로</button></div>
</header>
<main class="layout">
<section class="left">
  <div class="paper-wrap"><div class="canvas" id="canvas"></div>
  <p class="hint" id="hint">스티커를 끌어 옮기세요 · 방향키 이동 · [ ] 회전 · Ctrl+Z 되돌리기 · Ctrl+D 복제</p></div>
  <div class="settings">
    <div class="row">
      <label class="field">화면 비율<select id="ratio"><option value="square">정사각형</option><option value="portrait">세로형</option></select></label>
      <label class="field">시간대<select id="mood"><option value="dusk">초저녁</option><option value="midnight" selected>한밤중</option><option value="dawn">동트기 전</option></select></label>
      <label class="field">장면<select id="room"><option value="window" selected>창가</option><option value="open">하늘 가득</option></select></label>
    </div>
    <button id="save" class="save">PNG 저장</button>
    <div id="status" class="status" role="status"></div>
  </div>
</section>

<section class="editor">
<nav class="tabs" aria-label="꾸미기">
  <button class="active" data-tab="characters">친구</button>
  <button data-tab="night">밤하늘</button>
  <button data-tab="music">노래·속삭임</button>
  <button data-tab="stickers">장식·배치</button>
</nav>

<div id="characters" class="panel">
  <div class="switch"><button id="first" class="active">첫 번째 친구</button><button id="second">두 번째 친구</button></div>
  <div class="group"><label class="field">이름<input id="name" maxlength="14"></label></div>
  <div class="group"><div class="label">동물</div><div id="species" class="choices"></div></div>
  <div class="group"><div class="label">표정</div><div id="eyes" class="choices"></div></div>
  <div class="group"><div class="label">입</div><div id="mouth" class="choices"></div></div>
  <div class="group"><div class="label">색상</div><div class="colors">
    <label class="field">얼굴<input type="color" id="fur"></label>
    <label class="field">귀 안쪽<input type="color" id="inner"></label>
    <label class="field">눈<input type="color" id="eye"></label>
    <label class="field">볼<input type="color" id="cheek"></label>
    <label class="field">잠옷<input type="color" id="pj"></label>
    <label class="field">무늬<input type="color" id="patch"></label>
  </div></div>
  <div class="group"><div class="label">무늬</div><div id="pattern" class="choices"></div></div>
  <label class="field">볼 터치<select id="blush"><option value="round">동그라미</option><option value="heart">하트</option><option value="none">없음</option></select></label>
  <label class="check"><input type="checkbox" id="cap">수면 모자</label>
  <label class="check"><input type="checkbox" id="mole">눈 밑 점</label>
</div>

<div id="night" class="panel" hidden>
  <div class="group"><div class="label">밤하늘</div>
    <div class="range"><label for="stars">별 개수</label><input id="stars" type="range" min="0" max="140" value="70"><output id="starsOut">70</output></div>
    <label class="check"><input id="twinkle" type="checkbox" checked>크고 작은 별</label>
    <label class="check"><input id="skyline" type="checkbox" checked>도시 실루엣</label>
    <label class="check"><input id="glow" type="checkbox" checked>은은한 빛 번짐</label>
  </div>
  <div class="group"><div class="label">달</div>
    <div class="row">
      <label class="field">모양<select id="phase"><option value="full">보름달</option><option value="half">반달</option><option value="crescent" selected>초승달</option></select></label>
      <label class="field">달빛색<input type="color" id="moonColor" value="#fdf0cf"></label>
    </div>
  </div>
  <div class="group"><div class="label">방 안</div>
    <div class="row">
      <label class="field">이불색<input type="color" id="blanketColor" value="#3c3566"></label>
      <label class="field">포인트색<input type="color" id="accent" value="#efd9a8"></label>
    </div>
    <label class="field" style="margin-top:12px">새벽 시계<input id="clockText" value="AM 3:14" maxlength="10"></label>
    <label class="check"><input id="showClock" type="checkbox" checked>시계 표시</label>
  </div>
</div>

<div id="music" class="panel" hidden>
  <div class="group"><div class="label">같이 듣는 노래</div>
    <label class="field">곡명<input id="song" value="잠 못 드는 밤" maxlength="32"></label>
    <label class="field" style="margin-top:12px">가수<input id="artist" value="Your favorite artist" maxlength="36"></label>
    <div class="row" style="margin-top:12px">
      <label class="field">현재 시간<input id="elapsed" value="02:47" maxlength="5" placeholder="02:47"></label>
      <label class="field">전체 길이<input id="duration" value="04:12" maxlength="5" placeholder="04:12"></label>
    </div>
    <label class="check"><input id="showMusic" type="checkbox" checked>음악 카드 표시</label>
  </div>
  <div class="group"><div class="label">속삭임</div>
    <label class="field">첫 번째 친구<input id="quoteA" maxlength="30" value="…아직 안 자?"></label>
    <label class="field" style="margin-top:12px">두 번째 친구<input id="quoteB" maxlength="30" value="응. 이 곡 끝까지만."></label>
    <label class="check"><input id="showQuotes" type="checkbox" checked>말풍선 표시</label>
    <label class="check"><input id="showNames" type="checkbox" checked>이름표 표시</label>
  </div>
</div>

<div id="stickers" class="panel" hidden>
  <div class="group"><div class="label">스티커 추가</div><div class="choices">
    <button data-add="star">★ 별</button><button data-add="heart">♥ 하트</button><button data-add="note">♪ 음표</button>
    <button data-add="spark">✦ 반짝임</button><button data-add="zzz">z 졸음</button><button data-add="cloud">☁ 구름</button>
    <button data-add="shoot">☄ 별똥별</button><button data-add="moon2">☾ 작은 달</button>
  </div></div>
  <div class="group"><div class="label">기본 배치</div><div class="choices">
    <button data-layout="lean">기대어</button><button data-layout="side">나란히</button><button data-layout="sleepy">꾸벅꾸벅</button>
  </div></div>
  <div class="group"><div class="label">스티커 테두리</div>
    <div class="range"><label for="border">테두리</label><input id="border" type="range" min="0" max="14" value="6"><output id="borderOut">6</output></div>
    <label class="field" style="margin-top:12px">테두리색<input type="color" id="edgeColor" value="#f7efe0"></label>
    <label class="check"><input id="shadow" type="checkbox" checked>옅은 그림자</label>
  </div>
</div>

<div class="selection">
  <div class="selection-title"><span id="selectedLabel">첫 번째 친구</span><span class="small">선택한 스티커</span></div>
  <label class="field">요소 선택<select id="element"></select></label>
  <div class="range"><label for="scale">크기</label><input id="scale" type="range" min="40" max="190" value="100"><output id="scaleOut">100%</output></div>
  <div class="range"><label for="angle">회전</label><input id="angle" type="range" min="-45" max="45" value="0"><output id="angleOut">0°</output></div>
  <div class="range"><label for="posX">가로</label><input id="posX" type="range" min="20" max="780"><output id="posXOut"></output></div>
  <div class="range"><label for="posY">세로</label><input id="posY" type="range" min="20" max="780"><output id="posYOut"></output></div>
  <label id="stickerColorRow" class="field" style="margin-top:12px" hidden>장식 색<input id="stickerColor" type="color"></label>
  <div class="tools"><button id="back">뒤로</button><button id="front">앞으로</button><button id="dup">복제</button><button id="remove">숨기기</button></div>
</div>
</section>
</main>

<dialog id="result">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><b>완성된 새벽 스티커</b><button id="close">닫기</button></div>
  <img id="resultImage" alt=""><p>모바일에서는 이미지를 길게 눌러 저장할 수도 있어요.</p><a id="download">PNG 다운로드</a>
</dialog>

<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',ink='#1b1a33';
const moods={
  dusk:{sky:['#20265e','#4d4079','#cf8f95'],wall:'#241f3d'},
  midnight:{sky:['#050918','#111a44','#2b3068'],wall:'#11132a'},
  dawn:{sky:['#161b3c','#4a4274','#eda987'],wall:'#1c1a33'}
};
const choices={
  species:[['bunny','토끼'],['cat','고양이'],['dog','강아지'],['bear','곰'],['fox','여우'],['hamster','햄스터']],
  eyes:[['sleepy','나른한 눈'],['closed','감은 눈'],['dot','동그란 눈'],['smile','눈웃음'],['spark','반짝이는 눈'],['wink','윙크']],
  mouth:[['small','작은 입'],['w','고양이 입'],['smile','미소'],['yawn','하품']],
  pattern:[['none','없음'],['ear','귀 배색'],['eye','한쪽 눈'],['stripes','줄무늬'],['spots','얼룩']]
};
const initial=[
 {name:'모카',species:'bunny',eyes:'sleepy',mouth:'small',fur:'#fdf0d8',inner:'#e8b5a5',eye:'#2a2744',cheek:'#e79a8c',pj:'#4a4480',patch:'#7c74a8',pattern:'ear',blush:'round',cap:true,mole:false},
 {name:'라떼',species:'cat',eyes:'closed',mouth:'w',fur:'#fff3e2',inner:'#eebfa7',eye:'#2a2744',cheek:'#e79a8c',pj:'#3c5a74',patch:'#c7a98a',pattern:'none',blush:'round',cap:false,mole:true}
];
const DECOR=['star','heart','note','spark','zzz','cloud','shoot','moon2'],MAX_DECOR=38;
const FIELDS=['ratio','mood','room','stars','twinkle','skyline','glow','phase','moonColor','blanketColor','accent','clockText','showClock','song','artist','elapsed','duration','showMusic','quoteA','quoteB','showQuotes','showNames','border','edgeColor','shadow'];
const STORE='dawn-sheet-v1';
let chars=initial.map(c=>({...c})),active=0,selected='char0',nextId=20,items=[],svg,defs,drag=null,downloadURL='';
let past=[],future=[],last='',commitTimer;

/* ---------- SVG 헬퍼 ---------- */
function E(tag,attrs={},p){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(p)p.append(n);return n}
function P(p,d,fill=ink,attrs={}){return E('path',{d,fill,...attrs},p)}
function L(p,d,col=ink,w=4,attrs={}){return P(p,d,'none',{stroke:col,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...attrs})}
function O(p,x,y,rx,ry,fill,attrs={}){return E('ellipse',{cx:x,cy:y,rx,ry,fill,...attrs},p)}
function R(p,x,y,w,h,rx,fill,attrs={}){return E('rect',{x,y,width:w,height:h,rx,fill,...attrs},p)}
function T(p,x,y,value,size=18,col=ink,weight=600,max=0,extra={}){
  const t=E('text',{x,y,fill:col,'font-size':size,'text-anchor':'middle','font-family':'Arial, Malgun Gothic, sans-serif','font-weight':weight,...extra},p);
  t.textContent=value;
  if(max&&Array.from(value).reduce((s,c)=>s+(c.charCodeAt(0)>255?size:size*.58),0)>max){t.setAttribute('textLength',max);t.setAttribute('lengthAdjust','spacingAndGlyphs')}
  return t}
function starShape(p,x,y,r,col,outline=true){let d='';for(let j=0;j<10;j++){const a=j*Math.PI/5-Math.PI/2,rr=j%2?r*.46:r;d+=(j?'L':'M')+(x+Math.cos(a)*rr).toFixed(2)+' '+(y+Math.sin(a)*rr).toFixed(2)}
  return P(p,d+'Z',col,outline?{stroke:ink,'stroke-width':2.6,'stroke-linejoin':'round'}:{})}
function heart(p,x,y,s,col){const g=E('g',{transform:`translate(${x} ${y}) scale(${s})`},p);P(g,'M0 12 C-30 -4 -18 -25 0 -12 C18 -25 30 -4 0 12Z',col);return g}
/* 재현 가능한 난수(별 위치 고정용) */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}

/* ---------- 캐릭터 ---------- */
function character(p,c,id){
  const g=E('g',{},p),edge={stroke:ink,'stroke-width':4.8,'stroke-linejoin':'round'};
  // 몸통(잠옷)
  P(g,'M-70 150 C-70 92 -40 70 0 70 C40 70 70 92 70 150Z',c.pj,edge);
  for(const s of [-1,1]){
    const col=c.pattern==='ear'?c.patch:c.fur;
    if(c.species==='bunny'){P(g,`M${s*22} -49 C${s*19} -94 ${s*32} -155 ${s*58} -151 C${s*89} -152 ${s*88} -101 ${s*70} -52Z`,col,edge);L(g,`M${s*46} -75 Q${s*37} -113 ${s*56} -131`,c.inner,12)}
    else if(c.species==='fox'||c.species==='cat'){const tall=c.species==='fox'?157:117;P(g,`M${s*28} -62 Q${s*45} -${tall-22} ${s*87} -${tall} Q${s*111} -${tall-37} ${s*89} -25Z`,col,edge);P(g,`M${s*51} -69 L${s*84} -${tall-24} L${s*84} -57Z`,c.inner)}
    else if(c.species==='dog'){/* 접힌 귀는 얼굴 위에 그립니다. */}
    else{O(g,s*70,-62,c.species==='bear'?31:25,c.species==='bear'?31:25,col,edge);O(g,s*70,-62,16,16,c.inner)}
  }
  const face=c.species==='dog'?'M0 -72 C18 -73 30 -71 40 -68 C58 -87 83 -88 100 -72 C119 -54 120 -31 100 -23 C103 -11 104 0 104 12 C104 58 72 77 0 77 C-72 77 -104 58 -104 12 C-104 0 -103 -11 -100 -23 C-120 -31 -119 -54 -100 -72 C-83 -88 -58 -87 -40 -68 C-30 -71 -18 -73 0 -72Z':'M0 -72 C66 -72 102 -44 102 4 C102 58 72 77 0 77 C-72 77 -102 58 -102 4 C-102 -44 -66 -72 0 -72Z';
  P(g,face,c.fur,edge);
  const clip=E('clipPath',{id:'face'+id},defs);P(clip,face,'white');
  const marks=E('g',{'clip-path':`url(#face${id})`},g);
  if(c.pattern==='eye')O(marks,-39,17,27,31,c.patch);
  if(c.pattern==='stripes')for(const x of [-23,0,23])P(marks,`M${x-6} -74 L${x} -40 L${x+6} -74Z`,c.patch);
  if(c.pattern==='spots'){O(marks,76,-22,21,17,c.patch);O(marks,-82,36,14,20,c.patch)}
  // 옆으로 접힌 끝과 맞닿은 방울이 있는 수면 모자
  if(c.cap){
    const hat=E('g',{transform:c.species==='dog'?'translate(0 -17) scale(.78)':'translate(0 0)'},g);
    P(hat,'M-70 -58 C-56 -88 -29 -113 1 -120 C29 -127 54 -118 65 -103 Q69 -97 66 -89 L55 -87 C50 -99 39 -101 29 -94 C45 -84 60 -70 70 -58 C36 -76 -36 -76 -70 -58Z',c.pj,edge);
    L(hat,'M29 -94 Q20 -99 13 -99',ink,2.3,{opacity:.5});
    // 방울 중심을 모자 끝에 겹쳐 빈틈 없이 연결
    O(hat,63,-86,10.5,10.5,'#fdf0d8',{'stroke':ink,'stroke-width':3.8});
  }
  // 머리 윤곽과 이어지는 넓고 둥근 접힌 귀
  if(c.species==='dog')for(const side of [-1,1]){
    const ear=E('g',{transform:`scale(${side} 1)`},g);
    if(c.pattern==='ear'){
      P(ear,'M40 -68 C58 -87 83 -88 100 -72 C119 -54 120 -31 100 -23 C79 -18 51 -31 47 -52 C46 -58 44 -64 40 -68Z',c.patch);
      L(ear,'M40 -68 C58 -87 83 -88 100 -72 C119 -54 120 -31 100 -23',ink,4.8);
    }
    L(ear,'M47 -52 C49 -36 65 -23 83 -22 Q93 -20 100 -23',c.inner,4.2);
  }
  for(const s of [-1,1]){

function redo(){if(!future.length)return;past.push(last);last=future.pop();applyHistory(last)}
function applyHistory(s){const d=JSON.parse(s);chars=d.chars;items=d.items;nextId=d.nextId;
  for(const id in d.f){const el=$(id);if(!el)continue;if(el.type==='checkbox')el.checked=d.f[id];else el.value=d.f[id]}

    sleepy:{char0:[320,360,-14],char1:[500,375,13],name0:[250,500,-10],name1:[560,512,10],quote0:[560,165,5],quote1:[235,560,-5]}
  }[mode];
  for(const id in P_){const a=items.find(x=>x.id===id);if(a)Object.assign(a,{x:P_[id][0],y:P_[id][1],angle:P_[id][2]})}
  render();syncSelection()};

$('random').onclick=()=>{const pick=a=>a[Math.floor(Math.random()*a.length)];
  for(const c of chars){c.species=pick(choices.species)[0];c.eyes=pick(choices.eyes)[0];c.mouth=pick(choices.mouth)[0];
    c.fur=pick(['#fdf0d8','#d9c6b4','#ebc5bd','#c5ccd5','#f2ce9e']);
    c.pj=pick(['#4a4480','#3c5a74','#6a4f74','#4f6a5a']);c.blush=pick(['round','heart','none']);c.cap=Math.random()<.5}
  $('mood').value=pick(['dusk','midnight','dawn']);$('phase').value=pick(['full','half','crescent']);
  syncChar();render()};
$('reset').onclick=()=>{if(!confirm('꾸민 내용을 지우고 처음으로 돌아갈까요?'))return;try{localStorage.removeItem(STORE)}catch(e){}location.reload()};

/* 되돌리기 버튼 추가 */
const undoBtn=document.createElement('button'),redoBtn=document.createElement('button');
undoBtn.id='undoBtn';redoBtn.id='redoBtn';undoBtn.textContent='↶ 되돌리기';redoBtn.textContent='↷ 다시';
undoBtn.onclick=undo;redoBtn.onclick=redo;document.querySelector('.header-actions').prepend(undoBtn,redoBtn);

/* 키보드 */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range';
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(typing||$('result').open)return;
  if(mod&&k==='d'){e.preventDefault();duplicate();return}
  const a=current();if(!a)return;const step=e.shiftKey?10:1;
  const moves={arrowleft:[-step,0],arrowright:[step,0],arrowup:[0,-step],arrowdown:[0,step]};
  if(moves[k]){e.preventDefault();a.x=Math.max(20,Math.min(780,a.x+moves[k][0]));a.y=Math.max(20,Math.min(height()-20,a.y+moves[k][1]));render();syncSelection()}
  else if(k==='['||k===']'){a.angle=Math.max(-45,Math.min(45,a.angle+(k===']'?3:-3)));render();syncSelection()}
  else if(k==='delete'||k==='backspace'){e.preventDefault();$('remove').click()}});

/* 저장 */
$('close').onclick=()=>$('result').close();
$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;$('status').textContent='사진을 준비하고 있어요…';
  try{
    const out=render(true),source=new Blob([new XMLSerializer().serializeToString(out)],{type:'image/svg+xml;charset=utf-8'}),
          url=URL.createObjectURL(source),im=new Image();
    render();
    await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});
    const cv=document.createElement('canvas');cv.width=1200;cv.height=height()*1.5;
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)throw Error('png');
    if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(blob);
    $('resultImage').src=downloadURL;$('download').href=downloadURL;$('download').download='새벽_세시.png';
    $('download').click();$('result').showModal();$('status').textContent='PNG가 완성됐어요.'}
  catch(e){$('status').textContent='저장에 실패했어요. 다시 시도해 주세요.';render()}
  finally{btn.disabled=false}};

/* 시작 */
let saved=null;try{saved=localStorage.getItem(STORE)}catch(e){}
if(saved){try{last=saved;restore(saved);$('status').textContent='이전에 꾸미던 내용을 불러왔어요.'}catch(e){saved=null}}
if(!saved){defaults();syncChar();render();syncSelection();last=snapshot();updateHistoryButtons()}
</script></body></html>
