<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>둘의 공동 가계부</title><style>:root{--ink:#292c29;--line:#d8d6cb;--bg:#e9e8df;--paper:#fffdf6;--green:#49675c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.paper{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 35px #3331}.head{padding:24px;border-bottom:3px double var(--ink);display:flex;justify-content:space-between;gap:12px}.eyebrow{font:700 11px monospace;letter-spacing:.14em;color:var(--green)}h1{margin:7px 0;font-size:29px}section{padding:22px 24px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);background:white;border-radius:3px;font:inherit}button{font:inherit;cursor:pointer;border:1px solid var(--ink);padding:10px 15px;background:transparent;border-radius:3px;font-weight:700}button.primary{background:var(--ink);color:white}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{font-size:12px;color:#77786e;line-height:1.7}.hidden{display:none!important}.meter{height:5px;background:#e4e1d6;margin:14px 0 20px}.meter>div{height:100%;background:var(--green);transition:width .2s}.question{font-size:22px;font-weight:800;margin:8px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{text-align:left;min-height:90px;background:white;border:1px solid var(--line)}.choice:hover{border-color:var(--green)}.choice small{display:block;font-size:12px;color:#777;margin-top:7px;font-weight:400}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat>div{border:1px solid var(--line);padding:12px;background:#fff}.stat b{font-size:11px;color:#666;display:block}.stat strong{display:block;font-size:21px;margin-top:5px}.ledger{width:100%;border-collapse:collapse;font-size:12px}.ledger th{background:#eae9df;text-align:left;font-size:11px}.ledger td,.ledger th{padding:9px;border-bottom:1px solid var(--line)}.ledger td:last-child,.ledger th:last-child{text-align:right}.scroll{overflow-x:auto}.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:88px 1fr 100px;gap:10px;align-items:center;font-size:12px}.track{height:12px;background:#e9e5dc}.fill{height:100%;background:var(--green)}.summary{padding:14px;border:1px solid var(--line);line-height:1.8;font-size:13px;background:#fff}.avatars{display:flex;gap:12px}.avatar{width:62px;height:62px;background:#e4e2d9;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.who{display:flex;gap:8px;align-items:center}.who b{font-size:13px}.subhead{font-size:13px;font-weight:800;margin:20px 0 10px}@media(max-width:650px){.wrap{padding:9px}.head,section{padding:17px}.grid,.choices{grid-template-columns:1fr}.stat{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:65px 1fr 80px}h1{font-size:25px}}</style></head><body><div class="wrap"><main class="paper"><header class="head"><div><div class="eyebrow">JOINT HOUSEHOLD LEDGER / 01</div><h1>둘의 공동 가계부</h1><div class="muted">둘이 함께 쓰는 돈과 각자의 소비 습관을 기록합니다.</div></div><div class="eyebrow">HOUSEHOLD<br>ARCHIVE</div></header><section id="setup"><div class="grid"><div class="field"><label>캐릭터 A 이름</label><input id="nameA" value="캐릭터 A" maxlength="20"></div><div class="field"><label>캐릭터 B 이름</label><input id="nameB" value="캐릭터 B" maxlength="20"></div><div class="field"><label>캐릭터 A 이미지 (선택)</label><input id="imgA" type="file" accept="image/*"></div><div class="field"><label>캐릭터 B 이미지 (선택)</label><input id="imgB" type="file" accept="image/*"></div><div class="field"><label>화폐 단위</label><select id="currency"><option value="₩">원 (₩)</option><option value="$">달러 ($)</option><option value="¥">엔 (¥)</option></select></div><div class="field"><label>기록 월</label><input id="month" type="month" value="2026-10"></div></div><div class="row" style="margin-top:16px"><button class="primary" id="start">가계부 작성 시작</button><span class="muted">12개 생활 상황 · 소비 주체와 정산 방식 선택</span></div></section><section id="game" class="hidden"><div class="row" style="justify-content:space-between"><b id="count"></b><span class="muted" id="monthLabel"></span></div><div class="meter"><div id="progress"></div></div><div class="eyebrow" id="category"></div><div class="question" id="question"></div><p class="muted" id="description"></p><div class="choices" id="choices"></div><div class="subhead">최근 기록</div><div class="scroll"><table class="ledger"><thead><tr><th>일자</th><th>항목</th><th>결제자</th><th>금액</th></tr></thead><tbody id="recent"></tbody></table></div></section><section id="result" class="hidden"><div class="eyebrow">MONTHLY ACCOUNT STATEMENT</div><h2 id="resultTitle"></h2><div class="avatars" id="avatars"></div><div class="stat" style="margin-top:17px"><div><b>총 지출</b><strong id="total"></strong></div><div><b id="paidALabel">캐릭터 A 결제</b><strong id="paidA"></strong></div><div><b id="paidBLabel">캐릭터 B 결제</b><strong id="paidB"></strong></div></div><div class="subhead">지출 분야별 분포</div><div class="bars" id="bars"></div><div class="subhead">공동 지출 정산</div><div class="summary" id="settle"></div><div class="subhead">관계성 소비 기록</div><div class="summary" id="analysis"></div><div class="subhead">전체 거래 내역</div><div class="scroll"><table class="ledger"><thead><tr><th>일자</th><th>분류</th><th>내역</th><th>결제자</th><th>금액</th></tr></thead><tbody id="allRows"></tbody></table></div><div class="row" style="margin-top:20px"><button class="primary" id="save">가계부 PNG 저장</button><button id="retry">다시 작성</button></div><p class="muted">금액은 창작용 예시이며, 선택한 결제 방식에 따라 자동 기록됩니다.</p></section></main></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);const scenarios=[['식비','장보기','냉장고에 넣을 식재료를 함께 샀다.',42000],['식비','외식','둘이 식당에서 저녁을 먹었다.',36000],['식비','야식','늦은 밤 배달 음식을 주문했다.',19000],['주거','생활용품','세제와 수건을 새로 샀다.',23000],['주거','공과금','공동으로 사용하는 공간의 요금이 나왔다.',67000],['교통','이동','둘이 함께 이동할 교통비가 필요하다.',16000],['취미','취미 활동','함께 즐길 물건을 구매했다.',31000],['선물','상대 선물','한 사람이 상대에게 줄 선물을 골랐다.',27000],['식비','간식','상대가 좋아하는 간식을 발견했다.',11000],['의료','약국','한 사람이 아파서 약을 샀다.',14000],['여가','나들이','둘이 휴일에 놀러 나갔다.',48000],['기타','예상 밖 지출','갑자기 수리비가 발생했다.',39000]];let s=null;function fmt(v){return s.currency==='₩'?v.toLocaleString('ko-KR')+'원':s.currency+v.toLocaleString('ko-KR')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function hasBatchim(name){const t=String(name||'').trim();if(!t)return null;const ch=t.charCodeAt(t.length-1);if(ch>=0xAC00&&ch<=0xD7A3)return (ch-0xAC00)%28!==0;return null}function josa(name,type){const b=hasBatchim(name),m={subject:b===null?'(이)가':b?'이':'가',topic:b===null?'(은)는':b?'은':'는',object:b===null?'(을)를':b?'을':'를',with:b===null?'(과)와':b?'과':'와'};return String(name)+m[type]}function read(input){return new Promise((resolve,reject)=>{let f=input.files?.[0];if(!f)return resolve(null);let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}function choicesFor(i){let [cat,label,desc,amount]=scenarios[i];return[{name:`${josa(s.A,'subject')} 전액 결제`,sub:`${s.B} 몫까지 ${josa(s.A,'subject')} 부담`,payer:'A',share:'gift',amount},{name:`${josa(s.B,'subject')} 전액 결제`,sub:`${s.A} 몫까지 ${josa(s.B,'subject')} 부담`,payer:'B',share:'gift',amount},{name:'반씩 나눠 결제',sub:'각자 절반씩 부담',payer:'AB',share:'split',amount},{name:'한 명이 먼저 내고 정산',sub:`${josa(i%2===0?s.A:s.B,'subject')} 결제 · 절반은 나중에 돌려받기`,payer:i%2===0?'A':'B',share:'debt',amount}]}function render(){let i=s.i,[cat,label,desc]=scenarios[i];$('count').textContent=`거래 ${String(i+1).padStart(2,'0')} / ${scenarios.length}`;$('monthLabel').textContent=s.month;$('progress').style.width=(i/scenarios.length*100)+'%';$('category').textContent=cat;$('question').textContent=label;$('description').textContent=desc;$('choices').innerHTML='';choicesFor(i).forEach((c,j)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`${esc(c.name)}<small>${esc(c.sub)} · ${fmt(c.amount)}</small>`;b.onclick=()=>pick(c);$('choices').appendChild(b)});$('recent').innerHTML=s.rows.slice(-4).reverse().map(row=>`<tr><td>${row.date}</td><td>${esc(row.label)}</td><td>${esc(payerName(row))}</td><td>${fmt(row.amount)}</td></tr>`).join('')}function payerName(r){return r.payer==='AB'?`${s.A} / ${s.B}`:r.payer==='A'?s.A:s.B}function pick(c){let i=s.i,[cat,label,desc]=scenarios[i];s.rows.push({date:String(i+1).padStart(2,'0'),cat,label,desc,...c});s.i++;if(s.i<scenarios.length)render();else finish()}function numbers(){let a=0,b=0,owed=0;const cats={};for(let r of s.rows){cats[r.cat]=(cats[r.cat]||0)+r.amount;if(r.payer==='A')a+=r.amount;else if(r.payer==='B')b+=r.amount;else{a+=r.amount/2;b+=r.amount/2}if(r.share==='debt')owed+=r.payer==='A'?r.amount/2:-r.amount/2}return {a,b,owed,cats,total:a+b}}function finish(){let n=numbers();$('game').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=`${s.A} × ${s.B} · ${s.month} 공동 가계부`;$('total').textContent=fmt(n.total);$('paidALabel').textContent=s.A+' 결제';$('paidBLabel').textContent=s.B+' 결제';$('paidA').textContent=fmt(n.a);$('paidB').textContent=fmt(n.b);$('avatars').innerHTML='';[['A',s.A,s.imgA],['B',s.B,s.imgB]].forEach(([key,name,img])=>{let w=document.createElement('div');w.className='who';let av=document.createElement('div');av.className='avatar';if(img){let im=document.createElement('img');im.src=img;av.appendChild(im)}else av.textContent=key;let b=document.createElement('b');b.textContent=name;w.append(av,b);$('avatars').appendChild(w)});$('bars').innerHTML=Object.entries(n.cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><b>${esc(k)}</b><div class="track"><div class="fill" style="width:${v/n.total*100}%"></div></div><span>${fmt(v)} (${Math.round(v/n.total*100)}%)</span></div>`).join('');$('settle').textContent=n.owed===0?'정산 대기 금액 없음. 모든 공동 지출은 결제 시점에 정리되었거나 상대를 위해 부담한 금액입니다.':n.owed>0?`${s.B} → ${s.A} : ${fmt(n.owed)} 정산 예정. (${josa(s.A,'subject')} 먼저 결제한 공동 비용의 절반)`:`${s.A} → ${s.B} : ${fmt(-n.owed)} 정산 예정. (${josa(s.B,'subject')} 먼저 결제한 공동 비용의 절반)`;let giftA=s.rows.filter(r=>r.share==='gift'&&r.payer==='A').length,giftB=s.rows.filter(r=>r.share==='gift'&&r.payer==='B').length,split=s.rows.filter(r=>r.share==='split').length;let top=Object.entries(n.cats).sort((a,b)=>b[1]-a[1])[0][0];$('analysis').textContent=`가장 많은 지출이 발생한 분야는 ${top}입니다. ${josa(s.A,'subject')} 상대 몫까지 결제한 기록 ${giftA}건, ${josa(s.B,'subject')} 상대 몫까지 결제한 기록 ${giftB}건, 현장에서 반씩 나눈 기록 ${split}건이 확인됩니다. ${n.a===n.b?'두 사람은 동일한 금액을 결제했습니다.':josa(n.a>n.b?s.A:s.B,'topic')+' 실제 결제 금액이 더 많습니다.'}`;$('allRows').innerHTML=s.rows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.cat)}</td><td>${esc(r.label)}</td><td>${esc(payerName(r))}</td><td>${fmt(r.amount)}</td></tr>`).join('')}
function wrap(c,str,x,y,maxW,lh){let line='',yy=y;for(let ch of [...str]){if(c.measureText(line+ch).width>maxW&&line){c.fillText(line,x,yy);line=ch;yy+=lh}else line+=ch}if(line)c.fillText(line,x,yy);return yy}function avatar(c,src,x,y){return new Promise(done=>{c.fillStyle='#e7e4da';c.fillRect(x,y,86,86);if(!src)return done();let im=new Image();im.onload=()=>{let sc=Math.max(86/im.width,86/im.height),w=im.width*sc,h=im.height*sc;c.save();c.beginPath();c.rect(x,y,86,86);c.clip();c.drawImage(im,x+(86-w)/2,y+(86-h)/2,w,h);c.restore();done()};im.onerror=done;im.src=src})}async function save(){let n=numbers(),W=1100,H=1250+s.rows.length*52;let cv=document.createElement('canvas');cv.width=W;cv.height=H;let c=cv.getContext('2d');c.fillStyle='#fffdf6';c.fillRect(0,0,W,H);c.fillStyle='#292c29';c.fillRect(64,60,972,3);c.font='700 17px monospace';c.fillStyle='#49675c';c.fillText('JOINT HOUSEHOLD LEDGER',68,101);c.fillStyle='#292c29';c.font='bold 48px sans-serif';c.fillText('둘의 공동 가계부',68,170);c.font='26px sans-serif';c.fillText(`${s.A} × ${s.B}  /  ${s.month}`,68,218);await avatar(c,s.imgA,805,112);await avatar(c,s.imgB,906,112);c.font='bold 16px sans-serif';c.fillText(s.A,805,218);c.fillText(s.B,906,218);c.fillStyle='#e8e7df';c.fillRect(64,264,972,125);c.fillStyle='#292c29';[['총 지출',n.total],[s.A+' 결제',n.a],[s.B+' 결제',n.b]].forEach(([k,v],i)=>{let x=90+i*315;c.font='17px sans-serif';c.fillText(k,x,300);c.font='bold 29px sans-serif';c.fillText(fmt(v),x,354)});let y=438;c.font='bold 24px sans-serif';c.fillText('지출 분야별 분포',68,y);y+=44;Object.entries(n.cats).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{c.font='18px sans-serif';c.fillStyle='#292c29';c.fillText(k,70,y);c.fillStyle='#e4e1d6';c.fillRect(185,y-17,560,18);c.fillStyle='#49675c';c.fillRect(185,y-17,560*v/n.total,18);c.fillStyle='#292c29';c.fillText(fmt(v),770,y);y+=43});y+=36;c.font='bold 24px sans-serif';c.fillText('공동 지출 정산',68,y);y+=35;c.font='18px sans-serif';let settlement=$('settle').textContent;y=wrap(c,settlement,70,y,920,29)+54;c.font='bold 24px sans-serif';c.fillText('전체 거래 내역',68,y);y+=27;c.fillStyle='#e8e7df';c.fillRect(64,y,972,40);c.fillStyle='#292c29';c.font='bold 17px sans-serif';c.fillText('일자',80,y+27);c.fillText('분류',168,y+27);c.fillText('항목',320,y+27);c.fillText('결제자',620,y+27);c.fillText('금액',850,y+27);y+=40;s.rows.forEach((r,i)=>{if(i%2)c.fillStyle='#f4f1e9',c.fillRect(64,y,972,52);c.fillStyle='#292c29';c.font='17px sans-serif';c.fillText(r.date,80,y+33);c.fillText(r.cat,168,y+33);c.fillText(r.label,320,y+33);c.fillText(payerName(r),620,y+33);c.fillText(fmt(r.amount),850,y+33);y+=52});y+=60;c.font='bold 23px sans-serif';c.fillText('관계성 소비 기록',68,y);y+=40;c.font='18px sans-serif';y=wrap(c,$('analysis').textContent,70,y,920,31);c.fillStyle='#777';c.font='14px monospace';c.fillText('GENERATED FOR CREATIVE CHARACTER USE',68,Math.min(H-60,y+80));let blob=await new Promise(resolve=>cv.toBlob(resolve,'image/png'));if(!blob){alert('PNG 생성에 실패했습니다.');return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='joint-ledger-'+s.month+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('start').onclick=async()=>{try{s={A:$('nameA').value.trim()||'A',B:$('nameB').value.trim()||'B',imgA:await read($('imgA')),imgB:await read($('imgB')),currency:$('currency').value,month:$('month').value||'2026-10',i:0,rows:[]};$('setup').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()}catch(e){alert('이미지 로딩 실패. 파일을 다시 선택해 주세요.')}};$('retry').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden')};$('save').onclick=save;})();</script></body></html>
