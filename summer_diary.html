<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여름방학 그림일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--panel:#fffef9;--line:#dfe6df;--ink:#3e4a45;--accent:#e0795e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}
button,input,select,textarea{font:inherit}
header{padding:18px 26px;font-size:22px;font-weight:700}header small{font-weight:400;font-size:13px;color:#8a9a93;margin-left:8px}
main{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:0 26px 26px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 16px;max-height:calc(100vh - 90px);overflow:auto}
.sec{padding:12px 0;border-bottom:1px dashed var(--line)}.sec:last-child{border:0}
.lab{font-size:12px;letter-spacing:.08em;color:#8fa29a;margin-bottom:8px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1;padding:7px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=date],textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{height:120px;resize:vertical}
.count{font-size:12px;color:#8fa29a;text-align:right;margin-top:4px}.count.over{color:#d0533b;font-weight:700}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.palette button{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.palette button.on{box-shadow:0 0 0 3px var(--ink)}
.palette .eraser{background:#fff;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:8px 0 2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btns{display:flex;gap:6px;margin-top:8px}.btns button,.upload{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:13px;text-align:center}
.upload input{display:none}
.check{font-size:13px;display:flex;gap:6px;align-items:center;margin-top:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;padding:16px}
canvas{width:100%;max-width:640px;height:auto;touch-action:none;cursor:crosshair;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.bar{display:flex;gap:8px;margin-top:12px}.bar button{padding:10px 22px;border-radius:12px;border:0;background:var(--ink);color:#fff;cursor:pointer}
.tip{font-size:12px;color:#8fa29a;margin-top:8px}
@media(max-width:820px){main{grid-template-columns:1fr}aside{max-height:none}}
</style></head><body>
<header>☀ 여름방학 그림일기<small>그림 칸에 직접 그리거나 사진을 올려 보세요</small></header>
<main><aside>
<div class="sec"><div class="lab">날짜 · 날씨</div>
<input type="date" id="date" value="2026-07-25">
<div class="seg" style="margin-top:8px"><button data-w="0" class="on">맑음</button><button data-w="1">흐림</button><button data-w="2">비</button><button data-w="3">천둥</button><button data-w="4">바람</button></div></div>
<div class="sec"><div class="lab">제목 · 이름</div>
<input type="text" id="title" maxlength="18" value="바다에 간 날">
<input type="text" id="name" maxlength="8" placeholder="이름" value="김여름" style="margin-top:6px"></div>
<div class="sec"><div class="lab">일기</div>
<textarea id="text">오늘은 가족들과 바다에 갔다. 파도가 철썩철썩 와서 깜짝 놀랐다. 모래성을 크게 만들었는데 파도가 와서 무너졌다. 그래도 수박을 먹어서 기분이 좋았다. 내일도 또 가고 싶다.</textarea>
<div class="count" id="count"></div></div>
<div class="sec"><div class="lab">크레용</div>
<div class="palette" id="palette"></div>
<div class="row">굵기<output id="brushO"></output></div><input type="range" id="brush" min="3" max="40" value="10">
<div class="btns"><button id="undo">↶ 되돌리기</button><button id="clear">그림 지우기</button></div></div>
<div class="sec"><div class="lab">사진</div>
<div class="btns"><label class="upload">＋ 사진 올리기<input type="file" id="upload" accept="image/*"></label><button id="nophoto">사진 빼기</button></div>
<label class="check"><input type="checkbox" id="crayonfx" checked>크레용 효과</label></div>
<div class="sec"><div class="lab">선생님 도장</div>
<label class="check"><input type="checkbox" id="stamp" checked>도장 찍기</label>
<select id="stampText" style="margin-top:6px"><option>참 잘했어요</option><option>최고예요</option><option>멋져요</option></select></div>
</aside>
<div class="stage"><canvas id="cv" width="1000" height="1400" aria-label="그림일기"></canvas>
<p class="tip">그림 칸 안에서 드래그하면 크레용으로 그려져요.</p>
<div class="bar"><button id="save">PNG 저장</button></div></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const W=1000,H=1400,PX=50,PY=250,PW=900,PH=560,GX=50,GY=850,COLS=12,ROWS=6,CELL=75;
const HAND="'Nanum Pen Script','Gamja Flower',cursive",PRINT="system-ui,'Malgun Gothic',sans-serif",PENCIL='#34384a';
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
let seed=7;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;

// 종이 질감
const grain=mk(200,200);{const g=grain.getContext('2d');for(let i=0;i<5000;i++){g.fillStyle=`rgba(120,100,60,${rnd()*.06})`;g.fillRect(rnd()*200,rnd()*200,1.5,1.5)}}

// 그림 레이어
const layer=mk(PW,PH),lg=layer.getContext('2d');let photo=null,photoSrc=null;const undo=[];
const COLORS=['#e5483c','#f28c38','#f6cf3c','#6dbb4f','#2f8f6a','#4aa3df','#2f5fb3','#8a5cc2','#f29bb8','#8a5a3c','#3a3a3a'];
let color=COLORS[5],erasing=false,weather=0;

const pal=$('palette');COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(i===5)b.className='on';b.onclick=()=>{color=c;erasing=false;sel(b)};pal.appendChild(b)});
const er=document.createElement('button');er.className='eraser';er.textContent='지우개';er.onclick=()=>{erasing=true;sel(er)};pal.appendChild(er);
function sel(b){pal.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}

function crayon(x0,y0,x1,y1){const r=+$('brush').value/2,d=Math.hypot(x1-x0,y1-y0),steps=Math.max(1,Math.ceil(d/1.5));
for(let s=0;s<=steps;s++){const x=x0+(x1-x0)*s/steps,y=y0+(y1-y0)*s/steps;
if(erasing){lg.globalCompositeOperation='destination-out';lg.beginPath();lg.arc(x,y,r*1.4,0,7);lg.fill();lg.globalCompositeOperation='source-over';continue}
lg.fillStyle=color;const n=Math.ceil(r*1.3);for(let k=0;k<n;k++){const a=Math.random()*7,rr=Math.sqrt(Math.random())*r;lg.globalAlpha=.35+Math.random()*.35;lg.fillRect(x+Math.cos(a)*rr,y+Math.sin(a)*rr,1.8,1.8)}lg.globalAlpha=1}}

// 사진 크레용 효과
function makePhoto(){if(!photoSrc){photo=null;return}const c=mk(PW,PH),g=c.getContext('2d'),s=Math.max(PW/photoSrc.width,PH/photoSrc.height);
g.drawImage(photoSrc,(PW-photoSrc.width*s)/2,(PH-photoSrc.height*s)/2,photoSrc.width*s,photoSrc.height*s);
if($('crayonfx').checked){const d=g.getImageData(0,0,PW,PH),p=d.data,q=255/5;for(let i=0;i<p.length;i+=4){const n=(Math.random()-.5)*30;for(let k=0;k<3;k++){let v=Math.round((p[i+k]*1.1+8)/q)*q+n;p[i+k]=Math.max(0,Math.min(255,v))}}g.putImageData(d,0,0);
g.globalCompositeOperation='multiply';g.fillStyle=g.createPattern(grain,'repeat');g.fillRect(0,0,PW,PH);g.globalCompositeOperation='source-over'}photo=c}

// 날씨 아이콘
function cloud(x,y,col='#a9b4bd'){ctx.fillStyle=col;for(const [dx,dy,r] of [[-10,3,9],[0,-4,12],[11,3,9],[0,5,10]]){ctx.beginPath();ctx.arc(x+dx,y+dy,r,0,7);ctx.fill()}}
const ICONS=[
(x,y)=>{ctx.fillStyle='#f2b134';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.strokeStyle='#f2b134';ctx.lineWidth=3;ctx.lineCap='round';for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*15,y+Math.sin(a)*15);ctx.lineTo(x+Math.cos(a)*21,y+Math.sin(a)*21);ctx.stroke()}},
(x,y)=>cloud(x,y),
(x,y)=>{cloud(x,y-6);ctx.strokeStyle='#4aa3df';ctx.lineWidth=3;ctx.lineCap='round';for(const dx of [-9,0,9]){ctx.beginPath();ctx.moveTo(x+dx,y+12);ctx.lineTo(x+dx-3,y+20);ctx.stroke()}},
(x,y)=>{cloud(x,y-6,'#8d97a0');ctx.fillStyle='#f2c230';ctx.beginPath();ctx.moveTo(x+2,y+6);ctx.lineTo(x-7,y+17);ctx.lineTo(x,y+17);ctx.lineTo(x-4,y+26);ctx.lineTo(x+8,y+13);ctx.lineTo(x+1,y+13);ctx.closePath();ctx.fill()},
(x,y)=>{ctx.strokeStyle='#7fb3c9';ctx.lineWidth=3;ctx.lineCap='round';for(const [dy,l] of [[-8,30],[0,22],[8,26]]){ctx.beginPath();ctx.moveTo(x-15,y+dy);ctx.lineTo(x-15+l,y+dy);ctx.arc(x-15+l,y+dy-4,4,Math.PI/2,-Math.PI*.9,true);ctx.stroke()}}];

function box(x,y,w,h){ctx.strokeStyle='#6d8fb0';ctx.lineWidth=2.5;ctx.strokeRect(x,y,w,h)}
function seq(x,y,parts){ctx.textBaseline='middle';ctx.textAlign='left';for(const [txt,hand] of parts){ctx.font=hand?`46px ${HAND}`:`22px ${PRINT}`;ctx.fillStyle=hand?PENCIL:'#6b7280';ctx.fillText(txt,x,y);x+=ctx.measureText(txt).width+(hand?6:14)}}

function render(){
ctx.fillStyle='#fbf6e6';ctx.fillRect(0,0,W,H);ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,W,H);
// 머리
const [Y,M,D]=$('date').value.split('-').map(Number),day=Y?'일월화수목금토'[new Date(Y,M-1,D).getDay()]:'';
box(50,50,600,90);box(650,50,300,90);
if(Y)seq(72,97,[[Y,1],['년',0],[M,1],['월',0],[D,1],['일',0],[day,1],['요일',0]]);
ctx.font=`18px ${PRINT}`;ctx.fillStyle='#6b7280';ctx.textAlign='left';ctx.fillText('날씨',664,70);
ICONS.forEach((f,i)=>{const x=712+i*52,y=104;ctx.save();f(x,y);ctx.restore();if(i===weather){ctx.strokeStyle='rgba(224,72,60,.85)';ctx.lineWidth=3.5;ctx.beginPath();ctx.ellipse(x,y+2,25,27,-.2,0,7);ctx.stroke()}});
box(50,150,900,80);seq(72,191,[['제목',0],[$('title').value,1]]);
const nm=$('name').value.trim();if(nm){ctx.font=`22px ${PRINT}`;ctx.fillStyle='#6b7280';ctx.textAlign='right';ctx.font=`40px ${HAND}`;ctx.fillStyle=PENCIL;ctx.fillText(nm,928,191);const w=ctx.measureText(nm).width;ctx.font=`22px ${PRINT}`;ctx.fillStyle='#6b7280';ctx.fillText('이름',928-w-12,191)}
// 그림
ctx.fillStyle='#fffdf5';ctx.fillRect(PX,PY,PW,PH);if(photo)ctx.drawImage(photo,PX,PY);ctx.drawImage(layer,PX,PY);box(PX,PY,PW,PH);
// 원고지
ctx.strokeStyle='#8fb0cf';ctx.lineWidth=1.5;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)ctx.strokeRect(GX+c*CELL,GY+r*CELL,CELL,CELL);box(GX,GY,COLS*CELL,ROWS*CELL);
ctx.font=`60px ${HAND}`;ctx.fillStyle=PENCIL;ctx.textAlign='center';ctx.textBaseline='middle';
let r=0,c=0,used=0;for(const ch of Array.from($('text').value)){if(ch==='\n'){r++;c=0;continue}if(c>=COLS){r++;c=0}if(r>=ROWS){used=-1;break}
if(ch!==' ')ctx.fillText(ch,GX+c*CELL+CELL/2,GY+r*CELL+CELL/2+3);c++}
const total=COLS*ROWS,filled=r*COLS+c,cnt=$('count');if(used<0||r>=ROWS){cnt.textContent='칸이 넘쳤어요! 넘친 글자는 안 보여요';cnt.classList.add('over')}else{cnt.textContent=`남은 칸 ${total-filled} / ${total}`;cnt.classList.remove('over')}
// 도장
if($('stamp').checked){ctx.save();ctx.translate(860,1300);ctx.rotate(-.22);ctx.globalAlpha=.82;ctx.strokeStyle='#d7372f';ctx.fillStyle='#d7372f';ctx.lineWidth=5;
ctx.beginPath();ctx.arc(0,0,68,0,7);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,58,0,7);ctx.stroke();
const st=$('stampText').value,parts=st.length>4?[st.slice(0,2),st.slice(2)]:[st];ctx.font=`bold ${parts.length>1?26:30}px ${PRINT}`;ctx.textAlign='center';ctx.textBaseline='middle';
parts.forEach((p,i)=>ctx.fillText(p,0,(i-(parts.length-1)/2)*32));
ctx.globalAlpha=1;ctx.fillStyle='#fbf6e6';let s2=11;for(let i=0;i<90;i++){s2=(s2*16807)%2147483647;const a=s2/2147483647*7;s2=(s2*16807)%2147483647;const rr=s2/2147483647*70;ctx.fillRect(Math.cos(a)*rr,Math.sin(a)*rr,2.5,2.5)}ctx.restore()}}

let queued=false;const draw=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;render()})};

// 그리기
let last=null;const pt=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width-PX,y:(e.clientY-b.top)*H/b.height-PY}};
const inPic=p=>p.x>=0&&p.y>=0&&p.x<=PW&&p.y<=PH;
cv.onpointerdown=e=>{const p=pt(e);if(!inPic(p))return;undo.push(lg.getImageData(0,0,PW,PH));if(undo.length>25)undo.shift();cv.setPointerCapture(e.pointerId);last=p;crayon(p.x,p.y,p.x,p.y);draw()};
cv.onpointermove=e=>{if(!last)return;const p=pt(e);crayon(last.x,last.y,p.x,p.y);last=p;draw()};
cv.onpointerup=cv.onpointercancel=()=>{last=null};
$('undo').onclick=()=>{const d=undo.pop();if(d){lg.putImageData(d,0,0);draw()}};
$('clear').onclick=()=>{undo.push(lg.getImageData(0,0,PW,PH));lg.clearRect(0,0,PW,PH);draw()};

// 입력
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{weather=+b.dataset.w;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b));draw()});
document.querySelectorAll('input:not([type=file]),textarea,select').forEach(el=>el.addEventListener('input',()=>{if(el.id==='crayonfx')makePhoto();$('brushO').textContent=$('brush').value;draw()}));
$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{photoSrc=im;makePhoto();draw()};im.src=URL.createObjectURL(f)};
$('nophoto').onclick=()=>{photoSrc=null;photo=null;$('upload').value='';draw()};
$('save').onclick=()=>{render();cv.toBlob(b=>{const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=`그림일기_${$('date').value||'summer'}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)})};

$('brushO').textContent=$('brush').value;render();
document.fonts.load(`60px "Nanum Pen Script"`).then(render).catch(()=>{});
</script></body></html>
