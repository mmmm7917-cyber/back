<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POP-UP DIARY ATELIER — 움직이는 팝업 다이어리 공방</title>
<style>
:root{--bg:#f7f2f0;--panel:#fffdfb;--panel2:#fbf6f4;--well:#f6efec;--ink:#5c474e;--ink2:#86707a;--muted:#b19ca3;--rose:#e58aa5;--rose2:#cc6c8c;--roseSoft:#fcecf2;--mintSoft:#e4f3ee;--mintInk:#4d8577;--sh1:0 1px 2px rgba(110,70,85,.05),0 6px 18px -8px rgba(110,70,85,.16);--sh2:0 22px 44px -20px rgba(110,70,85,.32);--ring:0 0 0 3px rgba(229,138,165,.28)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background .18s,box-shadow .18s,transform .18s,color .18s}
button:disabled{opacity:.38;cursor:not-allowed}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--ring)}
svg.ic{width:18px;height:18px;fill:currentColor;display:block;flex-shrink:0}
.app{display:flex;flex-direction:column;height:100dvh;min-height:620px;overflow:hidden}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--panel);box-shadow:0 8px 24px -18px rgba(110,70,85,.35);flex-shrink:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brandmark{width:40px;height:40px;flex-shrink:0;filter:drop-shadow(0 6px 10px rgba(204,108,140,.25))}
.brand b{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:600;font-size:18px;letter-spacing:.6px;color:#9b6378}
.brand small{display:block;font-size:10.5px;letter-spacing:.12em;margin-top:2px;color:var(--muted)}
.topactions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:#fff;color:var(--ink2);border-radius:12px;padding:9px 13px;font-weight:700;white-space:nowrap;box-shadow:var(--sh1)}
.btn:hover{background:#fff6f8;color:var(--rose2)}
.btn.primary{background:linear-gradient(180deg,#ee9db6,#df7f9e);color:#fff;box-shadow:0 8px 18px -8px rgba(214,110,145,.7)}
.btn.primary:hover{background:linear-gradient(180deg,#e994ae,#d47394);color:#fff}
.btn.soft{background:var(--roseSoft);color:var(--rose2);box-shadow:none}
.btn.soft:hover{background:#f9dfe8}
.btn.mint{background:var(--mintSoft);color:var(--mintInk);box-shadow:none}
.btn.mint:hover{background:#d6ede5;color:var(--mintInk)}
.btn.icononly{padding:9px}
.btn.tiny{font-size:11px;padding:7px 10px;border-radius:10px}
.workspace{display:grid;grid-template-columns:268px minmax(340px,1fr) 280px;min-height:0;flex:1;overflow:hidden}
.sidebar{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden;z-index:2}
.sidebar.left{box-shadow:10px 0 28px -24px rgba(110,70,85,.4)}
.sidebar.right{box-shadow:-10px 0 28px -24px rgba(110,70,85,.4)}
.panelhead{padding:18px 18px 8px}
.panelhead b{font-size:15px;color:var(--ink)}
.panelhead small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.scroll{overflow-y:auto;min-height:0;flex:1;padding:14px 16px 20px;scrollbar-width:thin;scrollbar-color:#ead9df transparent}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 10px 10px;background:var(--panel2)}
.tab{border:0;background:transparent;color:#a58f96;padding:9px 1px 8px;border-radius:12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px}
.tab:hover{background:#fff;color:var(--rose2)}
.tab.active{background:#fff;color:var(--rose2);box-shadow:var(--sh1)}
.tab .ic{width:20px;height:20px}
.section{margin-bottom:22px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;color:#a07c88;margin-bottom:12px}
.field{margin:0 0 13px}
.field label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;color:var(--ink2);font-weight:700;font-size:11px}
.field output{font-variant-numeric:tabular-nums;color:var(--rose2);font-weight:700}
.field input[type=range]{accent-color:var(--rose);width:100%;display:block}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;border:0;border-radius:11px;background:var(--well);color:var(--ink);padding:9px 11px;min-height:38px;outline:none}
.field input[type=text]:focus,.field input[type=number]:focus,.field select:focus{background:#fff;box-shadow:var(--ring)}
.field input[type=color]{width:100%;height:34px;border:0;background:transparent;padding:0;cursor:pointer}
.field input[type=checkbox]{accent-color:var(--rose)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:10px}
input[type=color]::-moz-color-swatch{border:0;border-radius:10px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{font-size:11px;color:var(--muted);line-height:1.65}
.hint{padding:11px 13px;border-radius:12px;background:var(--panel2);color:#9b858c;font-size:11px;line-height:1.65}
.blockbtn{width:100%;margin-top:7px}
.sceneCard{border:0;border-radius:14px;background:#fff;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;text-align:left;width:100%;margin-bottom:8px;box-shadow:var(--sh1)}
.sceneCard:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.sceneCard.active{background:var(--roseSoft);box-shadow:none}
.sceneThumb{border-radius:11px;width:54px;height:50px;display:grid;place-items:center;background:linear-gradient(145deg,#fff6f4,#fde6ee);flex-shrink:0;overflow:hidden}
.sceneThumb img,.sceneThumb svg{width:44px;height:44px;display:block}
.sceneCard b{font-size:12px;color:var(--ink)}
.sceneCard small{display:block;color:var(--muted);margin-top:3px;font-size:10px}
.decogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.decoButton{border:0;border-radius:14px;background:#fff;min-height:84px;padding:8px 3px 9px;color:var(--ink2);font-size:10.5px;font-weight:600;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;gap:4px}
.decoButton img{width:50px;height:50px;display:block;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.decoButton:hover{background:#fff8fa;color:var(--rose2)}
.decoButton:hover img{transform:translateY(-3px) scale(1.06) rotate(-3deg)}
.scene{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:#e6f4ef;overflow:hidden}
.canvasArea{position:relative;flex:1;min-height:160px;touch-action:none;overflow:hidden}
.canvasArea canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.canvasArea canvas:active{cursor:grabbing}
.stageLabel{position:absolute;top:18px;left:18px;background:rgba(255,253,251,.72);border-radius:14px;padding:10px 15px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none;box-shadow:0 10px 26px -14px rgba(80,120,110,.4)}
.stageLabel b{font-family:Georgia,serif;font-style:italic;letter-spacing:.4px;color:#a1667c}
.stageLabel small{display:block;margin-top:3px;font-size:10px;color:#a8949a}
.stageBtns{position:absolute;top:18px;right:18px;display:flex;gap:6px}
.stageBtns .btn{background:rgba(255,253,252,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stageFooter{display:flex;flex-direction:column;gap:10px;flex-shrink:0;min-height:92px;background:rgba(255,253,251,.9);padding:12px 22px 13px;box-shadow:0 -10px 28px -24px rgba(110,70,85,.45)}
.stageTools{display:flex;justify-content:space-between;align-items:center;gap:14px}
.stageTools .group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.angleWrap{display:flex;align-items:center;gap:12px}
.angleWrap label{white-space:nowrap;color:var(--ink2);font-weight:700;font-size:11px}
.angleWrap input{accent-color:var(--rose);flex:1;min-width:40px}
.angleWrap b{font-size:11px;color:var(--rose2);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.propempty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 14px;color:var(--muted);gap:10px}
.propempty img{width:84px;height:84px;opacity:.95}
.propempty b{color:var(--ink2)}
.propsToolbar{display:flex;gap:6px;margin:4px 0 14px}
.propsToolbar button{flex:1}
.pill{display:inline-flex;border-radius:99px;background:var(--roseSoft);color:var(--rose2);padding:4px 9px;font-size:10px;font-weight:700;letter-spacing:0}
.objHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.objHead img{width:44px;height:44px;border-radius:12px;background:var(--panel2);padding:4px}
.objHead b{font-size:14px;display:block}
.pagelist{display:flex;flex-direction:column;gap:7px}
.pageRow{display:flex;align-items:center;gap:9px;background:#fff;padding:9px;border-radius:13px;box-shadow:var(--sh1)}
.pageRow.active{background:var(--roseSoft);box-shadow:none}
.pageNum{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,#f9dbe5,#f3c3d3);font-weight:800;color:#a65f7b;font-size:12px}
.pageRow .grow{flex:1;min-width:0}
.pageRow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pageRow small{font-size:10px;color:var(--muted)}
.pageRow button{border:0;background:var(--panel2);border-radius:8px;padding:5px 8px;color:var(--rose2);font-size:11px;font-weight:700}
.uploadCard{background:linear-gradient(160deg,#fff,#fff5f8);border-radius:16px;text-align:center;padding:14px;margin-bottom:10px;box-shadow:var(--sh1)}
.uploadCard img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto}
.uploadCard b{display:block;margin:6px 0 2px;color:#9f6d82}
.uploadCard small{display:block;margin:2px auto 8px;color:var(--muted);max-width:185px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colorrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.colorswatch{text-align:center;font-size:10px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.colorswatch input{width:38px;height:38px;border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%;box-shadow:var(--sh1)}
.colorswatch input::-webkit-color-swatch{border-radius:50%}
.colorswatch input::-moz-color-swatch{border-radius:50%}
.toast{position:absolute;left:50%;bottom:118px;transform:translate(-50%,8px);background:rgba(92,71,78,.92);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--sh2);z-index:9;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .22s,transform .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlaybar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,253,250,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:7px 14px;color:#8f7a80;font-size:11px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 20px -14px rgba(80,120,110,.5)}
.viewer .sidebar,.viewer .topbar{display:none}
.viewer .workspace{display:block}
.viewer .scene{height:100%}
.viewer .stageFooter{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,96%);border-radius:20px 20px 0 0;background:rgba(255,253,251,.88);backdrop-filter:blur(10px)}
.viewer .stageLabel{left:20px}
.viewer .stageBtns{top:16px}
.exportprogress{height:6px;border-radius:9px;overflow:hidden;background:#f3e7ea;margin:10px 0}
.exportprogress>div{height:100%;background:linear-gradient(90deg,#f2a9c0,#df7f9e);width:0%;transition:width .15s}
.mobilePanelToggle{display:none}
.singleCard{display:flex;align-items:center;gap:12px;background:var(--roseSoft);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.singleCard img{width:52px;height:52px;border-radius:12px;background:#fff;padding:4px}
.singleCard b{display:block;font-size:13px}.singleCard small{display:block;margin-top:3px;font-size:10.5px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(92,71,78,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{background:var(--panel);border-radius:22px;box-shadow:var(--sh2);width:min(560px,100%);max-height:92dvh;overflow:auto;padding:22px 22px 18px}
.sheet h2{margin:0;font-size:19px;color:var(--ink)}.sheet>p{margin:6px 0 4px}
.startSec{margin:18px 0 10px}.startSec b{display:block;font-size:13px;color:var(--rose2)}.startSec small{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.startGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.startCard{border:0;border-radius:14px;background:#fff;box-shadow:var(--sh1);padding:10px 4px 9px;font-size:10.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:6px}
.startCard img{width:52px;height:52px}.startCard:hover,.startWide:hover{background:#fff6f8;transform:translateY(-1px)}
.startWide{width:100%;border:0;border-radius:16px;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left}
.startWide .thumbs{display:flex}.startWide .thumbs img{width:40px;height:40px;margin-right:-8px;background:#fff6f4;border-radius:10px;padding:2px;box-shadow:0 0 0 2px #fff}
.startWide b{display:block;font-size:13px;margin-left:8px}.startWide small{display:block;margin:3px 0 0 8px;font-size:10.5px;color:var(--muted)}
@media(max-width:520px){.startGrid{grid-template-columns:repeat(3,1fr)}}
.hidden{display:none!important}
@media(max-width:1080px){.workspace{grid-template-columns:244px minmax(300px,1fr) 250px}.brand small{display:none}.topactions .btn{padding:8px 10px}.topbar{padding:0 12px}.tabs{gap:2px}.tab{font-size:10px}}
@media(max-width:790px){.app{min-height:0}.topbar{height:auto;min-height:56px;padding:7px 10px}.brandmark{width:32px;height:32px}.brand b{font-size:14px}.topactions{gap:4px}.topactions .btn{font-size:11px;padding:7px 8px}.topactions .desktopOnly{display:none}.workspace{display:flex;flex-direction:column;overflow:hidden}.scene{order:0;flex:1;min-height:250px}.sidebar{order:1;min-height:0;height:38%;max-height:300px}.sidebar.left{display:flex}.sidebar.right{display:none}.sidebar.right.mobileShow{display:flex}.sidebar.left.mobileHide{display:none}.tabs{padding:5px;grid-template-columns:repeat(8,1fr);gap:0}.tab{font-size:9px;padding:5px 0;gap:2px}.tab .ic{width:17px;height:17px}.panelhead{display:none}.scroll{padding:10px 13px}.scene .stageFooter{padding:8px 10px;min-height:84px;gap:7px}.stageLabel{padding:6px 10px;top:8px;left:8px}.stageBtns{top:8px;right:8px}.stageBtns .btn{font-size:10px;padding:6px}.stageTools{gap:5px}.stageTools .group{gap:3px}.stageTools .btn{font-size:10px;padding:6px 7px}.mobilePanelToggle{display:inline-flex}.viewer .scene{min-height:100%}.viewer .stageFooter{width:100%}.toast{bottom:96px}.decogrid{grid-template-columns:repeat(5,1fr)}.decoButton{min-height:70px}.decoButton img{width:40px;height:40px}.overlaybar{display:none}}
@media(max-width:400px){.brand b{font-size:12px;letter-spacing:0}.topactions .btn{font-size:10px;padding:6px}.stageTools .group .btn.tiny{padding:5px}.angleWrap label{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
 <header class="topbar"><div class="brand"><svg class="brandmark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="bmA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8bccf"/><stop offset="1" stop-color="#e5869f"/></linearGradient><linearGradient id="bmB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdfb"/><stop offset="1" stop-color="#fbe9ef"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#bmA)"/><path d="M6 27.5c4.5-1.8 9-1.6 14 .8v-12c-5-2.4-9.5-2.6-14-.8z" fill="url(#bmB)"/><path d="M34 27.5c-4.5-1.8-9-1.6-14 .8v-12c5-2.4 9.5-2.6 14-.8z" fill="#fff" opacity=".82"/><path d="M20 22.6c-4.2-2.7-6-4.6-5.6-6.8.4-2 2.9-2.6 4.4-.9l1.2 1.3 1.2-1.3c1.5-1.7 4-1.1 4.4.9.4 2.2-1.4 4.1-5.6 6.8z" fill="#e5869f"/><circle cx="16.8" cy="16.6" r=".9" fill="#fff" opacity=".8"/></svg><div><b>Pop-up Diary Atelier</b><small>움직이는 팝업 다이어리 공방</small></div></div>
 <div class="topactions"><button class="btn desktopOnly" id="newProject">새 프로젝트</button><button class="btn icononly desktopOnly" id="undoBtn" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"></button><button class="btn icononly desktopOnly" id="redoBtn" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행"></button><button class="btn soft" id="editView">평면 편집</button><button class="btn mint" id="viewerToggle">감상 모드</button><button class="btn primary" id="goSave">저장</button></div></header>
 <main class="workspace">
 <aside class="sidebar left" id="leftSidebar"><div class="tabs" id="tabs"></div><div class="scroll" id="leftContent"></div></aside>
 <section class="scene" id="scene"><div class="canvasArea" id="canvasArea"><canvas id="stageCanvas" aria-label="회전할 수 있는 팝업 다이어리 3D 미리보기"></canvas><div class="stageLabel" id="stageLabel"><b>Pop-up Diary</b><small id="sceneCaption">작은 디저트 가게 · 1 / 4</small></div><div class="stageBtns"><button class="btn tiny" id="resetCamera">시점 복구</button><button class="btn tiny" id="zoomOut" title="축소">−</button><button class="btn tiny" id="zoomIn" title="확대">＋</button></div><div class="overlaybar" id="overlaybar">드래그: 시점 회전 · 휠: 확대</div></div>
 <div class="stageFooter"><div class="stageTools"><div class="group"><button class="btn primary tiny" id="toggleBook">책 펼치기</button><button class="btn tiny" id="prevPage">〈 이전</button><button class="btn tiny" id="nextPage">다음 〉</button></div><div class="group"><button class="btn tiny" id="playPreview">▶ 감상 재생</button><button class="btn tiny" id="switchEditor">3D 미리보기</button><button class="btn tiny mobilePanelToggle" id="mobilePanelToggle">속성</button></div></div><div class="angleWrap"><label for="bookAngle">펼침 각도</label><input id="bookAngle" type="range" min="0" max="180" step="1" value="0"><b id="angleValue">0°</b></div></div><div class="toast" id="toast"></div></section>
 <aside class="sidebar right" id="rightSidebar"><div class="panelhead"><b>오브젝트 속성</b><small>선택한 요소의 입체 변환 및 접힘 설정</small></div><div class="scroll" id="props"></div></aside>
 </main>
</div>
<div class="modal hidden" id="startModal" role="dialog" aria-modal="true" aria-labelledby="startTitle"><div class="sheet"><h2 id="startTitle">무엇을 만들까요?</h2><p class="muted">나중에 언제든 장면을 더하거나 따로 저장할 수 있어요.</p><div class="startSec"><b>장면 하나만</b><small>한 장짜리 팝업 카드처럼, 펼치면 하나의 장면이 나와요</small></div><div class="startGrid" id="startScenes"></div><div class="startSec"><b>여러 장면이 이어지는 다이어리</b><small>페이지를 넘기며 장면이 차례로 펼쳐져요</small></div><button class="startWide" data-start="diary"><span class="thumbs" id="startDiaryThumbs"></span><span><b>샘플 다이어리</b><small>4장면 · 바로 편집 가능</small></span></button><button class="btn blockbtn" id="startCancel" style="margin-top:14px">취소</button></div></div>
<input type="file" accept="image/png,image/jpeg,image/webp" id="upload1" class="hidden"><input type="file" accept="image/png,image/jpeg,image/webp" id="upload2" class="hidden"><input type="file" accept="application/json,.json" id="loadJSON" class="hidden"><input type="file" accept="application/json,.json" id="loadScene" class="hidden">
<script>
'use strict';
// POP-UP DIARY ATELIER — all scene data and rendering are local, deterministic and offline.
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;

function tone(h,a=0){const c=rgbOf(h),t=a>=0?[255,253,251]:[88,44,62],k=Math.min(1,Math.abs(a));return '#'+c.map((x,i)=>Math.round(x+(t[i]-x)*k).toString(16).padStart(2,'0')).join('');}
function parseColor(s){s=String(s);if(s[0]==='#'){let h=s.slice(1);if(h.length===3||h.length===4)h=h.replace(/./g,'$&$&');const n=parseInt(h.slice(0,6),16);return [n>>16&255,n>>8&255,n&255,h.length>=8?parseInt(h.slice(6,8),16)/255:1];}const m=s.match(/[\d.]+/g)||[255,255,255];return [+m[0],+m[1],+m[2],m[3]!=null?+m[3]:1];}

function darken(hex,f=.92){const [r,g,b]=rgbOf(hex||'#F6BFD5');return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;}

let isImage=o.kind==='image',thumb=isImage?escapeAttr(imageAssets[o.imageSlot]?.data||''):o.kind==='text'?artURL('label',o.color):artURL(o.type,o.color);$('props').innerHTML=`<div class="section"><div class="objHead">${thumb?`<img src="${thumb}" alt="">`:''}<div><b>${isImage?'캐릭터 '+o.imageSlot:o.kind==='text'?'텍스트':iconName(o.type)}</b><span class="pill">${o.mode.toUpperCase()}</span></div></div><div class="propsToolbar"><button class="btn tiny" data-objaction="duplicate">복제</button><button class="btn tiny" data-objaction="lock">${o.locked?'잠금 해제':'잠금'}</button><button class="btn tiny" data-objaction="delete">삭제</button></div><div class="field"><label>배치 면</label><select data-prop="side"><option value="left" ${o.side==='left'?'selected':''}>왼쪽 페이지</option><option value="right" ${o.side==='right'?'selected':''}>오른쪽 페이지</option></select></div><div class="field"><label>팝업 방식</label><select data-prop="mode">${[['stand','STAND-UP'],['vfold','V-FOLD'],['box','BOX-FOLD'],['accordion','ACCORDION'],['flat','페이지 사진']].map(([id,n])=>`<option value="${id}" ${o.mode===id?'selected':''}>${n}</option>`).join('')}</select></div>${field('X 위치',o.x,'x',-40,340)}${field('Y 위치',o.y,'y',-230,230)}${field('깊이 Z',o.z,'z',-10,160)}${field('가로 크기',o.w,'w',20,270)}${field('세로 크기',o.h,'h',20,230)}${field('회전',o.rotation,'rotation',-180,180)}${field('투명도',o.opacity,'opacity',0,1,.01)}${field('레이어',o.layer,'layer',0,6)}${field('접힘 강도',o.fold,'fold',.15,1.5,.05)}${field('등장 지연',o.delay,'delay',0,.85,.05)}${field('모션 속도',o.speed,'speed',.2,3,.1)}${isImage?`<div class="field"><label>종이 컷아웃 테두리</label><select data-prop="paperEdge"><option value="none" ${o.paperEdge==='none'?'selected':''}>없음</option><option value="white" ${o.paperEdge==='white'?'selected':''}>크림 흰색</option><option value="pink" ${o.paperEdge==='pink'?'selected':''}>연분홍</option></select></div><div class="field"><label><span><input type="checkbox" data-prop="paperShadow" ${o.paperShadow===true?'checked':''}> 종이 그림자</span></label></div>`:''}${o.kind==='text'?inputField('내용',o.text||'메모','text','text'):''}<div class="field"><label>장식 색상</label><input data-prop="color" type="color" value="${tone(o.color,0)}"></div><button class="btn soft blockbtn" data-objaction="flip">좌우 반전 ${o.flip?'해제':''}</button></div>`;}

function addIcon(type,mode='stand'){let sides=page().objects.filter(o=>o.side==='right').length;let o=obj(type,105+(sides%4)*32,25+(sides%3)*22,mode,mode==='flat'?74:90,mode==='flat'?70:98,'right',ART_DEFAULT[type]||state.colors.pink);addObj(o);}

function addCharacter(slot){if(!imageAssets[slot]){toast('먼저 캐릭터 이미지를 불러오세요.');return;}let exists=page().objects.find(o=>o.kind==='image'&&o.imageSlot===slot);if(exists){selectObj(exists.id);toast('현재 페이지에 이미 배치되어 있습니다.');return;}let o=obj('doll',slot===1?100:211,20,'stand',112,147,'right','#fff2ee',{kind:'image',imageSlot:slot,layer:5});let img=imageAssets[slot].image;if(img?.naturalWidth&&img?.naturalHeight){o.w=Math.round(147*img.naturalWidth/img.naturalHeight);o.w=Math.max(45,Math.min(o.w,195));}addObj(o);if(state.angle<60)animateAngle(180);}
function syncPair(){let chars=page().objects.filter(o=>o.kind==='image').sort((a,b)=>a.imageSlot-b.imageSlot);if(chars.length<2){toast('현재 페이지에 캐릭터 2명을 배치하세요.');return;}for(const [i,o] of chars.slice(0,2).entries()){o.side='right';o.h=146;let img=imageAssets[o.imageSlot]?.image;o.w=img?.naturalWidth?clamp(Math.round(o.h*img.naturalWidth/img.naturalHeight),35,155):104;o.x=i?216:91;o.y=68;o.z=0;o.mode='stand';}checkpoint();renderAll();toast('두 캐릭터의 표시 높이와 발 위치를 맞췄습니다.');}
function handleAction(action,id){if(exportBusy&&action!=='loadJSON')return;switch(action){case 'template':{if(!confirm('현재 페이지 장식을 선택한 샘플 장면으로 바꿀까요?'))return;let newP=makeScene(SCENES[+id][0],+id);state.pages[state.page]=newP;state.selected=null;checkpoint();renderAll();setAngle(180);break;}
case 'addStructure':addIcon(({vfold:'heart',box:'gift',accordion:'flower',stand:'ribbon'})[id],id);if(state.angle<25)animateAngle(180);break;
case 'addText':addObj({...obj('label',145,-20,'stand',135,65,'right','#986B50'),kind:'text',text:'메모'});break;
case 'addDeco':addIcon(id,(['tape','label','lace','frame','envelope','rug'].includes(id)?'flat':'stand'));break;

case 'pageAdd':{let newPage=makeScene('새 팝업 장면',2);newPage.objects=[];state.pages.splice(state.page+1,0,newPage);state.page++;state.selected=null;state.angle=180;checkpoint();renderAll();break;}
case 'pageClone':{let copy=JSON.parse(JSON.stringify(page()));copy.name+=' 복사';copy.objects.forEach(o=>o.id=uid());state.pages.splice(state.page+1,0,copy);state.page++;state.selected=null;checkpoint();renderAll();break;}
case 'pageDelete':{if(state.pages.length<=1){toast('마지막 페이지는 삭제할 수 없습니다.');return;}if(!confirm('현재 페이지를 삭제할까요?'))return;state.pages.splice(state.page,1);state.page=clamp(state.page,0,state.pages.length-1);state.selected=null;checkpoint();renderAll();break;}
case 'pageMove':{let to=state.page+(+id);if(to<0||to>=state.pages.length)return;const el=state.pages.splice(state.page,1)[0];state.pages.splice(to,0,el);state.page=to;checkpoint();renderAll();break;}
