async function loadImage(id,file){if(!file)return;let url=URL.createObjectURL(file);try{let img=new Image;img.src=url;await img.decode();if(img.width*img.height>60000000)throw Error('이미지가 너무 큽니다. 6천만 픽셀 이하로 줄여 주세요.');let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);let data=g.getImageData(0,0,c.width,c.height).data,x0=c.width,y0=c.height,x1=-1,y1=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(data[(y*c.width+x)*4+3]>8){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}if(x1<0)throw Error('보이는 픽셀이 없는 이미지입니다.');C[id].img=img;C[id].crop={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};$('message').textContent=id+' 업로드 완료 · 머리와 씨앗 도착점을 맞춰 주세요.';renderPreview()}catch(e){$('message').textContent=e.message}finally{URL.revokeObjectURL(url)}}
function ellipse(g,x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);g.fill()}

function flower(g,x,y,r,color){for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(g,x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6,r*.47,r*.47,color)}ellipse(g,x,y,r*.2,r*.2,'#c7aa6e')}

function seedState(i,u){let a=.275+i*(.225/S.seeds),b=.275+(i+1)*(.225/S.seeds);return clamp((u-a)/(b-a))}
function seed(g,x,y,s=1,a=1){g.save();g.globalAlpha*=a;ellipse(g,x,y,5*s,7*s,S.fruitColor);ellipse(g,x-1.3*s,y-2*s,1.1*s,2*s,'#fbb6b8');g.restore()}

if(['palace','temple','throne'].includes(bg)){g.fillStyle='#262330';g.fillRect(135,65,450,440);g.strokeStyle='#4e424a';g.lineWidth=2;g.beginPath();g.arc(360,260,147,Math.PI,0);g.lineTo(507,505);g.lineTo(213,505);g.closePath();g.stroke();if(S.columns){for(let x of [66,154,566,654]){g.fillStyle='#35303b';g.fillRect(x-15,92,30,450);g.fillStyle='#4a4049';g.fillRect(x-24,86,48,14);g.fillRect(x-24,530,48,14);line(g,[[x-6,110],[x-6,521]],'#51444c')}}}
