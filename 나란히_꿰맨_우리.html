<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나란히 꿰맨 우리</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#595254;font:14px 'Malgun Gothic',sans-serif}header{height:82px;padding:22px 35px;border-bottom:1px solid #e6ddd9;display:flex;align-items:center;gap:14px;background:#fffdfa}header span{color:#cc8eaa;font-size:28px}h1{font:600 21px Georgia,'Batang',serif;margin:0}main{display:grid;grid-template-columns:330px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 82px)}aside{padding:24px;background:#fffdfa;border-right:1px solid #e6ddd9}section{padding-bottom:22px;margin-bottom:21px;border-bottom:1px dashed #dfd3d3}h2{font-size:13px;margin:0 0 15px;letter-spacing:.06em}label{display:block;font-size:12px;margin:13px 0 7px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}input,select,button{font:inherit;color:inherit}select,input[type=text]{width:100%;padding:10px;border:1px solid #e6dcda;border-radius:7px;background:#fff}button,.upload{border:1px solid #e3d5d9;background:#fff;padding:10px 12px;border-radius:7px;cursor:pointer;text-align:center}button:hover,.upload:hover{background:#fbedf2}button.active{background:#f4dce7;border-color:#d7a5bc}input[type=range]{width:100%;accent-color:#b77f9b}input[type=color]{border:0;background:none;width:100%;height:33px;cursor:pointer}input[type=checkbox]{accent-color:#b77f9b}input[type=file]{display:none}.upload{display:block;font-size:13px;margin:0}.stage{padding:28px 40px;display:flex;align-items:center;flex-direction:column;background:radial-gradient(#e7dfda 1px,transparent 1px) 0 0/14px 14px}.toolbar{display:flex;width:min(100%,650px);justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px;color:#94858b}.paper{width:min(100%,650px);box-shadow:0 12px 45px #6e48521b;background:repeating-conic-gradient(#eee 0 25%,white 0 50%) 0/16px 16px}canvas{display:block;width:100%;height:auto;touch-action:none}.save{background:#ad7890;color:white;border:0;width:100%;font-weight:600}.hint{font-size:11px;color:#a4959a;margin:10px 0;line-height:1.6}.status{min-height:20px;font-size:12px;text-align:center;margin-top:10px}summary{cursor:pointer;font-size:12px}details{margin-top:12px}@media(min-width:900px){.stage{position:sticky;top:0;height:100vh;overflow:auto}aside{height:calc(100vh - 82px);overflow:auto}}@media(max-width:800px){header{height:65px;padding:18px}main{display:flex;flex-direction:column}.stage{order:-1;padding:18px}.paper{max-width:440px}aside{border:0;padding:22px}.toolbar{max-width:440px}h1{font-size:19px}}
</style><header><span>✂</span><h1>나란히 꿰맨 우리</h1></header><main><aside>
<section><h2>01 &nbsp; 그림 배치</h2><div class="row"><button id="two" class="active">두 장</button><button id="one">한 장</button></div><label>배치</label><select id="layout"><option value="side">나란히</option><option value="offset">높낮이 다르게</option><option value="close">가운데 모으기</option></select><div class="row" style="margin-top:12px"><label class="upload">그림 A 불러오기<input type="file" id="fileA" accept="image/*"></label><label class="upload" id="uploadB">그림 B 불러오기<input type="file" id="fileB" accept="image/*"></label></div><label>편집할 그림</label><div class="row"><button id="selA" class="active">A</button><button id="selB">B</button></div><label>크기 <output id="scaleVal">100%</output></label><input id="scale" type="range" min="20" max="220" value="100"><label>회전 <output id="rotateVal">0°</output></label><input id="rotate" type="range" min="-30" max="30" value="0"><div class="row"><button id="flip">좌우 반전</button><button id="resetImage">초기화</button><button id="remove">삭제</button></div><p class="hint">그림을 드래그해 위치를 옮길 수 있어요.</p><label><input id="mat" type="checkbox" checked> 둥근 천 받침</label></section>
<section><h2>02 &nbsp; 원단과 바느질</h2><select id="palette"><option value="0">분홍 · 하늘</option><option value="1">크림 · 분홍</option><option value="2">세이지 · 크림</option><option value="3">라벤더 · 분홍</option><option value="4">직접 지정</option></select><div class="row"><div><label>분홍 원단</label><input type="color" id="pink" value="#f4b8cd"></div><div><label>하늘 원단</label><input type="color" id="blue" value="#a7cfe1"></div><div><label>바탕</label><input type="color" id="cream" value="#fffdee"></div></div><div class="row"><div><label>왼쪽 무늬</label><select id="patternA"><option value="check">깅엄체크</option><option value="stripe">줄무늬</option><option value="dot">도트</option><option value="heart">작은 하트</option><option value="plain">무지</option></select></div><div><label>오른쪽 무늬</label><select id="patternB"><option value="heart">작은 하트</option><option value="check">깅엄체크</option><option value="stripe">줄무늬</option><option value="dot">도트</option><option value="plain">무지</option></select></div></div><label>봉제선</label><select id="stitch"><option value="blanket">감침질</option><option value="cross">교차</option><option value="dash">일자</option></select><label>무늬 크기</label><input type="range" id="density" min="16" max="48" value="26"></section>
<section><h2>03 &nbsp; 레이스와 장식</h2><div class="row"><label><input id="ribbon" type="checkbox" checked> 리본</label><label><input id="lace" type="checkbox" checked> 레이스</label></div><div class="row"><label><input id="buttons" type="checkbox" checked> 단추</label><label><input id="patch" type="checkbox" checked> 하트 패치</label></div></section>
<section><h2>04 &nbsp; 이름과 날짜</h2><div class="row"><input type="text" id="nameA" placeholder="이름 A" maxlength="24"><input type="text" id="nameB" placeholder="이름 B" maxlength="24"></div><label>기념일</label><input type="text" id="date" placeholder="기념일" maxlength="36"><label>글꼴</label><select id="font"><option value="serif">명조</option><option value="sans-serif">고딕</option></select><div class="row"><label><input id="showNames" type="checkbox" checked> 이름 표시</label><label><input id="showDate" type="checkbox" checked> 날짜 표시</label></div></section>
<h2>05 &nbsp; 저장</h2><div class="row"><select id="ratio"><option value="portrait">세로 4:5</option><option value="square">정사각형 1:1</option></select><select id="resolution"><option value="2">PNG 2×</option><option value="3">PNG 3×</option></select></div><label><input type="checkbox" id="transparent"> 바탕 원단 투명</label><button class="save" id="save">PNG 저장</button><div class="status" id="status" role="status"></div><details><summary>편집 내용 보관</summary><div class="row" style="margin-top:12px"><button id="saveProject">작업 저장</button><label class="upload">작업 불러오기<input type="file" id="loadProject" accept=".json"></label></div></details>
</aside><div class="stage"><div class="toolbar"><span>미리보기</span><span id="sizeLabel">800 × 1000</span></div><div class="paper"><canvas id="canvas" width="800" height="1000" aria-label="페어틀 미리보기"></canvas></div></div></main>
<script>
'use strict';const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');let mode=2,selected=0,W=800,H=1000;const items=[blank(),blank()];function blank(){return {img:null,src:'',x:0,y:0,s:1,r:0,flip:false}}const settings=['layout','mat','pink','blue','cream','patternA','patternB','stitch','density','ribbon','lace','buttons','patch','nameA','nameB','date','font','showNames','showDate','transparent','ratio'];function v(id){return $(id).type==='checkbox'?$(id).checked:$(id).value}function path(c,s,fill,stroke,width=1){let p=new Path2D(s);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}}function line(c,x,y,X,Y,col,w=3){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke()}function heart(c,x,y,size,col){c.save();c.translate(x,y);c.scale(size/40,size/40);path(c,'M0 13 C-35 -8 -20 -30 0 -14 C20 -30 35 -8 0 13Z',col);c.restore()}function bow(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);path(c,'M0 0 C-45 -30 -108 -57 -113 -21 C-119 13 -48 23 0 4 C48 23 119 13 113 -21 C108 -57 45 -30 0 0Z',col);path(c,'M-17 -4 C-43 -16 -88 -31 -92 -20 C-97 -10 -51 -7 -17 -4 M17 -4 C43 -16 88 -31 92 -20 C97 -10 51 -7 17 -4',v('cream'));path(c,'M-9 3 Q-37 42 -94 72 L-75 76 L-68 91 Q-25 62 9 8Z',col);path(c,'M9 3 Q37 42 94 72 L75 76 L68 91 Q25 62 -9 8Z',col);c.fillStyle=col;c.beginPath();c.ellipse(0,0,16,12,0,0,7);c.fill();c.restore()}
function cloth(c,x,y,w,h,col,type){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.fillStyle=v('cream');c.fillRect(x,y,w,h);const d=+v('density');if(type==='plain'){c.globalAlpha=.45;c.fillStyle=col;c.fillRect(x,y,w,h)}else if(type==='check'){c.fillStyle=col;c.globalAlpha=.36;for(let i=x;i<x+w;i+=d*2)c.fillRect(i,y,d,h);for(let j=y;j<y+h;j+=d*2)c.fillRect(x,j,w,d)}else if(type==='stripe'){c.fillStyle=col;c.globalAlpha=.65;for(let i=x;i<x+w;i+=d*2)c.fillRect(i,y,d,h)}else{c.fillStyle=col;c.globalAlpha=.25;c.fillRect(x,y,w,h);c.globalAlpha=.85;for(let j=y+d;j<y+h;j+=d*2)for(let i=x+d+(Math.round((j-y)/d)%4===1?0:d);i<x+w;i+=d*2){if(type==='heart')heart(c,i,j,d*.37,col);else{c.beginPath();c.arc(i,j,d*.1,0,7);c.fillStyle=col;c.fill()}}}c.restore()}
function seam(c,x,y,X,Y,col){const len=Math.hypot(X-x,Y-y),dx=(X-x)/len,dy=(Y-y)/len;c.save();for(let k=10;k<len;k+=25){const a=x+dx*k,b=y+dy*k;if(v('stitch')==='cross'){line(c,a-dx*7-dy*7,b-dy*7+dx*7,a+dx*7+dy*7,b+dy*7-dx*7,col,4);line(c,a-dx*7+dy*7,b-dy*7-dx*7,a+dx*7-dy*7,b+dy*7+dx*7,col,4)}else if(v('stitch')==='dash')line(c,a-dx*6,b-dy*6,a+dx*6,b+dy*6,col,3);else line(c,a-dy*11,b+dx*11,a+dy*11,b-dx*11,col,4)}c.restore()}
function scallop(c,x,y,w,h,fill,col){c.beginPath();c.moveTo(x,y);for(let k=0;k<w;k+=40)c.quadraticCurveTo(x+k+20,y-19,x+Math.min(k+40,w),y);c.lineTo(x+w,y+h);for(let k=w;k>0;k-=40)c.quadraticCurveTo(x+k-20,y+h+19,x+Math.max(0,k-40),y+h);c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=col;c.lineWidth=3;c.stroke();c.save();c.setLineDash([1,7]);c.lineCap='round';c.strokeStyle=col;c.lineWidth=3;c.beginPath();c.moveTo(x+7,y+10);for(let k=0;k<w-14;k+=40)c.quadraticCurveTo(x+k+27,y-7,x+Math.min(k+47,w-7),y+10);c.stroke();c.beginPath();c.moveTo(x+7,y+h-10);for(let k=0;k<w-14;k+=40)c.quadraticCurveTo(x+k+27,y+h+7,x+Math.min(k+47,w-7),y+h-10);c.stroke();c.restore()}
function base(i){let yy=H*.55;return {x:mode===1?400:(i?584:216),y:yy+(v('layout')==='offset'?(i?50:-50):0)}}function geometry(i){let it=items[i],b=base(i),bw=mode===1?600:330,bh=H*.53,s=it.img?Math.min(bw/it.img.width,bh/it.img.height)*it.s:1;return {x:b.x+it.x+(mode===2&&v('layout')==='close'?(i?-65:65):0),y:b.y+it.y,w:it.img?it.img.width*s:bw,h:it.img?it.img.height*s:bh}}
function draw(c=ctx){c.clearRect(0,0,W,H);const pink=v('pink'),blue=v('blue'),cream=v('cream');if(!v('transparent')){cloth(c,0,0,W,H,pink,'check');cloth(c,24,164,384,H-212,blue,v('patternA'));cloth(c,408,200,368,H-248,pink,v('patternB'));cloth(c,408,H-245,368,210,blue,'stripe');seam(c,408,166,408,H-36,pink);seam(c,25,164,406,164,pink);seam(c,410,H-245,776,H-245,blue)}
if(v('mat')){for(let i=0;i<mode;i++){let b=base(i);c.fillStyle=cream;c.beginPath();c.ellipse(mode===1?400:b.x,b.y,mode===1?325:172,H*.31,0,0,7);c.fill();c.save();c.setLineDash([2,8]);c.strokeStyle=i?blue:pink;c.lineWidth=2;c.beginPath();c.ellipse(mode===1?400:b.x,b.y,mode===1?313:162,H*.31-10,0,0,7);c.stroke();c.restore()}}
for(let i=0;i<mode;i++){let it=items[i],g=geometry(i);c.save();c.translate(g.x,g.y);c.rotate(it.r*Math.PI/180);c.scale(it.flip?-1:1,1);if(it.img)c.drawImage(it.img,-g.w/2,-g.h/2,g.w,g.h);else{c.fillStyle=i?pink:blue;c.globalAlpha=.4;c.beginPath();c.ellipse(0,-35,58,67,0,0,7);c.fill();c.beginPath();c.ellipse(0,86,92,80,0,0,Math.PI*2);c.fill();c.globalAlpha=.9;c.fillStyle='#857781';c.font='16px sans-serif';c.textAlign='center';c.fillText(mode===1?'그림 불러오기':i?'그림 B':'그림 A',0,208)}c.restore()}
if(v('lace')){scallop(c,52,52,696,100,cream,pink);c.save();c.translate(400,H-101);c.rotate(.055);scallop(c,-430,-35,860,82,'#fffdfb',pink);seam(c,-420,-13,420,-13,blue);c.restore()}else{c.fillStyle=cream;c.fillRect(52,52,696,100);c.fillRect(48,H-129,704,80)}
if(v('ribbon')){bow(c,400,80,.72,blue);bow(c,63,H-130,.31,pink);bow(c,737,H-72,.31,pink)}if(v('buttons'))for(const [x,y,col] of [[48,196,pink],[751,226,blue]]){c.fillStyle=col;c.beginPath();c.arc(x,y,18,0,7);c.fill();c.strokeStyle=cream;c.lineWidth=1;c.beginPath();c.arc(x,y,13,0,7);c.stroke();line(c,x-5,y-5,x+5,y+5,cream,3);line(c,x+5,y-5,x-5,y+5,cream,3)}if(v('patch')){heart(c,400,H-238,63,pink);c.save();c.setLineDash([2,5]);c.translate(400,H-238);c.scale(1.2,1.2);path(c,'M0 13 C-35 -8 -20 -30 0 -14 C20 -30 35 -8 0 13Z',null,cream,1.5);c.restore()}
c.textAlign='center';c.fillStyle='#725d68';const ff=v('font')==='serif'?'Georgia,"Batang",serif':'"Malgun Gothic",sans-serif';if(v('showNames')){let names=[v('nameA').trim(),v('nameB').trim()].filter(Boolean).join('  &  ');c.font='24px '+ff;c.fillText(names,400,v('ribbon')?170:115,620)}if(v('showDate')&&v('date')){c.save();c.translate(400,H-80);c.rotate(v('lace')?.055:0);c.font='21px '+ff;c.fillText(v('date'),0,0,610);c.restore()}}
function render(){H=v('ratio')==='square'?800:1000;if(cv.height!==H)cv.height=H;$('sizeLabel').textContent='800 × '+H;draw()}function sync(){const it=items[selected];$('scale').value=it.s*100;$('rotate').value=it.r;$('scaleVal').value=Math.round(it.s*100)+'%';$('rotateVal').value=it.r+'°';$('selA').classList.toggle('active',selected===0);$('selB').classList.toggle('active',selected===1);$('flip').classList.toggle('active',it.flip)}function setMode(n){mode=n;if(n===1)selected=0;$('two').classList.toggle('active',n===2);$('one').classList.toggle('active',n===1);$('uploadB').style.display=n===1?'none':'';$('selB').disabled=n===1;sync();render()}
$('two').onclick=()=>setMode(2);$('one').onclick=()=>setMode(1);$('selA').onclick=()=>{selected=0;sync()};$('selB').onclick=()=>{selected=1;sync()};settings.forEach(id=>$(id).addEventListener('input',render));['pink','blue','cream'].forEach(id=>$(id).addEventListener('input',()=>{$('palette').value=4}));$('palette').onchange=()=>{const p=[['#f4b8cd','#a7cfe1','#fffdee'],['#e3a6bc','#e6cbb5','#fff9ed'],['#bacbbb','#d7c8a6','#fffcee'],['#cfbce3','#e9b4c8','#fffbef']][+$('palette').value];if(p){['pink','blue','cream'].forEach((id,i)=>$(id).value=p[i]);render()}};
function loadImage(src){return new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(Error('이미지를 읽지 못했어요.'));im.src=src})}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}['fileA','fileB'].forEach((id,i)=>$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let src=await readFile(f),img=await loadImage(src);items[i]={...blank(),src,img};selected=i;sync();render();$('status').textContent=''}catch(err){$('status').textContent=err.message}e.target.value=''});
$('scale').oninput=()=>{items[selected].s=+$('scale').value/100;sync();render()};$('rotate').oninput=()=>{items[selected].r=+$('rotate').value;sync();render()};$('flip').onclick=()=>{items[selected].flip=!items[selected].flip;sync();render()};$('resetImage').onclick=()=>{Object.assign(items[selected],{x:0,y:0,s:1,r:0,flip:false});sync();render()};$('remove').onclick=()=>{items[selected]=blank();sync();render()};let drag=null;function point(e){let r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}cv.onpointerdown=e=>{let p=point(e);for(let i=mode-1;i>=0;i--){const g=geometry(i),a=-items[i].r*Math.PI/180,dx=p.x-g.x,dy=p.y-g.y,x=dx*Math.cos(a)-dy*Math.sin(a),y=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(x)<g.w/2&&Math.abs(y)<g.h/2){selected=i;sync();drag={p,x:items[i].x,y:items[i].y};cv.setPointerCapture(e.pointerId);break}}};cv.onpointermove=e=>{if(!drag)return;let p=point(e);items[selected].x=drag.x+p.x-drag.p.x;items[selected].y=drag.y+p.y-drag.p.y;render()};cv.onpointerup=cv.onpointercancel=()=>drag=null;
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}$('save').onclick=async()=>{const b=$('save');b.disabled=true;$('status').textContent='저장 중…';try{let n=+$('resolution').value,out=document.createElement('canvas');out.width=W*n;out.height=H*n;let c=out.getContext('2d');c.scale(n,n);draw(c);const blob=await new Promise(r=>out.toBlob(r,'image/png'));if(!blob)throw Error('저장에 실패했어요.');download(blob,'나란히_꿰맨_우리.png');$('status').textContent=out.width+' × '+out.height+' PNG 저장 완료'}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
$('saveProject').onclick=()=>{const data={format:'patchwork-pair-v1',mode,settings:Object.fromEntries(settings.map(id=>[id,v(id)])),items:items.map(({img,...rest})=>rest)};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'페어틀_작업.json')};$('loadProject').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let d=JSON.parse(await f.text());if(d.format!=='patchwork-pair-v1'||!Array.isArray(d.items)||d.items.length!==2)throw Error('페어틀 작업 파일을 선택해 주세요.');let restored=await Promise.all(d.items.map(async it=>{if(it.src&&!/^data:image\//.test(it.src))throw Error('이미지 데이터가 올바르지 않아요.');return {...blank(),src:it.src||'',img:it.src?await loadImage(it.src):null,x:Number(it.x)||0,y:Number(it.y)||0,s:Math.max(.2,Math.min(2.2,Number(it.s)||1)),r:Math.max(-30,Math.min(30,Number(it.r)||0)),flip:!!it.flip}}));settings.forEach(id=>{if(d.settings[id]!==undefined){if($(id).type==='checkbox')$(id).checked=!!d.settings[id];else $(id).value=d.settings[id]}});items.splice(0,2,...restored);setMode(d.mode===1?1:2);$('palette').value=4;$('status').textContent='작업을 불러왔어요.'}catch(err){$('status').textContent=err.message}e.target.value=''};render();
</script></html>
